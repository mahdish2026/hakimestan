<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="skin" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fadfae"/>
      <stop offset="65%" stop-color="#f3c98b"/>
      <stop offset="100%" stop-color="#e0a86a"/>
    </radialGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff7ef"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a68c9"/>
      <stop offset="100%" stop-color="#5b4a9e"/>
