function importDialog(){modal('از فایل یا نوشتهٔ خودت شروع کن',`<div class="dropzone" id="dropzone">${ic('upload')}<h2>فایل‌ها را اینجا رها کن</h2><p class="small muted" style="margin:12px 0 20px">tarhdars · JSON · DOCX · TXT · CSV · Markdown</p>${btn('pick-plans','انتخاب فایل','upload','','primary')}</div><p class="mini-help">حداکثر ۱۶ مگابایت برای هر فایل. متن و جدول DOCX عمومی خوانده می‌شود؛ صفحه‌آرایی و تصاویر پیچیده منتقل نمی‌شوند.</p><label for="pasteImport" style="margin-top:22px">یا متن را بچسبان</label><textarea id="pasteImport" rows="5" placeholder="عنوان طرح، هدف‌ها یا متن موجود را اینجا بچسبان…"></textarea><div class="dialog-actions">${btn('paste-import','پیش‌نمایش متن','file')}</div>`);const zone=$('#dropzone');zone.ondragover=e=>{e.preventDefault();zone.classList.add('drag')};zone.ondragleave=()=>zone.classList.remove('drag');zone.ondrop=e=>{e.preventDefault();zone.classList.remove('drag');processFiles([...e.dataTransfer.files]).catch(error)}}
ACT['pick-plans']=()=>pickFiles();ACT['paste-import']=()=>{const text=$('#pasteImport').value;if(!text.trim())return error(Error('متنی برای ورود نیست.'));importPreview([textPlan(text,'متن واردشده')])};
function textPlan(text,title){const p=makeLesson(TOPICS[0],0);p.id=id();p.title=title;p.subject='';p.grade=store.settings.defaultGrade;p.type='روزانه';p.template='daily';p.tags=['واردشده'];p.meta=[{id:'teacher',label:'معلم',value:store.settings.teacherName},{id:'school',label:'مدرسه',value:store.settings.school},{id:'topic',label:'موضوع',value:title}];p.sections=[{id:id(),role:'custom',title:'متن واردشده؛ قابل بخش‌بندی',kind:'text',text}];p.origin='واردشده توسط کاربر؛ محتوا نیازمند بررسی معلم است.';return p}
async function importDocx(file){const files=await IO.unzip(await file.arrayBuffer());if(files['customXml/tarhdars.json']){const data=JSON.parse(files['customXml/tarhdars.json']);if(data.app==='hakimestan-tarhdars'&&data.version===1&&Array.isArray(data.plans)&&data.docxXmlHash===documentFingerprint(files['word/document.xml']||''))return data.plans.map(validatePlan)}if(!files['word/document.xml'])throw Error('سند Word خوانا نیست. فقط .docx استاندارد پشتیبانی می‌شود.');const doc=new DOMParser().parseFromString(files['word/document.xml'],'application/xml');if(doc.querySelector('parsererror'))throw Error('ساختار XML سند خراب است.');const nodes=(n,tag)=>Array.from(n.getElementsByTagNameNS('*',tag)),text=n=>nodes(n,'t').map(x=>x.textContent).join(''),body=nodes(doc,'body')[0],p=textPlan('',file.name.replace(/\.docx$/i,''));p.sections=[];let lines=[];const flush=()=>{if(lines.length){p.sections.push({id:id(),role:'custom',kind:'text',title:p.sections.length?'ادامهٔ متن':'متن سند',text:lines.join('\n')});lines=[]}};for(const n of Array.from(body?.children||[])){if(n.localName==='p'){const t=text(n);if(t)lines.push(t)}else if(n.localName==='tbl'){flush();const rows=nodes(n,'tr').map(tr=>Array.from(tr.children).filter(c=>c.localName==='tc').map(c=>nodes(c,'p').map(text).join('\n')));const cols=Math.max(1,...rows.map(r=>r.length));if(cols>20)throw Error('جدول با بیش از ۲۰ ستون را پیش از ورود ساده کنید.');rows.forEach(r=>{while(r.length<cols)r.push('')});if(rows.length)p.sections.push({id:id(),role:'custom',kind:'table',title:'جدول واردشده '+fa(p.sections.length+1),headers:rows.shift(),rows})}}flush();if(!p.sections.length)throw Error('متن یا جدول قابل خواندن در سند پیدا نشد.');return[validatePlan(p)]}
async function processFiles(files){if(files.length>30)throw Error('در هر بار حداکثر ۳۰ فایل انتخاب کنید.');const plans=[];for(const f of files){if(f.size>16*1024*1024)throw Error('فایل '+f.name+' بیش از ۱۶ مگابایت است.');const ext=f.name.split('.').at(-1).toLowerCase();if(ext==='docx')plans.push(...await importDocx(f));else if(['json','tarhdars'].includes(ext)){const d=JSON.parse(await f.text());if(d.app==='hakimestan-tarhdars'&&d.kind==='backup'){throw Error('این فایل پشتیبان کامل است. از تنظیمات ← بازیابی فایل استفاده کنید؛ ورود طرح‌ها اطلاعات قبلی را جایگزین نمی‌کند.')}const ps=Array.isArray(d)?d:d.app==='hakimestan-tarhdars'&&d.version===1&&Array.isArray(d.plans)?d.plans:d.sections?[d]:null;if(!ps)throw Error('قالب JSON شناخته نشد. فایل دادهٔ همین کارگاه را انتخاب کنید.');plans.push(...ps.map(validatePlan))}else if(ext==='csv'){const rows=IO.csvParse(await f.text());if(!rows.length)throw Error('CSV خالی است.');const cols=Math.max(...rows.map(r=>r.length));if(cols>20||rows.length>601)throw Error('CSV باید حداکثر ۲۰ ستون و ۶۰۰ ردیف داده داشته باشد.');rows.forEach(r=>{while(r.length<cols)r.push('')});const p=textPlan('',f.name.replace(/\.csv$/i,''));p.sections=[{id:id(),role:'custom',title:'جدول CSV واردشده',kind:'table',headers:rows.shift().map(String),rows:rows.map(r=>r.map(String))}];plans.push(p)}else if(['txt','md'].includes(ext)){const text=(await f.text()).replace(/^\uFEFF/,'');if(!text.trim())throw Error('فایل متنی خالی است.');const p=textPlan(text,f.name.replace(/\.[^.]+$/,''));if(ext==='md'){const chunks=text.split(/^#{1,6}\s+/m).filter(x=>x.trim());if(chunks.length>1)p.sections=chunks.map(c=>{const[line,...rest]=c.split('\n');return{id:id(),role:'custom',kind:'text',title:line.trim().slice(0,300),text:rest.join('\n').trim()}})}plans.push(validatePlan(p))}else throw Error('پسوند '+ext+' پشتیبانی نمی‌شود.')}if(plans.length>200)throw Error('در هر ورود حداکثر ۲۰۰ طرح مجاز است.');importPreview(plans)}
function importPreview(plans){plans.forEach(validatePlan);modal('پیش‌نمایش پیش از ورود',`<p class="explain">${fa(plans.length)} طرح خوانده شد. فقط موارد انتخاب‌شده به‌صورت نسخهٔ مستقل افزوده می‌شوند؛ هیچ طرح قبلی بازنویسی نمی‌شود. عنوان و درس را همین‌جا اصلاح کن.</p><div class="table-wrap"><table><thead><tr><th>ورود</th><th>عنوان طرح</th><th>پایه</th><th>درس</th><th>بخش‌ها</th></tr></thead><tbody>${plans.map((p,j)=>`<tr><td><input class="import-check" type="checkbox" data-index="${j}" checked aria-label="ورود ${E(p.title)}"></td><td><input class="import-title" data-index="${j}" value="${E(p.title)}" aria-label="عنوان طرح ${j+1}"></td><td><input class="import-grade" data-index="${j}" value="${E(p.grade)}" aria-label="پایه طرح ${j+1}"></td><td><input class="import-subject" data-index="${j}" value="${E(p.subject)}" aria-label="درس طرح ${j+1}"></td><td>${fa(p.sections.length)}<details><summary>دیدن متن</summary><pre style="white-space:pre-wrap;max-height:220px;overflow:auto;max-width:400px;font-family:inherit">${E(planText(p))}</pre></details></td></tr>`).join('')}</tbody></table></div><div class="dialog-actions">${btn('close','انصراف','close')}<button class="btn primary" data-act="confirm">تأیید و افزودن طرح‌ها</button></div>`,()=>{if(!writable())return;const selected=$$('.import-check:checked').map(el=>{const j=+el.dataset.index,p=clone(plans[j]);p.id=id();p.title=$(`.import-title[data-index="${j}"]`).value;p.grade=$(`.import-grade[data-index="${j}"]`).value;p.subject=$(`.import-subject[data-index="${j}"]`).value;p.createdAt=now();p.updatedAt=now();for(const m of p.meta){if(m.id==='topic')m.value=p.title;if(m.id==='grade')m.value=p.grade;if(m.id==='subject')m.value=p.subject}return validatePlan(p)});if(!selected.length)throw Error('دست‌کم یک طرح را انتخاب کنید.');commit(()=>{store.myPlans.push(...selected);store.stats.importCount+=selected.length;store.stats.totalCreated+=selected.length},fa(selected.length)+' طرح وارد شد.',false);close();ui.grade='';ui.subject='';ui.type='';ui.template='';go('mine')},true)}
function restorePreview(data,title='پشتیبان',historyData=null){const candidate=validateStore(clone(data)),restoredHistory=historyData?pruneHistory(validateHistory(clone(historyData))):null;modal('بازیابی؛ مرحلهٔ اول',`<p class="explain">${E(title)} شامل ${fa(candidate.myPlans.length)} طرح، ${fa(candidate.settings.customTemplates.length)} قالب شخصی و ${fa(candidate.notes.length)} یادداشت است. جایگزینی با اطلاعات فعلی انجام می‌شود؛ ادغام نیست.</p><div class="row">${btn('backup','اول نسخهٔ فعلی را بگیر','download')}</div><div class="dialog-actions">${btn('close','انصراف','close')}<button class="btn primary" data-act="confirm">ادامه به تأیید نهایی</button></div>`,()=>{modal('بازیابی؛ تأیید نهایی',`<form data-form="modal"><p class="explain">برای جایگزینی کامل اطلاعات کارگاه، عبارت «بازیابی کن» را بنویس.</p>${field('restoreText','عبارت تأیید','','autocomplete="off"')}${actions('جایگزینی اطلاعات')}</form>`,()=>{if(val('restoreText')!=='بازیابی کن')throw Error('عبارت تأیید درست نیست.');commitRestore(candidate,restoredHistory);close();ui.tab='home';render();toast('پشتیبان بازیابی شد؛ داده‌ها را بررسی کن.')})})}
$('#fileInput').addEventListener('change',async e=>{const files=[...e.target.files];if(!files.length)return;try{if(importKind==='restore'){if(files[0].size>16*1024*1024)throw Error('فایل بیش از حد بزرگ است.');const d=JSON.parse(await files[0].text());if(d.app!=='hakimestan-tarhdars'||d.version!==1||d.kind!=='backup')throw Error('این فایل، پشتیبان کامل کارگاه نیست.');restorePreview(d.data,files[0].name,d.history)}else await processFiles(files)}catch(err){error(err instanceof SyntaxError?Error('فایل JSON خوانا نیست؛ نسخه سالم انتخاب کنید.'):err)}finally{e.target.value=''}});
/* نوشته‌های ثابت پس از رندر شخصی‌سازی می‌شوند؛ محتواهای آموزشی در خود ویرایشگر تغییر می‌کنند. */
const baseCopies=applyCopies;applyCopies=function(){const mappings=store.settings.uiText;$$('[data-copy]').forEach(el=>{if(Object.prototype.hasOwnProperty.call(mappings,el.dataset.copy))el.textContent=mappings[el.dataset.copy]});for(const n of rawTextNodes($('#main')).concat(rawTextNodes($('#nav')))){n.__base=n.textContent;const key='raw:'+n.textContent;if(Object.prototype.hasOwnProperty.call(mappings,key))n.textContent=String(mappings[key])}};
