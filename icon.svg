  <path d="M 96 512 L 108 400 Q 118 360 180 350 L 332 350 Q 394 360 404 400 L 416 512 Z" fill="url(#robe)"/>
  <path d="M 130 420 Q 256 390 382 420" stroke="#2a1f52" stroke-width="6" fill="none" opacity="0.5"/>

