<script>
'use strict';
const EXAM=${EX},CFG=${safe(cfg)};
const EXAM_SECRET = ${safe(EXAM_SECRET)};

function b64dec(s){
  try{
    s = String(s).replace(/-/g,'+').replace(/_/g,'/');
    while(s.length % 4) s += '=';
    const bin = atob(s), bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }catch(e){ return ''; }
}

function unlock(q){
  if(!q || !q._x) return q;
  try{
    const raw = b64dec(q._x);
    const i = raw.lastIndexOf('|');
    if(i < 0 || raw.slice(i+1) !== (CFG.secret || EXAM_SECRET)) return q;
    const box = JSON.parse(raw.slice(0, i));
    Object.assign(q, box);
    if(Array.isArray(box.subAnswers) && Array.isArray(q.subQuestions)){
      q.subQuestions = q.subQuestions.map((s,idx)=>({ ...s, answer: box.subAnswers[idx]||'' }));
    }
    delete q.subAnswers;
    delete q._x;
  }catch(e){}
  return q;
}
const ABJAD=['الف','ب','ج','د','ه','و','ز','ح','ط','ی'];
const fa=v=>String(v).replace(/\\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').trim().replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[\\u200c]/g,'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\\s+/g,' ').toLowerCase();
const lbl=j=>CFG.labels==='num'?fa(j+1):CFG.labels==='latin'?String.fromCharCode(65+j):ABJAD[j];
const SKEY='hk_progress_'+EXAM.id;
let qs=[],order=[],idx=0,answers=[],marked=[],started=0,student='',klass='',finished=false,timerId=null,out=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prepare(){qs=EXAM.questions.map(q=>{q=unlock(JSON.parse(JSON.stringify(q)));if(!Array.isArray(q.pairs))q.pairs=[];if(CFG.shuffleOptions&&(q.type==='mcq'||q.type==='multi')){const idxs=shuffle(q.options.map((_,i)=>i));q.options=idxs.map(i=>q.options[i]);if(q.type==='multi')q.answer=(q.answer||[]).map(a=>idxs.indexOf(a));else if(Number.isInteger(q.answer))q.answer=idxs.indexOf(q.answer)}if(q.type==='match'){q.rightOpts=shuffle(q.pairs.map(p=>p[1]).concat(q.distractors||[]))}return q});if(CFG.random)qs=shuffle(qs);answers=qs.map(()=>null);marked=qs.map(()=>false)}
const root=document.getElementById('root');
function eq(a,b){a=[...(a||[])].map(String).sort();b=[...(b||[])].map(String).sort();return a.length===b.length&&a.every((v,i)=>v===b[i])}
function check(q,a){if(a===null||a===undefined||a===''||(Array.isArray(a)&&!a.length))return null;switch(q.type){case 'mcq':return a===q.answer;case 'tf':return a===q.answer;case 'multi':return eq(a,q.answer||[]);case 'short':return (q.shortAnswers||[]).map(norm).includes(norm(a));case 'blank':{const e=q.blankAnswers||[];const v=Array.isArray(a)?a:[a];if(!e.length)return null;const ok=e.filter((x,i)=>norm(x)===norm(v[i])).length;return ok===e.length?true:ok===0?false:ok/e.length}case 'match':{if(!Array.isArray(a))return false;const n=q.pairs.length;if(!n)return null;const ok=q.pairs.filter((p,j)=>norm(a[j])===norm(p[1])).length;return ok===n?true:ok===0?false:ok/n}case 'dropdown':return norm(a)===norm(q.dropdownAnswer);default:return null}}
function hasAns(a){return !(a===null||a===undefined||a===''||(Array.isArray(a)&&!a.some(x=>x!==''&&x!==null)))}
function saveProgress(){try{localStorage.setItem(SKEY,JSON.stringify({student,klass,started,idx,answers,marked,qids:qs.map(q=>q.id),qs}))}catch(e){}}
function clearProgress(){try{localStorage.removeItem(SKEY)}catch(e){}}
function renderStart(){let resume=null;try{resume=JSON.parse(localStorage.getItem(SKEY))}catch(e){}const doneKey='hk_done_'+EXAM.id;let doneBefore=null;try{doneBefore=JSON.parse(localStorage.getItem(doneKey))}catch(e){}
root.innerHTML='<div class="box"><h1>'+esc(EXAM.title)+'</h1><p class="c mut">'+[EXAM.subject,EXAM.grade,EXAM.school,EXAM.teacher&&'دبیر: '+EXAM.teacher,EXAM.date].filter(Boolean).map(esc).join(' • ')+'</p><div class="stats"><div><b>'+fa(qs.length)+'</b>سؤال</div><div><b>'+fa(CFG.duration)+'</b>دقیقه</div><div><b>'+fa(qs.reduce((s,q)=>s+q.score,0))+'</b>نمره</div></div>'+(doneBefore&&!CFG.allowRetry?'<div class="warnbox">شما قبلاً این آزمون را در تاریخ '+esc(new Date(doneBefore.date).toLocaleString('fa-IR'))+' با نمره‌ی '+fa(doneBefore.percent)+'٪ به پایان رسانده‌اید و امکان تکرار وجود ندارد.</div>':'<label>نام و نام خانوادگی '+(CFG.requireName?'<span style="color:#b00">*</span>':'(اختیاری)')+'</label><input id="st" class="field" autocomplete="name" value="'+esc(resume?.student||'')+'">'+(CFG.askClass?'<label>کلاس / شماره</label><input id="kl" class="field" value="'+esc(resume?.klass||'')+'">':'')+'<div class="warnbox">⏱ با زدن «شروع»، زمان‌سنج فعال می‌شود. پاسخ‌ها به‌صورت خودکار ذخیره می‌شوند و اگر صفحه بسته شد، می‌توانید ادامه دهید.</div><div class="acts"><button class="btn" id="go">شروع آزمون</button>'+(resume&&resume.answers&&!resume.finished?'<button class="btn ghost" id="resume">ادامه‌ی آزمون قبلی</button>':'')+'</div>')+'<div class="foot">آزمون‌ساز حکیمستان — طراح و توسعه‌دهنده: مهدی شریفیان</div></div>';
const go=document.getElementById('go');if(go)go.onclick=()=>{student=(document.getElementById('st').value||'').trim();klass=(document.getElementById('kl')?.value||'').trim();if(CFG.requireName&&!student){alert('لطفاً نام خود را وارد کنید.');document.getElementById('st').focus();return}prepare();started=Date.now();finished=false;idx=0;saveProgress();renderQ();clock()};
const rs=document.getElementById('resume');if(rs)rs.onclick=()=>{qs=resume.qs;answers=resume.answers;marked=resume.marked||qs.map(()=>false);student=resume.student;klass=resume.klass;started=resume.started;idx=Math.min(resume.idx||0,qs.length-1);finished=false;renderQ();clock()};}
function saveA(){const q=qs[idx];if(!q)return;let v=null;switch(q.type){case 'mcq':{const x=root.querySelector('input[name=a]:checked');v=x?+x.value:null;break}case 'multi':v=[...root.querySelectorAll('input[name=a]:checked')].map(x=>+x.value);if(!v.length)v=null;break;case 'tf':{const x=root.querySelector('input[name=a]:checked');v=x?x.value==='1':null;break}case 'blank':v=[...root.querySelectorAll('[data-blank]')].map(x=>x.value.trim());if(!v.some(Boolean))v=null;break;case 'match':v=q.pairs.map((_,k)=>root.querySelector('#m'+k)?.value||'');if(!v.some(Boolean))v=null;break;case 'dropdown':v=root.querySelector('#dd')?.value||null;break;default:v=(root.querySelector('#ans')?.value||'').trim()||null}answers[idx]=v;saveProgress()}
function fb(q,a){if(CFG.showCorrect!=='after')return '';const r=check(q,a);if(r===null)return '';if(r===true)return '<div class="fb ok">✓ درست است.'+(q.explanation?' '+esc(q.explanation):'')+'</div>';if(r===false)return '<div class="fb bad">✗ نادرست است.'+(q.explanation?' '+esc(q.explanation):'')+'</div>';return '<div class="fb part">بخشی درست است ('+fa(Math.round(r*100))+'٪)</div>'}
function renderQ(){const q=qs[idx];if(!q){finish();return}const a=answers[idx];let b='';
if(q.image)b+='<img class="qi" src="'+esc(q.image)+'" alt="">';
let text=q.text||'';
if(q.type==='blank'){let k=0;const parts=esc(text).split(/__+/);text=parts.map((p,i)=>i<parts.length-1?p+'<input class="blank" data-blank placeholder="جای خالی '+fa(k+1)+'" value="'+esc(Array.isArray(a)?a[k++]||'':'')+'">':p).join('')}else text=esc(text);
let sub=(q.subQuestions||[]).length?'<div style="margin:-6px 0 10px;padding-right:10px;border-right:3px solid #e0b640">'+q.subQuestions.map((s,j)=>'<div><b>'+ABJAD[j]+')</b> '+esc(s.text)+(s.score?' <small class="mut">('+fa(s.score)+')</small>':'')+'</div>').join('')+'</div>':'';
if(q.type==='mcq'||q.type==='multi')b+=q.options.map((o,j)=>{const on=q.type==='multi'?(a||[]).includes(j):a===j;return '<label class="opt '+(on?'sel':'')+'"><input type="'+(q.type==='multi'?'checkbox':'radio')+'" name="a" value="'+j+'" '+(on?'checked':'')+'><span class="l">'+lbl(j)+')</span><span>'+esc(o)+'</span></label>'}).join('');
else if(q.type==='tf')b+='<label class="opt '+(a===true?'sel':'')+'"><input type="radio" name="a" value="1" '+(a===true?'checked':'')+'><span>✓ صحیح</span></label><label class="opt '+(a===false?'sel':'')+'"><input type="radio" name="a" value="0" '+(a===false?'checked':'')+'><span>✗ غلط</span></label>';
else if(q.type==='match')b+='<div class="match">'+q.pairs.map((p,k)=>'<label><span><b>'+fa(k+1)+'.</b> '+esc(p[0])+'</span><select id="m'+k+'" class="field"><option value="">انتخاب کنید…</option>'+q.rightOpts.map(o=>'<option value="'+esc(o)+'" '+(Array.isArray(a)&&a[k]===o?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select></label>').join('')+'</div>';
else if(q.type==='dropdown')b+='<select id="dd" class="field"><option value="">انتخاب کنید…</option>'+q.dropdownOptions.map(o=>'<option value="'+esc(o)+'" '+(a===o?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
else if(q.type==='short')b+='<input id="ans" class="field" placeholder="پاسخ کوتاه…" value="'+esc(a||'')+'" autocomplete="off">';
else if(q.type==='essay')b+='<textarea id="ans" class="field" placeholder="پاسخ خود را بنویسید…">'+esc(a||'')+'</textarea>';
const answered=answers.filter(hasAns).length;
root.innerHTML='<div class="box"><div class="top"><b>سؤال '+fa(idx+1)+' از '+fa(qs.length)+' <span class="mut">('+fa(q.score)+' نمره)</span></b><b id="timer" class="timer">--:--</b></div><div class="bar"><i style="width:'+(answered/qs.length*100)+'%"></i></div>'+(q.section?'<span class="sec">'+esc(q.section)+'</span>':'')+'<p class="q">'+text+'</p>'+sub+b+fb(q,a)+'<div class="nav"><button class="btn ghost" id="prev" '+(idx===0?'disabled':'')+'>→ قبلی</button><button class="btn mark '+(marked[idx]?'on':'')+'" id="mk">'+(marked[idx]?'★ نشان‌شده':'☆ نشان کن')+'</button><button class="btn" id="next">'+(idx===qs.length-1?'پایان آزمون ✓':'بعدی ←')+'</button></div><details style="margin-top:12px"><summary class="mut" style="cursor:pointer">نقشه‌ی سؤال‌ها ('+fa(answered)+' پاسخ داده‌شده)</summary><div class="grid">'+qs.map((_,j)=>'<button type="button" data-j="'+j+'" class="'+(hasAns(answers[j])?'done ':'')+(marked[j]?'mk ':'')+(j===idx?'cur':'')+'">'+fa(j+1)+'</button>').join('')+'</div><button class="btn ghost" id="finishNow" style="width:100%">پایان و مشاهده‌ی نتیجه</button></details></div>';
root.querySelectorAll('.opt input').forEach(i=>i.addEventListener('change',()=>{saveA();if(q.type==='mcq'||q.type==='tf'){root.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.querySelector('input').checked));if(CFG.showCorrect==='after')renderQ()}else root.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.querySelector('input').checked))}));
root.querySelectorAll('[data-blank],#ans').forEach(x=>x.addEventListener('input',saveA));
root.querySelectorAll('select').forEach(x=>x.addEventListener('change',saveA));
document.getElementById('prev').onclick=()=>{saveA();if(idx>0){idx--;renderQ()}};
document.getElementById('next').onclick=()=>{saveA();if(idx===qs.length-1)askFinish();else{idx++;renderQ()}};
document.getElementById('mk').onclick=()=>{marked[idx]=!marked[idx];saveProgress();renderQ()};
document.getElementById('finishNow').onclick=()=>{saveA();askFinish()};
root.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>{saveA();idx=+b.dataset.j;renderQ()});
clock(true);window.scrollTo({top:0,behavior:'smooth'})}
function askFinish(){const un=answers.filter(a=>!hasAns(a)).length;if(un>0&&!confirm(fa(un)+' سؤال بی‌پاسخ مانده است. آزمون تمام شود؟'))return;finish()}
function clock(once){clearTimeout(timerId);if(!started||finished)return;const left=Math.max(0,CFG.duration*60-Math.floor((Date.now()-started)/1000));const t=document.getElementById('timer');if(t){t.textContent=fa(String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0'));t.classList.toggle('low',left<60)}if(left<=0){saveA();finish(true)}else if(!once||true)timerId=setTimeout(clock,1000)}
function finish(timeout){if(!started||finished)return;finished=true;clearTimeout(timerId);let total=0,max=0,correct=0,wrong=0,blank=0,pending=0;const details=qs.map((q,j)=>{const a=answers[j],r=check(q,a),full=q.score;let sc=0,st='';if(!hasAns(a)){blank++;st='blank';if(q.type==='essay')pending++}else if(r===null){pending++;st='pending'}else if(typeof r==='number'){sc=+(full*r).toFixed(2);st='partial'}else if(r){sc=full;correct++;st='correct'}else{wrong++;st='wrong'}max+=full;total+=sc;return{id:q.id,q:q.text||'',type:q.type,section:q.section||'',ans:a,correct_ans:q.type==='mcq'?(Number.isInteger(q.answer)?q.options[q.answer]:''):q.type==='multi'?(q.answer||[]).map(i=>q.options[i]).join('، '):q.type==='tf'?(q.answer?'صحیح':'غلط'):q.type==='short'?(q.shortAnswers||[]).join(' / '):q.type==='blank'?(q.blankAnswers||[]).join(' / '):q.type==='match'?q.pairs.map(p=>p[0]+'←'+p[1]).join('؛ '):q.type==='dropdown'?q.dropdownAnswer:(q.sampleAnswer||''),score:sc,full,status:st,ans_text:Array.isArray(a)?(q.type==='mcq'||q.type==='multi')?'':a.join('، '):q.type==='mcq'?(Number.isInteger(a)?lbl(a)+') '+q.options[a]:''):q.type==='tf'?(a===true?'صحیح':a===false?'غلط':''):String(a??'')}});
details.forEach(d=>{if(d.type==='multi'&&Array.isArray(d.ans))d.ans_text=d.ans.map(i=>lbl(i)).join('، ')});
total=+total.toFixed(2);const percent=max?Math.round(total/max*100):0;const passed=percent>=CFG.passPercent;const spent=Math.round((Date.now()-started)/1000);
out={hakimestan_result:2,exam_id:EXAM.id,exam_title:EXAM.title,subject:EXAM.subject||'',grade:EXAM.grade||'',student:student||'بدون نام',klass,date:new Date().toISOString(),time_spent:spent,timeout:!!timeout,total_score:total,max_score:max,percent,passed,correct_count:correct,wrong_count:wrong,blank_count:blank,manual_pending:pending,total_questions:qs.length,passPercent:CFG.passPercent,details};
clearProgress();try{localStorage.setItem('hk_done_'+EXAM.id,JSON.stringify({date:out.date,percent}))}catch(e){}

function readResultFiles(files){if(!files||!files.length)return;const big=[...files].reduce((s,f)=>s+f.size,0);if(big>1.5*1024*1024)toast('در حال خواندن فایل‌های حجیم… چند لحظه صبر کنید','info',{ms:4000});Promise.all([...files].map(f=>new Promise(res=>{const r=new FileReader();r.onload=()=>{try{res(JSON.parse(r.result))}catch(e){res(null)}};r.onerror=()=>res(null);r.readAsText(f)}))).then(list=>{const flat=list.flatMap(x=>Array.isArray(x)?x:[x]);const bad=flat.filter(x=>!x||!('percent' in x)).length;const n=addResults(flat.filter(Boolean));render();if(n)toast(`${fa(n)} نتیجه اضافه شد`,'ok');if(bad)toast(`${fa(bad)} فایل نامعتبر یا تکراری نادیده گرفته شد`,'err');if(!n&&!bad)toast('نتیجه‌ی جدیدی نبود (تکراری)','info')})}
function finalScore(r){const manual=r.manual||{};let t=0;(r.details||[]).forEach((d,i)=>{t+=manual[i]!==undefined?+manual[i]:(+d.score||0)});if(!(r.details||[]).length)return +r.total_score||0;return +t.toFixed(2)}
function finalPercent(r){const m=+r.max_score||0;return m?Math.round(finalScore(r)/m*100):(+r.percent||0)}
function pendingCount(r){const manual=r.manual||{};return (r.details||[]).filter((d,i)=>(d.status==='pending'||(d.type==='essay'&&d.status!=='blank'))&&manual[i]===undefined).length}

    case 'gCSV':{const list=results.slice().sort((a,b)=>finalPercent(b)-finalPercent(a));const rows=[['رتبه','نام','کلاس','آزمون','نمره','حداکثر','درصد','درست','نادرست','بی‌پاسخ','در انتظار تصحیح','زمان (ثانیه)','تاریخ'],...list.map((r,i)=>[i+1,r.student,r.klass||'',r.exam_title,finalScore(r),r.max_score,finalPercent(r),r.correct_count,r.wrong_count,r.blank_count,pendingCount(r),r.time_spent||'',r.date])];dl('natayej-'+new Date().toISOString().slice(0,10)+'.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8');return true}
    case 'gPrint':{const list=results.slice().sort((a,b)=>finalPercent(b)-finalPercent(a));const e=exam();const html=reportHTML(list,'کارنامه‌ی کلاس')+`<h1>کارنامه‌ی کلاس — ${esc(list[0]?.exam_title||e.title)}</h1><div class="m">${esc(e.subject||'')} ${esc(e.grade||'')} — ${fa(list.length)} دانش‌آموز — میانگین ${fa((list.reduce((s,r)=>s+finalPercent(r),0)/Math.max(1,list.length)).toFixed(1))}٪ — دبیر: ${esc(e.teacher||'')}</div><table><thead><tr><th>رتبه</th><th>نام</th><th>کلاس</th><th>نمره</th><th>درصد</th><th>درست</th><th>نادرست</th><th>بی‌پاسخ</th><th>وضعیت</th></tr></thead><tbody>${list.map((r,i)=>`<tr><td>${fa(i+1)}</td><td class="r">${esc(r.student)}</td><td>${esc(r.klass||'')}</td><td>${faNum(finalScore(r))} / ${faNum(r.max_score)}</td><td>${fa(finalPercent(r))}٪</td><td>${fa(r.correct_count??'')}</td><td>${fa(r.wrong_count??'')}</td><td>${fa(r.blank_count??'')}</td><td>${finalPercent(r)>=passOf(r)?'قبول':'مردود'}</td></tr>`).join('')}</tbody></table><div class="sig"><span>امضای دبیر</span><span>تاریخ: ${todayJalali()}</span></div></body></html>`;const w=openWin(html);if(w)setTimeout(()=>{try{w.print()}catch(x){}},900);else printViaFrame(html);return true}
    case 'gCards':{printCards(results.slice().sort((a,b)=>a.student.localeCompare(b.student,'fa')));return true}
  }
  return false;
}
