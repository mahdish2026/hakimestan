<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
 <link rel="icon" type="image/svg+xml" href="../icon.svg">
<link rel="apple-touch-icon" href="../icon.svg">
<link rel="manifest" href="../manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل معلم — فتح کهن دیار ایران</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: linear-gradient(180deg, #140b04, #0a0602);
    color: #f5edd6;
    min-height: 100vh;
    padding: 20px 16px;
    direction: rtl;
  }
  .container { max-width: 1000px; margin: 0 auto; }
  h1 { text-align: center; color: #f5c842; margin-bottom: 8px; font-size: 1.5rem; }
  .subtitle { text-align: center; color: #bda282; font-size: 0.8rem; margin-bottom: 24px; }

  /* ===== صفحه رمز ===== */
  .login-screen { display: flex; align-items: center; justify-content: center; min-height: 80vh; }
  .login-box {
    max-width: 400px; width: 100%;
    background: linear-gradient(145deg, #2a1506, #1b0c03);
    border: 2px solid #c9941a; border-radius: 20px;
    padding: 30px 24px; text-align: center;
    box-shadow: 0 15px 50px rgba(0,0,0,0.7);
  }
  .login-icon { font-size: 3rem; margin-bottom: 12px; filter: drop-shadow(0 0 15px rgba(245,200,66,0.5)); }
  .login-title { color: #f5c842; font-size: 1.1rem; font-weight: 900; margin-bottom: 6px; }
  .login-sub { color: #bda282; font-size: 0.75rem; margin-bottom: 20px; line-height: 1.6; }
  .login-input {
    width: 100%; padding: 14px 18px; border-radius: 14px;
    border: 1.5px solid rgba(201,148,26,0.4);
    background: rgba(0,0,0,0.4); color: #f5edd6;
    font-family: inherit; font-size: 1.1rem; text-align: center;
    letter-spacing: 4px; transition: all 0.3s; outline: none;
  }
  .login-input:focus { border-color: #f5c842; box-shadow: 0 0 15px rgba(245,200,66,0.3); }
  .login-btn {
    width: 100%; margin-top: 16px; padding: 14px;
    background: linear-gradient(135deg, #c9941a, #f5c842);
    color: #120500; border: none; border-radius: 30px;
    font-family: inherit; font-size: 1rem; font-weight: 900;
    cursor: pointer; box-shadow: 0 4px 15px rgba(245,200,66,0.3);
    transition: all 0.2s;
  }
  .login-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245,200,66,0.5); }
  .login-error { color: #e74c3c; font-size: 0.75rem; margin-top: 12px; font-weight: 700; display: none; }
  .login-error.show { display: block; }
  .login-hint { color: #5a4028; font-size: 0.65rem; margin-top: 16px; }

  #mainPanel { display: none; }
  #mainPanel.show { display: block; }

  /* ===== فیلترها و جستجو ===== */
  .toolbar {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(201,148,26,0.2);
    border-radius: 12px; padding: 12px;
    margin-bottom: 16px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .toolbar input, .toolbar select {
    padding: 8px 12px; border-radius: 10px;
    border: 1.5px solid rgba(201,148,26,0.3);
    background: rgba(0,0,0,0.4); color: #f5edd6;
    font-family: inherit; font-size: 0.8rem;
    outline: none; transition: all 0.2s;
  }
  .toolbar input:focus, .toolbar select:focus { border-color: #f5c842; }
  .toolbar input { flex: 1; min-width: 150px; }
  .toolbar select { min-width: 120px; }

  /* ===== کارت‌های آماری ===== */
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .stat-box {
    background: linear-gradient(145deg, #2a1506, #1b0c03);
    border: 1.5px solid #c9941a; border-radius: 16px;
    padding: 16px 12px; text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .stat-box .num { font-size: 2rem; font-weight: 900; color: #f5c842; display: block; }
  .stat-box .label { font-size: 0.7rem; color: #bda282; margin-top: 4px; font-weight: 700; }

  .section-title {
    color: #f5c842; font-size: 1.1rem; font-weight: 800;
    margin: 24px 0 12px; padding-bottom: 6px;
    border-bottom: 2px solid rgba(201,148,26,0.3);
    display: flex; justify-content: space-between; align-items: center;
  }

  /* ===== نمودار توزیع ===== */
  .chart-wrap {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(201,148,26,0.2);
    border-radius: 12px; padding: 16px 12px;
    display: flex; justify-content: space-around; align-items: flex-end;
    height: 200px; gap: 8px;
  }
  .chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .chart-bar {
    width: 100%; max-width: 60px; border-radius: 8px 8px 0 0;
    transition: height 0.6s ease; min-height: 4px;
  }
  .chart-count { font-size: 0.75rem; font-weight: 800; color: #f5c842; margin-bottom: 4px; }
  .chart-label { font-size: 0.7rem; color: #bda282; margin-top: 6px; font-weight: 700; }

  /* ===== درس‌به‌درس ===== */
  .lesson-item {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(201,148,26,0.2);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
  }
  .lesson-name {
    font-size: 0.85rem; font-weight: 800; color: #fff3b0;
    margin-bottom: 8px; display: flex; justify-content: space-between;
  }
  .lesson-pct { font-size: 0.9rem; color: #f5c842; }
  .lesson-bar { height: 10px; background: rgba(255,255,255,0.05); border-radius: 20px; overflow: hidden; margin-bottom: 6px; }
  .lesson-fill { height: 100%; border-radius: 20px; transition: width 0.5s ease; }
  .lesson-stat { font-size: 0.7rem; color: #bda282; text-align: right; }

  /* ===== جدول ===== */
  .table-wrap { overflow-x: auto; border-radius: 12px; }
  .students-table {
    width: 100%; border-collapse: collapse;
    background: rgba(0,0,0,0.3);
    font-size: 0.8rem; min-width: 700px;
  }
  .students-table th {
    background: linear-gradient(135deg, #2a1506, #1b0c03);
    color: #f5c842; padding: 12px 8px; font-weight: 800;
    text-align: center; border-bottom: 2px solid #c9941a;
    position: sticky; top: 0;
  }
  .students-table td {
    padding: 10px 8px; text-align: center;
    border-bottom: 1px solid rgba(201,148,26,0.1);
  }
  .students-table tr:hover { background: rgba(245,200,66,0.05); }
  .students-table tr:last-child td { border-bottom: none; }
  .students-table tr.selected { background: rgba(245,200,66,0.15); }

  .rank-medal { font-size: 1.2rem; }
  .score-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-weight: 800; font-size: 0.75rem; }
  .score-high { background: rgba(46,204,113,0.2); color: #2ecc71; }
  .score-mid { background: rgba(52,152,219,0.2); color: #3498db; }
  .score-low { background: rgba(231,76,60,0.2); color: #e74c3c; }

  .delete-btn {
    background: rgba(231,76,60,0.15);
    border: 1px solid rgba(231,76,60,0.4);
    color: #ff7b6b; border-radius: 8px;
    padding: 4px 8px; cursor: pointer;
    font-size: 0.85rem; transition: all 0.2s;
    font-family: inherit;
  }
  .delete-btn:hover { background: rgba(231,76,60,0.4); color: #fff; }

  .bulk-bar {
    background: rgba(231,76,60,0.15);
    border: 1.5px solid rgba(231,76,60,0.4);
    border-radius: 12px; padding: 10px 14px;
    margin-top: 12px;
    display: none; justify-content: space-between; align-items: center;
  }
  .bulk-bar.show { display: flex; }
  .bulk-bar span { font-size: 0.8rem; font-weight: 700; color: #ff7b6b; }

  .warn-tag {
    display: inline-block; padding: 2px 6px; border-radius: 8px;
    font-size: 0.6rem; background: rgba(231,76,60,0.2); color: #ff7b6b;
    margin-right: 4px;
  }

  .empty-state { text-align: center; padding: 40px 20px; color: #bda282; font-size: 0.9rem; }
  .loading { text-align: center; padding: 40px; color: #f5c842; }
  .last-update { text-align: center; color: #bda282; font-size: 0.7rem; margin-top: 20px; }
  .commander-tag {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 0.65rem; background: rgba(155,89,182,0.2); color: #d5b3e8;
  }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
  .refresh-btn, .export-btn, .logout-btn, .print-btn, .backup-btn {
    padding: 10px 24px; border: none; border-radius: 30px;
    font-family: inherit; font-size: 0.85rem; font-weight: 800;
    cursor: pointer; transition: all 0.2s;
  }
  .refresh-btn { background: linear-gradient(135deg, #c9941a, #f5c842); color: #120500; }
  .refresh-btn:hover { transform: translateY(-2px); }
  .export-btn { background: linear-gradient(135deg, #27ae60, #2ecc71); color: #fff; }
  .export-btn:hover { transform: translateY(-2px); }
  .print-btn { background: linear-gradient(135deg, #8e44ad, #9b59b6); color: #fff; }
  .print-btn:hover { transform: translateY(-2px); }
  .backup-btn { background: linear-gradient(135deg, #2980b9, #3498db); color: #fff; }
  .backup-btn:hover { transform: translateY(-2px); }
  .logout-btn {
    padding: 8px 20px; margin-top: 20px;
    background: rgba(139,26,26,0.3); color: #ff9999;
    border: 1px solid rgba(231,76,60,0.4); border-radius: 20px;
    font-size: 0.75rem; display: block; margin-left: auto; margin-right: auto;
  }
  .logout-btn:hover { background: rgba(139,26,26,0.5); }

  /* ===== حالت چاپ ===== */
  @media print {
    body { background: #fff; color: #000; padding: 0; }
    .login-screen, .toolbar, .btn-row, .logout-btn, .delete-btn,
    .bulk-bar, .last-update, .chart-wrap { display: none !important; }
    .stat-box, .lesson-item, .students-table {
      background: #fff !important; color: #000 !important;
      border-color: #333 !important; box-shadow: none !important;
    }
    .stat-box .num, .section-title, .lesson-pct { color: #000 !important; }
    h1, .subtitle { color: #000 !important; }
    .students-table th { background: #eee !important; color: #000 !important; }
    .score-badge { border: 1px solid #333; }
  }

  /* ===== موبایل ===== */
  @media (max-width: 640px) {
    body { padding: 12px 8px; }
    h1 { font-size: 1.2rem; }
    .stat-box .num { font-size: 1.5rem; }
    .chart-wrap { height: 160px; }
    .chart-count { font-size: 0.65rem; }
    .chart-label { font-size: 0.6rem; }
    .toolbar input, .toolbar select { font-size: 0.75rem; padding: 6px 10px; }
    .students-table { font-size: 0.7rem; min-width: 600px; }
    .students-table th, .students-table td { padding: 6px 4px; }
    .btn-row { flex-direction: column; }
    .refresh-btn, .export-btn, .print-btn, .backup-btn { width: 100%; }
  }
</style>
</head>
<body>

<!-- ===== صفحه رمز ===== -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <div class="login-title">ورود به پنل معلم</div>
    <div class="login-sub">برای دیدن اطلاعات کلاس، رمز عبور رو وارد کن</div>
    <input type="password" id="loginPassword" class="login-input" placeholder="••••" maxlength="20" onkeydown="if(event.key==='Enter') checkLogin()">
    <button class="login-btn" onclick="checkLogin()">🔓 ورود</button>
    <div class="login-error" id="loginError">❌ رمز اشتباهه!</div>
    <div class="login-hint">این پنل مخصوص معلمه</div>
  </div>
</div>

<!-- ===== پنل اصلی ===== -->
<div id="mainPanel">
  <div class="container">
    <h1>📊 پنل معلم</h1>
    <div class="subtitle">فتح کهن دیار ایران — مطالعات اجتماعی پایه پنجم</div>

    <div id="content">
      <div class="loading">⏳ در حال بارگذاری...</div>
    </div>

    <div class="btn-row">
      <button class="export-btn" onclick="exportCSV()">📥 دانلود Excel</button>
      <button class="backup-btn" onclick="backupJSON()">💾 پشتیبان JSON</button>
      <button class="print-btn" onclick="window.print()">🖨️ چاپ</button>
      <button class="refresh-btn" onclick="loadData(false)">🔄 به‌روزرسانی</button>
    </div>
    <div class="last-update" id="lastUpdate"></div>
    <button class="logout-btn" onclick="logout()">🚪 خروج از پنل</button>
  </div>
</div>

<script>
const WORKER_URL = 'https://hakim-game-worker.mahdisharifian7.workers.dev';
const PASSWORD = 'hakim2026';
const AUTH_KEY = 'ftah_teacher_auth';
const AUTH_DURATION = 7 * 24 * 60 * 60 * 1000;

const COMMANDER_NAMES = {
  abumuslim: '⚔️ ابومسلم',
  nizam: '📚 خواجه نظام‌الملک',
  yaghub: '🏹 یعقوب لیث',
  nasir: '🔭 خواجه نصیر'
};
const LESSON_NAMES = {
  18: 'درس ۱۸ — قیام و حکومت‌های ایرانی',
  19: 'درس ۱۹ — سلجوقیان و وزیران',
  20: 'درس ۲۰ — حمله مغول',
  21: 'درس ۲۱ — بازسازی ایران'
};

// ===== State =====
let allStudents = [];       // همه داده‌ها از سرور
let filteredStudents = [];  // بعد از فیلتر
let selectedIds = new Set(); // برای حذف گروهی
let searchQuery = '';
let dateFilter = 'all';

// ===== احراز هویت =====
function checkLogin() {
  const input = document.getElementById('loginPassword');
  const error = document.getElementById('loginError');
  if (input.value.trim() === PASSWORD) {
    try { localStorage.setItem(AUTH_KEY, JSON.stringify({ time: Date.now() })); } catch(e) {}
    showMainPanel();
  } else {
    error.classList.add('show');
    input.value = '';
    input.focus();
    setTimeout(() => error.classList.remove('show'), 2000);
  }
}

function isAuthenticated() {
  try {
    const auth = JSON.parse(localStorage.getItem(AUTH_KEY));
    if (auth && auth.time && (Date.now() - auth.time) < AUTH_DURATION) return true;
  } catch(e) {}
  return false;
}

function showMainPanel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainPanel').classList.add('show');
  loadData(false);
  setInterval(() => loadData(true), 60000);
}

function logout() {
  try { localStorage.removeItem(AUTH_KEY); } catch(e) {}
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainPanel').classList.remove('show');
  document.getElementById('loginPassword').value = '';
}

// ===== بارگذاری داده =====
async function loadData(isAutoRefresh) {
  const content = document.getElementById('content');
  if (!isAutoRefresh) content.innerHTML = '<div class="loading">⏳ در حال بارگذاری...</div>';

  try {
    const [listRes, statsRes] = await Promise.all([
      fetch(WORKER_URL + '/list'),
      fetch(WORKER_URL + '/stats')
    ]);
    const students = await listRes.json();
    const stats = await statsRes.json();
    allStudents = students || [];

    if (!allStudents.length) {
      content.innerHTML = '<div class="empty-state">📭 هنوز هیچ دانش‌آموزی بازی نکرده</div>';
      return;
    }

    applyFilters();
    renderPanel(stats);
    document.getElementById('lastUpdate').textContent =
      'آخرین به‌روزرسانی: ' + new Date().toLocaleTimeString('fa-IR');
  } catch (e) {
    content.innerHTML = '<div class="empty-state">❌ خطا در ارتباط با سرور<br><small>' + e.message + '</small></div>';
  }
}

// ===== فیلترها =====
function applyFilters() {
  const now = new Date();
  const today = now.toISOString().split('T')[0];

  filteredStudents = allStudents.filter(s => {
    // فیلتر جستجو
    if (searchQuery && !(s.student_name || '').toLowerCase().includes(searchQuery.toLowerCase())) {
      return false;
    }
    // فیلتر تاریخ
    const sDate = (s.created_at || '').split(' ')[0];
    if (dateFilter === 'today' && sDate !== today) return false;
    if (dateFilter === 'week') {
      const weekAgo = new Date(now.getTime() - 7*24*60*60*1000).toISOString().split('T')[0];
      if (sDate < weekAgo) return false;
    }
    if (dateFilter === 'month') {
      const monthAgo = new Date(now.getTime() - 30*24*60*60*1000).toISOString().split('T')[0];
      if (sDate < monthAgo) return false;
    }
    return true;
  });
}

function onSearch(val) {
  searchQuery = val;
  applyFilters();
  renderPanel(null, true);
}

function onDateFilter(val) {
  dateFilter = val;
  applyFilters();
  renderPanel(null, true);
}

function clearFilters() {
  searchQuery = '';
  dateFilter = 'all';
  document.getElementById('searchInput').value = '';
  document.getElementById('dateFilter').value = 'all';
  applyFilters();
  renderPanel(null, true);
}

// ===== نمایش پنل =====
function renderPanel(stats, partialOnly) {
  const content = document.getElementById('content');
  let html = '';

  // ===== آمار =====
  if (!partialOnly && stats) {
    html += '<div class="stats-grid">';
    html += `<div class="stat-box"><span class="num">${stats.total_plays || 0}</span><div class="label">تعداد بازی</div></div>`;
    html += `<div class="stat-box"><span class="num">${Math.round(stats.avg_score || 0)}</span><div class="label">میانگین امتیاز</div></div>`;
    html += `<div class="stat-box"><span class="num">${stats.max_score || 0}</span><div class="label">بالاترین امتیاز</div></div>`;
    html += `<div class="stat-box"><span class="num">${stats.min_score || 0}</span><div class="label">پایین‌ترین امتیاز</div></div>`;
    html += '</div>';
  }

  // ===== فیلترها =====
  html += `
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="🔍 جستجوی نام..." value="${searchQuery}" oninput="onSearch(this.value)">
      <select id="dateFilter" onchange="onDateFilter(this.value)">
        <option value="all" ${dateFilter==='all'?'selected':''}>📅 همه زمان‌ها</option>
        <option value="today" ${dateFilter==='today'?'selected':''}>امروز</option>
        <option value="week" ${dateFilter==='week'?'selected':''}>۷ روز گذشته</option>
        <option value="month" ${dateFilter==='month'?'selected':''}>۳۰ روز گذشته</option>
      </select>
      <button class="delete-btn" onclick="clearFilters()" style="padding:8px 14px">✖️ پاک کردن</button>
    </div>
  `;

  // ===== نمودار توزیع =====
  const bins = [0,0,0,0,0];
  const binLabels = ['۰-۴', '۵-۸', '۹-۱۲', '۱۳-۱۶', '۱۷-۲۰'];
  const binColors = ['#e74c3c', '#e67e22', '#3498db', '#2ecc71', '#27ae60'];
  filteredStudents.forEach(s => {
    const sc = s.score || 0;
    if (sc <= 4) bins[0]++;
    else if (sc <= 8) bins[1]++;
    else if (sc <= 12) bins[2]++;
    else if (sc <= 16) bins[3]++;
    else bins[4]++;
  });
  const maxBin = Math.max(...bins, 1);

  html += '<div class="section-title">📊 توزیع نمرات کلاس</div>';
  html += '<div class="chart-wrap">';
  bins.forEach((count, i) => {
    const h = Math.round((count / maxBin) * 100);
    html += `
      <div class="chart-col">
        <div class="chart-count">${count}</div>
        <div class="chart-bar" style="height:${h}%;background:linear-gradient(180deg, ${binColors[i]}, ${binColors[i]}88)"></div>
        <div class="chart-label">${binLabels[i]}</div>
      </div>`;
  });
  html += '</div>';

  // ===== درس‌به‌درس =====
  const lessonStats = { 18:{c:0,w:0}, 19:{c:0,w:0}, 20:{c:0,w:0}, 21:{c:0,w:0} };
  filteredStudents.forEach(s => {
    if (s.lesson_stats) {
      try {
        const ls = JSON.parse(s.lesson_stats);
        for (let lesson in ls) {
          if (lessonStats[lesson]) {
            lessonStats[lesson].c += ls[lesson].c || 0;
            lessonStats[lesson].w += ls[lesson].w || 0;
          }
        }
      } catch(e) {}
    }
  });

  html += '<div class="section-title">📚 تحلیل درس‌به‌درس</div>';
  for (let lesson of [18, 19, 20, 21]) {
    const l = lessonStats[lesson];
    const total = l.c + l.w;
    const pct = total > 0 ? Math.round((l.c / total) * 100) : 0;
    let color = pct >= 80 ? '#2ecc71' : pct >= 60 ? '#3498db' : pct >= 40 ? '#e67e22' : '#e74c3c';
    let grade = pct >= 80 ? 'عالی' : pct >= 60 ? 'خوب' : pct >= 40 ? 'قابل قبول' : 'نیاز به مرور';
    html += `
      <div class="lesson-item">
        <div class="lesson-name"><span>${LESSON_NAMES[lesson]}</span><span class="lesson-pct">${pct}٪</span></div>
        <div class="lesson-bar"><div class="lesson-fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="lesson-stat">${grade} — ${l.c} پاسخ درست از ${total}</div>
      </div>`;
  }

  // ===== جدول =====
  html += `<div class="section-title">
    <span>👥 لیست دانش‌آموزان (${filteredStudents.length})</span>
    <span style="font-size:0.7rem;font-weight:normal">${
      filteredStudents.length !== allStudents.length
        ? `از ${allStudents.length} رکورد`
        : ''
    }</span>
  </div>`;

  if (!filteredStudents.length) {
    html += '<div class="empty-state">🔍 هیچ نتیجه‌ای برای این فیلتر پیدا نشد</div>';
  } else {
    // مرتب‌سازی بر اساس امتیاز برای رتبه‌بندی
    const sorted = [...filteredStudents].sort((a, b) => (b.score || 0) - (a.score || 0));
    const rankMap = new Map();
    sorted.forEach((s, i) => rankMap.set(s.id, i + 1));

    html += '<div class="table-wrap"><table class="students-table"><thead><tr>';
    html += '<th><input type="checkbox" onchange="toggleSelectAll(this.checked)"></th>';
    html += '<th>رتبه</th><th>ردیف</th><th>نام</th><th>امتیاز</th><th>شهرها</th><th>قلب</th><th>زنجیره</th><th>سردار</th><th>تاریخ</th><th>حذف</th>';
    html += '</tr></thead><tbody>';

    filteredStudents.forEach((s, idx) => {
      let cities = 0;
      try { cities = JSON.parse(s.conquered_cities || '[]').length; } catch(e) {}
      const scoreClass = s.score >= 16 ? 'score-high' : s.score >= 11 ? 'score-mid' : 'score-low';
      const hearts = '❤️'.repeat(s.hearts || 0) + '🖤'.repeat(3 - (s.hearts || 0));
      const date = (s.created_at || '').split(' ')[0];
      const cmd = COMMANDER_NAMES[s.commander] || '—';
      const sid = s.id || '';
      const rank = rankMap.get(sid) || 0;
      let medal = '';
      if (rank === 1) medal = '🥇';
      else if (rank === 2) medal = '🥈';
      else if (rank === 3) medal = '🥉';
      else medal = rank;

      // هشدار نمره پایین
      const warn = (s.score || 0) < 8 ? '<span class="warn-tag">⚠️ ضعیف</span>' : '';

      const isSelected = selectedIds.has(sid);
      html += `<tr class="${isSelected ? 'selected' : ''}">
        <td><input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect('${sid}', this.checked)"></td>
        <td><span class="rank-medal">${medal}</span></td>
        <td>${idx + 1}</td>
        <td><strong>${s.student_name}</strong> ${warn}</td>
        <td><span class="score-badge ${scoreClass}">${s.score}</span></td>
        <td>${cities}/6</td>
        <td style="font-size:.9rem">${hearts}</td>
        <td>${s.max_combo || 0}</td>
        <td><span class="commander-tag">${cmd}</span></td>
        <td style="font-size:.7rem;color:#bda282">${date}</td>
        <td><button class="delete-btn" onclick="deleteRecord('${sid}', '${(s.student_name||'').replace(/'/g,"\\'")}')">🗑️</button></td>
      </tr>`;
    });
    html += '</tbody></table></div>';

    // نوار حذف گروهی
    html += `
      <div class="bulk-bar ${selectedIds.size > 0 ? 'show' : ''}" id="bulkBar">
        <span>🗑️ ${selectedIds.size} مورد انتخاب شده</span>
        <button class="delete-btn" style="padding:8px 16px" onclick="deleteSelected()">حذف انتخاب شده‌ها</button>
      </div>
    `;
  }

  content.innerHTML = html;
}

// ===== انتخاب گروهی =====
function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  renderPanel(null, true);
}

function toggleSelectAll(checked) {
  if (checked) filteredStudents.forEach(s => selectedIds.add(s.id));
  else selectedIds.clear();
  renderPanel(null, true);
}

async function deleteSelected() {
  if (!selectedIds.size) return;
  if (!confirm(`مطمئنی می‌خوای ${selectedIds.size} رکورد رو حذف کنی؟`)) return;

  let success = 0, fail = 0;
  for (const id of selectedIds) {
    try {
      const res = await fetch(WORKER_URL + '/delete?id=' + encodeURIComponent(id), { method: 'DELETE' });
      if (res.ok) success++; else fail++;
    } catch(e) { fail++; }
  }
  selectedIds.clear();
  showToast(`🗑️ ${success} رکورد حذف شد${fail ? ` — ${fail} خطا` : ''}`);
  loadData(false);
}

// ===== حذف تکی =====
async function deleteRecord(id, name) {
  if (!id) { showToast('❌ شناسه پیدا نشد'); return; }
  if (!confirm(`مطمئنی «${name}» حذف بشه؟`)) return;
  try {
    const res = await fetch(WORKER_URL + '/delete?id=' + encodeURIComponent(id), { method: 'DELETE' });
    if (res.ok) {
      showToast('🗑️ رکورد حذف شد');
      loadData(false);
    } else {
      showToast('❌ خطا در حذف (' + res.status + ')');
    }
  } catch(e) { showToast('❌ خطا: ' + e.message); }
}

// ===== خروجی CSV =====
function exportCSV() {
  const table = document.querySelector('.students-table');
  if (!table) { alert('اول داده‌ها رو لود کن!'); return; }
  const headers = ['رتبه','ردیف','نام','امتیاز','شهرها','قلب','زنجیره','سردار','تاریخ'];
  const rows = [];
  table.querySelectorAll('tbody tr').forEach((tr) => {
    const cells = tr.querySelectorAll('td');
    if (cells.length >= 11) {
      rows.push([
        cells[1].textContent.trim(),
        cells[2].textContent.trim(),
        cells[3].textContent.trim(),
        cells[4].textContent.trim(),
        cells[5].textContent.trim(),
        cells[6].textContent.trim(),
        cells[7].textContent.trim(),
        cells[8].textContent.trim(),
        cells[9].textContent.trim()
      ]);
    }
  });
  let csv = '\ufeff' + headers.join(',') + '\n';
  rows.forEach(row => {
    csv += row.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const date = new Date().toISOString().split('T')[0];
  link.download = `نتایج-فتح-کهن-دیار-ایران-${date}.csv`;
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
  showToast('✅ فایل Excel دانلود شد');
}

// ===== پشتیبان JSON =====
function backupJSON() {
  if (!allStudents.length) { alert('داده‌ای برای پشتیبان نیست'); return; }
  const data = {
    exported_at: new Date().toISOString(),
    total: allStudents.length,
    students: allStudents
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const link = document.createElement('a');
  const date = new Date().toISOString().split('T')[0];
  link.download = `backup-فتح-کهن-${date}.json`;
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
  showToast('💾 پشتیبان دانلود شد');
}

// ===== Toast =====
function showToast(msg) {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: linear-gradient(135deg, #27ae60, #2ecc71);
    color: #fff; padding: 14px 28px; border-radius: 30px;
    font-family: inherit; font-size: 0.9rem; font-weight: 800;
    box-shadow: 0 8px 25px rgba(46,204,113,0.5);
    z-index: 9999; opacity: 0; transition: all 0.3s ease;
    max-width: 90vw; text-align: center;
  `;
  toast.textContent = msg;
  document.body.appendChild(toast);
  requestAnimationFrame(() => {
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(-50%) translateY(0)';
  });
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(-20px)';
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

// ===== شروع =====
if (isAuthenticated()) {
  showMainPanel();
} else {
  document.getElementById('loginPassword').focus();
}
