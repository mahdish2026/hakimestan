:root{--accent:#3b82f6;--dark:#245baa;--soft:#eff6ff;--ink:#1d2734;--muted:#566173;--line:#e2e6ed;--line-2:#d3d9e2;--paper:#fff;--desk:#f3f4f7;--white:#fff;--radius:18px;--hh:64px;
--ok:#1d6a3e;--ok-bg:#e4f4ea;--warn:#7d5408;--warn-bg:#fff2d4;--bad:#a12424;--bad-bg:#fde8e8;--info:#1c4f8f;--info-bg:#e6effb;
--accent-ink:var(--dark);--tint:color-mix(in srgb,var(--accent) 9%,#fff);--tint-2:color-mix(in srgb,var(--accent) 16%,#fff);--accent-line:color-mix(in srgb,var(--accent) 34%,#fff);
--bevel:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -2px 0 rgba(20,30,48,.07),0 1px 2px rgba(20,30,48,.08),0 6px 14px -9px rgba(20,30,48,.35);
--bevel-press:inset 0 2px 5px rgba(20,30,48,.16),inset 0 0 0 1px rgba(20,30,48,.05);
--bevel-dark:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.22),0 2px 3px rgba(20,30,48,.14),0 10px 18px -10px color-mix(in srgb,var(--dark) 80%,transparent);
--lift:0 1px 0 rgba(255,255,255,.9) inset,0 1px 2px rgba(20,30,48,.05),0 12px 30px -22px rgba(20,30,48,.35);
--ease:cubic-bezier(.2,.75,.2,1);color-scheme:light;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);background:var(--desk)}
*{box-sizing:border-box}
body{margin:0;line-height:1.8;min-height:100dvh;background:radial-gradient(circle at 1px 1px,rgba(28,38,58,.075) 1px,transparent 1.3px) 0 0/22px 22px,linear-gradient(180deg,color-mix(in srgb,var(--soft) 75%,#f4f5f8) 0,#f4f5f8 420px,#f3f4f7 100%);background-attachment:fixed}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.48;cursor:not-allowed}
button,input,select{min-height:44px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 70%,#1d2734);outline-offset:2px}
a{color:var(--dark)}
h1,h2,h3,h4,p{margin:0}
h1,h2{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;line-height:1.45}
h1{font-size:32px}h2{font-size:22px}h3{font-size:15px;font-weight:800}
small,.small{font-size:12px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
input,select,textarea{width:100%;padding:9px 13px;border:1px solid var(--line-2);border-radius:12px;background:#fff;color:var(--ink);min-width:0;box-shadow:inset 0 1px 2px rgba(20,30,48,.06);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent-line);box-shadow:inset 0 1px 2px rgba(20,30,48,.06),0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent);outline:none}
input[type=color]{padding:4px;height:44px}
input[type=checkbox]{width:20px;height:20px;min-height:20px;accent-color:var(--dark);flex:0 0 auto;box-shadow:none}
textarea{min-height:100px;resize:vertical;line-height:1.9}
label,.lbl{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#3b4656}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:700;margin-bottom:10px}
.field{min-width:0}
.field small{display:block;color:var(--muted);margin-top:5px}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);border-radius:12px;padding:8px 15px;background:linear-gradient(180deg,#fff,#f6f7f9);color:var(--ink);font-size:13px;font-weight:700;white-space:nowrap;text-decoration:none;box-shadow:var(--bevel);transition:transform .14s var(--ease),box-shadow .14s,background .14s,filter .14s;position:relative}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.01)}
.btn:active:not(:disabled),.btn[aria-pressed=true]:active{transform:translateY(1px);box-shadow:var(--bevel-press)}
.btn .icon{width:18px;height:18px}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--dark) 88%,#fff),var(--dark) 60%);border-color:color-mix(in srgb,var(--dark) 80%,#000);color:#fff;box-shadow:var(--bevel-dark)}
.btn.primary:active:not(:disabled){box-shadow:inset 0 2px 6px rgba(0,0,0,.32)}
.btn.soft{background:linear-gradient(180deg,#fff,var(--tint));border-color:var(--accent-line);color:var(--dark)}
.btn.danger{background:linear-gradient(180deg,#fff,#fff3f3);border-color:#eab9b9;color:var(--bad)}
.btn.icon-only{padding:0;width:40px;min-width:40px;height:40px;min-height:40px}
.btn.small-btn{padding:6px 11px;min-height:36px;font-size:12px}
.link-btn{border:0;background:none;padding:4px;color:var(--dark);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.link-btn .icon{width:16px;height:16px}
.muted{color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:isolate}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--tint);color:var(--dark);border:1px solid var(--accent-line);white-space:nowrap}
.pill .icon{width:14px;height:14px}
.pill.green{background:var(--ok-bg);color:var(--ok);border-color:#b9dfc8}
.pill.amber{background:var(--warn-bg);color:var(--warn);border-color:#ecd39a}
.pill.red{background:var(--bad-bg);color:var(--bad);border-color:#efc0c0}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.spacer{flex:1}
.stack{display:grid;gap:16px;align-content:start}
.hidden,[hidden]{display:none!important}
.no-wrap{white-space:nowrap}
.check-label{display:flex;align-items:center;gap:9px;min-height:44px;margin:0;font-weight:500;font-size:13px}
.skip{position:fixed;z-index:999;top:-70px;right:20px;background:#fff;padding:12px;border-radius:10px}
.skip:focus{top:10px}
kbd,.kbd{font-family:ui-monospace,Consolas,monospace;font-size:10px;direction:ltr;display:inline-block;padding:1px 6px;border-radius:6px;border:1px solid var(--line-2);border-bottom-width:2px;background:#fff;color:#4b5565;line-height:1.5}

/* ── Header ─────────────────────────────── */
.app-header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 8px 24px -22px rgba(20,30,48,.5)}
.header-top{display:flex;align-items:center;gap:14px;padding:10px 22px;min-height:64px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--dark));color:#fff;box-shadow:var(--bevel-dark);flex:0 0 auto}
.brand-mark .icon{width:24px;height:24px}
.brand-name{font-family:Lalezar,Vazirmatn,sans-serif;font-size:21px;line-height:1.3;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.header-date{margin-inline-start:auto;font-size:12px;text-align:left;line-height:1.6;white-space:nowrap}
.header-date #headerDate{font-weight:700}
.save-state{font-size:11px;display:flex;gap:6px;align-items:center;color:var(--ok);justify-content:flex-end}
.save-state.unsaved{color:var(--bad)}
.hdr-actions{display:flex;align-items:center;gap:8px}
.cmdk-btn{display:inline-flex;align-items:center;gap:8px;height:40px;min-height:40px;padding:0 10px 0 8px;border:1px solid var(--line-2);border-radius:12px;background:rgba(255,255,255,.85);color:var(--muted);font-size:12px;box-shadow:inset 0 1px 2px rgba(20,30,48,.06);min-width:230px}
.cmdk-btn .lbl{margin:0;font-weight:500;color:var(--muted);font-size:12px;flex:1;text-align:right}
.cmdk-btn:hover{border-color:var(--accent-line)}
.sync-status{display:inline-flex;align-items:center;gap:6px;padding:0 10px;height:32px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted);white-space:nowrap}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.18)}
.sync-dot.green{background:#22a55a;box-shadow:0 0 0 3px rgba(34,165,90,.18)}.sync-dot.amber{background:#e39a0b}.sync-dot.red{background:#dc3b3b}
.timer-mini{font-weight:800;font-variant-numeric:tabular-nums;color:var(--dark)}
.btl-lobby-btn{margin:0!important;padding:0 14px!important;height:40px!important;min-height:40px!important;font-size:13px!important;gap:7px!important;border-radius:12px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.35),0 6px 14px -6px rgba(16,57,70,.7)!important;flex:0 0 auto}
.btl-lobby-btn:hover{transform:translateY(-1px)!important}
.btl-lobby-btn:active{transform:translateY(1px)!important;box-shadow:inset 0 2px 5px rgba(0,0,0,.45)!important}
.btl-lobby-btn .btl-icon{width:20px;height:20px}

/* ── Shell: rail + workspace ─────────────── */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start}
.rail{position:sticky;top:var(--hh);height:calc(100dvh - var(--hh));overflow:auto;padding:16px 12px 18px;border-inline-end:1px solid var(--line);background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
.nav-wrap{min-width:0}
.tabs{display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:none;border-radius:12px;padding:5px 8px;min-height:44px;color:#3b4656;font-size:13px;font-weight:600;text-align:right;transition:background .15s,border-color .15s,color .15s}
.tab.sep{margin-top:12px;position:relative}
.tab.sep::before{content:'';position:absolute;top:-8px;right:10px;left:10px;height:1px;background:var(--line)}
.tab-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#f2f4f7);border:1px solid var(--line);box-shadow:var(--bevel);color:var(--dark);flex:0 0 auto;transition:transform .15s var(--ease)}
.tab-ic .icon{width:17px;height:17px}
.tab-tx{flex:1;white-space:nowrap}
.tab-k{opacity:.0;transition:opacity .15s}
.tab:hover{background:rgba(255,255,255,.8);border-color:var(--line)}
.tab:hover .tab-k,.tabs:focus-within .tab-k{opacity:1}
.tab:active .tab-ic{transform:translateY(1px);box-shadow:var(--bevel-press)}
.tab[aria-selected=true]{background:#fff;border-color:var(--accent-line);color:var(--dark);font-weight:800;box-shadow:0 8px 20px -16px color-mix(in srgb,var(--dark) 70%,transparent)}
.tab[aria-selected=true] .tab-ic{background:linear-gradient(170deg,color-mix(in srgb,var(--accent) 72%,#fff),var(--dark));color:#fff;border-color:transparent;box-shadow:var(--bevel-dark)}
.rail-sec h2{font-family:Vazirmatn,sans-serif;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.2px;margin:0 8px 6px;display:flex;align-items:center;justify-content:space-between}
.rail-class{display:flex;align-items:center;gap:9px;width:100%;min-height:38px;border:1px solid transparent;border-radius:10px;background:none;padding:4px 8px;font-size:12px;text-align:right}
.rail-class .sw{width:10px;height:10px;border-radius:4px;background:var(--cc);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 22%,transparent);flex:0 0 auto}
.rail-class span:nth-child(2){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rail-class small{color:var(--muted);font-size:11px}
.rail-class:hover{background:rgba(255,255,255,.85);border-color:var(--line)}
.rail-class[aria-pressed=true]{background:#fff;border-color:color-mix(in srgb,var(--cc) 45%,#fff);box-shadow:inset -3px 0 0 var(--cc)}
.rail-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;font-size:11px;color:var(--muted);display:grid;gap:8px}
.meter{height:6px;border-radius:99px;background:#e7eaf0;overflow:hidden;box-shadow:inset 0 1px 2px rgba(20,30,48,.1)}
.meter>span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--dark))}
.meter.warn>span{background:linear-gradient(90deg,#f1b23d,#c27d0a)}
.rail-foot .credit{font-size:10.5px}
.workspace{min-width:0}
.page{max-width:1340px;margin:0 auto;padding:22px 28px 30px;min-height:70vh}
.page:focus{outline:none}

/* ── Page head ─────────────────────────── */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.ph-main{min-width:0}
.eyebrow{font-size:12px;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctx-chip{display:inline-flex;align-items:center;gap:6px;padding:1px 9px 1px 10px;border-radius:999px;background:#fff;border:1px solid color-mix(in srgb,var(--cc) 40%,#fff);color:#2b3442;font-weight:700;font-size:11px}
.ctx-chip::before{content:'';width:8px;height:8px;border-radius:3px;background:var(--cc)}
.page-head h1:focus{outline:none}
.page-description{font-size:13px;color:var(--muted);margin-top:2px}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* ── Surfaces ─────────────────────────── */
.panel,.sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--lift);min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel-head h2{font-size:21px}
.panel-head p{color:var(--muted);font-size:12px}
.sec-title{display:flex;align-items:center;gap:9px;font-family:Vazirmatn,sans-serif;font-size:15px;font-weight:800;margin-bottom:12px}
.sec-title .icon{color:var(--dark);width:18px;height:18px}
.sec-title .pill{margin-inline-start:auto}
.divider{height:1px;background:var(--line);margin:18px -20px}
.note-box{font-size:12px;background:#f7f8fa;border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--muted);line-height:2}
.info-line{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);line-height:1.9}
.info-line .icon{width:16px;height:16px;margin-top:4px;color:var(--dark)}

/* KPI instrument strip */
.kpis{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--lift);margin-bottom:16px;overflow:hidden}
.kpi{display:flex;align-items:center;gap:12px;padding:14px 16px;min-width:0;position:relative}
.kpi+.kpi{border-inline-start:1px solid var(--line)}
.kpi-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:linear-gradient(180deg,#fff,var(--tint));border:1px solid var(--accent-line);color:var(--dark);box-shadow:var(--bevel)}
.kpi-ic .icon{width:19px;height:19px}
.kpi-ic.mint{background:linear-gradient(180deg,#fff,#e8f6ee);border-color:#bfe2cd;color:var(--ok)}
.kpi-ic.peach{background:linear-gradient(180deg,#fff,#fff0e2);border-color:#f0cfac;color:#94500f}
.kpi-ic.lilac{background:linear-gradient(180deg,#fff,#f3ecfb);border-color:#dccaf0;color:#6b3f99}
.kpi-ic.rose{background:linear-gradient(180deg,#fff,#fdecec);border-color:#f1c4c4;color:var(--bad)}
.kpi strong{display:block;font-size:22px;line-height:1.35;font-weight:800;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .meter{margin-top:6px;width:100%}
.kpi>div:not(.kpi-ic){min-width:0;flex:1}
.stat-grid{display:contents}

/* Score bands */
.b-a{background:var(--ok-bg);color:var(--ok)}.b-b{background:var(--info-bg);color:var(--info)}.b-c{background:var(--warn-bg);color:var(--warn)}.b-d{background:var(--bad-bg);color:var(--bad)}
.score{font-weight:800;font-size:15px;color:var(--dark);font-variant-numeric:tabular-nums}
.score.b-a,.score.b-b,.score.b-c,.score.b-d{display:inline-block;padding:1px 10px;border-radius:8px;font-size:14px}

/* ── Home ──────────────────────────────── */
.home-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:16px;align-items:start}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tl-row{display:grid;grid-template-columns:62px 6px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#fff,#fbfbfd)}
.tl-time{font-size:13px;font-weight:800;text-align:center;line-height:1.35;font-variant-numeric:tabular-nums}
.tl-time small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.tl-spine{align-self:stretch;border-radius:99px;background:var(--cc);opacity:.9;min-height:36px}
.tl-body{min-width:0}
.tl-body strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-body small{color:var(--muted);font-size:12px}
.tl-state{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:#f1f3f6;color:#4b5565;white-space:nowrap}
.tl-row.now{border-color:color-mix(in srgb,var(--cc) 55%,#fff);background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--cc) 9%,#fff));box-shadow:0 10px 24px -18px color-mix(in srgb,var(--cc) 90%,#000)}
.tl-row.now .tl-state{background:var(--ok-bg);color:var(--ok)}
.tl-row.now .tl-state::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-inline-end:6px;animation:pulse 1.6s infinite}
.tl-row.done{opacity:.72}
.tl-row.next .tl-state{background:var(--info-bg);color:var(--info)}
.tl-progress{grid-column:3/-1;height:4px;border-radius:9px;background:#eceff3;overflow:hidden}
.tl-progress>span{display:block;height:100%;background:var(--cc)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.att-list{list-style:none;margin:0;padding:0}
.att-item{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #eef0f4;font-size:13px}
.att-item:last-child{border-bottom:0}
.att-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.att-ic .icon{width:16px;height:16px}
.att-ic.abs{background:var(--bad-bg);color:var(--bad)}.att-ic.low{background:var(--warn-bg);color:var(--warn)}.att-ic.drop{background:#f3ecfb;color:#6b3f99}.att-ic.rem{background:var(--info-bg);color:var(--info)}
.att-item .who{flex:1;min-width:0}
.att-item .who strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-item .who small{color:var(--muted);font-size:11.5px}
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:10px 6px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#fff,#f7f8fa);box-shadow:var(--bevel);font-size:12px;font-weight:700;color:#2f3a49;transition:transform .14s var(--ease),box-shadow .14s}
.quick .q-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(170deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--dark));color:#fff;box-shadow:var(--bevel-dark)}
.quick .q-ic .icon{width:18px;height:18px}
.quick:hover{transform:translateY(-2px)}
.quick:active{transform:translateY(1px);box-shadow:var(--bevel-press)}
.reminder{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eef0f4;font-size:13px}
.reminder:last-child{border:0}
.reminder .content{flex:1;min-width:0;overflow-wrap:anywhere}
.reminder.done .content{text-decoration:line-through;color:var(--muted)}
.reminder .btn{border:0;box-shadow:none;background:none}
.backup-note{display:flex;align-items:flex-start;gap:12px;background:linear-gradient(180deg,#fffaf0,#fff4dc);border:1px solid #ecd6a3;border-radius:14px;padding:14px;color:#6a4d12}
.backup-note p{font-size:12px;line-height:2}
.backup-note .icon{margin-top:4px}
.backup-note .link-btn{color:#6a4d12;padding:0}
.onboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;counter-reset:st}
.ob-step{padding:18px;border-inline-start:1px solid var(--line);position:relative}
.ob-step:first-child{border-inline-start:0}
.ob-step b{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(170deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--dark));color:#fff;box-shadow:var(--bevel-dark);margin-bottom:10px}
.ob-step p{font-size:12px;color:var(--muted);margin:6px 0 12px}
.hakim-home #hakimMount{margin:0}

/* ── Classes ───────────────────────────── */
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.class-tile{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--lift);overflow:hidden;display:flex;flex-direction:column}
.class-tile::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--cc)}
.class-tile header{display:flex;align-items:center;gap:12px;padding:18px 18px 12px}
.class-tile h2{font-size:21px;line-height:1.3}
.class-tile header p{font-size:12px;color:var(--muted)}
.class-tile header .pill{margin-inline-start:auto;align-self:flex-start}
.class-monogram{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:linear-gradient(170deg,#fff,color-mix(in srgb,var(--cc) 22%,#fff));border:1px solid color-mix(in srgb,var(--cc) 40%,#fff);color:#27303d;font-weight:800;font-size:15px;box-shadow:var(--bevel);flex:0 0 auto}
.class-metrics{display:grid;grid-template-columns:repeat(3,1fr);margin:0;border-block:1px solid var(--line);background:#fafbfc}
.class-metrics div{padding:10px 12px;min-width:0}
.class-metrics div+div{border-inline-start:1px solid var(--line)}
.class-metrics dt{font-size:11px;color:var(--muted)}
.class-metrics dd{margin:0;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-actions{display:flex;gap:8px;align-items:center;padding:12px 18px 16px;margin-top:auto}
.card-actions .primary{flex:1}
.ghost-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:220px;border:1.5px dashed var(--line-2);border-radius:var(--radius);background:rgba(255,255,255,.5);color:var(--dark);font-weight:800;font-size:14px}
.ghost-tile:hover{background:#fff;border-color:var(--accent-line)}
.ghost-tile .q-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(180deg,#fff,var(--tint));border:1px solid var(--accent-line);box-shadow:var(--bevel)}

/* ── Toolbars & tables ─────────────────── */
.toolbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:12px;margin:0 0 16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#fff,#f9fafb);box-shadow:var(--lift)}
.sheet>.toolbar,.panel>.toolbar{margin:-6px -6px 16px;box-shadow:none;background:#f8f9fb}
.toolbar .field{flex:1;min-width:150px;max-width:280px}
.toolbar .field label,.toolbar .field .lbl{font-size:11px;margin-bottom:4px;color:var(--muted)}
.toolbar .search-field{max-width:360px}
.toolbar .actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:12px;background:#eef0f4;box-shadow:inset 0 1px 3px rgba(20,30,48,.1)}
.seg button{min-height:36px;border:0;background:none;border-radius:9px;padding:0 13px;font-size:12px;font-weight:700;color:#4b5565;display:inline-flex;align-items:center;gap:6px}
.seg button .icon{width:16px;height:16px}
.seg button[aria-pressed=true]{background:#fff;color:var(--dark);box-shadow:var(--bevel)}
.date-stepper{display:flex;gap:6px;align-items:center}
.date-stepper input{text-align:center;min-width:0;flex:1}
.toolbar .field.date-field{max-width:320px;min-width:220px}
.table-wrap{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:14px;background:#fff}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;text-align:right}
th{background:#f6f7f9;color:#4a5465;font-weight:700;white-space:nowrap;font-size:12px}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
tbody tr:hover{background:#fafbfd}
td.name{min-width:170px}
td .sub{color:var(--muted);font-size:11px}
td .btn{font-size:12px}
td.actions{white-space:nowrap}
td.actions .btn{width:36px;min-width:36px;height:36px;min-height:36px;margin-inline-start:4px}
td input{min-width:95px}
.who-cell{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800;background:linear-gradient(170deg,#fff,var(--tint-2));border:1px solid var(--accent-line);color:var(--dark);flex:0 0 auto;box-shadow:var(--bevel)}
.avatar.sm{width:28px;height:28px;border-radius:9px;font-size:11px}
.avatar.lg{width:64px;height:64px;border-radius:18px;font-size:22px}
.mini-bar{display:inline-block;width:70px;height:6px;border-radius:9px;background:#eceff3;vertical-align:middle;margin-inline-start:8px;overflow:hidden}
.mini-bar>span{display:block;height:100%;background:var(--dark);border-radius:inherit}
.empty{text-align:center;padding:40px 22px}
.empty-symbol{width:62px;height:62px;border-radius:19px;background:linear-gradient(180deg,#fff,var(--tint));border:1px solid var(--accent-line);color:var(--dark);display:grid;place-items:center;margin:0 auto 14px;box-shadow:var(--bevel)}
.empty-symbol .icon{width:28px;height:28px}
.empty h2{font-size:23px}
.empty p{color:var(--muted);font-size:13px;max-width:480px;margin:6px auto 18px;line-height:2}
.empty.compact{padding:20px 12px}
.empty.compact p{margin-bottom:12px}

/* ── Schedule ──────────────────────────── */
.week-scroll{overflow:auto;padding-bottom:4px}
.week-grid{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:0;min-width:940px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fbfbfc}
.day-column{padding:10px;min-height:320px;display:flex;flex-direction:column;gap:8px}
.day-column+.day-column{border-inline-start:1px solid var(--line)}
.day-head{text-align:center;padding:4px 4px 10px;font-size:14px;font-weight:800;border-bottom:1px dashed var(--line-2);margin-bottom:2px}
.day-column.today{background:linear-gradient(180deg,var(--tint),#fff 60%)}
.day-column.today .day-head{color:var(--dark)}
.day-head small{font-size:11px;font-weight:500;display:block;color:var(--muted)}
.period{position:relative;background:#fff;border:1px solid var(--line);border-inline-start:4px solid var(--cc);border-radius:12px;box-shadow:var(--bevel);transition:transform .14s var(--ease)}
.period:hover{transform:translateY(-1px)}
.period.now{border-color:color-mix(in srgb,var(--cc) 55%,#fff);border-inline-start-color:var(--cc);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 20%,transparent),var(--bevel)}
.period>button{background:none;border:0;text-align:right;padding:10px 12px 6px;color:inherit;width:100%;min-height:72px;display:block}
.period .time{font-size:11.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.period strong{display:block;font-size:13px;margin-top:4px}
.period small{color:var(--muted);font-size:11.5px}
.period-tools{display:flex;justify-content:flex-end;border-top:1px solid #eef0f4;padding:0 4px}
.period-tools button{min-height:40px;width:40px;border:0;background:none;color:var(--muted);border-radius:9px}
.period-tools button:hover{color:var(--dark);background:var(--tint)}
.add-period{margin-top:auto;width:100%;border:1.5px dashed var(--line-2);background:transparent;border-radius:11px;color:var(--dark);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.add-period:hover{background:#fff;border-color:var(--accent-line)}
.add-period .icon{width:16px;height:16px}
.week-help{font-size:12px;color:var(--muted);margin-top:14px}

/* ── Attendance ────────────────────────── */
.tally{margin-bottom:14px}
.tally-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#eceff3;box-shadow:inset 0 1px 2px rgba(20,30,48,.12);gap:2px}
.tally-bar span{min-width:0;transition:flex .3s var(--ease)}
.t-p{background:linear-gradient(180deg,#46b874,#23864c)}.t-a{background:linear-gradient(180deg,#ec6a6a,#c03535)}.t-l{background:linear-gradient(180deg,#f3c055,#cf920f)}.t-n{background:transparent}
.tally-legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;margin-top:9px;color:#3b4656}
.tally-legend strong{font-size:16px;margin-inline-end:4px;font-variant-numeric:tabular-nums}
.tally-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.kbd-hint{font-size:11.5px;color:var(--muted);margin:-4px 0 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
@media(hover:none){.kbd-hint{display:none}}
.roll-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:8px}
.roll-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:#fff;border-inline-start:4px solid #d9dee6;transition:border-color .2s,background .2s}
.roll-row.present{border-inline-start-color:#2f9d5d;background:linear-gradient(90deg,#fff 70%,#f2faf5)}
.roll-row.absent{border-inline-start-color:#c93a3a;background:linear-gradient(90deg,#fff 70%,#fdf1f1)}
.roll-row.late{border-inline-start-color:#d39a17;background:linear-gradient(90deg,#fff 70%,#fff8e8)}
.roll-row:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.roll-n{width:22px;text-align:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.roll-who{flex:1;min-width:0}
.roll-who strong{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roll-who small{font-size:11px;color:var(--muted)}
.abs-badge{color:var(--bad);font-weight:700}
.status-group{display:flex;gap:4px;align-items:center;padding:3px;border-radius:12px;background:#f0f2f5;box-shadow:inset 0 1px 2px rgba(20,30,48,.1)}
.status-btn{min-width:58px;padding:0 10px;border:1px solid transparent;background:none;border-radius:9px;font-size:12px;font-weight:700;color:#4b5565;min-height:38px;transition:background .15s,color .15s,transform .12s}
.status-btn:hover{background:rgba(255,255,255,.7)}
.status-btn:active{transform:translateY(1px)}
.status-btn[aria-pressed=true]{box-shadow:var(--bevel)}
.status-btn[aria-pressed=true][data-status=present]{background:linear-gradient(180deg,#fff,#e1f3e8);border-color:#a9d7bb;color:var(--ok)}
.status-btn[aria-pressed=true][data-status=absent]{background:linear-gradient(180deg,#fff,#fbe1e1);border-color:#e6aaaa;color:var(--bad)}
.status-btn[aria-pressed=true][data-status=late]{background:linear-gradient(180deg,#fff,#fdf0cf);border-color:#e3c57c;color:var(--warn)}
.status-clear{border:0;background:none;color:var(--muted);min-width:36px;min-height:38px;border-radius:9px;display:grid;place-items:center}
.status-clear .icon{width:16px;height:16px}
.status-clear:hover{background:#fff;color:var(--bad)}

/* ── Grades matrix ─────────────────────── */
.matrix{font-size:12.5px}
.matrix th,.matrix td{padding:6px 8px;text-align:center;border-inline-start:1px solid #eef0f4}
.matrix thead th{vertical-align:bottom;white-space:normal;min-width:92px;max-width:140px;position:sticky;top:0;z-index:2}
.matrix .mx-title{display:block;font-weight:800;color:#2b3442;line-height:1.5}
.matrix .mx-meta{display:block;font-weight:500;font-size:10.5px;color:var(--muted);line-height:1.6}
.matrix .stick{position:sticky;right:0;z-index:1;background:#fff;text-align:right;min-width:190px;border-inline-start:0;box-shadow:-1px 0 0 var(--line)}
.matrix thead .stick{z-index:3;background:#f6f7f9}
.matrix tbody th.stick{font-weight:700;color:var(--ink)}
.matrix tbody th .who-cell{gap:8px}
.matrix tfoot td,.matrix tfoot th{background:#f6f7f9;font-weight:800;border-top:1px solid var(--line-2);border-bottom:0}
.matrix tfoot .stick{background:#f6f7f9}
.mx-cell{min-width:52px;min-height:34px;border-radius:9px;border:1px solid transparent;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 1px rgba(20,30,48,.06);transition:transform .12s}
.mx-cell:hover{transform:translateY(-1px);border-color:rgba(20,30,48,.15)}
.mx-cell.blank{background:none;box-shadow:none;color:#9aa3b0;font-weight:500;border:1px dashed transparent}
.mx-cell.blank:hover,.mx-cell.blank:focus-visible{border-color:var(--accent-line);color:var(--dark);background:var(--tint)}
.mx-avg{background:#fafbfc}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* ── Report & analytics ───────────────── */
.report-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.report-name{font-size:28px;line-height:1.3}
.report-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.report-grid>section{padding:16px;min-width:0}
.report-grid>section+section{border-inline-start:1px solid var(--line)}
.sheet .kpis{box-shadow:none;margin-bottom:16px}
.subj-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 46px;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #eef0f4;font-size:13px}
.subj-row:last-child{border:0}
.subj-row .bar{height:8px;border-radius:9px;background:#eceff3;overflow:hidden}
.subj-row .bar span{display:block;height:100%;border-radius:inherit}
.chart{width:100%;min-height:180px;display:block}
.chart text{font-family:Vazirmatn,Tahoma,sans-serif;fill:#4f5a6b;font-size:12px}
.chart-panel{overflow:hidden}
.rank-pill{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:9px;font-weight:800;font-size:12px;background:#f1f3f6;color:#3b4656}
.rank-pill.r1{background:linear-gradient(160deg,#fff3c4,#f0c24b);color:#4a3300;box-shadow:var(--bevel)}
.rank-pill.r2{background:linear-gradient(160deg,#f7f8fa,#c9cfd8);color:#2b3442;box-shadow:var(--bevel)}
.rank-pill.r3{background:linear-gradient(160deg,#fbe3cf,#d79a66);color:#3d2108;box-shadow:var(--bevel)}
.student-avatar{display:none}

/* ── Tools ─────────────────────────────── */
.tools-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tool-result{display:grid;place-items:center;min-height:150px;text-align:center;font-size:32px;font-family:Lalezar,Vazirmatn,sans-serif;background:radial-gradient(120% 140% at 50% 0,#fff,var(--tint));border:1px solid var(--accent-line);border-radius:16px;margin:14px 0;padding:16px;box-shadow:inset 0 2px 10px rgba(20,30,48,.06);color:#26303e}
.timer-face{position:relative;display:grid;place-items:center;margin:8px auto;width:min(230px,100%);aspect-ratio:1}
.timer-face svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer-face .trk{fill:none;stroke:#e9ecf1;stroke-width:6}
.timer-face .val{fill:none;stroke:var(--dark);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.timer-clock{font-size:46px;font-family:Vazirmatn;font-weight:800;letter-spacing:2px;line-height:1.2;font-variant-numeric:tabular-nums}
.tool-result.active{animation:pop .3s ease}
.die{width:84px;height:84px;border-radius:20px;background:linear-gradient(160deg,#fff,#eef1f5);border:1px solid var(--line-2);box-shadow:var(--bevel),0 14px 24px -16px rgba(20,30,48,.5);display:grid;place-items:center;font-family:Vazirmatn;font-weight:800;font-size:38px;color:var(--dark)}

/* ── Settings ──────────────────────────── */
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.theme-card{position:relative;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#fff,var(--ts));padding:14px 10px 10px;color:var(--ink);min-height:96px;box-shadow:var(--bevel);transition:transform .14s var(--ease)}
.theme-card:hover{transform:translateY(-1px)}
.theme-card[aria-pressed=true]{border-color:var(--tc-b,#7b8aa0);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent),var(--bevel)}
.theme-card .swatch{width:34px;height:34px;background:var(--tc);display:block;border:3px solid #fff;border-radius:11px;margin:0 auto 8px;box-shadow:0 0 0 1px rgba(20,30,48,.1),0 6px 12px -6px rgba(20,30,48,.5)}
.theme-card strong{font-size:12px}
.theme-card[aria-pressed=true]::after{content:'✓';position:absolute;top:6px;right:9px;font-weight:800;color:var(--dark)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.span-2{grid-column:1/-1}
.settings-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.settings-help{font-size:12.5px;line-height:2.05;color:var(--muted)}
.danger-zone{border-color:#efcaca;background:linear-gradient(180deg,#fff,#fffafa)}
.danger-zone h2{color:var(--bad)}

/* ── Footer & Hakim ────────────────────── */

 async function unzip(buffer){const a=new Uint8Array(buffer),v=new DataView(buffer);let end=-1;for(let i=a.length-22;i>=Math.max(0,a.length-65557);i--)if(v.getUint32(i,true)===0x06054b50){end=i;break}if(end<0)throw Error('فایل Excel معتبر نیست. فقط قالب .xlsx پشتیبانی می‌شود.');const count=v.getUint16(end+10,true);if(count>2000)throw Error('تعداد اجزای فایل بیش از حد مجاز است.');let p=v.getUint32(end+16,true),total=0;const out={};for(let i=0;i<count;i++){if(p+46>a.length||v.getUint32(p,true)!==0x02014b50)throw Error('ساختار فشردهٔ فایل خراب است.');const flags=v.getUint16(p+8,true),method=v.getUint16(p+10,true),size=v.getUint32(p+20,true),raw=v.getUint32(p+24,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),at=v.getUint32(p+42,true),name=td.decode(a.slice(p+46,p+46+nl));p+=46+nl+el+cl;if(!/^(xl\/.*\.(xml|rels)|\[Content_Types\]\.xml)$/.test(name))continue;if(flags&1)throw Error('فایل رمزدار پشتیبانی نمی‌شود.');total+=raw;if(raw>12000000||total>30000000)throw Error('فایل Excel بیش از حد بزرگ است.');if(at+30>a.length)throw Error('فایل ناقص است.');const start=at+30+v.getUint16(at+26,true)+v.getUint16(at+28,true);if(start+size>a.length)throw Error('فایل ناقص است.');let data=a.slice(start,start+size);if(method===8){if(typeof DecompressionStream==='undefined')throw Error('برای خواندن Excel مرورگر را به‌روز کنید یا فایل CSV وارد کنید.');let stream;try{stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))}catch(e){throw Error('این مرورگر خواندن Excel فشرده را پشتیبانی نمی‌کند؛ CSV وارد کنید.')}const reader=stream.getReader(),chunks=[];let length=0;while(true){const{value,done}=await reader.read();if(done)break;length+=value.length;if(length>12000000||length>raw+1024){await reader.cancel();throw Error('حجم بازشدهٔ فایل معتبر نیست.')}chunks.push(value)}data=new Uint8Array(length);let o=0;for(const chunk of chunks){data.set(chunk,o);o+=chunk.length}}else if(method!==0)throw Error('روش فشرده‌سازی فایل پشتیبانی نمی  if(!z[sheetPath]){sheetPath=Object.keys(z).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0]}if(!sheetPath)throw Error('برگه‌ای در فایل پیدا نشد.');const shared=z['xl/sharedStrings.xml']?nodes(X(z['xl/sharedStrings.xml']),'si').map(n=>nodes(n,'t').map(t=>t.textContent).join('')):[];const rows=[];for(const row of nodes(X(z[sheetPath]),'row')){if(rows.length>5000)throw Error('حداکثر ۵۰۰۰ ردیف در هر ورود مجاز است.');const cells=[];for(const cell of nodes(row,'c')){const ref=cell.getAttribute('r')||'A1';let col=0;for(const c of ref.replace(/\d/g,''))col=col*26+c.charCodeAt(0)-64;if(col>100)continue;const type=cell.getAttribute('t'),value=nodes(cell,'v')[0]?.textContent??'';cells[col-1]=type==='s'?(shared[Number(value)]??''):type==='inlineStr'?nodes(cell,'t').map(x=>x.textContent).join(''):type==='n'||!type?(value!==''?Number(value):''):value}rows.push(Array.from({length:cells.length},(_,i)=>cells[i]??''))}return rows.filter(r=>r.some(x=>String(x).trim()))}

function titleBlock(title,description,actions=''){const c=['students','attendance','grades','report','analytics'].includes(view.tab)?klass(view.classId):null;return `<div class="page-head"><div class="ph-main"><p class="eyebrow"><span>${E(db.settings.school||'دفتر معلم حکیمستان')}</span>${c?`<span class="ctx-chip" style="--cc:${E(c.color)}">${E(c.name)}</span>`:''}</p><h1 id="viewTitle" tabindex="-1">${E(title)}</h1><p class="page-description">${E(description)}</p></div><div class="ph-actions">${actions}${!['tools','settings'].includes(view.tab)?b('export','<span class="export-label">خروجی و چاپ</span>','download','aria-label="خروجی و چاپ"'):''}</div></div>`}
function go(tab,cid){if(!TABS.some(t=>t[0]===tab))return;if(cid){view.classId=cid;view.studentId='';view.subject=''}view.tab=tab;view.search='';render();$('#viewTitle')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});if(tab==='home')say('سلام معلم عزیز! امروز چه کلاسی داری؟');if(tab==='report'&&student(view.studentId))say('کارنامه‌ی '+fullName(student(view.studentId))+' آماده‌ست.')}
function render(){const focusId=document.activeElement?.id;ensureClass();applyTheme();const mount=$('#hakimMount');if(mount)$('#hakimFooter').append(mount);$('#tabs').innerHTML=TABS.map(([id,title,icon],k)=>`<button class="tab${k===6||k===8?' sep':''}" id="tab-${id}" role="tab" aria-selected="${view.tab===id}" aria-controls="main" tabindex="${view.tab===id?0:-1}" data-action="go" data-view="${id}" aria-keyshortcuts="Alt+${(k+1)%10}"><span class="tab-ic">${i(icon)}</span><span class="tab-tx">${title}</span><kbd class="tab-k" aria-hidden="true">Alt ${fa((k+1)%10)}</kbd></button>`).join('');renderRail();$('#main').setAttribute('aria-labelledby','tab-'+view.tab);$('#main').innerHTML='<div class="view-enter">'+RENDERS[view.tab]()+'</div>';if(view.tab==='home'){$('#homeHakim').append(mount);$('#hakimFooter').hidden=true}else $('#hakimFooter').hidden=false;$('#headerDate').textContent=longDate();updateStorage();updateTimer();$('#tab-'+view.tab)?.scrollIntoView({block:'nearest',inline:'nearest'});if(focusId&&document.getElementById(focusId))document.getElementById(focusId).focus({preventScroll:true});}
function renderRail(){const rc=$('#railClasses');if(rc)rc.innerHTML=db.classes.length?db.classes.map(c=>`<button class="rail-class" type="button" data-action="rail-class" data-id="${E(c.id)}" aria-pressed="${c.id===view.classId}" style="--cc:${E(c.color)}"><span class="sw" aria-hidden="true"></span><span>${E(c.name)}</span><small>${fa(roster(c.id).length)} نفر</small></button>`).join('')+`<button class="rail-class" type="button" data-action="add-class" style="--cc:#c9cfd8"><span class="sw" aria-hidden="true"></span><span>کلاس جدید…</span></button>`:`<button class="rail-class" type="button" data-action="add-class" style="--cc:#c9cfd8"><span class="sw" aria-hidden="true"></span><span>ساخت اولین کلاس</span></button>`;const rs=$('#railStorage');if(rs){let used=0;try{used=(localStorage.getItem(KEY)||'').length*2}catch(e){}const pct=Math.min(100,used/(5*1024*1024)*100);rs.innerHTML=`<div class="row between"><span>فضای دفتر در مرورگر</span><bdi>${fa(Math.max(1,Math.round(used/1024)))} KB</bdi></div><div class="meter${pct>70?' warn':''}" aria-hidden="true"><span style="width:${Math.max(2,pct)}%"></span></div>`}}
window.addEventListener('storage',e=>{if((e.key===KEY||e.key===null)&&e.newValue!==storageToken){storageConflict=true;updateStorage()}});
window.addEventListener('beforeunload',e=>{if(unsaved){e.preventDefault();e.returnValue=''}});

<script>
const CLASS_TABS=['students','attendance','grades','report','analytics'];
const initials=s=>s?((s.first||'').slice(0,1)+(s.last||'').slice(0,1))||'؟':'؟';
const band=v=>v===null||!Number.isFinite(v)?'':v>=17?'b-a':v>=14?'b-b':v>=10?'b-c':'b-d';
const toMin=t=>{const[h,m]=String(t||'0:0').split(':').map(Number);return h*60+m};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const kpis=(...items)=>`<div class="kpis" style="--n:${items.length}">${items.join('')}</div>`;
const sec=(icon,title,extra='')=>`<h2 class="sec-title">${i(icon)}<span>${title}</span>${extra}</h2>`;
let gradeCols=[];
function attentionItems(){const out=[];for(const c of db.classes){const sum=attendanceSummary(c.id);for(const x of sum)if(x.absent>=3)out.push({kind:'abs',icon:'alert',s:x.s,c,text:fa(x.absent)+' غیبت در '+c.name,w:x.absent+10})}
 for(const s of db.students){const gs=gradesOf(s.id).slice().sort((a,b)=>a.date.localeCompare(b.date));if(!gs.length)continue;const m=avg(gs),c=klass(s.classId);if(m!==null&&m<10)out.push({kind:'low',icon:'score',s,c,text:'میانگین '+fmt(m)+' · '+(c?.name||''),w:20-m});else if(gs.length>=3){const last=gs.at(-1),prev=avg(gs.slice(0,-1));if(prev!==null&&prev-last.score>=3)out.push({kind:'drop',icon:'chart',s,c,text:'افت در «'+last.title+'»: '+fmt(last.score)+' (میانگین قبلی '+fmt(prev)+')',w:prev-last.score})}}
 return out.sort((a,b)=>b.w-a.w).slice(0,6)}
function homeView(){const today=isoToday(),di=dayIndex(),periods=db.schedule.filter(p=>p.day===di).sort((a,b)=>a.start.localeCompare(b.start));const backupAge=db.lastBackup?Math.floor((Date.now()-Date.parse(db.lastBackup))/86400000):null;const due=backupAge===null||backupAge>=7;const nm=nowMin();let nextFound=false;
 const taken=periods.filter(p=>Object.keys(db.attendance[p.classId]?.[today]||{}).length).length;
 const rows=periods.map(p=>{const s=toMin(p.start),e=toMin(p.end),c=klass(p.classId);let st='',label='در انتظار';if(nm>=e){st='done';label='تمام شد'}else if(nm>=s){st='now';label='در حال برگزاری'}else if(!nextFound){nextFound=true;st='next';const d=s-nm;label='بعدی · '+(d>=60?fa(Math.floor(d/60))+' ساعت دیگر':fa(d)+' دقیقه دیگر')}const prog=st==='now'?Math.round((nm-s)/Math.max(1,e-s)*100):0;const n=Object.keys(db.attendance[p.classId]?.[today]||{}).length,total=roster(p.classId).length;
  return `<li class="tl-row ${st}" style="--cc:${E(p.color)}"><div class="tl-time ltr">${fa(p.start)}<small>${fa(p.end)}</small></div><span class="tl-spine" aria-hidden="true"></span><div class="tl-body"><strong>${E(p.subject||c?.subject||'زنگ کلاس')}</strong><small>${E(c?.name||'')} · ${n?'حضور '+fa(n)+' از '+fa(total)+' ثبت شد':'حضور ثبت نشده'}</small></div><span class="tl-state">${label}</span><button class="btn small-btn ${st==='now'?'primary':'soft'}" data-action="period-attendance" data-id="${E(p.id)}" aria-label="حضور و غیاب ${E(c?.name||'')} ساعت ${fa(p.start)}">${i('check')}حضور</button>${st==='now'?`<div class="tl-progress" aria-hidden="true"><span style="width:${prog}%"></span></div>`:''}</li>`}).join('');
 const att=attentionItems();
 const onboard=(!db.classes.length||!db.students.length)?`<section class="sheet" style="padding:0;margin-bottom:16px" aria-labelledby="obTitle"><h2 id="obTitle" class="sr-only">سه قدم تا یک دفتر مرتب</h2><div class="onboard">${[['۱','کلاس را بساز','نام، پایه و درس کلاس.','add-class','ساخت کلاس',db.classes.length>0],['۲','دانش‌آموزان را اضافه کن','تکی، گروهی یا از CSV / Excel.','go-students','افزودن دانش‌آموز',db.students.length>0],['۳','امروز را ثبت کن','حضور، نمره و یک یادداشت.','go','حضور و غیاب',false]].map(x=>`<div class="ob-step"><b>${x[5]?i('check'):x[0]}</b><h3>${x[1]}</h3><p>${x[2]}</p>${b(x[3],x[4],'arrow',x[3]==='go'?'data-view="attendance"':'',x[5]?'small-btn':'soft small-btn')}</div>`).join('')}</div></section>`:'';
 return titleBlock('سلام، '+(db.settings.teacher||'معلم عزیز')+'!','امروز '+longDate()+'؛ یک روز تازه برای یاد گرفتن.',db.classes.length?b('go','حضور و غیاب امروز','check','data-view="attendance"','primary'):b('add-class','اولین کلاسم را بسازم','plus','','primary'))
 +kpis(stat(fa(db.classes.length),'کلاس در دفتر','class'),stat(fa(db.students.length),'دانش‌آموز','users','mint'),stat(periods.length?fa(taken)+' از '+fa(periods.length):'۰','حضورِ زنگ‌های امروز','calendar','peach',periods.length?taken/periods.length*100:null),stat(backupAge===null?'—':backupAge===0?'امروز':fa(backupAge)+' روز','از آخرین پشتیبان','shield',due?'rose':'lilac'))
 +onboard
 +`<div class="home-grid"><div class="stack"><section class="sheet">${sec('calendar','امروز، '+(DAYS[di]||'جمعه'),`<span class="pill">${periods.length?fa(periods.length)+' زنگ':'بدون زنگ'}</span>`)}${periods.length?`<ol class="timeline">${rows}</ol>`:empty('امروز زنگی ثبت نشده','برنامهٔ هفتگی را وارد کن؛ زنگ‌های امروز به‌صورت خودکار اینجا نمایش داده می‌شوند.','go-schedule','تنظیم برنامه','calendar',true)}</section>`
 +`<section class="sheet">${sec('bell','نیاز به توجه',att.length?`<span class="pill amber">${fa(att.length)} مورد</span>`:'<span class="pill green">همه چیز آرام است</span>')}${att.length?`<ul class="att-list">${att.map(x=>`<li class="att-item"><span class="att-ic ${x.kind}">${i(x.icon)}</span><span class="avatar sm">${E(initials(x.s))}</span><div class="who"><strong>${E(fullName(x.s))}</strong><small>${E(x.text)}</small></div><button class="link-btn" data-action="student-report" data-id="${E(x.s.id)}" aria-label="کارنامهٔ ${E(fullName(x.s))}">کارنامه ${i('arrow')}</button></li>`).join('')}</ul>`:'<p class="muted small">دانش‌آموزی با غیبت زیاد، میانگین زیر ۱۰ یا افت ناگهانی نمره نداریم. حکیم مراقب است.</p>'}</section></div>`
 +`<aside class="stack" aria-label="ابزار کنار صفحه"><div id="homeHakim" class="hakim-home"></div><section class="sheet">${sec('dice','کارهای سریع')}<div class="quick-grid">${[['go','حضور امروز','check','data-view="attendance"'],['add-grade','ثبت نمره','score',''],['add-student','دانش‌آموز جدید','users',''],['add-reminder','یادآوری','bell',''],['go','تایمر کلاس','clock','data-view="tools"'],['export','خروجی و چاپ','print','']].map(x=>`<button class="quick" type="button" data-action="${x[0]}" ${x[3]}><span class="q-ic">${i(x[2])}</span>${x[1]}</button>`).join('')}</div></section>`
 +`<section class="sheet">${sec('bell','یادم باشد…',iconButton('add-reminder','افزودن یادآوری','plus','style="margin-inline-start:auto"'))}${db.reminders.length?db.reminders.slice().sort((a,b)=>Number(a.done)-Number(b.done)||(a.due||'9999').localeCompare(b.due||'9999')).map(r=>`<div class="reminder ${r.done?'done':''}"><input type="checkbox" data-change="reminder" data-id="${E(r.id)}" ${r.done?'checked':''} aria-label="انجام شد: ${E(r.text)}"><div class="content">${E(r.text)}${r.due?` <span class="pill ${!r.done&&r.due<today?'red':''}">${jalali(r.due)}</span>`:''}</div>${iconButton('delete-reminder','حذف یادآوری','trash',`data-id="${E(r.id)}"`)}</div>`).join(''):'<p class="muted small">برای تکلیف فردا، جلسهٔ اولیا یا یک کار کوچک، یادآوری بگذار.</p>'}</section>`
 +(due?`<div class="backup-note">${i('shield')}<div><strong class="small">${db.lastBackup?'وقت پشتیبان هفتگی است':'یک نسخهٔ امن، بیرون از مرورگر'}</strong><p>پاک‌کردن داده‌های مرورگر، دفتر را هم پاک می‌کند. فایل پشتیبان را در جای امن نگه دار.</p><button class="link-btn" data-action="backup">دریافت پشتیبان ${i('arrow')}</button></div></div>`:'')+`</aside></div>`}
function classesView(){return titleBlock('کلاس‌های من','هر کلاس، یک جهان کوچک برای یاد گرفتن.',b('add-class','کلاس جدید','plus','','primary'))+(db.classes.length?`<div class="class-grid">${db.classes.map((c,idx)=>{const r=ranking(c.id,''),m=r.length?r.reduce((s,x)=>s+x.mean,0)/r.length:null,att=attendanceSummary(c.id),tp=att.reduce((s,x)=>s+x.present+x.late,0),tt=tp+att.reduce((s,x)=>s+x.absent,0),per=db.schedule.filter(p=>p.classId===c.id).length;return `<article class="class-tile" style="--cc:${E(c.color)}"><header><div class="class-monogram">${E(c.grade||fa(idx+1))}</div><div><h2>${E(c.name)}</h2><p>پایه ${E(c.grade||'ثبت نشده')} · ${E(c.subject||'همهٔ درس‌ها')}</p></div><span class="pill">${fa(roster(c.id).length)} دانش‌آموز</span></header><dl class="class-metrics"><div><dt>میانگین کلاس</dt><dd>${fmt(m)}</dd></div><div><dt>نرخ حضور</dt><dd>${tt?fa(Math.round(tp/tt*100))+'٪':'—'}</dd></div><div><dt>زنگ در هفته</dt><dd>${fa(per)}</dd></div></dl><div class="card-actions">${b('class-students','دانش‌آموزان','users',`data-id="${E(c.id)}"`,'primary')}${iconButton('class-attendance','حضور و غیاب '+c.name,'check',`data-id="${E(c.id)}"`)}${iconButton('edit-class','ویرایش '+c.name,'edit',`data-id="${E(c.id)}"`)}${iconButton('delete-class','حذف '+c.name,'trash',`data-id="${E(c.id)}"`)}</div></article>`}).join('')}<button class="ghost-tile" type="button" data-action="add-class"><span class="q-ic">${i('plus')}</span>یک کلاس تازه بساز</button></div>`:empty('هنوز کلاسی در دفتر نیست','با ساخت اولین کلاس، بخش‌های دانش‌آموزان، حضور و غیاب و نمرات آمادهٔ استفاده می‌شوند.'))}
function scheduleView(){const di=dayIndex(),nm=nowMin();return titleBlock('برنامهٔ هفتگی','از شنبه تا پنجشنبه؛ روی هر زنگ بزن تا حضور و غیاب آن کلاس باز شود.',b('add-period','زنگ جدید','plus','','primary'))+(needClass()||`<section class="sheet"><div class="row between" style="margin-bottom:14px"><span class="pill">${i('calendar')} ${E(db.settings.year)} · ${fa(db.schedule.length)} زنگ در هفته · ساعت‌ها به وقت محلی</span><div class="row">${b('import-schedule','ورود CSV / Excel','upload','','small-btn')}${b('schedule-template','فایل نمونه','download','','small-btn')}</div></div><div class="week-scroll"><div class="week-grid">${DAYS.map((day,d)=>{const ps=db.schedule.filter(p=>p.day===d).sort((a,b)=>a.start.localeCompare(b.start));return `<div class="day-column ${di===d?'today':''}"><div class="day-head">${day}<small>${di===d?'امروز':ps.length?fa(ps.length)+' زنگ':'آزاد'}</small></div>${ps.map(p=>{const live=di===d&&nm>=toMin(p.start)&&nm<toMin(p.end);return `<article class="period${live?' now':''}" style="--cc:${E(p.color)}"><button data-action="period-attendance" data-id="${E(p.id)}"><span class="time ltr">${fa(p.start)} – ${fa(p.end)}</span><strong>${E(p.subject||klass(p.classId)?.subject)}</strong><small>${E(klass(p.classId)?.name)}${live?' · در حال برگزاری':''}</small></button><div class="period-tools"><button data-action="edit-period" data-id="${E(p.id)}" aria-label="ویرایش زنگ ${E(p.subject)}">${i('edit')}</button><button data-action="delete-period" data-id="${E(p.id)}" aria-label="حذف زنگ ${E(p.subject)}">${i('trash')}</button></div></article>`}).join('')}<button class="add-period" data-action="add-period" data-day="${d}" aria-label="افزودن زنگ به ${day}">${i('plus')} افزودن زنگ</button></div>`}).join('')}</div></div><p class="week-help">در موبایل جدول را افقی حرکت دهید. ورود Excel از اولین برگهٔ فایل .xlsx انجام می‌شود. برای ثبت حضور یک روز دیگر، تاریخ را در حضور و غیاب تغییر دهید.</p></section>`)}
function studentsView(){let list=roster().filter(s=>norm(fullName(s)+' '+s.code+' '+s.phone).includes(norm(view.search)));if(view.sort==='code')list.sort((a,b)=>a.code.localeCompare(b.code,'fa',{numeric:true}));if(view.sort==='last')list.sort((a,b)=>a.last.localeCompare(b.last,'fa'));const absMap=Object.fromEntries(attendanceSummary(view.classId).map(x=>[x.s.id,x.absent]));return titleBlock('دانش‌آموزان','نام‌ها فقط در همین مرورگر ذخیره می‌شوند؛ اطلاعات تماس را محرمانه نگه دارید.',b('add-student','دانش‌آموز جدید','plus','','primary'))+(needClass()||`<section class="sheet"><div class="toolbar">${classSelect()}<div class="field search-field"><label for="studentSearch">جستجوی نام، کد یا تلفن</label><input id="studentSearch" data-input="search" value="${E(view.search)}" placeholder="نام دانش‌آموز…" type="search"></div><div class="field"><label for="studentSort">مرتب‌سازی</label><select id="studentSort" data-change="sort"><option value="name" ${view.sort==='name'?'selected':''}>نام کامل</option><option value="last" ${view.sort==='last'?'selected':''}>نام خانوادگی</option><option value="code" ${view.sort==='code'?'selected':''}>کد دانش‌آموز</option></select></div><div class="actions">${b('paste-students','افزودن گروهی','users')}${b('import-students','ورود CSV','upload')}</div></div>${roster().length?`<p class="small muted" style="margin-bottom:10px">${fa(list.length)} نفر از ${fa(roster().length)} دانش‌آموز کلاس</p>`+table(['دانش‌آموز','کد','تلفن والدین','میانگین','غیبت','یادداشت','عملیات'],list.map(s=>{const m=avg(gradesOf(s.id));return `<tr><td class="name"><span class="who-cell"><span class="avatar sm">${E(initials(s))}</span><strong>${E(fullName(s))}</strong></span></td><td class="ltr">${E(s.code||'—')}</td><td class="ltr">${E(s.phone||'—')}</td><td>${m===null?'<span class="muted">—</span>':`<span class="score ${band(m)}">${fmt(m)}</span>`}</td><td>${absMap[s.id]?`<span class="pill ${absMap[s.id]>=3?'red':'amber'}">${fa(absMap[s.id])}</span>`:'<span class="muted">۰</s function toolsView(){const pct=Math.max(0,Math.min(100,100*timer.remaining/(timer.total||300000)));return titleBlock('ابزار کوچکِ کلاس','کمی تنوع، کمی بازی؛ برای یک کلاس پرانرژی.')+`<div class="tools-grid"><section class="panel">${sec('users','نوبت چه کسی است؟')}<p class="small muted">انتخاب تصادفی از فهرست واقعی کلاس</p><div class="toolbar" style="margin-top:14px">${db.classes.length?classSelect():'<p class="small muted">ابتدا یک کلاس بسازید.</p>'}</div><div class="tool-result" id="randomResult" role="status">منتظر یک نام تازه…</div><label class="check-label"><input type="checkbox" id="noRepeat" checked>تا تمام شدن فهرست، تکرار نکن</label><div class="row">${b('random-student','انتخاب دانش‌آموز','users','','primary')}${b('reset-random','شروع دور تازه','reset')}</div></section>`
 +`<section class="panel">${sec('clock','تایمر کلاس')}<p class="small muted">با جابه‌جایی بین بخش‌ها، شمارش ادامه دارد.</p><div class="timer-face"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="44"/><circle class="val" id="timerRing" cx="50" cy="50" r="44" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100-pct}"/></svg><div id="timerClock" class="timer-clock ltr" role="timer" aria-label="زمان باقی‌مانده">۰۵:۰۰</div></div><div class="form-grid"><div class="field"><label for="timerMinutes">دقیقه (۰ تا ۱۸۰)</label><input id="timerMinutes" inputmode="numeric" value="${fa(Math.floor((timer.total||300000)/60000))}" class="ltr"></div><div class="field"><label for="timerSeconds">ثانیه (۰ تا ۵۹)</label><input id="timerSeconds" inputmode="numeric" value="${fa(Math.floor((timer.total||300000)%60000/1000))}" class="ltr"></div></div><div class="row" style="margin:10px 0 2px">${[1,3,5,10,15].map(m=>`<button class="btn small-btn" type="button" data-action="timer-preset" data-min="${m}">${fa(m)} دقیقه</button>`).join('')}</div><label class="check-label" style="margin:6px 0"><input type="checkbox" id="timerAlarm" ${timer.alarm?'checked':''} data-change="timer-alarm">هشدار صوتی در پایان</label><div class="row">${b('timer-start',timer.running?'در حال شمارش':'شروع / ادامه','play','','primary')}${b('timer-pause','مکث','pause')}${b('timer-reset','تنظیم مجدد','reset')}</div><p class="small muted" style="margin-top:12px">تایمر با بستن یا بارگذاری دوبارهٔ صفحه متوقف می‌شود. پخش هشدار در پس‌زمینه به محدودیت مرورگر وابسته است.</p></section>`

function settingsView(){return titleBlock('تنظیمات دفتر','دفترت را به رنگ و نام خودت کن؛ پشتیبان را فراموش نکن.')+`<div class="settings-grid"><div class="stack"><section class="panel"><h2 style="margin-bottom:20px">مشخصات معلم و مدرسه</h2><form id="settingsForm" data-form="settings"><div class="form-grid">${F('teacher','نام معلم',db.settings.teacher,'text','maxlength="200" autocomplete="name"')}${F('school','نام مدرسه',db.settings.school,'text','maxlength="200"')}${F('year','سال تحصیلی',db.settings.year,'text','maxlength="200"')}<div class="field"><label>محل ذخیره‌سازی</label><div class="note-box">همین دستگاه و مرورگر</div></div></div><div class="row" style="margin-top:20px"><button class="btn primary" type="submit">${i('check')} ذخیرهٔ مشخصات</button></div></form></section><section class="panel"><div class="panel-head"><div><h2>دفترت، به رنگ خودت</h2><p>هشت تم روشن؛ چاپ همیشه سیاه‌وسفید است.</p></div></div><div class="theme-grid">${THEMES.map(t=>`<button class="theme-card" style="--tc:${t[0]==='rainbow'?'linear-gradient(100deg,#f48b9b,#edc777,#7bc9b5,#87adeb,#bb94dd)':t[2]};--ts:${t[3]}" data-action="theme" data-theme="${t[0]}" aria-pressed="${db.settings.theme===t[0]}"><span class="swatch"></span><strong>${t[1]}</strong></button>`).join('')}</div><p class="small muted" style="margin-top:15px">در تم مدادرنگی، رنگ اختصاصی هر کلاس روی کارت‌ها و برنامهٔ هفتگی حفظ می‌شود.</p></section></div><div class="stack"><section class="panel"><h2>نسخهٔ امنِ دفتر</h2><p class="settings-help" style="margin:12px 0 20px">پشتیبان JSON شامل همهٔ کلاس‌ها، دانش‌آموزان، تلفن‌ها، نمرات و حضور و غیاب است. فایل رمزگذاری نشده؛ آن را در محل امن نگه دارید و در فضای عمومی به اشتراک نگذارید.</p><div class="row">${b('backup','دریافت پشتیبان','download','','primary')}${b('restore','بازیابی پشتیبان','upload')}</div><p class="small muted" style="margin-top:18px">آخرین پشتیبان: ${db.lastBackup?jalali(db.lastBackup.slice(0,10)):'هنوز دریافت نشده'}</p><div class="note-box" style="margin-top:18px">بازیابی، اطلاعات فعلی این دفتر را جایگزین می‌کند؛ ادغام انجام نمی‌شود. پیش از بازیابی از اطلاعات فعلی پشتیبان بگیرید.</div></section><section class="panel"><h2>دربارهٔ ذخیره‌سازی آفلاین</h2><p class="settings-help" style="margin-top:12px">این برنامه هیچ اطلاعاتی به سرور نمی‌فرستد. داده‌ها به نشانی سایت، دستگاه و مرورگر وابسته‌اند؛ برای انتقال دفتر به دستگاه دیگر از پشتیبان استفاده کنید. حالت ناشناس یا پاک‌سازی مرورگر ممکن است داده‌ها را از بین ببرد.</p><p class="settings-help" style="margin-top:12px">فونت‌ها و ابزار ساخت تصویر داخل همین فایل‌اند. اتصال به حکیم از فایل هم‌مسیر <bdi>hakim-core.js</bdi> انجام می‌شود. فایل Excel واقعی با پسوند .xlsx و Word استاندارد با پسوند .docx تولید می‌شود؛ CSV نیز دارای BOM است.</p></section><section class="panel danger-zone"><h2>پاک‌کردن دفتر</h2><p class="settings-help" style="margin:12px 0 20px">این کار فقط اطلاعات دفتر معلم را حذف می‌کند؛ اطلاعات بازی‌ها و ابزارهای دیگر حکیمستان دست‌نخورده می‌ماند. بازگردانی تنها با پشتیبان ممکن است.</p>${b('clear-all','پاک‌کردن همهٔ داده‌ها','trash','','danger')}</section></div></div>`}

<script>
function classForm(id){const c=id?klass(id):{name:'',grade:'',subject:'',color:['#6398d9','#62af92','#dc91a4','#b297d4','#dfb35c'][db.classes.length%5]};openModal(id?'ویرایش کلاس':'یک کلاس تازه',`<form data-form="modal"><p class="modal-copy">نامی آشنا انتخاب کن؛ مثل «پنجم / ۱». هر کلاس می‌تواند نمره‌های چند درس داشته باشد.</p><div class="form-grid">${F('name','نام کلاس *',c.name,'text','maxlength="100" required')}${F('grade','پایه',c.grade,'text','maxlength="100" placeholder="مثلاً پنجم"')}${F('subject','درس اصلی',c.subject,'text','maxlength="100" placeholder="مثلاً ریاضی"')}${F('color','رنگ کلاس',c.color,'color')}</div>${formActions('ذخیرهٔ کلاس')}</form>`,()=>{const obj={id:id||uid(),name:req(V('name'),'نام کلاس'),grade:V('grade').trim(),subject:V('subject').trim(),color:V('color')};if(db.classes.some(x=>x.id!==id&&norm(x.name)===norm(obj.name)))throw Error('کلاسی با این نام وجود دارد؛ نام متمایز انتخاب کنید.');if(commit(d=>{if(id)d.classes[d.classes.findIndex(x=>x.id===id)]=obj;else d.classes.push(obj)},'کلاس ذخیره شد.')){view.classId=obj.id;closeModal();render()}})}
function studentForm(id){if(!view.classId)return toast('ابتدا یک کلاس بسازید.',true);const s=id?student(id):{first:'',last:'',code:'',phone:'',note:''};openModal(id?'ویرایش دانش‌آموز':'دانش‌آموز جدید',`<form data-form="modal"><p class="modal-copy">کلاس ${E(klass(view.classId).name)} · کد و تلفن اختیاری‌اند. صفر ابتدای کد و تلفن حفظ می‌شود.</p><div class="form-grid">${F('first','نام *',s.first,'text','required maxlength="100"')}${F('last','نام خانوادگی',s.last,'text','maxlength="100"')}${F('code','کد دانش‌آموز',s.code,'text','maxlength="100" inputmode="numeric" class="ltr"')}${F('phone','تلفن والدین',s.phone,'tel','maxlength="100" class="ltr"')}<div class="field span-2"><label for="f-note">یادداشت خصوصی معلم</label><textarea id="f-note" maxlength="2000">${E(s.note)}</textarea><small>این یادداشت در کارنامه درج نمی‌شود؛ یادداشت کارنامه جداست.</small></div></div>${formActions()}</form>`,()=>{const obj={...s,id:id||uid(),classId:view.classId,first:req(V('first'),'نام'),last:V('last').trim(),code:latin(V('code')).trim(),phone:latin(V('phone')).trim(),note:V('note').trim(),reportNote:s.reportNote||''};if(obj.code&&db.students.some(x=>x.id!==id&&x.classId===view.classId&&norm(x.code)===norm(obj.code)))throw Error('این کد در کلاس تکراری است.');if(commit(d=>{if(id)d.students[d.students.findIndex(x=>x.id===id)]=obj;else d.students.push(obj)},'دانش‌آموز ذخیره شد.'))closeModal()})}
function periodConflict(p,others=db.schedule){return others.find(x=>x.id!==p.id&&x.day===p.day&&p.start<x.end&&p.end>x.start)}
function readTime(value){if(typeof value==='number'&&value>=0&&value<1){const m=Math.round(value*1440);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}let s=latin(value).trim();const m=s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);if(!m||+m[1]>23||+m[2]>59)throw Error('ساعت باید به شکل ۰۸:۳۰ و در بازهٔ ۰۰:۰۰ تا ۲۳:۵۹ باشد.');return m[1].padStart(2,'0')+':'+m[2]}
function periodForm(id,day=0){if(!db.classes.length)return toast('ابتدا یک کلاس بسازید.',true);const p=id?db.schedule.find(x=>x.id===id):{classId:view.classId||db.classes[0].id,day:Number(day),start:'08:00',end:'08:45',subject:klass(view.classId)?.subject||'',color:klass(view.classId)?.color||'#6398d9'};openModal(id?'ویرایش زنگ':'افزودن زنگ',`<form data-form="modal"><div class="form-grid">${S('class','کلاس *',db.classes.map(c=>[c.id,c.name]),p.classId)}${S('day','روز',DAYS.map((d,i)=>[i,d]),p.day)}${F('start','ساعت شروع',p.start,'time','required')}${F('end','ساعت پایان',p.end,'time','required')}${F('subject','درس *',p.subject,'text','required maxlength="100"')}${F('color','رنگ زنگ',p.color,'color')}</div><p class="small muted" style="margin-top:18px">برای جلوگیری از تداخل برنامه، دو زنگ نمی‌توانند در یک روز هم‌زمان باشند.</p>${formActions('ذخیرهٔ زنگ')}</form>`,()=>{const obj={id:id||uid(),classId:V('class'),day:Number(V('day')),start:readTime(V('start')),end:readTime(V('end')),subject:req(V('subject'),'درس'),color:V('color')};if(obj.end<=obj.start)throw Error('ساعت پایان باید بعد از ساعت شروع باشد.');const conflict=periodConflict(obj);if(conflict)throw Error(`این زنگ با ${klass(conflict.classId)?.name} (${fa(conflict.start)} تا ${fa(conflict.end)}) تداخل دارد.`);if(commit(d=>{if(id)d.schedule[d.schedule.findIndex(x=>x.id===id)]=obj;else d.schedule.push(obj)},'زنگ به برنامه اضافه شد.'))closeModal()});$('#f-class').addEventListener('change',()=>{const c=klass(V('class'));$('#f-subject').value=c.subject;$('#f-color').value=c.color})}
function gradeForm(id,preset=null){if(!roster().length)return toast('ابتدا دانش‌آموزی در این کلاس اضافه کنید.',true);const g=id?db.grades.find(x=>x.id===id):null;const pre=preset||{};const students=g?[student(g.studentId)]:pre.studentId?[student(pre.studentId)].filter(Boolean):roster();openModal(g?'ویرایش نمره':pre.studentId?'ثبت نمره برای '+fullName(student(pre.studentId)):'ثبت نمره؛ تکی یا گروهی',`<form data-form="modal"><p class="modal-copy">برای ثبت تکی فقط یک ردیف را پر کنید. ردیف‌های خالی نمره نمی‌گیرند؛ صفر یک نمرهٔ واقعی است.</p><div class="form-grid">${F('title','عنوان *',g?.title||pre.title||'','text','required maxlength="200" placeholder="مثلاً فصل دوم؛ کسرها"')}${F('subject','درس *',g?.subject||pre.subject||view.subject||klass(view.classId)?.subject||'','text','required maxlength="100"')}${S('type','نوع ارزیابی',TYPES,g?.type||pre.type||'امتحان')}${F('date','تاریخ شمسی',jalali(g?.date||pre.date||isoToday()),'text','required class="ltr" inputmode="numeric"')}${F('weight','وزن (بیشتر از صفر تا ۱۰۰)',g?fa(g.weight):pre.weight?fa(pre.weight):'۱','text','required inputmode="decimal"')}${F('note','توضیح مشترک',g?.note||pre.note||'','text','maxlength="2000"')}</div><div style="margin-top:22px">${table(['دانش‌آموز','نمره از ۲۰'],students.map(s=>`<tr><td><label for="grade-${s.id}">${E(fullName(s))}</label></td><td><input id="grade-${s.id}" class="grade-input ltr" data-student="${s.id}" inputmode="decimal" value="${g?fa(g.score):''}" placeholder="بدون نمره" aria-label="نمرهٔ ${E(fullName(s))}"></td></tr>`))}</div>${formActions('ثبت نمره‌ها')}</form>`,()=>{const base={title:req(V('title'),'عنوان',200),subject:req(V('subject'),'درس'),type:V('type'),date:parseDate(V('date')),weight:num(V('weight')),note:V('note').trim()};if(!Number.isFinite(base.weight)||base.weight<=0||base.weight>100)throw Error('وزن باید عددی بیشتر از صفر و حداکثر ۱۰۰ باشد.');const entries=[];for(const input of $$('.grade-input')){if(!input.value.trim())continue;const n=num(input.value);if(!Number.isFinite(n)||n<0||n>20)throw Error('نمرهٔ '+fullName(student(input.dataset.student))+' باید از صفر تا بیست باشد.');entries.push({...base,id:g?.id||uid(),classId:view.classId,studentId:input.dataset.student,score:n,...(g?.sourceKey?{sourceKey:g.sourceKey}:{})})}if(!entries.length)throw Error('حداقل یک نمره وارد کنید.');if(commit(d=>{if(g)d.grades[d.grades.findIndex(x=>x.id===g.id)]=entries[0];else d.grades.push(...entries)},'نمره‌ها ثبت شد.')){closeModal();say('نمره‌ها ثبت شد.')}},true)}

/* Shape complete Persian lines natively before html2canvas captures the layout.
   This avoids glyph-order errors in html2canvas's per-grapheme RTL fallback. */
async function rasterizeReportText(root){
 const elements=Array.from(root.querySelectorAll('h1,h2,p,th,td,.report-end'));
 for(const el of elements){
  const text=el.textContent,style=getComputedStyle(el),width=Math.max(8,el.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight));
  if(!text.trim())continue;
  const size=parseFloat(style.fontSize)||14,lineHeight=parseFloat(style.lineHeight)||size*1.9;
  const font=style.fontStyle+' '+style.fontWeight+' '+style.fontSize+' '+style.fontFamily;
  const probe=document.createElement('canvas').getContext('2d');probe.font=font;
  const lines=[];
  for(const paragraph of text.split('\n')){let line='';for(const word of paragraph.split(/\s+/)){if(!word)continue;const proposed=line?line+' '+word:word;if(probe.measureText(proposed).width<=width||!line){line=proposed}else{lines.push(line);line=word}if(probe.measureText(line).width>width){let fragment='';for(const char of Array.from(line)){if(fragment&&probe.measureText(fragment+char).width>width){lines.push(fragment);fragment=char}else fragment+=char}line=fragment}}lines.push(line)}
  const height=Math.max(lineHeight,lines.length*lineHeight),scale=2,canvas=document.createElement('canvas');
  if(height>12000)throw Error('متن برای تصویر بیش از حد بلند است؛ خروجی Word یا PDF را انتخاب کنید.');
  canvas.width=Math.ceil(width*scale);canvas.height=Math.ceil(height*scale);const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.font=font;ctx.fillStyle=style.color;ctx.direction=style.direction==='rtl'?'rtl':'ltr';const align=style.textAlign==='center'?'center':style.textAlign==='left'?'left':'right';ctx.textAlign=align;ctx.textBaseline='alphabetic';const metrics=ctx.measureText('آموزش Ag'),asc=metrics.fontBoundingBoxAscent||size*.85,desc=metrics.fontBoundingBoxDescent||size*.25,baseline=(lineHeight-asc-desc)/2+asc;
  lines.forEach((line,j)=>ctx.fillText(line,align==='center'?width/2:align==='right'?width:0,j*lineHeight+baseline));
  const img=new Image();img.src=canvas.toDataURL('image/png');img.alt=text;img.style.cssText='display:block;max-width:100%;width:'+width+'px;height:'+height+'px;object-fit:contain;';await img.decode();el.replaceChildren(img);canvas.width=1;canvas.height=1;
 }
}
async function pngReport(r){if(r.visualSheets)r={...r,sheets:r.visualSheets,visualSheets:null};if(typeof html2canvas!=='function')throw Error('ابزار تصویر در این نسخه در دسترس نیست؛ از چاپ استفاده کنید.');await document.fonts.ready;const pages=[];if(r.sheets.reduce((n,s)=>n+s.rows.length,0)<=28)pages.push(r);else for(const s of r.sheets){if(s.rows.length){for(let start=0;start<s.rows.length;start+=28)pages.push({...r,sheets:[{...s,rows:s.rows.slice(start,start+28)}],chart:pages.length===0?r.chart:'',note:''})}else pages.push({...r,sheets:[s],chart:pages.length===0?r.chart:'',note:''})}if(!pages.length)pages.push(r);if(pages.length>100)throw Error('این گزارش بیش از ۱۰۰ صفحهٔ تصویری دارد؛ از Excel یا چاپ استفاده کنید.');pages[pages.length-1].note=r.note;const files={};let holder=document.createElement('div');holder.className='export-staging';document.body.append(holder);try{for(let j=0;j<pages.length;j++){holder.innerHTML=reportHTML(pages[j]);holder.querySelector('.report-end').append(' · صفحهٔ '+fa(j+1)+' از '+fa(pages.length));const el=holder.firstElementChild;await rasterizeReportText(el);if(el.scrollHeight>11000)throw Error('متن یک صفحه برای تصویر بسیار بلند است؛ از PDF یا Word استفاده کنید.');const canvas=await html2canvas(el,{backgroundColor:'#fff',scale:1.6,logging:false,useCORS:false,windowWidth:1100,scrollX:0,scrollY:0});const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('ساخت تصویر ممکن نشد.');files['page-'+String(j+1).padStart(3,'0')+'.png']=new Uint8Array(await blob.arrayBuffer());canvas.width=1;canvas.height=1}const name='daftar-'+view.tab+'-'+isoToday();if(pages.length===1)IO.download(new Blob([Object.values(files)[0]],{type:'image/png'}),name+'.png');else{IO.download(IO.zip(files),name+'-png-pages.zip');toast(fa(pages.length)+' تصویر در یک فایل ZIP آماده شد.')}}finally{holder.remove()}}
async function exportAs(format){if(exportBusy)return;exportBusy=true;const buttons=$$('#modalBody button');buttons.forEach(b=>b.disabled=true);try{const r=reportData(),name='daftar-'+view.tab+'-'+isoToday();if(format==='print'){$('#printArea').innerHTML=reportHTML(r);exportBusy=false;closeModal();await document.fonts.ready;window.print();return}if(format==='png')await pngReport(r);else if(format==='xlsx')IO.download(IO.xlsx(r.sheets),name+'.xlsx');else if(format==='docx')IO.download(IO.docx({...r,sheets:r.visualSheets||r.sheets}),name+'.docx');else if(format==='text')IO.download('\uFEFF'+textReport(r),name+'.txt','text/plain;charset=utf-8');else if(format==='csv'){if(r.sheets.length===1)IO.download(IO.csv([r.sheets[0].headers,...r.sheets[0].rows]),name+'.csv','text/csv;charset=utf-8');else{const files={};r.sheets.forEach((s,j)=>files[String(j+1)+'-'+s.name+'.csv']=IO.csv([s.headers,...s.rows]));IO.download(IO.zip(files),name+'-csv.zip');toast('برای حفظ ستون‌ها، هر جدول در CSV جدا داخل ZIP قرار گرفت.')}}else if(format==='doc')IO.download('\uFEFF<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>'+E(r.title)+'</title><style>body{font-family:Tahoma;direction:rtl}table{border-collapse:collapse;width:100%;direction:rtl}td,th{border:1px solid #999;padding:8px}p{line-height:1.9}</style><body>'+reportHTML({...r,chart:''})+'</body></html>',name+'.doc','application/msword');toast('خروجی برای دانلود آماده شد.')}catch(err){showError(err)}finally{exportBusy=false;buttons.forEach(b=>b.disabled=false)}}

<script>
/* نسخهٔ ساده و مطمئن همگام‌سازی */
(function(){
  'use strict';
  
  const API = 'https://script.google.com/macros/s/AKfycbztmPYCnyvlIpAlwC68yp6mLbUHbGKy6TA0875h_RK3CIN9h1lG5Uk_vrG28P1LbYgE/exec';
  const K_AUTH = 'hakimestan_daftar_auth';
  const K_DATA = 'hakimestan_daftar_v1';
  const K_LAST = 'hakimestan_daftar_last_sync';
  const K_LAST_USER = 'hakimestan_daftar_last_user';
  const K_OFFLINE_MODE = 'hakimestan_daftar_offline_mode';
  const syncEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function sGet(k, sess){ try { return (sess ? sessionStorage : localStorage).getItem(k); } catch(e){ return null; } }
  function sSet(k, v, sess){ try { (sess ? sessionStorage : localStorage).setItem(k, v); } catch(e){} }
  function sDel(k, sess){ try { (sess ? sessionStorage : localStorage).removeItem(k); } catch(e){} }

  function getAuth(){
    try { return JSON.parse(sGet(K_AUTH, false) || sGet(K_AUTH, true) || 'null'); }
    catch(e) { return null; }
  }
  function setAuth(auth, remember){
    const str = JSON.stringify(auth);
    sDel(K_OFFLINE_MODE, true);
    if(remember){ sSet(K_AUTH, str, false); sDel(K_AUTH, true); }
    else { sSet(K_AUTH, str, true); sDel(K_AUTH, false); }
  }
  function delAuth(clearLocalData){
    sDel(K_AUTH, false);
    sDel(K_AUTH, true);
    if(clearLocalData){
      sDel(K_DATA, false);
      sDel(K_LAST, false);
      sDel(K_LAST_USER, false);
    }
  }
  function safeStoreRemoteData(remoteData){
    if(!remoteData || typeof remoteData !== 'object') return false;
    const validated = typeof window.__daftarValidateDB === 'function' ? window.__daftarValidateDB(remoteData) : remoteData;
    sSet(K_DATA, JSON.stringify(validated), false);
    return true;
  }

  async function api(action, payload){
    let res;
    try {
      res = await fetch(API, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(Object.assign({action}, payload||{})),
        redirect: 'follow'
      });
    } catch(netErr) {
      const e = new Error('اتصال به سرور همگام‌سازی برقرار نشد.');
      e.isNetwork = true;
      throw e;
    }
    const data = await res.json();
    if(data && data.ok === false){
      const e = new Error(data.error || 'خطا');
      e.isAuth = true;
      throw e;
    }
    return data;
  }
  
  function showToast(text, err){
    const area = document.getElementById('toasts');
    if(!area) return alert(text);
    const el = document.createElement('div');
    el.className = 'toast' + (err ? ' error' : '');
    el.textContent = text;
    area.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
  
  /* ═══════ پنجرهٔ ورود/ثبت‌نام ═══════ */
  function openAuthModal(msg){
