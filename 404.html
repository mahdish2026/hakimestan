<style>
:root{
  --ink:#f1ecff; --muted:#b6a9db; --gold:#f5c76a; --teal:#5eead4;
  --font:'Vazirmatn','Vazir',Tahoma,'Segoe UI',Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; font-family:var(--font); color:var(--ink); line-height:1.9;
  min-height:100vh; display:grid; place-items:center; padding:30px 18px; text-align:center;
  background:
    radial-gradient(1000px 620px at 80% -10%, rgba(139,92,246,.24), transparent 60%),
    radial-gradient(760px 520px at 6% 108%, rgba(94,234,212,.11), transparent 55%),
    linear-gradient(180deg,#0d0a1f,#151033 50%,#0d0a1f);
}
.card{max-width:660px; width:100%}
.code{
  font-size:clamp(4.5rem,18vw,8rem); font-weight:900; line-height:1; letter-spacing:-4px;
  background:linear-gradient(160deg,#f5c76a,#8b5cf6 70%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin-bottom:6px;
}
h1{font-size:1.7rem; margin:0 0 12px; font-weight:900}
p{color:var(--muted); margin:0 0 26px}
.art{width:132px; height:132px; margin:0 auto 4px; display:block; opacity:.95}
.links{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:11px; margin-top:8px;
}
.links a{
  display:flex; align-items:center; justify-content:center; gap:9px;
  padding:14px 12px; border-radius:16px; text-decoration:none; font-weight:700; font-size:.9rem;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); color:var(--ink);
  transition:transform .2s ease, border-color .2s ease;
}
.links a:hover{transform:translateY(-2px); border-color:var(--gold)}
.links a:focus-visible{outline:3px solid var(--teal); outline-offset:3px}
.home{
  display:inline-flex; align-items:center; gap:10px; margin-top:26px;
  padding:14px 30px; border-radius:15px; font-weight:800; text-decoration:none;
  background:linear-gradient(145deg,#f5c76a,#e9a94d); color:#1b1035; border:2px solid #ffd98a;
}
.home:hover{transform:translateY(-2px)}
@media(max-width:560px){h1{font-size:1.35rem}}
</style>
</head>
