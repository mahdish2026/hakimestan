    <radialGradient id="gold" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f9e3a4"/>
      <stop offset="55%" stop-color="#e9b44c"/>
      <stop offset="100%" stop-color="#c9922f"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#332454"/>
      <stop offset="100%" stop-color="#120a1e"/>
    </radialGradient>
  </defs>

  <!-- پس‌زمینهٔ شب بنفش -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
