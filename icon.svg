    <path d="M 85 355 Q 95 355 95 345 Q 95 355 105 355 Q 95 355 95 365 Q 95 355 85 355 Z"/>
    <circle cx="440" cy="330" r="4"/>
    <circle cx="70" cy="160" r="3"/>
    <circle cx="420" cy="200" r="3"/>
  </g>

