><path d="m369 54 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" fill="#a9c9e9"/></svg>`;
function homeView(){const today=isoToday(),periods=db.schedule.filter(p=>p.day===dayIndex()).sort((a,b)=>a.start.localeCompare(b.start));const backupAge=db.lastBackup?Math.floor((Date.now()-Date.parse(db.lastBackup))/86400000):null;const due=backupAge===null||backupAge>=7;return titleBlock('سلام، '+(db.settings.teacher||'معلم عزیز')+'!','امروز '+longDate()+'؛ یک روز تازه برای یاد گرفتن.')+`<section class="hero"><div><span class="pill">${i('book')} دفترت همیشه همراه توست</span><h2>کمی نظم؛<br>وقت بیشتری برای آموزش.</h2><p>کلاس‌ها، حضور و غیاب و نمره‌ها، همه در یک دفتر آرام و مرتب. از برنامهٔ امروز شروع کنیم؟</p><div class="row">${b(db.classes.length?'go':'add-class',db.classes.length?'حضور و غیاب امروز':'اولین کلاسم را بسازم',db.classes.length?'check':'plus',db.classes.length?'data-view="attendance"':'','primary')}${b('go','برنامهٔ هفتگی','arrow','data-view="schedule"','soft')}</div></div>${ART}</section>`+`<div class="stat-grid">${stat(fa(db.classes.length),'کلاس در دفتر','class')}${stat(fa(db.students.length),'دانش‌آموز','users','mint')}${stat(fa(periods.length),'زنگِ امروز','calendar','peach')}${stat(backupAge===null?'—':backupAge===0?'امروز':fa(backupAge)+' روز','از آخرین پشتیبان','shield','lilac')}</div>`+`<div class="home-grid"><div class="stack"><section class="panel"><div class="panel-head"><div><h2>امروز چه کلاسی داری؟</h2><p>${periods.length?fa(periods.length)+' زنگ در برنامهٔ امروز':'برنامهٔ امروزت از اینجا شروع می‌شود.'}</p></div><span class="pill">${DAYS[dayIndex()]||'جمعه'}</span></div>${periods.length?periods.map(p=>`<button class="schedule-item" style="--cc:${p.color}" data-action="period-attendance" data-id="${p.id}"><span class="time ltr">${fa(p.start)}<br>${fa(p.end)}</span><span><strong>${E(p.subject||klass(p.classId)?.subject||'زنگ کلاس')}</strong><br><small class="muted">${E(klass(p.classId)?.name)}</small></span>${i('arrow')}</button>`).join(''):empty('امروز زنگی ثبت نشده','برنامهٔ هفتگی را وارد کن؛ زنگ‌های امروز به‌صورت خودکار اینجا نمایش داده می‌شوند.','go-schedule','تنظیم برنامه','calendar',true)}</section><section class="panel"><div class="panel-head"><h2>سه قدم تا یک دفتر مرتب</h2><span class="pill green">شروع ساده</span></div><div class="guide">${[['۱','کلاس را بساز','نام، پایه و درس کلاس.','classes'],['۲','دانش‌آموزان را اضافه کن','تکی، گروهی یا از CSV.','students'],['۳','امروز را ثبت کن','حضور، نمره و یک یادداشت.','attendance']].map(x=>`<div class="guide-step"><b>${x[0]}</b><div><h3>${x[1]}</h3><p>${x[2]}</p></div>${b('go','برویم','arrow',`data-view="${x[3]}"`,'soft')}</div>`).join('')}</div></section></div><aside><div id="homeHakim" class="hakim-home"></div><section class="panel"><div class="panel-head"><h2>یادم باشد…</h2>${iconButton('add-reminder','افزودن یادآوری','plus')}</div>${db.reminders.length?db.reminders.slice().sort((a,b)=>Number(a.done)-Number(b.done)||(a.due||'9999').localeCompare(b.due||'9999')).map(r=>`<div class="reminder ${r.done?'done':''}"><input type="checkbox" data-change="reminder" data-id="${r.id}" ${r.done?'checked':''} aria-label="انجام شد: ${E(r.text)}"><div class="content">${E(r.text)}${r.due?`<br><span class="pill ${!r.done&&r.due<today?'red':''}">${jalali(r.due)}</span>`:''}</div>${iconButton('delete-reminder','حذف یادآوری','trash',`data-id="${r.id}"`)}</div>`).join(''):'<p class="muted small">برای تکلیف فردا، جلسهٔ اولیا یا یک کار کوچک، یادآوری بگذار.</p>'}</section>${due?`<div class="backup-note">${i('shield')}<div><strong class="small">${db.lastBackup?'وقت پشتیبان هفتگی است':'یک نسخهٔ امن، بیرون از مرورگر'}</strong><p>پاک‌کردن داده‌های مرورگر، دفتر را هم پاک می‌کند. فایل پشتیبان را در جای امن نگه دار.</p><button class="link-btn" data-action="backup">دریافت پشتیبان ${i('arrow')}</button></div></div>`:''}</aside></div>`}
function classesView(){return titleBlock('کلاس‌های من','هر کلاس، یک جهان کوچک برای یاد گرفتن.',b('add-class','کلاس جدید','plus','','primary'))+(db.classes.length?`<div class="class-grid">${db.classes.map((c,idx)=>`<article class="panel class-card" style="--cc:${c.color}"><div class="row between"><div class="class-monogram">${E(c.grade||fa(idx+1))}</div><span class="pill">${fa(roster(c.id).length)} دانش‌آموز</span></div><h2>${E(c.name)}</h2><p class="muted small">پایه ${E(c.grade||'ثبت نشده')} · ${E(c.subject||'همهٔ درس‌ها')}</p><div class="card-actions">${b('class-students','دانش‌آموزان','users',`data-id="${c.id}"`,'primary')}${iconButton('edit-class','ویرایش '+c.name,'edit',`data-id="${c.id}"`)}${iconButton('delete-class','حذف '+c.name,'trash',`data-id="${c.id}"`)}</div></article>`).join('')}</div>`:empty('هنوز کلاسی در دفتر نیست','با ساخت اولین کلاس، بخش‌های دانش‌آموزان، حضور و غیاب و نمرات آمادهٔ استفاده می‌شوند.'))}
function scheduleView(){return titleBlock('برنامهٔ هفتگی','از شنبه تا پنجشنبه؛ روی هر زنگ بزن تا حضور و غیاب آن کلاس باز شود.',b('add-period','زنگ جدید','plus','','primary'))+(needClass()||`<section class="panel"><div class="row between" style="margin-bottom:22px"><span class="pill">${i('calendar')} ${E(db.settings.year)} · ساعت‌ها به وقت محلی</span><div class="row">${b('import-schedule','ورود CSV / Excel','upload')}${b('schedule-template','فایل نمونه','download')}</div></div><div class="week-scroll"><div class="week-grid">${DAYS.map((day,d)=>`<div class="day-column ${dayIndex()===d?'today':''}"><div class="day-head">${day}<small>${dayIndex()===d?'امروز':'برنامهٔ هفتگی'}</small></div>${db.schedule.filter(p=>p.day===d).sort((a,b)=>a.start.localeCompare(b.start)).map(p=>`<article class="period" style="--cc:${p.color}"><button data-action="period-attendance" data-id="${p.id}"><span class="time ltr">${fa(p.start)} – ${fa(p.end)}</span><strong>${E(p.subject||klass(p.classId)?.subject)}</strong><small>${E(klass(p.classId)?.name)}</small></button><div class="period-tools"><button data-action="edit-period" data-id="${p.id}" aria-label="ویرایش زنگ ${E(p.subject)}">${i('edit')}</button><button data-action="delete-period" data-id="${p.id}" aria-label="حذف زنگ ${E(p.subject)}">${i('trash')}</button></div></article>`).join('')}<button class="btn soft" data-action="add-period" data-day="${d}" style="width:100%">${i('plus')} افزودن زنگ</button></div>`).join('')}</div></div><p class="week-help">در موبایل جدول را افقی حرکت دهید. ورود Excel از اولین برگهٔ فایل .xlsx انجام می‌شود. برای ثبت حضور یک روز دیگر، تاریخ را در حضور و غیاب تغییر دهید.</p></section>`)}
function studentsView(){let list=roster().filter(s=>norm(fullName(s)+' '+s.code+' '+s.phone).includes(norm(view.search)));if(view.sort==='code')list.sort((a,b)=>a.code.localeCompare(b.code,'fa',{numeric:true}));if(view.sort==='last')list.sort((a,b)=>a.last.localeCompare(b.last,'fa'));return titleBlock('دانش‌آموزان','نام‌ها فقط در همین مرورگر ذخیره می‌شوند؛ اطلاعات تماس را محرمانه نگه دارید.')+(needClass()||`<section class="panel"><div class="toolbar">${classSelect()}<div class="field search-field"><label for="studentSearch">جستجوی نام، کد یا تلفن</label><input id="studentSearch" data-input="search" value="${E(view.search)}" placeholder="نام دانش‌آموز…" type="search"></div><div class="field"><label for="studentSort">مرتب‌سازی</label><select id="studentSort" data-change="sort"><option value="name" ${view.sort==='name'?'selected':''}>نام کامل</option><option value="last" ${view.sort==='last'?'selected':''}>نام خانوادگی</option><option value="code" ${view.sort==='code'?'selected':''}>کد دانش‌آموز</option></select></div><div class="actions">${b('add-student','دانش‌آموز جدید','plus','','primary')}${b('paste-students','افزودن گروهی','users')}${b('import-students','ورود CSV','upload')}</div></div>${roster().length?`<p class="small muted" style="margin-bottom:14px">${fa(list.length)} نفر از ${fa(roster().length)} دانش‌آموز کلاس</p>`+table(['دانش‌آموز','کد','تلفن والدین','یادداشت','عملیات'],list.map(s=>`<tr><td class="name"><strong>${E(fullName(s))}</strong></td><td class="ltr">${E(s.code||'—')}</td><td class="ltr">${E(s.phone||'—')}</td><td style="max-width:260px;white-space:pre-wrap;overflow-wrap:anywhere">${E(s.note||'—')}</td><td class="actions">${iconButton('student-report','کارنامهٔ '+fullName(s),'file',`data-id="${s.id}"`)}${iconButton('edit-student','ویرایش '+fullName(s),'edit',`data-id="${s.id}"`)}${iconButton('delete-student','حذف '+fullName(s),'trash',`data-id="${s.id}"`)}</td></tr>`)):empty('جای دانش‌آموزانت خالی است','نام‌ها را تکی وارد کن، یک فهرست را بچسبان یا فایل CSV کلاس را انتخاب کن.','add-student','افزودن دانش‌آموز','users')}</section>`)}
function attendanceView(){const list=roster(),vals=db.attendance[view.classId]?.[view.date]||{},counts={present:0,absent:0,late:0};list.forEach(s=>{if(vals[s.id])counts[vals[s.id]]++});return titleBlock('حضور و غیاب','تاریخ شمسی است. انتخاب هر وضعیت، همان لحظه ذخیره می‌شود.')+(needClass()||`<section class="panel attendance-panel"><div class="toolbar">${classSelect()}<div class="field"><label for="attendanceDate">تاریخ شمسی</label><input id="attendanceDate" data-change="att-date" class="ltr" value="${jalali(view.date)}" placeholder="۱۴۰۵/۰۶/۲۲" inputmode="numeric"></div><div class="actions">${b('all-present','همه حاضر','check','','soft')}${b('save-attendance','ثبت حضور کلاس','check','','primary')}</div></div><div class="summary-strip"><span><strong>${fa(counts.present)}</strong> حاضر</span><span><strong>${fa(counts.absent)}</strong> غایب</span><span><strong>${fa(counts.late)}</strong> تأخیر</span><span><strong>${fa(list.length-Object.keys(vals).length)}</strong> بدون ثبت</span><span class="spacer"></span><span>${longDate(view.date)}</span></div>${list.length?table(['دانش‌آموز','وضعیت حضور'],list.map(s=>`<tr><td class="name"><strong>${E(fullName(s))}</strong><div class="sub">${E(s.code||'بدون کد')}</div></td><td><div class="status-group" role="group" aria-label="وضعیت ${E(fullName(s))}">${[['present','حاضر'],['absent','غایب'],['late','تأخیر']].map(([id,label])=>`<button class="status-btn" data-action="attendance-status" data-id="${s.id}" data-status="${id}" aria-pressed="${vals[s.id]===id}">${label}</button>`).join('')}<button class="status-clear" data-action="attendance-clear" data-id="${s.id}" aria-label="پاک‌کردن وضعیت ${E(fullName(s))}">${i('close')}</button></div></td></tr>`)):empty('هنوز دانش‌آموزی ثبت نشده','ابتدا فهرست این کلاس را وارد کنید.','go-students','افزودن دانش‌آموز','users')}</section><section class="panel" style="margin-top:22px"><div class="panel-head"><div><h2>گزارش حضور در طول ترم</h2><p>فقط روزهای دارای وضعیت ثبت‌شده محاسبه می‌شوند؛ روزهای خالی، غیبت نیستند.</p></div></div><div class="toolbar"><div class="field"><label for="absenceFrom">از تاریخ (اختیاری)</label><input id="absenceFrom" class="ltr" placeholder="۱۴۰۵/۰۷/۰۱" value="${view.from?jalali(view.from):''}"></div><div class="field"><label for="absenceTo">تا تاریخ (اختیاری)</label><input id="absenceTo" class="ltr" placeholder="۱۴۰۵/۱۲/۲۹" value="${view.to?jalali(view.to):''}"></div>${b('filter-absence','اعمال بازه','calendar')}${b('clear-absence','همهٔ تاریخ‌ها','close')}</div>${table(['دانش‌آموز','حاضر','غایب','تأخیر'],attendanceSummary(view.classId,view.from,view.to).map(x=>`<tr><td>${E(fullName(x.s))}</td><td>${fa(x.present)}</td><td><span class="pill ${x.absent?'red':'green'}">${fa(x.absent)}</span></td><td>${fa(x.late)}</td></tr>`))}<p class="small muted" style="margin-top:13px">خروجی Excel شامل حضور روز انتخابی، خلاصهٔ بازه و جزئیات تمام غیبت‌ها و تأخیرهای بازه است.</p></section>`)}
function gradesView(){const gs=db.grades.filter(g=>g.classId===view.classId&&(!view.subject||g.subject===view.subject)).slice().sort((a,b)=>b.date.localeCompare(a.date)||a.title.localeCompare(b.title,'fa'));return titleBlock('دفتر نمرات','نمره‌ها در مقیاس ۰ تا ۲۰؛ میانگین با وزن هر نمره محاسبه می‌شود.')+(needClass()||`<section class="panel"><div class="toolbar">${classSelect()}${subjectSelect()}<div class="actions">${b('add-grade','ثبت نمره','plus','','primary')}${b('import-exam','ورود از آزمون‌ساز','upload')}</div></div><div class="note-box" style="margin-bottom:18px">میانگین وزنی = مجموعِ (نمره × وزن) ÷ مجموع وزن‌ها. نمرهٔ ثبت‌نشده صفر نیست و در میانگین حساب نمی‌شود. برای ثبت تکی یا گروهی، «ثبت نمره» را بزنید.</div>${gs.length?table(['دانش‌آموز','عنوان / درس','نوع','تاریخ','نمره از ۲۰','وزن','عملیات'],gs.map(g=>`<tr><td class="name">${E(fullName(student(g.studentId)))}</td><td><strong>${E(g.title)}</strong><div class="sub">${E(g.subject)}${g.note?' · '+E(g.note):''}</div></td><td>${E(g.type)}</td><td class="no-wrap">${jalali(g.date)}</td><td><span class="score">${fmt(g.score)}</span></td><td>${fmt(g.weight)}</td><td class="actions">${iconButton('edit-grade','ویرایش نمره','edit',`data-id="${g.id}"`)}${iconButton('delete-grade','حذف نمره','trash',`data-id="${g.id}"`)}</td></tr>`)):empty('اولین نمره، شروع یک مسیر','نمرهٔ امتحان، پرسش یا فعالیت را ثبت کن؛ میانگین و کارنامه خودکار آماده می‌شوند.','add-grade','ثبت نمره','score')}</section>`)}
function progressChart(gs){if(!gs.length)return '<p class="muted small">با ثبت نمره، نمودار پیشرفت نمایش داده می‌شود.</p>';const groups={};gs.forEach(g=>(groups[g.date]??=[]).push(g));const series=Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0])).map(([date,arr])=>({date,value:avg(arr)}));const W=650,H=240,L=45,R=25,T=25,B=42,x=i=>L+(series.length===1?(W-L-R)/2:i*(W-L-R)/(series.length-1)),y=v=>T+(20-v)*(H-T-B)/20;return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="نمودار میانگین وزنی روزانه، از صفر تا بیست"><title>پیشرفت نمره‌ها به ترتیب تاریخ</title>${[0,5,10,15,20].map(v=>`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="#e7ebf0"/><text x="27" y="${y(v)+4}" text-anchor="middle">${fa(v)}</text>`).join('')}<polyline points="${series.map((p,j)=>`${x(j)},${y(p.value)}`).join(' ')}" fill="none" stroke="${THEMES.find(t=>t[0]===db.settings.theme)[4]}" stroke-width="3"/>${series.map((p,j)=>`<circle cx="${x(j)}" cy="${y(p.value)}" r="4" fill="white" stroke="${THEMES.find(t=>t[0]===db.settings.theme)[4]}" stroke-width="2"><title>${jalali(p.date)}: ${fmt(p.value)}</title></circle>${j===0||j===series.length-1||j===Math.floor(series.length/2)?`<text x="${x(j)}" y="${H-14}" text-anchor="middle" style="font-size:10px">${jalali(p.date)}</text>`:''}`).join('')}</svg>`}
function barChart(list){const bins=[{label:'کمتر از ۱۰',n:0},{label:'۱۰ تا کمتر از ۱۴',n:0},{label:'۱۴ تا کمتر از ۱۷',n:0},{label:'۱۷ تا ۲۰',n:0}];list.forEach(x=>bins[x.mean<10?0:x.mean<14?1:x.mean<17?2:3].n++);const max=Math.max(1,...bins.map(x=>x.n));return `<svg class="chart" viewBox="0 0 620 260" role="img" aria-label="توزیع میانگین دانش‌آموزان در چهار بازه"><title>توزیع میانگین دانش‌آموزان دارای نمره</title>${[0,.5,1].map(k=>`<line x1="35" y1="${210-160*k}" x2="595" y2="${210-160*k}" stroke="#e7ebf0"/>`).join('')}${bins.map((bin,j)=>`<rect x="${60+j*140}" y="${210-160*bin.n/max}" width="75" height="${160*bin.n/max}" rx="7" fill="${['#f2afa8','#efcf81','#9acbbb','#92b3e6'][j]}"/><text x="${97+j*140}" y="${198-160*bin.n/max}" text-anchor="middle">${fa(bin.n)}</text><text x="${97+j*140}" y="240" text-anchor="middle" style="font-size:10px">${bin.label}</text>`).join('')}</svg>`}
function reportView(){const s=student(view.studentId),gs=s?gradesOf(s.id).slice().sort((a,b)=>a.date.localeCompare(b.date)):[],mean=avg(gs),rank=ranking(view.classId,'').find(x=>x.student.id===s?.id),subjects=[...new Set(gs.map(g=>g.subject))];return titleBlock('کارنامهٔ دانش‌آموز','میانگین وزنی همهٔ نمره‌ها؛ رتبه فقط میان دانش‌آموزان دارای نمره محاسبه می‌شود.')+(needClass()||`<div class="toolbar">${classSelect()}<div class="field"><label for="reportStudent">دانش‌آموز</label><select id="reportStudent" data-change="report-student">${roster().map(s=>`<option value="${s.id}" ${s.id===view.studentId?'selected':''}>${E(fullName(s))}</option>`).join('')}</select></div></div>${s?`<section class="panel"><div class="row"><div class="student-avatar">${E(s.first.slice(0,1)+s.last.slice(0,1))}</div><div><h2 class="report-name">${E(fullName(s))}</h2><p class="small muted">${E(klass(s.classId)?.name)} · کد ${E(s.code||'ثبت نشده')} · سال تحصیلی ${E(db.settings.year)}</p></div><span class="spacer"></span><span class="pill">کارنامهٔ آموزشی</span></div><div class="stat-grid">${stat(fmt(mean),'میانگین وزنی از ۲۰','score')}${stat(rank?fa(rank.rank):'—','رتبه در کلاس','chart','peach')}${stat(fa(gs.length),'نمرهٔ ثبت‌شده','file','mint')}${stat(fa(ranking(view.classId,'').length),'دانش‌آموز در رتبه‌بندی','users','lilac')}</div><div class="report-grid"><div class="panel chart-panel"><h3>مسیر پیشرفت</h3><p class="small muted">محور زمان از چپ به راست است؛ هر نقطه، میانگین وزنی یک روز.</p>${progressChart(gs)}</div><div class="panel"><h3 style="margin-bottom:15px">میانگین هر درس</h3>${subjects.length?table(['درس','میانگین'],subjects.map(sub=>`<tr><td>${E(sub)}</td><td class="score">${fmt(avg(gs.filter(g=>g.subject===sub)))}</td></tr>`)):'<p class="small muted">هنوز نمره‌ای ثبت نشده.</p>'}</div></div><h3 style="margin:25px 0 15px">همهٔ نمرات</h3>${table(['تاریخ','عنوان','درس / نوع','نمره','وزن'],gs.map(g=>`<tr><td class="no-wrap">${jalali(g.date)}</td><td>${E(g.title)}</td><td>${E(g.subject)} · ${E(g.type)}</td><td class="score">${fmt(g.score)}</td><td>${fmt(g.weight)}</td></tr>`))}<div class="field" style="margin-top:24px"><label for="reportNote">یادداشت معلم در کارنامه</label><textarea id="reportNote" maxlength="2000" placeholder="یک پیشنهاد برای ادامهٔ مسیر یادگیری…">${E(s.reportNote||'')}</textarea></div><div class="row" style="margin-top:14px">${b('save-report-note','ذخیرهٔ یادداشت','check','','primary')}<p class="small muted">یادداشت ذخیره‌شده در خروجی کارنامه می‌آید.</p></div></section>`:empty('ابتدا دانش‌آموزی اضافه کنید','کارنامه به‌صورت خودکار از نمرات ثبت‌شده ساخته می‌شود.','go-students','دانش‌آموزان','users')}`)}
function analyticsView(){const list=ranking(),mean=list.length?list.reduce((s,x)=>s+x.mean,0)/list.length:null;return titleBlock('گزارش کلاسی','یک تصویر روشن از وضعیت یادگیری؛ بدون محاسبهٔ نمرهٔ صفر برای داده‌های خالی.')+(needClass()||`<div class="toolbar">${classSelect()}${subjectSelect()}</div><div class="stat-grid">${stat(fmt(mean),'میانگین میانگین‌های دانش‌آموزان','chart')}${stat(fmt(list[0]?.mean??null),'بیشترین میانگین','score','mint')}${stat(fmt(list.at(-1)?.mean??null),'کمترین میانگین','score','peach')}${stat(fa(list.length)+' / '+fa(roster().length),'دارای نمره / کل کلاس','users','lilac')}</div><div class="report-grid"><section class="panel"><div class="panel-head"><div><h2>رتبه‌بندی کلاس</h2><p>میانگین‌های برابر تا دو رقم اعشار، رتبهٔ مشترک دارند.</p></div><span class="pill">${E(view.subject||'همهٔ درس‌ها')}</span></div>${table(['رتبه','دانش‌آموز','میانگین از ۲۰','کارنامه'],list.map(x=>`<tr><td><span class="pill">${fa(x.rank)}</span></td><td>${E(fullName(x.student))}</td><td class="score">${fmt(x.mean)}</td><td>${iconButton('student-report','کارنامهٔ '+fullName(x.student),'file',`data-id="${x.student.id}"`)}</td></tr>`))}</section><section class="panel chart-panel"><h2>توزیع نمرات</h2><p class="small muted">بر اساس میانگین وزنی دانش‌آموزان دارای نمره</p>${barChart(list)}<div class="note-box">میانگین کلاس، میانگین سادهٔ میانگین وزنی دانش‌آموزان است؛ به هر دانش‌آموز سهم برابر می‌دهد.<br>${fa(roster().length-list.length)} دانش‌آموز هنوز در این گزارش نمره‌ای ندارد.</div></section></div>`)}
function toolsView(){return titleBlock('ابزار کوچکِ کلاس','کمی تنوع، کمی بازی؛ برای یک کلاس پرانرژی.')+`<div class="tools-grid"><section class="panel"><h2>نوبت چه کسی است؟</h2><p class="small muted">انتخاب تصادفی از فهرست واقعی کلاس</p><div class="toolbar" style="margin-top:18px">${db.classes.length?classSelect():''}</div><div class="tool-result" id="randomResult" role="status">منتظر یک نام تازه…</div><label class="check-label"><input type="checkbox" id="noRepeat" checked>تا تمام شدن فهرست، تکرار نکن</label><div class="row">${b('random-student','انتخاب دانش‌آموز','users','','primary')}${b('reset-random','شروع دور تازه','close')}</div></section><section class="panel"><h2>تایمر کلاس</h2><p class="small muted">با جابه‌جایی بین بخش‌ها، شمارش ادامه دارد.</p><div class="tool-result"><div id="timerClock" class="timer-clock ltr" role="timer" aria-label="زمان باقی‌مانده">۰۵:۰۰</div></div><div class="form-grid"><div class="field"><label for="timerMinutes">دقیقه (۰ تا ۱۸۰)</label><input id="timerMinutes" inputmode="numeric" value="۵" class="ltr"></div><div class="field"><label for="timerSeconds">ثانیه (۰ تا ۵۹)</label><input id="timerSeconds" inputmode="numeric" value="۰" class="ltr"></div></div><label class="check-label" style="margin:10px 0"><input type="checkbox" id="timerAlarm" ${timer.alarm?'checked':''} data-change="timer-alarm">هشدار صوتی در پایان</label><div class="row">${b('timer-start',timer.running?'در حال شمارش':'شروع / ادامه','clock','','primary')}${b('timer-pause','مکث','clock')}${b('timer-reset','تنظیم مجدد','close')}</div><p class="small muted" style="margin-top:12px">تایمر با بستن یا بارگذاری دوبارهٔ صفحه متوقف می‌شود. پخش هشدار در پس‌زمینه به محدودیت مرورگر وابسته است.</p></section><section class="panel"><h2>تاس کلاس</h2><div class="tool-result" id="diceResult" role="status">یک تا شش</div>${b('roll-dice','تاس بینداز','dice','','primary')}</section><section class="panel"><h2>شیر یا خط؟</h2><div class="tool-result" id="coinResult" role="status">شیر یا خط</div>${b('flip-coin','سکه بینداز','dice','','primary')}</section></div>`}
function settingsView(){return titleBlock('تنظیمات دفتر','دفترت را به رنگ و نام خودت کن؛ پشتیبان را فراموش نکن.')+`<div class="settings-grid"><div class="stack"><section class="panel"><h2 style="margin-bottom:20px">مشخصات معلم و مدرسه</h2><form id="settingsForm" data-form="settings"><div class="form-grid">${F('teacher','نام معلم',db.settings.teacher,'text','maxlength="200" autocomplete="name"')}${F('school','نام مدرسه',db.settings.school,'text','maxlength="200"')}${F('year','سال تحصیلی',db.settings.year,'text','maxlength="200"')}<div class="field"><label>محل ذخیره‌سازی</label><div class="note-box">همین دستگاه و مرورگر</div></div></div><div class="row" style="margin-top:20px"><button class="btn primary" type="submit">${i('check')} ذخیرهٔ مشخصات</button></div></form></section><section class="panel"><div class="panel-head"><div><h2>دفترت، به رنگ خودت</h2><p>هشت تم روشن؛ چاپ همیشه سیاه‌وسفید است.</p></div></div><div class="theme-grid">${THEMES.map(t=>`<button class="theme-card" style="--tc:${t[0]==='rainbow'?'linear-gradient(100deg,#f48b9b,#edc777,#7bc9b5,#87adeb,#bb94dd)':t[2]};--ts:${t[3]}" data-action="theme" data-theme="${t[0]}" aria-pressed="${db.settings.theme===t[0]}"><span class="swatch"></span><strong>${t[1]}</strong></button>`).join('')}</div><p class="small muted" style="margin-top:15px">در تم مدادرنگی، رنگ اختصاصی هر کلاس روی کارت‌ها و برنامهٔ هفتگی حفظ می‌شود.</p></section></div><div class="stack"><section class="panel"><h2>نسخهٔ امنِ دفتر</h2><p class="settings-help" style="margin:12px 0 20px">پشتیبان JSON شامل همهٔ کلاس‌ها، دانش‌آموزان، تلفن‌ها، نمرات و حضور و غیاب است. فایل رمزگذاری نشده؛ آن را در محل امن نگه دارید و در فضای عمومی به اشتراک نگذارید.</p><div class="row">${b('backup','دریافت پشتیبان','download','','primary')}${b('restore','بازیابی پشتیبان','upload')}</div><p class="small muted" style="margin-top:18px">آخرین پشتیبان: ${db.lastBackup?jalali(db.lastBackup.slice(0,10)):'هنوز دریافت نشده'}</p><div class="note-box" style="margin-top:18px">بازیابی، اطلاعات فعلی این دفتر را جایگزین می‌کند؛ ادغام انجام نمی‌شود. پیش از بازیابی از اطلاعات فعلی پشتیبان بگیرید.</div></section><section class="panel"><h2>دربارهٔ ذخیره‌سازی آفلاین</h2><p class="settings-help" style="margin-top:12px">این برنامه هیچ اطلاعاتی به سرور نمی‌فرستد. داده‌ها به نشانی سایت، دستگاه و مرورگر وابسته‌اند؛ برای انتقال دفتر به دستگاه دیگر از پشتیبان استفاده کنید. حالت ناشناس یا پاک‌سازی مرورگر ممکن است داده‌ها را از بین ببرد.</p><p class="settings-help" style="margin-top:12px">فونت‌ها و ابزار ساخت تصویر داخل همین فایل‌اند. اتصال به حکیم از فایل هم‌مسیر <bdi>hakim-core.js</bdi> انجام می‌شود. فایل Excel واقعی با پسوند .xlsx و Word استاندارد با پسوند .docx تولید می‌شود؛ CSV نیز دارای BOM است.</p></section><section class="panel danger-zone"><h2>پاک‌کردن دفتر</h2><p class="settings-help" style="margin:12px 0 20px">این کار فقط اطلاعات دفتر معلم را حذف می‌کند؛ اطلاعات بازی‌ها و ابزارهای دیگر حکیمستان دست‌نخورده می‌ماند. بازگردانی تنها با پشتیبان ممکن است.</p>${b('clear-all','پاک‌کردن همهٔ داده‌ها','trash','','danger')}</section></div></div>`}
const RENDERS={home:homeView,schedule:scheduleView,classes:classesView,students:studentsView,attendance:attendanceView,grades:gradesView,report:reportView,analytics:analyticsView,tools:toolsView,settings:settingsView};

<script>
function classForm(id){const c=id?klass(id):{name:'',grade:'',subject:'',color:['#6398d9','#62af92','#dc91a4','#b297d4','#dfb35c'][db.classes.length%5]};openModal(id?'ویرایش کلاس':'یک کلاس تازه',`<form data-form="modal"><p class="modal-copy">نامی آشنا انتخاب کن؛ مثل «پنجم / ۱». هر کلاس می‌تواند نمره‌های چند درس داشته باشد.</p><div class="form-grid">${F('name','نام کلاس *',c.name,'text','maxlength="100" required')}${F('grade','پایه',c.grade,'text','maxlength="100" placeholder="مثلاً پنجم"')}${F('subject','درس اصلی',c.subject,'text','maxlength="100" placeholder="مثلاً ریاضی"')}${F('color','رنگ کلاس',c.color,'color')}</div>${formActions('ذخیرهٔ کلاس')}</form>`,()=>{const obj={id:id||uid(),name:req(V('name'),'نام کلاس'),grade:V('grade').trim(),subject:V('subject').trim(),color:V('color')};if(db.classes.some(x=>x.id!==id&&norm(x.name)===norm(obj.name)))throw Error('کلاسی با این نام وجود دارد؛ نام متمایز انتخاب کنید.');if(commit(d=>{if(id)d.classes[d.classes.findIndex(x=>x.id===id)]=obj;else d.classes.push(obj)},'کلاس ذخیره شد.')){view.classId=obj.id;closeModal();render()}})}
function studentForm(id){if(!view.classId)return toast('ابتدا یک کلاس بسازید.',true);const s=id?student(id):{first:'',last:'',code:'',phone:'',note:''};openModal(id?'ویرایش دانش‌آموز':'دانش‌آموز جدید',`<form data-form="modal"><p class="modal-copy">کلاس ${E(klass(view.classId).name)} · کد و تلفن اختیاری‌اند. صفر ابتدای کد و تلفن حفظ می‌شود.</p><div class="form-grid">${F('first','نام *',s.first,'text','required maxlength="100"')}${F('last','نام خانوادگی',s.last,'text','maxlength="100"')}${F('code','کد دانش‌آموز',s.code,'text','maxlength="100" inputmode="numeric" class="ltr"')}${F('phone','تلفن والدین',s.phone,'tel','maxlength="100" class="ltr"')}<div class="field span-2"><label for="f-note">یادداشت خصوصی معلم</label><textarea id="f-note" maxlength="2000">${E(s.note)}</textarea><small>این یادداشت در کارنامه درج نمی‌شود؛ یادداشت کارنامه جداست.</small></div></div>${formActions()}</form>`,()=>{const obj={...s,id:id||uid(),classId:view.classId,first:req(V('first'),'نام'),last:V('last').trim(),code:latin(V('code')).trim(),phone:latin(V('phone')).trim(),note:V('note').trim(),reportNote:s.reportNote||''};if(obj.code&&db.students.some(x=>x.id!==id&&x.classId===view.classId&&norm(x.code)===norm(obj.code)))throw Error('این کد در کلاس تکراری است.');if(commit(d=>{if(id)d.students[d.students.findIndex(x=>x.id===id)]=obj;else d.students.push(obj)},'دانش‌آموز ذخیره شد.'))closeModal()})}
function periodConflict(p,others=db.schedule){return others.find(x=>x.id!==p.id&&x.day===p.day&&p.start<x.end&&p.end>x.start)}
function readTime(value){if(typeof value==='number'&&value>=0&&value<1){const m=Math.round(value*1440);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}let s=latin(value).trim();const m=s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);if(!m||+m[1]>23||+m[2]>59)throw Error('ساعت باید به شکل ۰۸:۳۰ و در بازهٔ ۰۰:۰۰ تا ۲۳:۵۹ باشد.');return m[1].padStart(2,'0')+':'+m[2]}
function periodForm(id,day=0){if(!db.classes.length)return toast('ابتدا یک کلاس بسازید.',true);const p=id?db.schedule.find(x=>x.id===id):{classId:view.classId||db.classes[0].id,day:Number(day),start:'08:00',end:'08:45',subject:klass(view.classId)?.subject||'',color:klass(view.classId)?.color||'#6398d9'};openModal(id?'ویرایش زنگ':'افزودن زنگ',`<form data-form="modal"><div class="form-grid">${S('class','کلاس *',db.classes.map(c=>[c.id,c.name]),p.classId)}${S('day','روز',DAYS.map((d,i)=>[i,d]),p.day)}${F('start','ساعت شروع',p.start,'time','required')}${F('end','ساعت پایان',p.end,'time','required')}${F('subject','درس *',p.subject,'text','required maxlength="100"')}${F('color','رنگ زنگ',p.color,'color')}</div><p class="small muted" style="margin-top:18px">برای جلوگیری از تداخل برنامه، دو زنگ نمی‌توانند در یک روز هم‌زمان باشند.</p>${formActions('ذخیرهٔ زنگ')}</form>`,()=>{const obj={id:id||uid(),classId:V('class'),day:Number(V('day')),start:readTime(V('start')),end:readTime(V('end')),subject:req(V('subject'),'درس'),color:V('color')};if(obj.end<=obj.start)throw Error('ساعت پایان باید بعد از ساعت شروع باشد.');const conflict=periodConflict(obj);if(conflict)throw Error(`این زنگ با ${klass(conflict.classId)?.name} (${fa(conflict.start)} تا ${fa(conflict.end)}) تداخل دارد.`);if(commit(d=>{if(id)d.schedule[d.schedule.findIndex(x=>x.id===id)]=obj;else d.schedule.push(obj)},'زنگ به برنامه اضافه شد.'))closeModal()});$('#f-class').addEventListener('change',()=>{const c=klass(V('class'));$('#f-subject').value=c.subject;$('#f-color').value=c.color})}
function gradeForm(id){if(!roster().length)return toast('ابتدا دانش‌آموزی در این کلاس اضافه کنید.',true);const g=id?db.grades.find(x=>x.id===id):null;const students=g?[student(g.studentId)]:roster();openModal(g?'ویرایش نمره':'ثبت نمره؛ تکی یا گروهی',`<form data-form="modal"><p class="modal-copy">برای ثبت تکی فقط یک ردیف را پر کنید. ردیف‌های خالی نمره نمی‌گیرند؛ صفر یک نمرهٔ واقعی است.</p><div class="form-grid">${F('title','عنوان *',g?.title||'','text','required maxlength="200" placeholder="مثلاً فصل دوم؛ کسرها"')}${F('subject','درس *',g?.subject||view.subject||klass(view.classId)?.subject||'','text','required maxlength="100"')}${S('type','نوع ارزیابی',TYPES,g?.type||'امتحان')}${F('date','تاریخ شمسی',jalali(g?.date||isoToday()),'text','required class="ltr" inputmode="numeric"')}${F('weight','وزن (بیشتر از صفر تا ۱۰۰)',g?fa(g.weight):'۱','text','required inputmode="decimal"')}${F('note','توضیح مشترک',g?.note||'','text','maxlength="2000"')}</div><div style="margin-top:22px">${table(['دانش‌آموز','نمره از ۲۰'],students.map(s=>`<tr><td><label for="grade-${s.id}">${E(fullName(s))}</label></td><td><input id="grade-${s.id}" class="grade-input ltr" data-student="${s.id}" inputmode="decimal" value="${g?fa(g.score):''}" placeholder="بدون نمره" aria-label="نمرهٔ ${E(fullName(s))}"></td></tr>`))}</div>${formActions('ثبت نمره‌ها')}</form>`,()=>{const base={title:req(V('title'),'عنوان',200),subject:req(V('subject'),'درس'),type:V('type'),date:parseDate(V('date')),weight:num(V('weight')),note:V('note').trim()};if(!Number.isFinite(base.weight)||base.weight<=0||base.weight>100)throw Error('وزن باید عددی بیشتر از صفر و حداکثر ۱۰۰ باشد.');const entries=[];for(const input of $$('.grade-input')){if(!input.value.trim())continue;const n=num(input.value);if(!Number.isFinite(n)||n<0||n>20)throw Error('نمرهٔ '+fullName(student(input.dataset.student))+' باید از صفر تا بیست باشد.');entries.push({...base,id:g?.id||uid(),classId:view.classId,studentId:input.dataset.student,score:n,...(g?.sourceKey?{sourceKey:g.sourceKey}:{})})}if(!entries.length)throw Error('حداقل یک نمره وارد کنید.');if(commit(d=>{if(g)d.grades[d.grades.findIndex(x=>x.id===g.id)]=entries[0];else d.grades.push(...entries)},'نمره‌ها ثبت شد.')){closeModal();say('نمره‌ها ثبت شد.')}},true)}
function reminderForm(){openModal('یادم باشد…',`<form data-form="modal"><div class="stack">${F('text','یادآوری *','','text','required maxlength="500" placeholder="مثلاً جلسهٔ اولیا، سه‌شنبه"')}${F('due','تاریخ شمسی (اختیاری)','','text','class="ltr" inputmode="numeric" placeholder="۱۴۰۵/۰۶/۲۲"')}</div>${formActions('افزودن یادآوری')}</form>`,()=>{const r={id:uid(),text:req(V('text'),'متن یادآوری',500),due:parseDate(V('due'),true),done:false};if(commit(d=>d.reminders.push(r),'یادآوری اضافه شد.'))closeModal()})}
function backup(update=true){if(storageBroken)return IO.download(storageToken||'', 'daftar-recovery-raw.txt','text/plain;charset=utf-8');if(update&&!storageConflict){db.lastBackup=new Date().toISOString();persist()}IO.download(JSON.stringify({app:'hakimestan-daftar',version:1,exportedAt:new Date().toISOString(),data:db},null,2),'daftar-backup-'+isoToday()+'.json','application/json');if(!$('#modal').open)render();toast('فایل پشتیبان برای دانلود آماده شد؛ آن را در محل امن ذخیره کنید.');say('پشتیبان گرفته شد.')}
function clearAll(){openModal('پاک‌کردن همهٔ داده‌های دفتر',`<form data-form="modal"><p class="modal-copy">${fa(db.classes.length)} کلاس و ${fa(db.students.length)} دانش‌آموز همراه با نمرات و حضور و غیاب حذف می‌شوند. این کار برگشت‌پذیر نیست؛ مگر پشتیبان داشته باشید.</p>${b('backup','اول پشتیبان می‌گیرم','download')}<div style="margin-top:20px">${F('confirmText','برای تأیید بنویسید: پاک کن','','text','autocomplete="off"')}</div>${formActions('پاک‌کردن قطعی')}</form>`,()=>{if(V('confirmText').trim()!=='پاک کن')throw Error('عبارت «پاک کن» را دقیق وارد کنید.');try{localStorage.removeItem(KEY)}catch(e){if(storageToken)throw Error('حذف اطلاعات ذخیره‌شده ممکن نشد. دسترسی مرورگر را بررسی کنید.')}db=blank();storageToken=null;storageBroken=false;storageConflict=false;storageProblem='';unsaved=false;view.classId='';view.studentId='';view.tab='home';persist();closeModal();render();toast('فقط داده‌های دفتر معلم پاک شد.')})}
function pickFile(kind,accept){fileKind=kind;$('#fileInput').accept=accept;$('#fileInput').value='';$('#fileInput').click()}
function randomInt(max){if(window.crypto?.getRandomValues){const a=new Uint32Array(1),limit=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}return Math.floor(Math.random()*max)}
function animateResult(id,text){const el=$('#'+id);if(!el)return;el.textContent=text;el.classList.remove('active');void el.offsetWidth;el.classList.add('active')}
function getAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}catch(e){return null}}
function alarm(){if(!timer.alarm)return;const c=getAudio();if(!c)return;try{for(let j=0;j<3;j++){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=j===2?880:660;g.gain.setValueAtTime(0,c.currentTime+j*.32);g.gain.linearRampToValueAtTime(.12,c.currentTime+j*.32+.025);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+j*.32+.25);o.connect(g).connect(c.destination);o.start(c.currentTime+j*.32);o.stop(c.currentTime+j*.32+.28)}}catch(e){}}
function updateTimer(){if(timer.running){timer.remaining=Math.max(0,timer.end-performance.now());if(timer.remaining<=0){timer.running=false;clearInterval(timer.interval);timer.interval=null;alarm();toast('زمان فعالیت کلاس به پایان رسید.');say('زمان فعالیت به پایان رسید؛ خسته نباشید!')}}const sec=Math.ceil(timer.remaining/1000),text=fa(String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'));if($('#timerClock'))$('#timerClock').textContent=text;const mini=$('#timerMini');mini.classList.toggle('hidden',!timer.running);mini.textContent=text;}
function timerSet(){const m=num($('#timerMinutes')?.value??5),s=num($('#timerSeconds')?.value??0);if(!Number.isInteger(m)||m<0||m>180||!Number.isInteger(s)||s<0||s>59||m*60+s<=0)throw Error('زمان را بین یک ثانیه و ۱۸۰ دقیقه و ۵۹ ثانیه انتخاب کنید.');timer.remaining=(m*60+s)*1000;timer.configured=true}

 'filter-absence':()=>{const from=parseDate($('#absenceFrom').value,true),to=parseDate($('#absenceTo').value,true);if(from&&to&&from>to)throw Error('تاریخ پایان نباید قبل از شروع باشد.');view.from=from;view.to=to;render()},'clear-absence':()=>{view.from='';view.to='';render()},
 'add-grade':()=>gradeForm(),'edit-grade':el=>gradeForm(el.dataset.id),'delete-grade':el=>confirmBox('حذف نمره','این نمره از محاسبهٔ میانگین و کارنامه حذف می‌شود.',()=>commit(d=>d.grades=d.grades.filter(x=>x.id!==el.dataset.id),'نمره حذف شد.')),
 'save-report-note':()=>commit(d=>d.students.find(s=>s.id===view.studentId).reportNote=$('#reportNote').value.trim(),'یادداشت کارنامه ذخیره شد.'),

document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const fn=ACTIONS[el.dataset.action];if(fn)try{const r=fn(el);if(r?.catch)r.catch(showError)}catch(err){showError(err)}});
document.addEventListener('submit',e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();try{if(form.dataset.form==='modal'&&modalAction)modalAction();else if(form.dataset.form==='settings')commit(d=>{d.settings.teacher=V('teacher').trim();d.settings.school=V('school').trim();d.settings.year=req(V('year'),'سال تحصیلی',200)},'مشخصات دفتر ذخیره شد.')}catch(err){showError(err)}});
document.addEventListener('change',e=>{const el=e.target;try{switch(el.dataset.change){case'class':view.classId=el.value;view.studentId='';view.subject='';view.search='';render();break;case'subject':view.subject=el.value;render();break;case'sort':view.sort=el.value;render();break;case'att-date':{try{view.date=parseDate(el.value);render()}catch(err){el.value=jalali(view.date);throw err}break}case'report-student':view.studentId=el.value;render();say('کارنامه‌ی '+fullName(student(view.studentId))+' آماده‌ست.');break;case'reminder':commit(d=>d.reminders.find(r=>r.id===el.dataset.id).done=el.checked);break;case'timer-alarm':timer.alarm=el.checked;break}}catch(err){showError(err)}});
document.addEventListener('input',e=>{if(e.target.dataset.input==='search'){const value=e.target.value,pos=e.target.selectionStart;view.search=value;render();const input=$('#studentSearch');input.focus({preventScroll:true});input.setSelectionRange(pos,pos)}});
$('#tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const index=TABS.findIndex(t=>t[0]===view.tab),next=e.key==='Home'?0:e.key==='End'?TABS.length-1:(index+(e.key==='ArrowLeft'?1:-1)+TABS.length)%TABS.length;go(TABS[next][0]);$('#tab-'+TABS[next][0]).focus()});
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});

$('#modal').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const list=$$('#modal button:not(:disabled),#modal input:not(:disabled):not([type=hidden]),#modal select:not(:disabled),#modal textarea:not(:disabled),#modal summary,#modal [tabindex="0"]').filter(el=>el.getClientRects().length);if(!list.length){e.preventDefault();return}const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});

</script>

<script>

case'attendance':{title='حضور و غیاب '+(c?.name||'');summary='تاریخ حضور: '+longDate(view.date)+' · بازهٔ گزارش: '+(view.from?jalali(view.from):'ابتدای سوابق')+' تا '+(view.to?jalali(view.to):'انتهای سوابق');const labels={present:'حاضر',absent:'غایب',late:'تأخیر'};sheets.push({name:'حضور روزانه',headers:['دانش‌آموز','کد','تاریخ','وضعیت'],rows:roster().map(s=>[fullName(s),s.code,jalali(view.date),labels[db.attendance[view.classId]?.[view.date]?.[s.id]]||'بدون ثبت'])},{name:'خلاصه حضور در بازه',headers:['دانش‌آموز','کد','حاضر','غایب','تأخیر'],rows:attendanceSummary(view.classId,view.from,view.to).map(x=>[fullName(x.s),x.s.code,x.present,x.absent,x.late])});const absences=[];for(const[date,values]of Object.entries(db.attendance[view.classId]||{}).sort((a,b)=>a[0].localeCompare(b[0]))){if(view.from&&date<view.from||view.to&&date>view.to)continue;for(const[sid,status]of Object.entries(values))if(status!=='present')absences.push([fullName(student(sid)),student(sid)?.code||'',jalali(date),labels[status]])}sheets.push({name:'جزئیات غیبت و تأخیر',headers:['دانش‌آموز','کد','تاریخ','وضعیت'],rows:absences});note='روزهای بدون ثبت به‌عنوان غیبت محاسبه نشده‌اند.';break}

}
async function pngReport(r){if(r.visualSheets)r={...r,sheets:r.visualSheets,visualSheets:null};if(typeof html2canvas!=='function')throw Error('ابزار تصویر در این نسخه در دسترس نیست؛ از چاپ استفاده کنید.');await document.fonts.ready;const pages=[];if(r.sheets.reduce((n,s)=>n+s.rows.length,0)<=28)pages.push(r);else for(const s of r.sheets){if(s.rows.length){for(let start=0;start<s.rows.length;start+=28)pages.push({...r,sheets:[{...s,rows:s.rows.slice(start,start+28)}],chart:pages.length===0?r.chart:'',note:''})}else pages.push({...r,sheets:[s],chart:pages.length===0?r.chart:'',note:''})}if(!pages.length)pages.push(r);if(pages.length>100)throw Error('این گزارش بیش از ۱۰۰ صفحهٔ تصویری دارد؛ از Excel یا چاپ استفاده کنید.');pages[pages.length-1].note=r.note;const files={};let holder=document.createElement('div');holder.className='export-staging';document.body.append(holder);try{for(let j=0;j<pages.length;j++){holder.innerHTML=reportHTML(pages[j]);holder.querySelector('.report-end').append(' · صفحهٔ '+fa(j+1)+' از '+fa(pages.length));const el=holder.firstElementChild;await rasterizeReportText(el);if(el.scrollHeight>11000)throw Error('متن یک صفحه برای تصویر بسیار بلند است؛ از PDF یا Word استفاده کنید.');const canvas=await html2canvas(el,{backgroundColor:'#fff',scale:1.6,logging:false,useCORS:false,windowWidth:1100,scrollX:0,scrollY:0});const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('ساخت تصویر ممکن نشد.');files['page-'+String(j+1).padStart(3,'0')+'.png']=new Uint8Array(await blob.arrayBuffer());canvas.width=1;canvas.height=1}const name='daftar-'+view.tab+'-'+isoToday();if(pages.length===1)IO.download(new Blob([Object.values(files)[0]],{type:'image/png'}),name+'.png');else{IO.download(IO.zip(files),name+'-png-pages.zip');toast(fa(pages.length)+' تصویر در یک فایل ZIP آماده شد.')}}finally{holder.remove()}}
