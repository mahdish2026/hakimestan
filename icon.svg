  <ellipse cx="152" cy="250" rx="7" ry="12" fill="#c98a4e" opacity="0.55"/>
  <ellipse cx="360" cy="248" rx="18" ry="26" fill="#e0a86a"/>
  <ellipse cx="360" cy="250" rx="7" ry="12" fill="#c98a4e" opacity="0.55"/>

