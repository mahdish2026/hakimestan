    const ov = document.createElement('div');
    ov.id = 'dkAuthOverlay';
    ov.className = 'auth-ov';
    ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-labelledby','dkAuthTitle');
    ov.innerHTML = '<div class="auth-card"><div class="auth-side"><div class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg></div><h2 id="dkAuthTitle">دفتر معلم حکیمستان</h2><p>کلاس‌ها، حضور و غیاب، نمره‌ها و کارنامه‌ها؛ همه در یک دفتر آرام و مرتب.</p>'
      + '<ul class="auth-feats"><li><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>حضور و غیاب با یک لمس</li><li><svg class="icon" aria-hidden="true"><use href="#i-score"/></svg>دفتر نمرهٔ ماتریسی و کارنامه</li><li><svg class="icon" aria-hidden="true"><use href="#i-cloud"/></svg>همگام‌سازی ابری، اختیاری</li><li><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg>کار کامل آفلاین در همین مرورگر</li></ul></div>'
      + '<div class="auth-form"><h3>ورود یا ثبت‌نام</h3><p class="sub">برای ذخیرهٔ ابری اطلاعات وارد شو؛ یا بدون حساب، آفلاین ادامه بده.</p>'
      + '<div id="dkErr" class="auth-err" role="alert"></div>'
      + '<div class="auth-tabs" role="tablist" aria-label="ورود یا ثبت‌نام"><button id="tabLogin" type="button" role="tab" aria-selected="true" aria-controls="frmLogin">ورود</button><button id="tabReg" type="button" role="tab" aria-selected="false" aria-controls="frmReg">ثبت‌نام</button></div>'
      + '<div id="frmLogin" role="tabpanel" aria-labelledby="tabLogin"><label for="lu">نام کاربری</label><input id="lu" type="text" dir="ltr" placeholder="mahdi" autocomplete="username"><label for="lp">رمز عبور</label><input id="lp" type="password" placeholder="رمز" autocomplete="current-password"><label class="check-label"><input id="lrem" type="checkbox" checked>مرا به خاطر بسپار</label><button id="btnLogin" type="button" class="btn primary">ورود به دفتر</button></div>'
      + '<div id="frmReg" role="tabpanel" aria-labelledby="tabReg" style="display:none"><label for="ru">نام کاربری * (حروف کوچک انگلیسی)</label><input id="ru" type="text" dir="ltr" placeholder="zahra" autocomplete="username"><label for="rn">نام و نام خانوادگی</label><input id="rn" type="text" placeholder="زهرا احمدی" autocomplete="name"><label for="rp">رمز عبور * (حداقل ۶ کاراکتر)</label><input id="rp" type="password" autocomplete="new-password"><label class="check-label"><input id="rrem" type="checkbox" checked>مرا به خاطر بسپار</label><button id="btnReg" type="button" class="btn primary">ساخت حساب و ورود</button></div>'
      + '<div class="auth-alt"><button id="btnOfflineMode" type="button" class="btn"><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg>ادامه به‌صورت آفلاین (ذخیره در همین مرورگر)</button></div></div></div>';
    
    document.body.appendChild(ov);
    ov.querySelector('#btnOfflineMode').onclick = () => {
      sSet(K_OFFLINE_MODE, '1', true);
      ov.remove();
      const lbl = document.getElementById('syncStatusLabel');
      if(lbl) lbl.textContent = 'آفلاین (مرورگر)';
      showToast('📴 حالت آفلاین فعال شد؛ داده‌ها در همین مرورگر ذخیره می‌شوند.');
    };
    
    const errEl = ov.querySelector('#dkErr');
    const showErr = (e) => { errEl.textContent = e && e.message ? e.message : String(e); errEl.style.display = 'block'; };
    
    if(msg) showErr(new Error(msg));
    
    const setAuthTab = (login) => {
      ov.querySelector('#tabLogin').setAttribute('aria-selected', String(login));
      ov.querySelector('#tabReg').setAttribute('aria-selected', String(!login));
      ov.querySelector('#frmLogin').style.display = login ? 'block' : 'none';
      ov.querySelector('#frmReg').style.display = login ? 'none' : 'block';
      errEl.style.display = 'none';
      ov.querySelector(login ? '#lu' : '#ru').focus();
    };
    ov.querySelector('#tabLogin').onclick = () => setAuthTab(true);
    ov.querySelector('#tabReg').onclick = () => setAuthTab(false);
    ov.querySelector('#frmLogin').addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox'){ e.preventDefault(); ov.querySelector('#btnLogin').click(); } });
    ov.querySelector('#frmReg').addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox'){ e.preventDefault(); ov.querySelector('#btnReg').click(); } });
    setTimeout(() => { const f = ov.querySelector('#lu'); if(f && ov.isConnected) f.focus({preventScroll:true}); }, 30);
    
     ov.querySelector('#btnLogin').onclick = async () => {
      const u = ov.querySelector('#lu').value.trim().toLowerCase();
      const p = ov.querySelector('#lp').value;
      const rem = ov.querySelector('#lrem').checked;
      errEl.style.display = 'none';
      if(!u || !p) return showErr(new Error('نام کاربری و رمز را وارد کن.'));
      
      const btn = ov.querySelector('#btnLogin');
      btn.disabled = true; btn.textContent = 'در حال ورود…';
      try {
        const r = await api('tLogin', {username: u, password: p});
        const prevUser = sGet(K_LAST_USER, false);
        setAuth({username: r.username, token: r.token, remember: rem}, rem);
        sSet(K_LAST_USER, r.username, false);
        
        // ★ مهم: قبل از هر کاری، داده‌های این حساب رو از سرور بگیر
        // تا کلاس‌های حساب قبلی روی این حساب آپلود نشن
        try {
          const dr = await api('tpClassGetAll', {token: r.token});
          if(dr.data) {
            safeStoreRemoteData(dr.data);
          } else if(prevUser && prevUser !== r.username) {
            sDel(K_DATA, false);
          }
        } catch(err) {
          console.warn('خطا در دریافت داده اولیه:', err);
          if(prevUser && prevUser !== r.username) sDel(K_DATA, false);
        }
        
        ov.remove();
        showToast('✅ خوش آمدی ' + (r.name || r.username) + '!');
        if(r.mustChangePassword){
          openForcePassModal(r);
        } else {
          updateUI();
          startAutoSync();
          // ★ صفحه رو رفرش کن تا داده‌های حساب جدید نمایش داده بشن
          setTimeout(() => location.reload(), 800);
        }
      } catch(e) {
        showErr(e); btn.disabled = false; btn.textContent = 'ورود به دفتر';
      }
    };
    
    ov.querySelector('#btnReg').onclick = async () => {
      const u = ov.querySelector('#ru').value.trim().toLowerCase();
      const n = ov.querySelector('#rn').value.trim();
      const p = ov.querySelector('#rp').value;
      const rem = ov.querySelector('#rrem').checked;
      errEl.style.display = 'none';
      if(!u || !p) return showErr(new Error('نام کاربری و رمز را وارد کن.'));
      
            const btn = ov.querySelector('#btnReg');
      btn.disabled = true; btn.textContent = 'در حال ثبت‌نام…';
      try {
        const r = await api('tRegister', {username: u, password: p, name: n});
        const prevUser = sGet(K_LAST_USER, false);
        setAuth({username: r.username, token: r.token, remember: rem}, rem);
        sSet(K_LAST_USER, r.username, false);
        if(prevUser && prevUser !== r.username){
          sDel(K_DATA, false);
          sDel(K_LAST, false);
        }
        
        ov.remove();
        showToast('✅ حساب ساخته شد. خوش آمدی ' + (r.name || r.username) + '!');
        updateUI();
        startAutoSync();
        // ★ رفرش کن تا دفتر کاملاً خالی باز بشه
        setTimeout(() => location.reload(), 800);
      } catch(e) {
        showErr(e); btn.disabled = false; btn.textContent = 'ساخت حساب و ورود';
      }
    };
  }
  
  /* ═══════ پنجرهٔ قفل ═══════ */
  function openForcePassModal(user){
    const old = document.getElementById('dkForcePassOverlay');
    if(old) old.remove();
    
    const ov = document.createElement('div');
    ov.id = 'dkForcePassOverlay';
    ov.className = 'auth-ov';
    ov.style.zIndex = '10000';
    ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-labelledby','dkForceTitle');
    ov.innerHTML = '<div class="auth-card force"><div class="auth-form">'
      + '<h3 id="dkForceTitle">تغییر اجباری رمز</h3>'
      + '<p class="sub">سلام <b>' + syncEsc(user.name||'معلم عزیز') + '</b>! مدیر رمز عبورت را بازنشانی کرده؛ برای ادامه همین حالا رمز تازه‌ای تعیین کن.</p>'
      + '<div class="auth-err" style="display:block">تا رمز جدید تعیین نشود، دسترسی به حساب ممکن نیست.</div>'
      + '<div id="fErr" class="auth-err" role="alert"></div>'
      + '<label for="fp1">رمز جدید (حداقل ۶ کاراکتر)</label><input id="fp1" type="password" autocomplete="new-password">'
      + '<label for="fp2">تکرار رمز جدید</label><input id="fp2" type="password" autocomplete="new-password">'
      + '<button id="fSave" type="button" class="btn primary">ذخیرهٔ رمز جدید</button>'
      + '<button id="fOut" type="button" class="btn danger" style="margin-top:10px">خروج از حساب</button>'
      + '</div></div>';
    document.body.appendChild(ov);
    
    const errEl = ov.querySelector('#fErr');
    
    ov.querySelector('#fSave').onclick = async () => {
      errEl.style.display = 'none';
      const p1 = ov.querySelector('#fp1').value, p2 = ov.querySelector('#fp2').value;
      if(!p1 || !p2) return (errEl.textContent = 'همه را پر کن.', errEl.style.display='block');
      if(p1.length < 6) return (errEl.textContent = 'حداقل ۶ کاراکتر.', errEl.style.display='block');
      if(p1 !== p2) return (errEl.textContent = 'رمزها یکسان نیستند.', errEl.style.display='block');
      
      const btn = ov.querySelector('#fSave');
      btn.disabled = true; btn.textContent = 'در حال ذخیره…';
      try {
        const a = getAuth();
        await api('tSetPasswordAfterReset', {token: a.token, newPassword: p1});
        showToast('✅ رمز جدید ذخیره شد.');
        setTimeout(() => location.reload(), 800);
      } catch(e) {
        errEl.textContent = e.message; errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'ذخیرهٔ رمز جدید';
      }
    };
    
    ov.querySelector('#fOut').onclick = async () => {
      if(!confirm('از حساب خارج می‌شی؟')) return;
      try { const a = getAuth(); await api('tLogout', {token: a.token}); } catch(e){}
      delAuth();
      ov.remove();
      location.reload();
    };
  }
  
  /* ═══════ UI ═══════ */
  function updateUI(){
    const a = getAuth();
    const dot = document.getElementById('syncDot');
    const label = document.getElementById('syncStatusLabel');
    const btn = document.getElementById('syncBtn');
    
    if(a && a.token){
      if(dot){ dot.className = 'sync-dot green'; }
      if(label){ label.textContent = 'وارد شده'; }
      if(btn){ btn.classList.remove('soft'); btn.classList.add('primary'); }
    } else {
      if(dot){ dot.className = 'sync-dot gray'; }
      if(label){ label.textContent = 'غیرفعال'; }
      if(btn){ btn.classList.remove('primary'); btn.classList.add('soft'); }
    }
  }
  
  /* ═══════ همگام‌سازی ═══════ */
  let syncTimer = null;
  
  async function doSync(){
    const a = getAuth();
    if(!a || !a.token) return;
    const raw = localStorage.getItem(K_DATA);
    if(!raw) return;
    
    try {
      const data = JSON.parse(raw);
      await api('tpClassSaveAll', {token: a.token, data});
      localStorage.setItem(K_LAST, new Date().toISOString());
      const dot = document.getElementById('syncDot');
      if(dot) dot.className = 'sync-dot green';
      console.log('✅ sync شد');
    } catch(e){
      console.warn('sync خطا:', e.message);
      const dot = document.getElementById('syncDot');
      if(dot) dot.className = 'sync-dot red';
    }
  }
  
   function startAutoSync(){
    const a = getAuth();
    if(!a || !a.token) return;
    
    // ★ sync اولیه فقط اگه واقعاً داده‌ای هست
    const initialData = localStorage.getItem(K_DATA);
    if(initialData){
      setTimeout(doSync, 2000);
    }
    
    // watch تغییرات بعدی
    let lastData = localStorage.getItem(K_DATA);
    setInterval(() => {
      const curr = localStorage.getItem(K_DATA);
      if(curr && curr !== lastData){
        lastData = curr;
        clearTimeout(syncTimer);
        syncTimer = setTimeout(doSync, 5000);
      }
    }, 3000);
  }
  
  /* ═══════ پنجرهٔ sync ═══════ */
  function openSyncModal(){
    const dlg = document.getElementById('modal');
    if(!dlg) return;
    
    const a = getAuth();
    const last = sGet(K_LAST, false);
    const lastText = last ? 'آخرین همگام‌سازی: ' + new Date(last).toLocaleString('fa-IR') : 'هنوز همگام نشده';
    
    document.getElementById('modalTitle').textContent = 'همگام‌سازی با Google Sheets';
    document.getElementById('modalBody').innerHTML = 
      '<p class="modal-copy">اطلاعات دفتر در شیت ذخیره می‌شود.</p>'
      + '<div style="background:#eff6ff;border-radius:12px;padding:12px;margin-bottom:16px;font-size:13px"><b>👤 کاربر:</b> ' + syncEsc(a?a.username:'-') + '</div>'
      + '<div id="syncAlert" class="modal-error" style="display:none"></div>'
      + '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">'
      +   '<button type="button" class="btn primary" id="syncUp">☁️ آپلود به شیت</button>'
      +   '<button type="button" class="btn soft" id="syncDown">⬇️ دریافت از شیت</button>'
      + '</div>'
      + '<p style="font-size:12px;color:#64748b">' + syncEsc(lastText) + '</p>'
      + '<div class="modal-actions" style="display:flex;justify-content:space-between;gap:8px;margin-top:20px">'
      +   '<button type="button" class="btn danger" id="syncOut">🚪 خروج از حساب</button>'
      +   '<button type="button" class="btn" id="syncChPass">🔑 تغییر رمز</button>'
      + '</div>';
    
    if(!dlg.open) dlg.showModal();
    
    const alertEl = document.getElementById('syncAlert');
    
    document.getElementById('syncUp').onclick = async () => {
      alertEl.style.display = 'none';
      try {
        const raw = sGet(K_DATA, false);
        if(!raw) throw new Error('داده‌ای نیست');
        await api('tpClassSaveAll', {token: a.token, data: JSON.parse(raw)});
        sSet(K_LAST, new Date().toISOString(), false);
        showToast('✅ روی شیت ذخیره شد');
        dlg.close();
      } catch(e){ alertEl.textContent = e.message; alertEl.style.display = 'block'; }
    };
    
    document.getElementById('syncDown').onclick = async () => {
      if(!confirm('داده‌های محلی جایگزین می‌شوند. ادامه؟')) return;
      alertEl.style.display = 'none';
      try {
        const r = await api('tpClassGetAll', {token: a.token});
        if(!r.data) throw new Error('شیت خالیه');
        safeStoreRemoteData(r.data);
        showToast('✅ دریافت شد. رفرش می‌شه.');
        setTimeout(() => location.reload(), 800);
      } catch(e){ alertEl.textContent = e.message; alertEl.style.display = 'block'; }
    };
    
    document.getElementById('syncOut').onclick = async () => {
      const wipe = confirm('آیا داده‌های محلی این حساب نیز از مرورگر پاک شوند؟ (Cancel = خروج با حفظ داده‌های محلی)');
      try { await api('tLogout', {token: a.token}); } catch(e){}
      delAuth(wipe);
      dlg.close();
      if(wipe) setTimeout(() => location.reload(), 300);
      else openAuthModal('از حساب ابری خارج شدی؛ داده‌های محلی حفظ شده‌اند.');
    };
    
    document.getElementById('syncChPass').onclick = () => {
      document.getElementById('modalTitle').textContent = 'تغییر رمز';
      document.getElementById('modalBody').innerHTML = 
        '<div id="chErr" class="modal-error" style="display:none"></div>'
        + '<div class="field"><label>رمز فعلی</label><input id="chOld" type="password"></div>'
        + '<div class="field"><label>رمز جدید</label><input id="chNew" type="password"></div>'
        + '<div class="field"><label>تکرار رمز جدید</label><input id="chNew2" type="password"></div>'
        + '<div class="modal-actions"><button class="btn" id="chCancel">انصراف</button><button class="btn primary" id="chSave">ذخیره</button></div>';
      
      document.getElementById('chCancel').onclick = () => openSyncModal();
      document.getElementById('chSave').onclick = async () => {
        const o = document.getElementById('chOld').value;
        const n = document.getElementById('chNew').value;
        const n2 = document.getElementById('chNew2').value;
        const err = document.getElementById('chErr');
        err.style.display = 'none';
        if(!o||!n||!n2) return (err.textContent='پر کن', err.style.display='block');
        if(n.length<6) return (err.textContent='حداقل ۶', err.style.display='block');
        if(n!==n2) return (err.textContent='یکسان نیستند', err.style.display='block');
        try {
          await api('tChangePassword', {token: a.token, oldPassword: o, newPassword: n});
          showToast('✅ رمز تغییر کرد');
          dlg.close();
        } catch(e){ err.textContent = e.message; err.style.display = 'block'; }
      };
    };
  }
  
  /* ═══════ راه‌اندازی ═══════ */
  function init(){
    // استایل
    
    // دکمه (از نسخهٔ ازپیش‌موجود در HTML استفاده می‌شود تا چیدمان هنگام بارگذاری نپرد)
    var btn = document.getElementById('syncBtn');
    if(!btn){
      const backupBtn = document.querySelector('[data-action="backup"]');
      if(backupBtn){
        btn = document.createElement('button');
        btn.id = 'syncBtn';
        btn.type = 'button';
        btn.className = 'btn soft';
        btn.innerHTML = '<span>☁️ همگام‌سازی</span>';
        backupBtn.parentNode.insertBefore(btn, backupBtn);
      }
    }
    if(btn){
      btn.onclick = () => {
        const a = getAuth();
        if(!a || !a.token) openAuthModal();
        else openSyncModal();
      };
      if(!document.getElementById('syncStatus')){
        const status = document.createElement('div');
        status.id = 'syncStatus';
        status.className = 'sync-status';
        status.innerHTML = '<span id="syncDot" class="sync-dot gray"></span><span id="syncStatusLabel">غیرفعال</span>';
        btn.parentNode.insertBefore(status, btn.nextSibling);
      }
    }
    
    // بررسی ورود (بدون پاک‌کردن دادهٔ محلی در صورت قطع اینترنت)
    const a = getAuth();
    const hasLocalClasses = !!(sGet(K_DATA, false));
    if(a && a.token){
      if(navigator.onLine === false){
        const lbl = document.getElementById('syncStatusLabel');
        if(lbl) lbl.textContent = 'آفلاین (محلی)';
        return;
      }
      api('tWhoAmI', {token: a.token}).then(r => {
        if(r.mustChangePassword){ openForcePassModal(r); return; }
        updateUI();
        startAutoSync();
      }).catch(e => {
        if(e && e.isNetwork){
          const lbl = document.getElementById('syncStatusLabel');
          if(lbl) lbl.textContent = 'آفلاین (محلی)';
          return;
        }
        delAuth(false);
        updateUI();
        openAuthModal('نشست ابری منقضی شده؛ داده‌های محلی حفظ شده‌اند. دوباره وارد شو یا آفلاین ادامه بده.');
      });
    } else if(navigator.onLine === false || sGet(K_OFFLINE_MODE, true) === '1' || hasLocalClasses) {
      const lbl = document.getElementById('syncStatusLabel');
      if(lbl) lbl.textContent = 'آفلاین (محلی)';
    } else {
      openAuthModal();
    }
  }
  
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  
})();
</script>

<!-- 📊 ردیاب بازدید حکیمستان -->
<script>
(function(){
  try {
    var API = 'https://script.google.com/macros/s/AKfycbztmPYCnyvlIpAlwC68yp6mLbUHbGKy6TA0875h_RK3CIN9h1lG5Uk_vrG28P1LbYgE/exec';

    if (localStorage.getItem('hk_no_stats') === '1') return; // انصراف از آمار بازدید (صفحهٔ حریم خصوصی)
    var userId = localStorage.getItem('hk_uid');
    var isNew = false;
    if (!userId) {
      userId = 'hk_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('hk_uid', userId);
      isNew = true;
    }

    var ua = navigator.userAgent;
    var device = 'دسکتاپ';
    if (/mobile|android|iphone|ipod/i.test(ua)) device = 'موبایل';
    else if (/ipad|tablet/i.test(ua)) device = 'تبلت';

    var browser = 'سایر';
    if (ua.indexOf('Firefox') > -1) browser = 'Firefox';
    else if (ua.indexOf('Edg') > -1) browser = 'Edge';
    else if (ua.indexOf('Chrome') > -1) browser = 'Chrome';
    else if (ua.indexOf('Safari') > -1) browser = 'Safari';

    var os = 'سایر';
    if (/android/i.test(ua)) os = 'Android';
    else if (/iphone|ipad|ipod/i.test(ua)) os = 'iOS';
    else if (/windows/i.test(ua)) os = 'Windows';
    else if (/mac/i.test(ua)) os = 'Mac';
    else if (/linux/i.test(ua)) os = 'Linux';

    var ref = 'مستقیم';
    if (document.referrer) {
      if (document.referrer.indexOf('hakimistan.ir') > -1) ref = 'داخلی';
      else if (document.referrer.indexOf('google') > -1) ref = 'گوگل';
      else if (document.referrer.indexOf('eitaa') > -1) ref = 'ایتا';
      else if (document.referrer.indexOf('shad') > -1) ref = 'شاد';
      else ref = 'سایر';
    }

    if (navigator.onLine === false) return;
    fetch(API, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'logVisit',
        userId: userId,
        page: (function(){
          var p = location.pathname.replace(/^\//, '').split('/').filter(Boolean);
          if (p.length === 0) return 'index.html';
          if (p.length === 1) return p[0];
          return p.slice(-2).join('/');
        })(),
        device: device,
        browser: browser,
        os: os,
        lang: navigator.language || 'fa',
        ref: ref,
        isNew: isNew
      })
    }).catch(function(){});

  } catch(e){}
})();
</script>
