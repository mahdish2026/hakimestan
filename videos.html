<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فیلم‌های حکیمستان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   TOKENS — modern (default)
═══════════════════════════════════════════ */
:root {
  --bg:#faf8f5; --bg-2:#ffffff;
  --gold:#ff7d3b; --gold-light:#e35d18; --gold-deep:#c24d12;
  --violet:#3ba7ff; --violet-deep:#1f8ce0;
  --teal:#0d9488;
  --ink:#2b2320; --muted:#8a7a6f;
  --glass:rgba(255,255,255,.8); --glass-brd:#f0e3da;
  --shadow:0 18px 40px -20px rgba(120,70,30,.22);
  --radius:24px;
  --ok:#2ecc71; --bad:#e74c3c;
  /* card */
  --card-bg:#ffffff;
  --card-brd:#f0e3da;
  --card-shadow:0 10px 30px -14px rgba(120,70,30,.16);
  --card-hover-shadow:0 24px 50px -18px rgba(120,70,30,.28);
  /* nav */
  --nav-bg:rgba(255,255,255,.9);
  --nav-link:#4b3f38;
  --nav-hover-bg:#fff1ea;
  --nav-hover-clr:#e35d18;
  /* modal */
  --modal-bg:#ffffff;
  --modal-brd:#f0e3da;
  /* soon */
  --soon-bg:rgba(240,227,218,.92);
  --soon-clr:#8a7a6f;
  /* section title bg */
  --sec-bg:rgba(250,248,245,.92);
  /* footer */
  --footer-clr:#6b5d54;
  /* theme panel */
  --panel-bg:#ffffff;
}

/* ═══════════════════════════════════════════
   DARK / COLOUR THEMES
═══════════════════════════════════════════ */
[data-theme="night"] {
  --bg:#0d0a1f; --bg-2:#130f2e;
  --gold:#f5c76a; --gold-light:#daa94f; --gold-deep:#b88a38;
  --violet:#8b5cf6; --violet-deep:#7c3aed;
  --ink:#f1ecff; --muted:#9d8fc0;
  --glass:rgba(13,10,31,.85); --glass-brd:rgba(139,92,246,.25);
  --shadow:0 18px 40px -20px rgba(0,0,0,.55);
  --card-bg:#1a1530; --card-brd:rgba(139,92,246,.2);
  --card-shadow:0 10px 30px -14px rgba(0,0,0,.4);
  --card-hover-shadow:0 24px 50px -18px rgba(139,92,246,.3);
  --nav-bg:rgba(19,15,46,.9); --nav-link:#d0c4f7;
  --nav-hover-bg:rgba(139,92,246,.15); --nav-hover-clr:#c4b5fd;
  --modal-bg:#1a1530; --modal-brd:rgba(139,92,246,.25);
  --soon-bg:rgba(26,21,48,.95); --soon-clr:#9d8fc0;
  --sec-bg:rgba(13,10,31,.95);
  --footer-clr:#9d8fc0;
  --panel-bg:#1a1530;
}
[data-theme="ocean"] {
  --bg:#04121f; --bg-2:#061c30;
  --gold:#7dd3fc; --gold-light:#38bdf8; --gold-deep:#0284c7;
  --violet:#38bdf8; --violet-deep:#0ea5e9;
  --ink:#eaf6ff; --muted:#7ab0cc;
  --glass:rgba(4,18,31,.85); --glass-brd:rgba(56,189,248,.2);
  --shadow:0 18px 40px -20px rgba(0,0,0,.6);
  --card-bg:#061c30; --card-brd:rgba(56,189,248,.15);
  --card-shadow:0 10px 30px -14px rgba(0,0,0,.45);
  --card-hover-shadow:0 24px 50px -18px rgba(56,189,248,.25);
  --nav-bg:rgba(4,18,31,.92); --nav-link:#bae6fd;
  --nav-hover-bg:rgba(56,189,248,.12); --nav-hover-clr:#38bdf8;
  --modal-bg:#061c30; --modal-brd:rgba(56,189,248,.18);
  --soon-bg:rgba(6,28,48,.95); --soon-clr:#7ab0cc;
  --sec-bg:rgba(4,18,31,.95);
  --footer-clr:#7ab0cc;
  --panel-bg:#061c30;
}
[data-theme="forest"] {
  --bg:#04150f; --bg-2:#071e14;
  --gold:#fbbf24; --gold-light:#f59e0b; --gold-deep:#d97706;
  --violet:#34d399; --violet-deep:#10b981;
  --ink:#ecfdf5; --muted:#6bb48a;
  --glass:rgba(4,21,15,.85); --glass-brd:rgba(52,211,153,.2);
  --shadow:0 18px 40px -20px rgba(0,0,0,.6);
  --card-bg:#071e14; --card-brd:rgba(52,211,153,.15);
  --card-shadow:0 10px 30px -14px rgba(0,0,0,.45);
  --card-hover-shadow:0 24px 50px -18px rgba(52,211,153,.25);
  --nav-bg:rgba(4,21,15,.92); --nav-link:#a7f3d0;
  --nav-hover-bg:rgba(52,211,153,.12); --nav-hover-clr:#34d399;
  --modal-bg:#071e14; --modal-brd:rgba(52,211,153,.18);
  --soon-bg:rgba(7,30,20,.95); --soon-clr:#6bb48a;
  --sec-bg:rgba(4,21,15,.95);
  --footer-clr:#6bb48a;
  --panel-bg:#071e14;
}
[data-theme="sunny"] {
  --bg:#fff8ec; --bg-2:#fff3d8;
  --gold:#b45309; --gold-light:#92400e; --gold-deep:#78350f;
  --violet:#7c3aed; --violet-deep:#6d28d9;
  --ink:#4a3418; --muted:#92806a;
  --glass:rgba(255,248,236,.88); --glass-brd:#fde68a;
  --shadow:0 18px 40px -20px rgba(120,70,0,.18);
  --card-bg:#ffffff; --card-brd:#fde68a;
  --card-shadow:0 10px 30px -14px rgba(120,70,0,.12);
  --card-hover-shadow:0 24px 50px -18px rgba(120,70,0,.22);
  --nav-bg:rgba(255,248,236,.92); --nav-link:#78350f;
  --nav-hover-bg:#fef3c7; --nav-hover-clr:#b45309;
  --modal-bg:#fffbf0; --modal-brd:#fde68a;
  --soon-bg:rgba(254,243,199,.95); --soon-clr:#92806a;
  --sec-bg:rgba(255,248,236,.95);
  --footer-clr:#92806a;
  --panel-bg:#fffbf0;
}
[data-theme="sky"] {
  --bg:#f0f9ff; --bg-2:#e0f2fe;
  --gold:#0369a1; --gold-light:#0284c7; --gold-deep:#0369a1;
  --violet:#4f46e5; --violet-deep:#4338ca;
  --ink:#16324f; --muted:#5a8ab0;
  --glass:rgba(240,249,255,.88); --glass-brd:#bae6fd;
  --shadow:0 18px 40px -20px rgba(3,105,161,.18);
  --card-bg:#ffffff; --card-brd:#bae6fd;
  --card-shadow:0 10px 30px -14px rgba(3,105,161,.12);
  --card-hover-shadow:0 24px 50px -18px rgba(3,105,161,.22);
  --nav-bg:rgba(240,249,255,.92); --nav-link:#16324f;
  --nav-hover-bg:#e0f2fe; --nav-hover-clr:#0369a1;
  --modal-bg:#f8fbff; --modal-brd:#bae6fd;
  --soon-bg:rgba(224,242,254,.95); --soon-clr:#5a8ab0;
  --sec-bg:rgba(240,249,255,.95);
  --footer-clr:#5a8ab0;
  --panel-bg:#f8fbff;
}
[data-theme="candy"] {
  --bg:#fff5f7; --bg-2:#ffe8ef;
  --gold:#db2777; --gold-light:#be185d; --gold-deep:#9d174d;
  --violet:#8b5cf6; --violet-deep:#7c3aed;
  --ink:#4a2b5c; --muted:#a06090;
  --glass:rgba(255,245,247,.88); --glass-brd:#fbcfe8;
  --shadow:0 18px 40px -20px rgba(219,39,119,.18);
  --card-bg:#ffffff; --card-brd:#fbcfe8;
  --card-shadow:0 10px 30px -14px rgba(219,39,119,.12);
  --card-hover-shadow:0 24px 50px -18px rgba(219,39,119,.22);
  --nav-bg:rgba(255,245,247,.92); --nav-link:#4a2b5c;
  --nav-hover-bg:#fce7f3; --nav-hover-clr:#db2777;
  --modal-bg:#fff8fa; --modal-brd:#fbcfe8;
  --soon-bg:rgba(252,231,243,.95); --soon-clr:#a06090;
  --sec-bg:rgba(255,245,247,.95);
  --footer-clr:#a06090;
  --panel-bg:#fff8fa;
}
[data-theme="shad"] {
  --bg:#fff4e6; --bg-2:#ffead0;
  --gold:#ea580c; --gold-light:#c2410c; --gold-deep:#9a3412;
  --violet:#3d8bff; --violet-deep:#2563eb;
  --ink:#4a3220; --muted:#8a6a50;
  --glass:rgba(255,244,230,.88); --glass-brd:#fed7aa;
  --shadow:0 18px 40px -20px rgba(234,88,12,.18);
  --card-bg:#ffffff; --card-brd:#fed7aa;
  --card-shadow:0 10px 30px -14px rgba(234,88,12,.12);
  --card-hover-shadow:0 24px 50px -18px rgba(234,88,12,.22);
  --nav-bg:rgba(255,244,230,.92); --nav-link:#4a3220;
  --nav-hover-bg:#ffedd5; --nav-hover-clr:#ea580c;
  --modal-bg:#fff9f2; --modal-brd:#fed7aa;
  --soon-bg:rgba(255,237,213,.95); --soon-clr:#8a6a50;
  --sec-bg:rgba(255,244,230,.95);
  --footer-clr:#8a6a50;
  --panel-bg:#fff9f2;
}

/* ═══════════════════════════════════════════
   RESET
═══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 110px;
}

body {
  font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.7;
  color: var(--ink);
  min-height: 100vh;
  background:
    radial-gradient(900px 520px at 85% -5%, rgba(255,125,59,.10), transparent 60%),
    radial-gradient(820px 520px at 8% 12%, rgba(59,167,255,.10), transparent 60%),
    radial-gradient(760px 480px at 50% 112%, rgba(255,125,59,.08), transparent 62%),
    linear-gradient(180deg,#faf8f5 0%,#f5f0e8 55%,#faf8f5 100%);
  background-attachment: fixed;
  transition: color .3s, background .3s;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

[data-theme="night"] body,
body[data-theme="night"] {
  background:
    radial-gradient(800px 500px at 80% 0%, rgba(139,92,246,.12), transparent 60%),
    radial-gradient(700px 500px at 10% 20%, rgba(245,199,106,.06), transparent 60%),
    #0d0a1f;
  background-attachment: fixed;
}
[data-theme="ocean"] body,
body[data-theme="ocean"] {
  background:
    radial-gradient(800px 500px at 80% 0%, rgba(56,189,248,.10), transparent 60%),
    radial-gradient(700px 500px at 10% 20%, rgba(125,211,252,.06), transparent 60%),
    #04121f;
  background-attachment: fixed;
}
[data-theme="forest"] body,
body[data-theme="forest"] {
  background:
    radial-gradient(800px 500px at 80% 0%, rgba(52,211,153,.10), transparent 60%),
    radial-gradient(700px 500px at 10% 20%, rgba(251,191,36,.06), transparent 60%),
    #04150f;
  background-attachment: fixed;
}

/* ═══ Light themes background ═══ */
body[data-theme="sunny"] {
  background:
    radial-gradient(900px 520px at 85% -5%, rgba(251,146,60,.15), transparent 60%),
    radial-gradient(820px 520px at 8% 12%, rgba(167,139,250,.10), transparent 60%),
    linear-gradient(180deg,#fff8ec 0%,#fdeecd 55%,#fff8ec 100%);
  background-attachment: fixed;
}
body[data-theme="sky"] {
  background:
    radial-gradient(900px 520px at 85% -5%, rgba(56,189,248,.18), transparent 60%),
    radial-gradient(820px 520px at 8% 12%, rgba(99,102,241,.12), transparent 60%),
    linear-gradient(180deg,#f0f9ff 0%,#e0f2fe 55%,#f0f9ff 100%);
  background-attachment: fixed;
}
body[data-theme="candy"] {
  background:
    radial-gradient(900px 520px at 85% -5%, rgba(236,72,153,.15), transparent 60%),
    radial-gradient(820px 520px at 8% 12%, rgba(139,92,246,.12), transparent 60%),
    linear-gradient(180deg,#fff5f7 0%,#f5f0ff 55%,#f0fdfa 100%);
  background-attachment: fixed;
}
body[data-theme="shad"] {
  background:
    radial-gradient(900px 520px at 85% -5%, rgba(255,125,59,.20), transparent 60%),
    radial-gradient(820px 520px at 8% 12%, rgba(61,139,255,.15), transparent 60%),
    linear-gradient(180deg,#fff4e6 0%,#ffe8d1 55%,#fff4e6 100%);
  background-attachment: fixed;
}

/* ═══════════════════════════════════════════
   HEADER
═══════════════════════════════════════════ */
.header {
  text-align: center;
  padding: 3rem 1.5rem 1.5rem;
}

.emblem {
  width: 60px; height: 60px;
  margin: 0 auto 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.emblem svg { width: 60px; height: 60px; }

.brand {
  font-size: clamp(2rem, 8vw, 2.7rem);
  font-weight: 900;
  color: var(--gold);
  letter-spacing: -.5px;
  line-height: 1.15;
  margin-bottom: .45rem;
}

.slogan {
  color: var(--muted);
  font-size: clamp(.9rem, 3.4vw, 1rem);
  font-weight: 500;
}
.sep { color: #ff9a5f; margin: 0 .3em; }

.header-rule {
  width: 100%;
  max-width: 280px;
  height: 2px;
  margin: 1.2rem auto 0;
  background: linear-gradient(90deg, transparent, var(--gold), #ff9a5f, var(--gold), transparent);
  border-radius: 2px;
  opacity: .7;
}

/* ═══════════════════════════════════════════
   THEME BUTTON
═══════════════════════════════════════════ */
#themeBtnWrap {
  position: fixed;
  top: calc(14px + env(safe-area-inset-top, 0px));
  right: calc(14px + env(safe-area-inset-right, 0px));
  z-index: 300;
}

#themeBtn {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: #fff;
  border: 1.5px solid var(--glass-brd, #f0e3da);
  box-shadow: 0 8px 20px -8px rgba(120,70,30,.22);
  font-size: 1.3rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--gold-light, #e35d18);
  transition: transform .2s, box-shadow .2s;
}
#themeBtn:hover { transform: scale(1.08); box-shadow: 0 12px 28px -10px rgba(120,70,30,.3); }
#themeBtn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* ═══════════════════════════════════════════
   THEME PANEL
═══════════════════════════════════════════ */
#themePanel {
  position: fixed;
  top: calc(72px + env(safe-area-inset-top, 0px));
  right: calc(14px + env(safe-area-inset-right, 0px));
  z-index: 299;
  width: min(300px, calc(100vw - 28px));
  background: var(--panel-bg);
  border: 1.5px solid var(--glass-brd, #f0e3da);
  border-radius: 20px;
  padding: 1.1rem 1.1rem .9rem;
  box-shadow: 0 20px 50px -15px rgba(120,70,30,.28);
  display: none;
  animation: panelIn .18s ease;
}
#themePanel.open { display: block; }
@keyframes panelIn {
  from { opacity: 0; transform: scale(.94) translateY(-6px); }
  to   { opacity: 1; transform: scale(1)   translateY(0); }
}

.panel-group { margin-bottom: .8rem; }
.panel-group-label {
  font-size: .7rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: .05em;
  margin-bottom: .45rem;
  padding-right: .1rem;
}
.panel-row {
  display: flex;
  flex-wrap: wrap;
  gap: .45rem;
}

.theme-opt {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .28rem;
  cursor: pointer;
  border: 2px solid transparent;
  border-radius: 12px;
  padding: .35rem .5rem;
  background: none;
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  font-size: .68rem;
  font-weight: 600;
  color: var(--ink);
  transition: border-color .2s, background .2s;
}
.theme-opt:hover { background: rgba(0,0,0,.04); }
.theme-opt.active { border-color: var(--gold); background: rgba(255,125,59,.06); }
.theme-opt:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.swatch {
  width: 30px; height: 19px;
  border-radius: 6px;
  border: 1.5px solid rgba(0,0,0,.08);
  flex-shrink: 0;
}
.sw-modern  { background: linear-gradient(135deg,#faf8f5 50%,#ff7d3b 50%); }
.sw-night   { background: linear-gradient(135deg,#0d0a1f 50%,#f5c76a 50%); }
.sw-ocean   { background: linear-gradient(135deg,#04121f 50%,#38bdf8 50%); }
.sw-forest  { background: linear-gradient(135deg,#04150f 50%,#34d399 50%); }
.sw-sunny   { background: linear-gradient(135deg,#fff8ec 50%,#b45309 50%); }
.sw-sky     { background: linear-gradient(135deg,#f0f9ff 50%,#4f46e5 50%); }
.sw-candy   { background: linear-gradient(135deg,#fff5f7 50%,#db2777 50%); }
.sw-shad    { background: linear-gradient(135deg,#fff4e6 50%,#ea580c 50%); }

/* ═══════════════════════════════════════════
   QUICK NAV
═══════════════════════════════════════════ */
.quicknav {
  position: sticky;
  top: 8px;
  z-index: 70;
  display: flex;
  justify-content: center;
  gap: .3rem;
  margin: 0 auto 2.5rem;
  padding: 4px;
  width: fit-content;
  max-width: calc(100vw - 2rem);
  background: var(--nav-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 99px;
  box-shadow: 0 6px 18px -10px rgba(120,70,30,.15);
  overflow-x: auto;
  scrollbar-width: none;
}
.quicknav::-webkit-scrollbar { display: none; }

.quicknav a {
  display: flex;
  align-items: center;
  gap: .3rem;
  padding: 8px 16px;
  border-radius: 99px;
  text-decoration: none;
  color: var(--nav-link);
  font-size: .88rem;
  font-weight: 600;
  white-space: nowrap;
  transition: background .18s, color .18s;
}
.quicknav a:hover {
  background: var(--nav-hover-bg);
  color: var(--nav-hover-clr);
}
.quicknav a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ═══════════════════════════════════════════
   MAIN
═══════════════════════════════════════════ */
.main-content {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 1.25rem 4rem;
}

/* ═══════════════════════════════════════════
   SECTION
═══════════════════════════════════════════ */
.video-section {
  margin-bottom: 3.5rem;
}

.section-title {
  position: sticky;
  top: 60px;
  z-index: 60;
  display: flex;
  align-items: center;
  gap: .6rem;
  margin-bottom: 1.4rem;
  padding: 10px 16px;
  background: var(--sec-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 16px;
  border: 1.5px solid var(--glass-brd, #f0e3da);
  font-size: 1.05rem;
  font-weight: 900;
  color: var(--gold-light);
  line-height: 1.3;
}
.section-title .sec-icon { font-size: 1.25rem; flex-shrink: 0; }
.section-title .sec-label { flex-shrink: 0; }
.section-title .sec-count {
  font-size: .78rem;
  font-weight: 600;
  color: var(--muted);
  flex-shrink: 0;
}
.section-title .sec-line {
  flex: 1;
  height: 1.5px;
  background: linear-gradient(90deg, var(--gold), transparent);
  opacity: .4;
  border-radius: 1px;
  min-width: 20px;
}

/* ═══════════════════════════════════════════
   VIDEO GRID
═══════════════════════════════════════════ */
.video-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}
@media (min-width: 700px) {
  .video-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 1024px) {
  .video-grid { grid-template-columns: repeat(3, 1fr); }
}

/* ═══════════════════════════════════════════
   VIDEO CARD
═══════════════════════════════════════════ */
.video-card {
  background: var(--card-bg);
  border: 1.5px solid var(--card-brd);
  border-radius: 24px;
  box-shadow: var(--card-shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition:
    transform .3s cubic-bezier(.175,.885,.32,1.275),
    box-shadow .3s;
}
.video-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--card-hover-shadow);
}

/* Thumbnail */
.card-thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #e8ddd6;
  cursor: pointer;
  flex-shrink: 0;
}
.card-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: none;
  position: absolute; inset: 0;
}
.card-thumb img.loaded { display: block; }

.thumb-ph {
  position: absolute; inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  background: linear-gradient(145deg, #f0e3da, #e8d8cc);
}
[data-theme="night"]  .thumb-ph { background: linear-gradient(145deg,#1a1535,#130f28); }
[data-theme="ocean"]  .thumb-ph { background: linear-gradient(145deg,#061c30,#04121f); }
[data-theme="forest"] .thumb-ph { background: linear-gradient(145deg,#071e14,#04150f); }
[data-theme="sunny"]  .thumb-ph { background: linear-gradient(145deg,#fef3c7,#fde68a); }
[data-theme="sky"]    .thumb-ph { background: linear-gradient(145deg,#e0f2fe,#bae6fd); }
[data-theme="candy"]  .thumb-ph { background: linear-gradient(145deg,#fce7f3,#fbcfe8); }
[data-theme="shad"]   .thumb-ph { background: linear-gradient(145deg,#ffedd5,#fed7aa); }

.thumb-ph .ph-icon { font-size: 2.2rem; opacity: .45; }
.thumb-ph .ph-title {
  font-size: .75rem;
  font-weight: 600;
  color: var(--muted);
  text-align: center;
  padding: 0 .8rem;
  line-height: 1.5;
}

/* play overlay (shown when file exists) */
.play-overlay {
  position: absolute; inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.22);
  transition: background .2s;
}
.play-overlay.visible { display: flex; }
.card-thumb:hover .play-overlay.visible { background: rgba(0,0,0,.35); }

.play-circle {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg,#ff9a5c,#ff7d3b);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem;
  color: #fff;
  box-shadow: 0 6px 20px -4px rgba(255,125,59,.6);
  transition: transform .2s;
  pointer-events: none;
}
.card-thumb:hover .play-circle { transform: scale(1.1); }

/* soon overlay */
.soon-overlay {
  position: absolute; inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .45rem;
  background: var(--soon-bg);
}
.soon-overlay.visible { display: flex; }
.soon-icon { font-size: 1.7rem; opacity: .8; }
.soon-pill {
  background: var(--glass-brd, #f0e3da);
  color: var(--muted);
  font-size: .8rem;
  font-weight: 700;
  border-radius: 99px;
  padding: .28rem .9rem;
}

/* Card body */
.card-body {
  padding: 1rem 1.1rem 1.1rem;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: .45rem;
}
.card-title {
  font-size: 1rem;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.4;
}
.card-desc {
  font-size: .85rem;
  color: var(--muted);
  line-height: 1.65;
  flex: 1;
}
.card-actions {
  display: flex;
  align-items: center;
  gap: .6rem;
  margin-top: .4rem;
  flex-wrap: wrap;
}

.btn-play {
  background: linear-gradient(135deg,#ff9a5c,#ff7d3b);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 8px 18px;
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  font-size: .85rem;
  font-weight: 800;
  cursor: pointer;
  transition: opacity .2s, transform .18s;
  display: flex; align-items: center; gap: .35rem;
  flex-shrink: 0;
}
.btn-play:hover:not(:disabled) { transform: scale(1.03); opacity: .9; }
.btn-play:disabled {
  opacity: .38;
  cursor: not-allowed;
  transform: none;
}
.btn-play:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.link-goto {
  font-size: .82rem;
  font-weight: 600;
  color: var(--gold-light);
  text-decoration: none;
  transition: opacity .2s;
  white-space: nowrap;
}
.link-goto:hover { text-decoration: underline; opacity: .8; }
.link-goto:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }

/* ═══════════════════════════════════════════
   MODAL
═══════════════════════════════════════════ */
.modal-overlay {
  position: fixed; inset: 0;
  z-index: 500;
  background: rgba(0,0,0,.82);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.modal-overlay.open { display: flex; }

.modal-box {
  background: var(--modal-bg);
  border: 1.5px solid var(--modal-brd);
  border-radius: 24px;
  width: 100%;
  max-width: 820px;
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: 0 30px 80px -20px rgba(0,0,0,.6);
  animation: modalIn .22s cubic-bezier(.175,.885,.32,1.275);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(.95) translateY(12px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.25rem;
  border-bottom: 1.5px solid var(--modal-brd);
  gap: .75rem;
}
.modal-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.4;
}
.modal-close {
  background: #f5ede8;
  border: 1px solid var(--modal-brd);
  color: var(--ink);
  width: 36px; height: 36px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: background .18s, color .18s;
  flex-shrink: 0;
}
.modal-close:hover { background: var(--bad); color: #fff; border-color: var(--bad); }
.modal-close:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

[data-theme="night"] .modal-close,
[data-theme="ocean"] .modal-close,
[data-theme="forest"] .modal-close {
  background: rgba(255,255,255,.08);
}

.modal-video-wrap { background: #000; }
.modal-video {
  width: 100%;
  display: block;
  max-height: 60vh;
}

.modal-footer {
  padding: .9rem 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: .5rem;
  border-top: 1.5px solid var(--modal-brd);
}
.modal-desc { font-size: .85rem; color: var(--muted); }
.modal-link {
  font-size: .85rem;
  font-weight: 700;
  color: var(--gold-light);
  text-decoration: none;
}
.modal-link:hover { text-decoration: underline; }

/* ═══════════════════════════════════════════
   FOOTER
═══════════════════════════════════════════ */
.footer {
  text-align: center;
  padding: 2.5rem 1.5rem;
  color: var(--footer-clr);
}
.sig-line {
  width: min(260px, 80%);
  height: 1.5px;

.sig-brand {

}
.sig-dev { font-size: .82rem; color: var(--muted); }
.sig-name { color: var(--gold-light); font-weight: 700; }

/* ── DATA ─────────────────────────────────────────────────── */

      { id:'daftar',        title:'دفتر معلم',        desc:'نظم دیجیتال برای دفتر کلاس',           link:'daftar.html',           linkLabel:'برو به ابزار' },
      { id:'tarh-dars',     title:'کارگاه طرح درس',   desc:'طراحی طرح درس با کمک هوش مصنوعی',      link:'tarh-dars.html',        linkLabel:'برو به ابزار' },
      { id:'hqf-converter', title:'مبدل سؤال',        desc:'تبدیل سؤالات بین فرمت‌های مختلف',      link:'hqf-converter.html',    linkLabel:'برو به ابزار' },
      { id:'payamresan',    title:'پیام‌رسان',         desc:'ارتباط سریع بین معلم و اولیا',          link:'payamresan.html',       linkLabel:'برو به ابزار' },
      { id:'teacher-panel', title:'پنل معلم',          desc:'داشبورد یکپارچه برای مدیریت آموزش',    link:'panels/teacher.html',   linkLabel:'برو به ابزار' }

      { id:'water-cycle',    title:'چرخهٔ آب در طبیعت',    desc:'سفر آب از دریا تا ابر تا باران',           link:null, linkLabel:'' },
      { id:'photosynthesis', title:'فتوسنتز',               desc:'چگونگی تبدیل نور خورشید به انرژی گیاه',   link:null, linkLabel:'' }
    ]
  }
];

/* ── THEME ────────────────────────────────────────────────── */
const THEME_KEY = 'hakimestan_lobby_theme';

function applyTheme(id) {
  document.body.setAttribute('data-theme', id);
  document.querySelectorAll('.theme-opt').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === id);
    btn.setAttribute('aria-pressed', btn.dataset.theme === id ? 'true' : 'false');
  });
  try { localStorage.setItem(THEME_KEY, id); } catch(e) {}
}

(function initTheme() {
  let saved = 'modern';
  try { saved = localStorage.getItem(THEME_KEY) || 'modern'; } catch(e) {}
  applyTheme(saved);
})();

const themeBtn = document.getElementById('themeBtn');
const themePanel = document.getElementById('themePanel');

themeBtn.addEventListener('click', e => {
  e.stopPropagation();
  themePanel.classList.toggle('open');
  themeBtn.setAttribute('aria-expanded', themePanel.classList.contains('open') ? 'true' : 'false');
});

document.querySelectorAll('.theme-opt').forEach(btn => {
  btn.addEventListener('click', () => {
    applyTheme(btn.dataset.theme);
    themePanel.classList.remove('open');
    themeBtn.setAttribute('aria-expanded', 'false');
  });
});

document.addEventListener('click', e => {
  if (!themePanel.contains(e.target) && e.target !== themeBtn) {
    themePanel.classList.remove('open');
    themeBtn.setAttribute('aria-expanded', 'false');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && themePanel.classList.contains('open')) {
    themePanel.classList.remove('open');
    themeBtn.setAttribute('aria-expanded', 'false');
    themeBtn.focus();
  }
});

/* ── MODAL ────────────────────────────────────────────────── */
const modal      = document.getElementById('videoModal');
const modalVideo = document.getElementById('modalVideo');
const modalTitle = document.getElementById('modalTitleEl');
const modalDesc  = document.getElementById('modalDescEl');
const modalLink  = document.getElementById('modalLinkEl');
const modalClose = document.getElementById('modalClose');

function openModal(video) {
  modalTitle.textContent = video.title;
  modalDesc.textContent  = video.desc;
  if (video.link) {
    modalLink.href        = video.link;
    modalLink.textContent = '← ' + video.linkLabel;
    modalLink.style.display = '';
  } else {
    modalLink.style.display = 'none';
  }
  modalVideo.src = 'videos/' + video.id + '.mp4';
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => { modalVideo.play().catch(() => {}); }, 80);
}

function closeModal() {
  modal.classList.remove('open');
  modalVideo.pause();
  modalVideo.src = '';
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── BUILD CARD ───────────────────────────────────────────── */
const videoStatus = {};   // id → 'ready' | 'soon'

function buildCard(video) {
  const card = document.createElement('article');
  card.className = 'video-card';

  /* — thumbnail — */
  const thumb = document.createElement('div');
  thumb.className = 'card-thumb';
  thumb.setAttribute('aria-label', 'پیش‌نمایش: ' + video.title);

  const img = document.createElement('img');
  img.alt = video.title;
  img.onload  = () => img.classList.add('loaded');
  img.onerror = () => img.classList.remove('loaded');
  img.src = 'videos/' + video.id + '.jpg';
  thumb.appendChild(img);

  const ph = document.createElement('div');
  ph.className = 'thumb-ph';
  ph.innerHTML = `<span class="ph-icon" aria-hidden="true">🎬</span><span class="ph-title">${video.title}</span>`;
  thumb.appendChild(ph);

  const playOverlay = document.createElement('div');
  playOverlay.className = 'play-overlay';
  playOverlay.innerHTML = '<div class="play-circle" aria-hidden="true">▶</div>';
  thumb.appendChild(playOverlay);

  const soonOverlay = document.createElement('div');
  soonOverlay.className = 'soon-overlay visible';  // start visible until probe resolves
  soonOverlay.innerHTML = '<span class="soon-icon" aria-hidden="true">📽️</span><span class="soon-pill">به‌زودی</span>';
  thumb.appendChild(soonOverlay);

  card.appendChild(thumb);

  /* — body — */
  const body  = document.createElement('div');
  body.className = 'card-body';

  const title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = video.title;

  const desc = document.createElement('div');
  desc.className = 'card-desc';
  desc.textContent = video.desc;

  const actions = document.createElement('div');
  actions.className = 'card-actions';

  const playBtn = document.createElement('button');
  playBtn.className = 'btn-play';
  playBtn.setAttribute('aria-label', 'پخش فیلم ' + video.title);
  playBtn.innerHTML = '▶ پخش فیلم';
  playBtn.disabled = true;   // disabled until probe resolves
  actions.appendChild(playBtn);

  if (video.link) {
    const goLink = document.createElement('a');
    goLink.className = 'link-goto';
    goLink.href = video.link;
    goLink.textContent = '← ' + video.linkLabel;
    actions.appendChild(goLink);
  }

  body.appendChild(title);
  body.appendChild(desc);
  body.appendChild(actions);
  card.appendChild(body);

  /* — probe video — */
  const probe = document.createElement('video');
  probe.preload = 'metadata';   // metadata (not 'none')
  probe.src = 'videos/' + video.id + '.mp4';
  probe.style.display = 'none';

  function markReady() {
    if (videoStatus[video.id]) return;
    videoStatus[video.id] = 'ready';
    clearTimeout(timer);
    soonOverlay.classList.remove('visible');
    playOverlay.classList.add('visible');
    playBtn.disabled = false;
    probe.remove();
  }

  function markSoon() {
    if (videoStatus[video.id]) return;
    videoStatus[video.id] = 'soon';
    clearTimeout(timer);
    soonOverlay.classList.add('visible');
    playOverlay.classList.remove('visible');
    playBtn.disabled = true;
    probe.remove();
  }

  probe.addEventListener('loadedmetadata', markReady);
  probe.addEventListener('canplay',        markReady);
  probe.addEventListener('error',          markSoon);

  const timer = setTimeout(markSoon, 5000);   // 5-second timeout

  document.body.appendChild(probe);
  probe.load();

  /* — click handlers — */
  function tryPlay() {
    if (videoStatus[video.id] === 'ready') openModal(video);
  }
  thumb.addEventListener('click', tryPlay);
  playBtn.addEventListener('click', tryPlay);

  return card;
}

/* ── RENDER SECTIONS ──────────────────────────────────────── */
function renderSections() {
  const main = document.getElementById('mainContent');
  SECTIONS.forEach(sec => {
    const section = document.createElement('section');
    section.className = 'video-section';
    section.id = sec.id;

    const titleEl = document.createElement('h2');
    titleEl.className = 'section-title';
    titleEl.innerHTML =
      `<span class="sec-icon" aria-hidden="true">${sec.icon}</span>` +
      `<span class="sec-label">${sec.title}</span>` +
      `<span class="sec-count">(${sec.videos.length} فیلم)</span>` +
      `<span class="sec-line" aria-hidden="true"></span>`;
    section.appendChild(titleEl);

    const grid = document.createElement('div');
    grid.className = 'video-grid';
    sec.videos.forEach(v => grid.appendChild(buildCard(v)));
    section.appendChild(grid);

    main.appendChild(section);
  });
}

renderSections();
</script>
