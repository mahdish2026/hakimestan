['5','علوم','اندام‌های حسی','اندام‌های حسی اطلاعات محیط را دریافت می‌کنند و محدودیت دارند.','اشیای بی‌خطر را با مشاهده و لمس اختیاری توصیف و نتایج را مقایسه کنید.','چرا فقط رنگ برای شناخت یک جسم کافی نیست؟','چون جنس، بافت و اندازه نیز اطلاعات می‌دهند.','یک وسیله را با سه ویژگی توصیف کن؛ چشیدن مواد ناشناس ممنوع است.'],
['5','علوم','انرژی و تبدیل‌های آن','انرژی در فرایندها از شکلی به شکل دیگر تبدیل می‌شود.','زنجیره انرژی چراغ‌قوه، دوچرخه و پنکه را با پیکان رسم کنید.','در چراغ‌قوه باتری‌دار چه تبدیل‌هایی رخ می‌دهد؟','انرژی شیمیایی باتری به انرژی الکتریکی و سپس نور و گرما تبدیل می‌شود.','یک وسیله خانگی را فقط مشاهده و مسیر انرژی آن را رسم کن.'],
['5','علوم','خاک و انواع آن','اندازه ذرات و مواد آلی بر نگهداری آب در خاک اثر دارند.','نمونه‌های تمیز ماسه و خاک باغچه را با مقدار برابر آب و ظرف یکسان مقایسه کنید.','چرا باید مقدار آب برای دو نمونه برابر باشد؟','تا اثر نوع خاک را جدا از اثر مقدار آب بسنجیم.','نتیجه مقایسه را در جدولی ثبت کن و پس از کار دست‌ها را بشوی.'],
['5','علوم','شرایط رشد گیاهان','آزمایش منصفانه هر بار یک عامل رشد را تغییر می‌دهد.','دو گلدان مشابه با شرایط نوری متفاوت و آب یکسان طراحی و جدول مشاهده یک‌هفته‌ای بسازید.','برای بررسی اثر نور، چه چیزهایی باید یکسان بماند؟','نوع گیاه، خاک، ظرف، مقدار آب و زمان مشاهده.','رشد دو گیاه را هفت روز ثبت کن؛ تغییرات را با عکس بدون اطلاعات شخصی نشان بده.'],
['5','فارسی','خوانش شعر ای ایران','خوانش روان با درک معنا، مکث و آهنگ متناسب همراه است.','از نسخه مجاز مدرسه، یک بند کوتاه را گروهی بخوانید و جای مکث‌ها را علامت بزنید.','آیا بلندتر خواندن همیشه به معنای بیان بهتر است؟','خیر؛ وضوح، مکث و تناسب آهنگ با معنا مهم‌تر است.','خوانش خود را با رضایت خانواده ضبط یا حضوری تمرین کن؛ انتشار عمومی لازم نیست.'],
['5','فارسی','جمله‌سازی و بسط جمله','افزودن جزئیات مرتبط، جمله را روشن‌تر می‌کند.','جمله «پرنده آمد» را با پاسخ به کجا، چه وقت و چگونه گسترش دهید.','کدام افزوده جمله را دقیق‌تر می‌کند؟','افزوده‌ای که اطلاعات مرتبط بدهد؛ مانند «صبح، پرنده کوچک روی شاخه نشست».','سه جمله کوتاه را با جزئیات مشاهده‌پذیر گسترش بده.'],
['5','فارسی','داستان‌نویسی خلاق','داستان به شخصیت، مسئله، رویداد و پایان مرتبط نیاز دارد.','برای یک کلید گمشده، نقشه داستان چهارخانه‌ای بسازید و پایان متفاوت پیشنهاد دهید.','اگر پایان به رویدادهای قبلی مربوط نباشد چه می‌شود؟','انسجام داستان کم می‌شود و خواننده مسیر حل مسئله را نمی‌فهمد.','داستانی ده‌خطی بنویس و از یک هم‌کلاسی بازخورد مشخص بگیر.'],
['5','فارسی','املا و واژه‌آموزی','شناخت معنا و الگوی واژه به درست‌نویسی کمک می‌کند.','پنج واژه از متن مجاز کتاب را در جمله به کار ببرید و اشتباه‌های املایی را دسته‌بندی کنید.','چرا دیدن واژه در جمله مفید است؟','معنای آن و ارتباطش با واژه‌های دیگر روشن می‌شود.','دفترچه سه واژه دشوار با معنی و جمله شخصی بساز.'],
['5','فارسی','سرود ملی','درک واژگان و خوانش دقیق به فهم پیام یک متن ملی کمک می‌کند.','متن درس در نسخه کتاب مدرسه را بخوانید؛ واژه‌های همبستگی را استخراج و توضیح دهید.','چگونه می‌توان درباره پیام متن با شاهد صحبت کرد؟','باید به واژه یا عبارتی از همان متن اشاره و برداشت خود را توضیح داد.','یک بند درباره همکاری در مدرسه بنویس و یک شاهد از درس بیاور.'],
['5','مطالعات','نقشه و جهت‌های اصلی','راهنما و جهت‌نما خواندن نقشه را ممکن می‌کنند.','نقشه ساده کلاس با راهنما و چهار جهت بسازید و مسیر دو نقطه را توضیح دهید.','بدون راهنما، یک علامت روی نقشه چه مشکلی دارد؟','ممکن است افراد آن را متفاوت تفسیر کنند.','نقشه خیالی یک محله امن رسم کن؛ نشانی واقعی خانه را درج نکن.'],
['5','مطالعات','زندگی شهری و روستایی','شهر و روستا در خدمات و فعالیت‌ها تفاوت و وابستگی متقابل دارند.','کارت کالاها و خدمات را در مسیر تولید تا مصرف بچینید.','چرا شهر و روستا به هم نیاز دارند؟','کالا، خدمات، نیروی کار و دانش میان آن‌ها مبادله می‌شود.','یک محصول را از تولیدکننده تا مصرف‌کننده دنبال و نقش‌ها را رسم کن.'],
['5','مطالعات','نهادهای اجتماعی','نهادها برای پاسخ به نیازهای مشترک شکل می‌گیرند.','نیازهای سلامت، آموزش و ایمنی را به نهاد مربوط وصل و محدودیت وظایف را بیان کنید.','برای مسئله آموزشی مدرسه ابتدا به کجا مراجعه می‌کنیم؟','به معلم یا مسئول مرتبط مدرسه؛ موضوع باید به نهاد مسئول ارجاع شود.','یک نقشه ارتباط میان مدرسه، خانواده و کتابخانه تهیه کن.'],
['5','هدیه','احترام به پدر و مادر','احترام در گفت‌وگو و همکاری روزمره نمود پیدا می‌کند.','دو موقعیت اختلاف نظر خانوادگی را با گفت‌وگوی محترمانه و حفظ مرزهای ایمن نقش‌آفرینی کنید.','آیا احترام یعنی نتوانیم نظر متفاوتی داشته باشیم؟','خیر؛ می‌توان اختلاف نظر را محترمانه بیان کرد و از بزرگسال امن کمک گرفت.','یک رفتار یاری‌رسان امن انتخاب و درباره اثر آن تأمل کن.'],
['5','هدیه','نماز و آداب','شناخت معنا و ترتیب آداب به مشارکت آگاهانه کمک می‌کند.','کارت مراحل و آداب نماز را مطابق کتاب مدرسه مرتب و معنای یک عبارت را توضیح دهید.','چرا یادگیری معنا در کنار ترتیب مراحل مفید است؟','عبادت را آگاهانه‌تر می‌کند و فقط به حفظ حرکت محدود نمی‌ماند.','یک پرسش درباره معنای نماز بنویس و پاسخ را از منبع آموزشی معتبر بررسی کن.'],
['5','قرآن','سوره کافرون','خوانش دقیق با توجه به نشانه‌ها و شنیدن الگوی معتبر تمرین می‌شود.','از مصحف یا کتاب معتبر مدرسه، قطعه کوتاهی را گوش دهید و نوبتی با بازخورد محترمانه بخوانید.','هنگام ندانستن تلفظ چه کار می‌کنیم؟','به متن و الگوی معتبر مراجعه می‌کنیم و از حدس‌زدن پرهیز می‌کنیم.','بخش تعیین‌شده را با متن معتبر تمرین کن؛ متن عربی از روی حافظه بازنویسی نشود.'],
['5','قرآن','سوره کوثر','تمرین کوتاه و پیوسته به روان‌خوانی دقیق کمک می‌کند.','با کتاب معتبر، محل وقف و پیوستگی واژه‌ها را بررسی و خوانش دونفره انجام دهید.','بازخورد مفید به خوانش دوستمان چگونه است؟','یک نکته مشخص و محترمانه بر اساس متن و الگوی معتبر بیان می‌کنیم.','خوانش را در دو نوبت کوتاه تمرین و بخش نیازمند کمک را علامت بزن.'],
['5','کار و فناوری','دوخت و سوزن','ترتیب کار و ایمنی بخشی از مهارت ساخت است.','با مقوای سوراخ‌شده و سوزن پلاستیکی کند، دوخت ساده را تمرین کنید.','چرا پیش از دوخت باید مسیر را مشخص کنیم؟','کار منظم‌تر می‌شود و احتمال خطا و آسیب کم می‌شود.','روی مقوا الگوی دوخت طراحی کن؛ کار با ابزار تیز فقط با نظارت بزرگسال است.'],
['5','کار و فناوری','کار با کاغذ و مقوا','اندازه‌گیری، خط‌تا و اتصال مناسب کیفیت سازه را بالا می‌برد.','با کاغذ بازیافتی یک نگهدارنده مداد بسازید و پایداری آن را آزمایش کنید.','چگونه پایه را پایدارتر کنیم؟','با افزایش سطح تکیه‌گاه و تقویت اتصال‌ها.','سازه را با یک تغییر بهبود بده و دلیل تغییر را ثبت کن.'],
['5','هنر','نقاشی با رنگ‌های اصلی','ترکیب رنگ‌ها به مشاهده و آزمایش نیاز دارد.','با رنگ‌های آموزشی قرمز، زرد و آبی، جدول ترکیب بسازید و تفاوت طیف‌ها را مشاهده کنید.','آیا مقدار رنگ‌ها بر نتیجه اثر دارد؟','بله؛ نسبت رنگ‌ها می‌تواند طیف متفاوتی بسازد.','سه ترکیب دلخواه را با نام و نسبت تقریبی رنگ‌ها ثبت کن.'],
['5','هنر','کاردستی از دورریختنی','بازاستفاده خلاقانه عمر مواد سالم را بیشتر می‌کند.','بسته‌بندی تمیز و بدون لبه تیز را به وسیله‌ای کاربردی تبدیل کنید.','آیا هر دورریختنی برای کاردستی مناسب است؟','خیر؛ تمیزی، سلامت و ایمنی ماده باید بررسی شود.','یک بسته‌بندی سالم را بازطراحی و کاربرد جدیدش را معرفی کن.'],
['5','هنر','نقاشی طبیعت','مشاهده جزئیات و ترکیب‌بندی در بیان تصویری مهم است.','یک برگ افتاده را مشاهده و با سه خط و سه لکه رنگی بازنمایی کنید.','آیا همه باید از یک برگ نقاشی یکسانی بکشند؟','نه؛ برداشت و انتخاب هنری متفاوت است، اما توضیح مشاهده مهم است.','یک منظره کوچک را بدون آسیب به گیاهان مشاهده و تصویر کن.'],
['1','ریاضی','شمارش','تناظر یک‌به‌یک پایه شمارش دقیق است.','ده مهره را با لمس هر مهره یک بار بشمارید و با کارت عدد هماهنگ کنید.','اگر یک مهره را دو بار بشماریم چه می‌شود؟','تعداد به‌اشتباه بیشتر گزارش می‌شود.','پنج وسیله بی‌خطر را بشمار و برای هرکدام یک نشانه بکش.'],
['1','فارسی','نشانه ا','دیدن و شنیدن نشانه در واژه به رمزگشایی کمک می‌کند.','در واژه‌های مجاز آموخته‌شده، شکل نشانه ا را پیدا و با خمیر شکل‌سازی کنید.','آیا شکل‌های شبیه همیشه صدای یکسان دارند؟','نه؛ باید به واژه، جای نشانه و آموزش قبلی توجه کنیم.','در صفحه تعیین‌شده کتاب، سه نمونه نشانه پیدا و نشان بده.'],
['1','علوم','حواس پنجگانه','برای مشاهده می‌توان از چند حس ایمن کمک گرفت.','اشیای آشنا را ببینید و صدای آن‌ها را بشنوید؛ از چشیدن مواد خودداری کنید.','چگونه بدون چشیدن یک شیء را توصیف کنیم؟','با رنگ، شکل، بو در فاصله امن و صدای آن.','یک شیء آشنا را با دو ویژگی مشاهده‌ای نقاشی کن.'],
['2','ریاضی','جمع دو رقمی','دسته‌های ده‌تایی و یکی ارزش مکانی را نشان می‌دهند.','۲۷ و ۱۵ را با بسته‌های ده‌تایی جمع و ده یکی را مبادله کنید.','حاصل ۲۷+۱۵ چیست؟','۴۲؛ دوازده یکی به یک ده‌تایی و دو یکی تبدیل می‌شود.','یک مسئله خرید فرضی با جمع دو عدد دو رقمی بساز.'],
['2','فارسی','جمله‌نویسی','جمله باید پیام روشن و نشانه پایان مناسب داشته باشد.','از تصویر حیاط مدرسه سه جمله مرتبط بنویسید و برای دوستتان بخوانید.','چگونه می‌فهمیم جمله روشن است؟','خواننده بدون حدس اضافی پیام اصلی را می‌فهمد.','درباره یک تصویر خانوادگی بدون ذکر اطلاعات شخصی دو جمله بنویس.'],
['2','علوم','گیاهان','گیاهان بخش‌هایی با نقش‌های متفاوت دارند.','تصویر ریشه، ساقه و برگ را مرتب و نقش هر بخش را با شاهد توضیح دهید.','ریشه چه کمکی به گیاه می‌کند؟','گیاه را نگه می‌دارد و آب و مواد محلول را جذب می‌کند.','یک گیاه را بدون کندن ریشه مشاهده و بخش‌های قابل دیدن را رسم کن.'],
['3','ریاضی','ضرب و تقسیم','ضرب دسته‌های برابر و تقسیم بازتوزیع برابر را مدل می‌کند.','دوازده مهره را در سه گروه برابر بچینید و دو عبارت ضرب و تقسیم بنویسید.','۱۲ تقسیم بر ۳ چیست؟','۴؛ در هر گروه چهار مهره قرار می‌گیرد.','یک داستان برای سه دسته چهارتایی بساز.'],
['3','فارسی','درک متن','پاسخ مستند از شواهد متن کمک می‌گیرد.','متن کوتاه مجاز کتاب را بخوانید و برای هر پاسخ زیر شاهد مربوط خط بکشید.','تفاوت حدس با پاسخ مستند چیست؟','پاسخ مستند به نشانه‌ای در متن تکیه دارد.','یک پرسش از متن با پاسخ و شاهد بنویس.'],
['3','علوم','آب و هوا','آب‌وهوا با مشاهده چند متغیر توصیف می‌شود.','جدول سه‌روزه ابر، باد و دمای گزارش‌شده را تکمیل کنید.','آیا یک روز بارانی برای توصیف آب‌وهوای کل سال کافی است؟','خیر؛ به داده‌های طولانی‌تر نیاز داریم.','سه روز مشاهده بی‌خطر هوا را با نماد ثبت کن.'],
['4','ریاضی','اعشار','ارزش مکانی دهم و صدم بخش‌های واحد را نشان می‌دهد.','عدد ۰٫۳۵ را روی جدول صدخانه نمایش و با ۰٫۵ مقایسه کنید.','کدام بزرگ‌تر است: ۰٫۳۵ یا ۰٫۵؟','۰٫۵؛ برابر پنجاه صدم است.','سه عدد اعشاری روی خط عدد مشخص کن.'],
['4','فارسی','انواع جمله','نوع جمله با قصد گوینده و نشانه‌گذاری ارتباط دارد.','یک جمله خبری را به پرسشی و عاطفی تبدیل و آهنگ خوانش را مقایسه کنید.','آیا فقط تغییر علامت برای تغییر معنی کافی است؟','همیشه نه؛ ساختار و لحن جمله نیز باید متناسب باشد.','یک گفت‌وگوی کوتاه با سه نوع جمله بنویس.'],
['4','مطالعات','استان‌های ایران','نقشه سیاسی تقسیمات اداری را نشان می‌دهد.','با نقشه به‌روز کتاب مدرسه، استان خود و همسایگانش را پیدا کنید.','چرا باید از نقشه به‌روز استفاده کرد؟','تقسیمات و اطلاعات ممکن است تغییر کنند.','یک کارت معرفی استان با دو ویژگی طبیعی و منبع اطلاعات تهیه کن.'],
['6','ریاضی','بخش‌پذیری','بعضی الگوهای رقم‌ها برای آزمون بخش‌پذیری مفیدند.','کارت اعداد را بر اساس بخش‌پذیری بر ۲، ۳ و ۵ دسته‌بندی و دلیل بنویسید.','آیا ۱۲۳ بر ۳ بخش‌پذیر است؟','بله؛ مجموع رقم‌ها ۶ و بر ۳ بخش‌پذیر است.','پنج عدد بساز و دلیل بخش‌پذیری یا نبود آن را بنویس.'],

function makeLesson(t,index,category='روزانه',template='daily',override=''){
 const[g,subject,topicTitle,concept,task,question,answer,home]=t,title=override||topicTitle;
 const national=template==='national',online=template==='online';
 const material=subject==='ریاضی'?'کاغذ شطرنجی، کارت عدد، مداد رنگی، مهره یا نوار کاغذی':subject==='علوم'||subject==='فیزیک'?'تصویر معتبر کتاب، برگه مشاهده، ابزار آموزشی بی‌خطرِ متناسب با فعالیت':subject==='فارسی'||subject==='قرآن'?'نسخه معتبر کتاب مدرسه، برگه واژه و نشانه، ابزار نوشتن':'کارت موقعیت، کاغذ، ابزار نوشتن، تصویر آموزشی مرتبط';
 const objective=`۱. مفهوم «${topicTitle}» را با یک مثال مرتبط توضیح دهد.\n۲. به پرسش «${question}» با دلیل پاسخ دهد.\n۳. فعالیت «${task}» را با معیار دقت و توضیح مسیر انجام دهد.\n۴. محصول خود را با پاسخ یا الگوی معیار مقایسه و دست‌کم یک اصلاح انجام دهد.\n۵. در گفت‌وگوی دونفره، نظر هم‌کلاسی را منصفانه بازگو کند.`;
 let sections=[sec('general','هدف کلی',concept),sec('goals','اهداف جزئی و رفتاری',`شناختی: ${concept}\nعاطفی: به تفاوت راه‌حل‌ها گوش بدهد و پرسش خود را محترمانه مطرح کند.\nمهارتی: محصول فعالیت را خوانا و با نشانه‌گذاری روشن ارائه کند.\n\n${objective}`),sec('prior','پیش‌نیازها و تشخیص آغازین',`دانش‌آموز بتواند یک تجربه یا دانسته مرتبط با «${topicTitle}» بیان کند.\nپرسش آغازین: ${question}\nپیش از آموزش، پاسخ‌ها بدون نمره ثبت شوند؛ پاسخ نمونه برای معلم: ${answer}`),sec('tools','وسایل و ملاحظات ایمنی',material+'\n'+(online?'بستر انتخابی مدرسه و نسخه متنی کم‌حجم؛ ضبط تصویر یا صدا اجباری نیست.':'در صورت نبود ابزار، از طرح روی کاغذ یا تصویر جایگزین استفاده شود.')+'\nمواد ناشناس چشیده نشوند؛ ابزار تیز، برق شهری و مواد گرم در فعالیت مستقل کودک استفاده نشوند.'),sec('method','روش و الگوی تدریس',`${METHODS[index%METHODS.length][0]}؛ ${METHODS[index%METHODS.length][1]}\nالگو: ${MODELS[index%MODELS.length]}\nپیوند روش با موضوع: پرسش «${question}» آغازگر بررسی و محصول فعالیت، شاهد رسیدن به هدف است.`)];
 if(national)sections.push(tabSec('before','فعالیت‌های قبل از تدریس',['خدا / طبیعت','خود','دیگران','فضای آموزشی و چیدمان'],[[`تأمل در نظم و مسئولیت نسبت به محیط؛ پیوند با ${topicTitle}`,'ثبت دانسته و پرسش شخصی','تعیین نوبت، شنیدن و نقش‌های گروهی','گروه‌های دو تا چهار نفره؛ مسیر رفت‌وآمد باز، ابزار در دسترس']]),tabSec('expect','انتظارات از دانش‌آموزان',['حیطه / هدف جزئی','مفهوم کلیدی','روش پیشنهادی','وسایل'],[['شناختی؛ توضیح با شاهد',concept,'کاوش پرسش‌محور','کارت پرسش و کتاب'],['مهارتی؛ ساخت و بازبینی محصول',task,'تمرین و بازخورد همتا',material],['عاطفی؛ شنیدن محترمانه','پذیرش تفاوت پاسخ‌ها','گفت‌وگوی نوبتی','کارت نقش']]));
 sections.push(tabSec('steps',online?'زمان‌بندی جلسهٔ مجازی':'مراحل اجرای جلسه',[online?'ساعت / دقیقه':'دقیقه','فعالیت معلم','فعالیت دانش‌آموز','شاهد یادگیری'],[
 ['5',`پرسش «${question}» را ${online?'در پیام کوتاه و فایل متنی':'روی تخته'} مطرح می‌کند؛ پاسخ اولیه را ارزش‌داوری نمی‌کند.`,'فردی پیش‌بینی می‌کند و دلیل کوتاهی می‌نویسد.','پاسخ آغازین و یک پرسش'],

 ['17',`دستور فعالیت را مرحله‌ای می‌دهد: ${task} با پرسش راهنما، به‌جای گفتن پاسخ، مسیر بررسی را باز می‌کند.`,`${task} ${online?'محصول را به شکل متن یا تصویر کم‌حجم و بدون مشخصات شخصی ارائه می‌کند.':'نقش‌های گروه را رعایت و نتیجه را ثبت می‌کند.'}`,'محصول مشخص، توضیح روش و دقت اجرا'],
 ['8',`دو محصول متفاوت را مقایسه و بازخورد را با معیار پیوند می‌دهد. پرسش کلیدی: ${question}`,'نتیجه را با دلیل گزارش و پس از بازخورد اصلاح می‌کند.',answer],
 ['7','با برگه خروج جمع‌بندی می‌کند؛ یک بدفهمی را ثبت و تکلیف انتخابی را توضیح می‌دهد.','پاسخ مستقل، یک نکته آموخته و یک پرسش بازمانده می‌نویسد.','پاسخ مستقل و تصمیم معلم برای جلسه بعد']
 ],'timeline'),tabSec('assessment','ارزشیابی چندلایه',['لایه','تکلیف یا پرسش','معیار و اقدام بعدی'],[['آغازین',question,'ثبت دانسته قبلی؛ بدون نمره و بدون برچسب'],['تکوینی',task,'مشاهده مسیر و توضیح؛ راهنمایی برای خطای مشخص'],['پایانی',question,answer+'؛ پاسخ همراه دلیل پذیرفته شود.'],['عملکردی',`ارائه محصول درباره ${topicTitle}`,'سه معیار: درستی، توضیح مسیر، اصلاح پس از بازخورد؛ هر معیار نیازمند تمرین / در حال پیشرفت / مستقل']]),sec('homework','تکلیف مرتبط با زندگی',home||`یک نمونه تازه برای «${topicTitle}» بساز و با دو معیار خودارزیابی کن.`),sec('differentiation','پشتیبانی و فرصت گسترش','پشتیبانی: دستور در گام‌های کوچک و یک نمونه نیمه‌کامل؛ پاسخ تصویری، نوشتاری یا شفاهی پذیرفته شود.\nگسترش: یک مثال نقض یا موقعیت تازه طراحی و محدودیت راه‌حل توضیح داده شود.\nبرای نبود ابزار، نسخه کاغذی و بدون هزینه ارائه شود.'),sec('sources','منابع و تطبیق با کتاب',`نمونهٔ تألیفی کارگاه؛ منبع رسمی یا گزارش اجرای واقعی نیست.\nکتاب ${subject} پایه ${g} در نسخه مورد استفاده مدرسه، راهنمای معلم و مواد آموزشی بررسی‌شده توسط مدرس.\nشماره صفحه و عنوان فصل عمداً قطعی فرض نشده‌اند؛ پیش از اجرا با کتاب و برنامه مدرسه تطبیق داده شوند.`),tabSec('self','خودارزیابی معلم؛ پیش‌نویس قابل تکمیل',['قوت مورد انتظار','چالش پیش‌بینی‌شده','اقدام جلسه بعد'],[[`پیوند ${topicTitle} با محصول قابل مشاهده`,'تفاوت سرعت یادگیری و نیاز به زمان توضیح فردی',`بر اساس پاسخ «${question}»، یک فعالیت کوتاه جبرانی یا گسترشی انتخاب شود.`]]),sec('reflection','بازتاب پس از تدریس؛ راهنمای ثبت',`این بخش گزارش واقعی نیست و پس از اجرا بازنویسی می‌شود.\nشاهد مورد انتظار: دانش‌آموز بتواند توضیح دهد «${answer}».\nپس از جلسه ثبت کنید: چه شواهدی به دست آمد؟ کدام بخش فعالیت ${topicTitle} نیاز به تغییر داشت؟ یک اقدام مشخص برای جلسه بعد چیست؟`));

function validateStore(x){if(!x||x.version!==1||!x.settings||!Array.isArray(x.myPlans)||x.myPlans.length>1500||!Array.isArray(x.favorites)||!Array.isArray(x.archived)||!x.stats)throw Error('قالب پشتیبان شناخته نشد.');x.myPlans=x.myPlans.map(e=>e?.data?{...e.data,id:e.id,createdAt:e.createdAt,updatedAt:e.updatedAt,type:e.type}:e);x.myPlans.forEach(validatePlan);for(const k of ['favorites','archived'])if(x[k].length>5000||x[k].some(v=>!safeId(v)))throw Error('فهرست شناسه‌های پشتیبان معتبر نیست.');if(!x.stats.usage||Array.isArray(x.stats.usage)||typeof x.stats.usage!=='object'||Object.entries(x.stats.usage).some(([k,v])=>!safeId(k)||!Number.isFinite(v)||v<0))throw Error('آمار استفاده معتبر نیست.');if(new Set(x.myPlans.map(p=>p.id)).size!==x.myPlans.length)throw Error('شناسهٔ طرح تکراری است.');const s=x.settings;for(const k of ['examUrl','hqfUrl']){if(typeof s[k]!=='string'||s[k].length>2000||/[<>\"'\x00-\x1f]/.test(s[k])||s[k].startsWith('//')||s[k].includes(':')&&!/^(https?:\/\/|file:\/)/i.test(s[k]))throw Error('پیوند ذخیره‌شده امن نیست.');}if(!['book','official','compact'].includes(s.printStyle)||!['portrait','landscape'].includes(s.orientation)||!['comfortable','compact'].includes(s.density))throw Error('تنظیمات ظاهر معتبر نیست.');for(const k of ['totalCreated','importCount','exportCount'])if(!Number.isFinite(x.stats[k])||x.stats[k]<0)throw Error('آمار پشتیبان معتبر نیست.');if(x.stats.lastBackup!==null&&(typeof x.stats.lastBackup!=='string'||!isFinite(Date.parse(x.stats.lastBackup))))throw Error('تاریخ پشتیبان معتبر نیست.');if(!THEMES.some(t=>t[0]===s.theme)&&s.theme!=='auto')throw Error('تم پشتیبان معتبر نیست.');if(!['Tahoma','Vazirmatn','Arial','serif'].includes(s.font)||!Number.isFinite(s.fontSize)||s.fontSize<12||s.fontSize>21)throw Error('تنظیمات نوشته معتبر نیست.');for(const k of ['teacherName','school','year'])if(typeof s[k]!=='string'||s[k].length>300)throw Error('تنظیمات ناقص است.');if(!Object.hasOwn(TEMPLATE_NAMES,s.defaultTemplate)||!Array.isArray(s.customSections)||s.customSections.length>100)throw Error('قالب پیش‌فرض معتبر نیست.');if(!Array.isArray(s.customTemplates)||s.customTemplates.length>100)throw Error('قالب‌های شخصی معتبر نیستند.');s.customTemplates.forEach(validatePlan);if(x.draft)validatePlan(x.draft);if(!Array.isArray(x.notes)||x.notes.length>1000||x.notes.some(n=>!n||!safeId(n.id)||typeof n.at!=='string'||!isFinite(Date.parse(n.at))||typeof n.text!=='string'||n.text.length>10000))throw Error('یادداشت‌ها معتبر نیستند.');s.uiText=s.uiText||{};if(typeof s.uiText!=='object'||Array.isArray(s.uiText)||Object.entries(s.uiText).some(([k,v])=>k.length>5000||typeof v!=='string'||v.length>10000))throw Error('متن‌های سفارشی رابط معتبر نیستند.');validateExtensions(x);return x}
let store=fresh(),token=null,broken=false,unsaved=false,conflict=false,problem='';try{token=localStorage.getItem(KEY);if(token)try{store=validateStore(JSON.parse(token))}catch(e){broken=true;problem='دادهٔ قبلی خوانده نشد؛ آن را حفظ کرده‌ایم. نسخهٔ خام را دریافت یا پشتیبان سالم بازیابی کنید.'}}catch(e){unsaved=true;problem='حافظهٔ مرورگر در دسترس نیست. پیش از بستن، فایل پشتیبان دریافت کنید.'}

function persist(){if(broken||conflict){unsaved=true;status();return false}try{const raw=JSON.stringify(serializeStore(store));localStorage.setItem(KEY,raw);token=raw;unsaved=false;problem='';status();return true}catch(e){unsaved=true;problem='فضای ذخیره‌سازی پر یا مسدود است؛ تغییرات موقت‌اند. صفحه را نبندید و پشتیبان بگیرید.';status();return false}}
function status(){const el=$('#saveState');if(!el)return;el.innerHTML='<span class="pill-dot"></span>'+E(broken?'نیاز به بازیابی':conflict?'تغییر در تب دیگر':unsaved?'ذخیرهٔ موقت':dirty?'در حال ویرایش':'ذخیره روی این دستگاه');$('#storageWarning').classList.toggle('hidden',!problem&&!conflict);$('#storageWarning').innerHTML=E(conflict?'نسخهٔ دفتر در تب دیگری تغییر کرده؛ برای جلوگیری از بازنویسی، ابتدا نسخهٔ این تب را دریافت و صفحه را تازه کنید.':problem)+btn('backup','دریافت پشتیبان','download')+(conflict?btn('reload','بارگذاری نسخهٔ جدید','arrow'):'');}
function toast(text,error=false){const d=document.createElement('div');d.className='toast'+(error?' error':'');d.setAttribute('role',error?'alert':'status');d.innerHTML='<span>'+E(text)+'</span><button aria-label="بستن پیام">×</button>';d.querySelector('button').onclick=()=>d.remove();while($('#toasts').children.length>2)$('#toasts').firstElementChild.remove();$('#toasts').append(d);setTimeout(()=>d.remove(),error?10000:5500)}
function error(e){const msg=e.message||String(e);if($('#modal').open&&$('#formError')){$('#formError').textContent=msg;$('#formError').hidden=false}else toast(msg,true)}
function writable(){if(broken||conflict){toast('ابتدا مشکل ذخیره‌سازی را برطرف کنید؛ خروجی گرفتن همچنان ممکن است.',true);return false}return true}
function commit(fn,msg='',redraw=true){if(!writable())return false;const before=clone(store);try{fn();validateStore(store);persist();if(redraw)render();if(msg)toast(msg+(unsaved?' (موقت)':''));return true}catch(e){store=before;error(e);return false}}
function weekly(){if(!store.myPlans.length||broken||conflict)return;try{const old=JSON.parse(localStorage.getItem(WEEK)||'null');if(!old||Date.now()-Date.parse(old.at)>7*86400000)localStorage.setItem(WEEK,JSON.stringify({at:now(),data:serializeStore(store)}))}catch(e){/* پشتیبان محلی جای فایل بیرونی را نمی‌گیرد؛ کمبود فضا به داده اصلی آسیب نمی‌زند. */}}
function savePlan(silent=false){if(!active||!writable())return false;try{validatePlan(active);const pos=store.myPlans.findIndex(p=>p.id===active.id),previous=pos<0?null:clone(store.myPlans[pos]),changed=!previous||planDigest(previous)!==planDigest(active);if(changed&&previous)recordRevision(previous,'پیش از ویرایش');active.updatedAt=now();if(pos<0){if(store.myPlans.length>=1500)throw Error('دفتر به سقف ۱۵۰۰ طرح رسیده؛ ابتدا پشتیبان بگیرید.');store.myPlans.push(clone(active));store.stats.totalCreated++}else store.myPlans[pos]=clone(active);if(changed)recordHabit(pos<0?'created':'edited');store.draft=clone(active);const ok=persist();if(ok&&changed)recordRevision(active,pos<0?'ساخت طرح':'ذخیره تغییرات');dirty=!ok;weekly();status();if(!silent)toast(ok?'طرح در دفتر شخصی ذخیره شد.':'طرح موقت است؛ فایل پشتیبان دریافت کنید.',!ok);return ok}catch(e){error(e);return false}}
function change(fn,group=''){if(!active||!writable())return;const tm=Date.now();if(!group||group!==lastGroup||tm-lastTime>700){past.push(clone(active));if(past.length>20)past.shift()}future=[];lastGroup=group;lastTime=tm;fn(active);dirty=true;status();clearTimeout(previewTimer);previewTimer=setTimeout(updatePreview,180)}
function undo(redo=false){if(!active)return;const from=redo?future:past,to=redo?past:future;if(!from.length)return;to.push(clone(active));active=from.pop();dirty=true;lastGroup='';render();}
function begin(p,copy=true){if(active&&dirty&&!savePlan(true))return;active=personalizePlan(p);if(copy){active.id=id();active.createdAt=now();active.updatedAt=now();active.origin=p.id.startsWith('bank-')?'برگرفته از نمونهٔ تألیفی کارگاه':p.origin;for(const m of active.meta){if(m.id==='teacher'&&store.settings.teacherName)m.value=store.settings.teacherName;if(m.id==='school'&&store.settings.school)m.value=store.settings.school;if(m.id==='year')m.value=store.settings.year}store.stats.usage??={};store.stats.usage[p.id]=(store.stats.usage[p.id]||0)+1}dirty=true;past=[];future=[];ui.tab='editor';ui.mobile='edit';store.draft=clone(active);persist();render();window.scrollTo(0,0)}
function newPlan(template='daily',preset=null){if(preset)return begin(preset,true);const p=makeLesson(TOPICS[0],0,template==='national'?'ملی':template==='online'?'مجازی':template==='annual'?'سالانه':'روزانه',template);p.title='طرح تازهٔ من';p.grade=store.settings.defaultGrade;p.subject='';p.tags=[];p.meta=p.meta.map(m=>({...m,value:m.id==='teacher'?store.settings.teacherName:m.id==='school'?store.settings.school:m.id==='year'?store.settings.year:m.id==='grade'?p.grade:m.id==='duration'?'۴۵ دقیقه':''}));p.sections.forEach(s=>{if(s.kind==='text')s.text='';else s.rows=s.kind==='timeline'?[['5','','',''],['8','','',''],['17','','',''],['8','','',''],['7','','','']]:[s.headers.map(()=>'')]});if(template==='annual'){p.sections.unshift(tabSec('calendar','تقویم سالانه',['ماه','فصل','هفته','درس / محتوا','اهداف ویژه','فعالیت تکمیلی'],Array.from({length:36},(_,j)=>[MONTHS[Math.floor(j/4)],'',String(j+1),'','',''])))}begin(p,true)}

function homeView(){const tip=TIPS[Math.floor(Date.now()/86400000)%TIPS.length],recent=store.myPlans.slice().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));return `<div class="hero"><div><div class="eyebrow" data-copy="welcome">به کارگاه کوچکِ ایده‌های بزرگ خوش آمدی</div><h1 data-copy="hero">هر کلاس، یک قصه.<br><em>هر طرح، یک آغاز تازه.</em></h1><p data-copy="hero-help">ایده‌ای بردار، آن را به زبان کلاس خودت بنویس و یک تجربهٔ یادگیری بساز. اینجا هیچ قالبی دست‌وپایت را نمی‌بندد.</p><div class="row">${btn('new','یک طرح تازه بسازیم','plus','','primary')}${btn('go','گشت‌وگذار در بانک','arrow','data-tab="bank"','soft')}</div></div>${HERO_ART}</div><div class="stat-row">${stat(fa(BANK.length),'نمونهٔ تألیفی و پرشده','book')}${stat('۱۲','رنگ برای حال‌وهوای تو','settings')}${stat(fa(store.myPlans.length),'طرح در دفتر شخصی','file')}${stat('۱ تا ۱۲','پوشش پایه‌های تحصیلی','class')}</div><div class="split"><section><div class="section-title"><div><h2>از یک چارچوب خوب شروع کن</h2><p>سه ساختار آشنا؛ همهٔ عنوان‌ها، جدول‌ها و بخش‌ها قابل تغییرند.</p></div></div>${templates()}<div class="section-title"><div><h2>${recent.length?'آخرین ردّ قلمت':'برای اولین قدم'}</h2><p>${recent.length?'طرح‌های خودت؛ همیشه قابل بازنویسی':'نمونه‌های پیشنهادی برای معلم پایه پنجم'}</p></div>${btn('go','دیدن همه','arrow',`data-tab="${recent.length?'mine':'bank'}"`)}</div><div class="cards home-cards">${(recent.length?recent.slice(0,2):[BANK[0],BANK[12]]).map(p=>card(p,!!recent.length)).join('')}</div></section><aside class="stack"><section class="panel"><div class="panel-head"><h2>یادداشت روی میز</h2>${ic('edit')}</div><p class="small muted" data-copy="note-help">فکری که همین حالا به ذهنت رسیده، می‌تواند شروع طرح بعدی باشد.</p><textarea id="quickNote" aria-label="یادداشت سریع" placeholder="اگر فردا کلاس را با یک پرسش شروع کنم…" style="margin:15px 0"></textarea>${btn('save-note','این ایده را نگه دار','plus','','soft')}<div class="note-list">${store.notes.slice(-2).map(n=>`<div class="note-item"><span>${E(n.text)}</span>${ib('delete-note','حذف یادداشت','trash',`data-id="${n.id}"`)}</div>`).join('')}</div></section><section class="tip-card"><span class="chip">نکتهٔ امروز · ${E(tip.group)}</span><p>${E(tip.text)}</p>${btn('go','کتابخانهٔ نکته‌ها','arrow','data-tab="library"','soft')}</section><div class="callout warning"><strong>یک نسخه بیرون از مرورگر داشته باش.</strong><p class="small" style="margin:9px 0">${store.stats.lastBackup?'آخرین دریافت: '+dateFa(store.stats.lastBackup.slice(0,10)):'هنوز فایل پشتیبان نگرفته‌ای.'} نسخهٔ هفتگی محلی هم با پاک‌شدن مرورگر از بین می‌رود.</p>${btn('backup','دریافت نسخهٔ امن','download')}</div></aside></div>`}
function filtered(mine=false){let list=mine?store.myPlans:BANK;list=list.filter(p=>{if(mine){const archived=store.archived.includes(p.id);if(ui.scope==='archived'&&!archived||ui.scope==='active'&&archived||ui.scope==='favorites'&&!store.favorites.includes(p.id))return false}return matchesQuery(p,ui.q)&&(!ui.grade||gradeParts(p).includes(norm(ui.grade)))&&(!ui.subject||p.subject.includes(ui.subject))&&(!ui.type||p.type===ui.type)&&(!ui.template||p.template===ui.template)&&(!ui.level||p.level===ui.level)&&(!ui.duration||(ui.duration==='short'?p.duration<=45:p.duration>45))});return list.slice().sort((a,b)=>ui.sort==='az'?a.title.localeCompare(b.title,'fa'):ui.sort==='new'?String(b.updatedAt).localeCompare(String(a.updatedAt)):ui.sort==='popular'?(store.stats.usage?.[b.id]||0)-(store.stats.usage?.[a.id]||0):Number(store.favorites.includes(b.id))-Number(store.favorites.includes(a.id)))}
function filters(){return `<div class="filters"><div class="field search"><label for="searchPlans">جستجوی پیشرفته در متن، عنوان و برچسب</label><input id="searchPlans" type="search" data-input="search" value="${E(ui.q)}" placeholder="مثلاً +پایه۵ #ریاضی -مجازی یا &quot;کسرهای مساوی&quot;"></div>${select('filter-grade','پایه',[['','همهٔ پایه‌ها'],...Array.from({length:12},(_,j)=>[String(j+1),'پایه '+fa(j+1)])],ui.grade,'data-filter="grade"')}${select('filter-subject','درس',[['','همهٔ درس‌ها'],...SUBJECTS],ui.subject,'data-filter="subject"')}${select('filter-type','دسته',[['','همهٔ دسته‌ها'],...CATEGORIES],ui.type,'data-filter="type"')}${select('filter-template','قالب',[['','همهٔ قالب‌ها'],...Object.entries(TEMPLATE_NAMES)],ui.template,'data-filter="template"')}${select('filter-duration','زمان',[['','همهٔ زمان‌ها'],['short','تا ۴۵ دقیقه'],['long','بیش از ۴۵ دقیقه']],ui.duration,'data-filter="duration"')}${select('filter-level','سطح',[['','همهٔ سطح‌ها'],['قابل تطبیق','قابل تطبیق'],['مقدماتی','مقدماتی'],['میانی','میانی'],['پیشرفته','پیشرفته']],ui.level,'data-filter="level"')}${select('sort','مرتب‌سازی',[['suggested','برگزیده‌های من'],['az','الفبایی'],['new','تازه‌تر'],['popular','بیشتر استفاده‌شده توسط من']],ui.sort,'data-filter="sort"')}</div>`}
function bankView(mine=false){const list=filtered(mine);return head(mine?'طرح‌های من':'کتابخانهٔ طرح‌های درس',mine?'نسخه‌های شخصی تو؛ ویرایش، بایگانی، مقایسه و خروجی جمعی.':`${fa(BANK.length)} نمونهٔ تألیفی، در ۱۰ دسته؛ برای استفاده با کتاب و نیاز کلاس تطبیق بده.`,btn('new','طرح تازه','plus','','primary')+btn('import','ورود فایل','upload'))+`<section class="panel">${filters()}<div class="quick-filters">${btn('quick-filter','پایهٔ من','class','data-kind="grade"')}${btn('quick-filter','شروع با پنجم','book','data-kind="fifth"')}${btn('quick-filter','مناسبت‌ها','calendar','data-kind="occasion"')}${btn('reset-filter','پاک‌کردن فیلترها','close')}${mine?`<span class="spacer"></span>${select('scope','نمایش',[['active','فعال'],['favorites','برگزیده'],['archived','آرشیو']],ui.scope,'data-filter="scope"')}${btn('layout',ui.layout==='cards'?'نمای فهرست':'نمای کارت','file')}`:''}</div><div class="row between"><span class="small muted">${fa(list.length)} طرح پیدا شد${mine?' · '+fa(ui.selected.size)+' طرح انتخاب‌شده':''}</span>${mine?`<div class="row">${btn('select-all','انتخاب نتایج','check')}${btn('batch','خروجی جمعی','download')}${btn('compare','مقایسهٔ دو طرح','class')}</div>`:''}</div></section><div style="margin-top:23px" class="cards ${mine&&ui.layout==='list'?'list':''}">${list.slice(0,ui.limit).map(p=>card(p,mine)).join('')}</div>${!list.length?empty('این صفحه منتظر یک ایده است',mine?'یک طرح از بانک بردار یا چارچوب خودت را بساز.':'فیلترها را کمتر کن یا واژه دیگری بنویس.'):''}${list.length>ui.limit?`<div class="row" style="justify-content:center;margin-top:25px">${btn('more','نمایش طرح‌های بیشتر','plus')}</div>`:''}${mine?`<section class="panel" style="margin-top:25px"><h2>نمای کوچکِ کارهای تو</h2><div class="bars">${CATEGORIES.filter(t=>store.myPlans.some(p=>p.type===t)).map(t=>{const n=store.myPlans.filter(p=>p.type===t).length;return `<div class="bar-row"><span>${t}</span><div class="bar-track"><span style="width:${n/Math.max(1,store.myPlans.length)*100}%"></span></div> function markHTML(p){if(!p.mark)return '';const strokes=p.mark.strokes||[];return `<div class="signature">${strokes.length?`<svg viewBox="0 0 640 160" aria-label="امضای ترسیمی" role="img">${strokes.map(s=>`<polyline points="${s.map(pt=>pt.join(',')).join(' ')}" fill="none" stroke="#264a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}</svg>`:''}${p.mark.text?`<span class="stamp">${E(p.mark.text)}</span>`:''}</div>`}
function planText(p){p=personalizePlan(p);return [p.title,...p.meta.map(m=>m.label+': '+m.value),...p.sections.flatMap(s=>['\n'+s.title,s.kind==='text'?s.text:[s.headers,...s.rows].map(r=>r.join(' | ')).join('\n')]),p.mark?.text?'امضا / مهر: '+p.mark.text:''].join('\n')}
function displayRows(p,s){if(s.kind!=='timeline')return s.rows;let elapsed=0;const start=(p.startTime||'08:00').split(':').map(Number),base=start[0]*60+start[1],clock=n=>{const total=Math.round(n*60),h=Math.floor(total/3600)%24,m=Math.floor(total/60)%60,ss=total%60;return fa(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+(ss?':'+String(ss).padStart(2,'0'):''))+(total>=86400?' (روز بعد)':'')};return s.rows.map(r=>{const min=number(r[0])||0,copy=r.slice();copy[0]=p.template==='online'?'از '+clock(base+elapsed)+' تا '+clock(base+elapsed+min)+'\n'+fa(min)+' دقیقه':fa(r[0])+' دقیقه';elapsed+=min;return copy})}
function paperHTML(p){p=personalizePlan(p);return `<article class="paper" data-printstyle="${E(store.settings.printStyle)}"><div class="paper-top"><div><div class="paper-kicker">${E(p.type)} · ${E(TEMPLATE_NAMES[p.template]||'چارچوب شخصی')} · ${p.date?dateFa(p.date):'تاریخ اجرا: تعیین نشده'}</div><h1>${E(p.title||'طرح بدون عنوان')}</h1></div><div class="paper-mark">${ic('book')}</div></div><table class="meta-table"><tbody>${p.meta.map((m,j)=>j%2===0?`<tr><th>${E(m.label)}</th><td>${E(m.value)}</td>${p.meta[j+1]?`<th>${E(p.meta[j+1].label)}</th><td>${E(p.meta[j+1].value)}</td>`:'<th></th><td></td>'}</tr>`:'').join('')}</tbody></table>${p.sections.map(s=>`<section><h2>${E(s.title)}</h2>${s.kind==='text'?`<p>${E(s.text||' ')}</p>`:`<table><thead><tr>${s.headers.map(h=>`<th>${E(h)}</th>`).join('')}</tr></thead><tbody>${displayRows(p,s).map(r=>`<tr>${r.map(c=>`<td>${E(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}</section>`).join('')}${markHTML(p)}<div class="paper-foot">${E(p.origin||'طرح شخصی معلم')}<br>${E(CREDIT)}</div></article>`}
function checklist(p){const roles=['general','goals','steps','assessment','homework','reflection'];return roles.map(role=>{const s=p.sections.find(s=>s.role===role);return{title:{general:'هدف کلی',goals:'هدف‌های رفتاری',steps:'مراحل',assessment:'ارزشیابی',homework:'تکلیف',reflection:'بازتاب'}[role],ok:!!s&&(s.kind==='text'?!!s.text.trim():s.rows.some(r=>r.some((c,j)=>j>0&&c.trim())))}})}
function metricsHTML(p){const checks=checklist(p),n=checks.filter(c=>c.ok).length,ts=p.sections.filter(s=>s.kind==='timeline').flatMap(s=>s.rows),sum=ts.reduce((n,r)=>n+(number(r[0])||0),0);return `<div class="row between"><strong class="small">${fa(n)} از ${fa(checks.length)} پیشنهاد تکمیل</strong><span class="small muted">${fa(sum)} / ${fa(p.duration)} دقیقه</span></div><div class="progress-track"><span style="width:${n/checks.length*100}%"></span></div><div class="checks">${checks.map(c=>`<span class="check-item ${c.ok?'ok':''}">${c.ok?'✓':'○'} ${c.title}</span>`).join('')}</div>${ts.length?`<div class="time-bar" aria-label="سهم زمانی مراحل">${ts.map((r,j)=>`<span title="${E(r[1])}: ${fa(r[0])} دقیقه" style="flex:${Math.max(.1,number(r[0])||0)};background:${['#699681','#bda065','#719bc0','#a18cbc','#cf927b'][j%5]}"></span>`).join('')}</div><p class="mini-help">${sum===p.duration?'زمان مراحل با مدت جلسه هماهنگ است.':`اختلاف زمان: ${fa(sum-p.duration)} دقیقه؛ از کمک زمان‌بندی استفاده کن.`}</p>`:''}`}
function updatePreview(){if(ui.tab!=='editor'||!active)return;if($('#livePaper'))$('#livePaper').innerHTML=paperHTML(active);if($('#metrics'))$('#metrics').innerHTML=metricsHTML(active);if($('#undoButton'))$('#undoButton').disabled=!past.length;if($('#redoButton'))$('#redoButton').disabled=!future.length;status()}

function aboutView(){return head('یک کارگاه، نه یک فرمِ بسته','راهنمای کوتاه، محدودیت‌های روشن و ساختار فایل‌ها.')+`<div class="settings-grid"><div class="stack"><section class="panel"><h2>از ایده تا برگهٔ کلاس</h2><ol class="small"><li>در بانک جستجو کن یا از یکی از سه چارچوب، طرح خالی بساز.</li><li>«بردار و ویرایش» یک نسخهٔ مستقل می‌سازد؛ بانک اصلی تغییر نمی‌کند.</li><li>عنوان فیلدها، متن‌ها و سلول‌ها را ویرایش کن. برای ترتیب بخش‌ها از کشیدن یا دکمه جابه‌جایی استفاده کن.</li><li>از کمک آموزشی، زمان‌بندی، بازگشت ۲۰ مرحله‌ای و پیش‌نمایش زنده کمک بگیر.</li><li>طرح را ذخیره کن؛ از طرح‌های من یک یا چند مورد را برای خروجی یا مقایسه انتخاب کن.</li><li>برای PDF، در پنجرهٔ چاپ مرورگر «ذخیره به PDF» را انتخاب کن.</li></ol><div class="callout">Ctrl / ⌘ + S: ذخیره · Ctrl / ⌘ + Z: بازگشت · Ctrl / ⌘ + Shift + Z: انجام دوباره · Escape: بستن پنجره</div></section><section class="panel"><h2>دربارهٔ بانک و چارچوب‌ها</h2><p class="small muted" style="margin-top:14px">${fa(BANK.length)} نمونه، تألیفی و فعالیت‌محور هستند، نه اسناد رسمی، گزارش اجرای واقعی یا تضمین انطباق با آخرین چاپ کتاب. عنوان‌های درسی، صفحه، زمان و سطح باید با کتاب مدرسه و نیاز دانش‌آموزان تطبیق داده شوند. جدول ۳۶ هفته‌ای تقویم پیشنهادی است؛ تعطیلات متغیر محلی و مذهبی به‌صورت خودکار اعمال نمی‌شوند.</p><p class="small muted" style="margin-top:12px">سه چارچوب اصلی: مجازی، سالانه و ملیِ الهام‌گرفته از ساختارهای آموزشی. قالب آزاد و قالب‌های شخصی نیز در دسترس‌اند. هیچ ادعای تأیید وزارت آموزش‌وپرورش وجود ندارد.</p></section></div><div class="stack"><section class="panel"><h2>فرمت‌ها و محدودیت‌های صادقانه</h2><p class="small muted" style="margin-top:14px">ورودی: tarhdars، JSON، DOCX، متن، Markdown، CSV و پیست. فایل DOCX عمومی به متن و جدول قابل ویرایش تبدیل می‌شود؛ تصویر، ماکرو، فرمول و صفحه‌آرایی پیچیده آن منتقل نمی‌شوند. واردکردن همیشه پیش‌نمایش دارد.</p><p class="small muted" style="margin-top:12px">خروجی: DOCX واقعی، XLSX واقعی، PDF از چاپ، tarhdars، JSON، TXT، Markdown، CSV با BOM و HTML مستقل. خروجی جمعی چند طرح را در یک فایل نگه می‌دارد. امضا، تصویر ترسیمی است و امضای رمزنگاری‌شده یا گواهی رسمی نیست.</p></section><section class="panel"><h2>فایل و حافظه</h2><p class="small muted" style="margin-top:14px">همهٔ CSS، جاوااسکریپت، SVG و بانک تألیفی در همین HTML هستند؛ بدون فونت، تصویر، CDN یا کتابخانهٔ خارجی. فونت Vazirmatn فقط اگر روی دستگاه نصب باشد استفاده می‌شود؛ Tahoma و فونت‌های سیستمی جایگزین‌اند.</p><p class="small muted" style="margin-top:12px">کلید اصلی: <bdi>${KEY}</bdi><br>نسخهٔ هفتگی: <bdi>${WEEK}</bdi><br>ساختار tarhdars: یک JSON UTF-8 با <bdi>app: hakimestan-tarhdars</bdi>، <bdi>version: 1</bdi> و <bdi>kind: plans</bdi> یا <bdi>backup</bdi>. طرح‌ها در plans و پشتیبان کامل در data قرار می‌گیرند.</p><p class="small muted" style="margin-top:12px">داده‌ها به مرورگر و نشانی سایت وابسته‌اند. برای انتقال، فایل بگیر. پاک‌شدن مرورگر، نسخهٔ هفتگی محلی را نیز پاک می‌کند. تب دوم برای جلوگیری از بازنویسی، هشدار تعارض ایجاد می‌کند.</p></section></div></div>`}
const VIEWS={home:homeView,bank:()=>bankView(false),mine:()=>bankView(true),editor:editorView,library:libraryView,calendar:calendarView,tools:toolsView,settings:settingsView,about:aboutView};

</script>

<script>
function findPlan(pid){return store.myPlans.find(p=>p.id===pid)||BANK.find(p=>p.id===pid)||store.settings.customTemplates.find(p=>p.id===pid)}
function section(pid){return active?.sections.find(s=>s.id===pid)}
function editRefresh(fn){change(fn);render()}
function addSection(){if(!active)return toast('اول یک طرح باز کن.',true);modal('یک بخش به زبان خودت',`<form data-form="modal"><div class="form-grid">${field('sectionTitle','عنوان بخش','بخش دلخواه')}${select('sectionKind','نوع محتوا',[['text','متن آزاد'],['table','جدول'],['timeline','زمان‌بندی']])}${field('sectionHeaders','عنوان ستون‌ها (با ویرگول)','عنوان، شرح، معیار')}</div>${actions('افزودن بخش')}</form>`,()=>{const kind=val('sectionKind'),headers=val('sectionHeaders').split(/[,،]/).map(x=>x.trim()).filter(Boolean);if(kind!=='text'&&(!headers.length||headers.length>20))throw Error('بین یک تا بیست عنوان ستون بنویسید.');editRefresh(p=>p.sections.push(kind==='text'?{id:id(),role:'custom',title:val('sectionTitle')||'بخش دلخواه',kind,text:''}:{id:id(),role:'custom',title:val('sectionTitle')||'جدول دلخواه',kind,headers:kind==='timeline'?['دقیقه',...headers]:headers,rows:[(kind==='timeline'?['دقیقه',...headers]:headers).map((_,j)=>kind==='timeline'&&j===0?'5':'')]}));close()})}
function distribute(total,weights){if(!Number.isInteger(total)||total<1||total>10080||!weights.length||weights.some(w=>!Number.isFinite(w)||w<0)||!weights.some(w=>w>0))throw Error('زمان کل باید عدد صحیح مثبت و وزن‌ها نامنفی باشند؛ دست‌کم یک وزن مثبت لازم است.');const sum=weights.reduce((a,b)=>a+b,0),exact=weights.map(w=>w/sum*total),out=exact.map(Math.floor);let left=total-out.reduce((a,b)=>a+b,0);exact.map((x,j)=>({j,r:x-out[j]})).sort((a,b)=>b.r-a.r).slice(0,left).forEach(x=>out[x.j]++);return out}
function timing(){if(!active)return toast('ابتدا طرحی در کارگاه باز کن.',true);const rows=active.sections.filter(s=>s.kind==='timeline').flatMap(s=>s.rows);if(!rows.length)return toast('این طرح بخش زمان‌بندی ندارد؛ یک بخش از این نوع اضافه کن.',true);modal('زمان‌بندی متناسب با کلاس',`<form data-form="modal"><p class="explain">زمان مراحل، با حفظ نسبت فعلی و گردکردن دقیق، به مجموع هدف می‌رسد. مراحل با وزن صفر زمان نمی‌گیرند.</p>${field('minutes','زمان هدف (دقیقه)',fa(active.duration),'inputmode="numeric"')}<p class="callout" style="margin-top:18px">${fa(rows.length)} مرحله · اکنون ${fa(rows.reduce((n,r)=>n+(number(r[0])||0),0))} دقیقه</p>${actions('اعمال زمان‌بندی')}</form>`,()=>{const total=number(val('minutes')),out=distribute(total,rows.map(r=>Math.max(0,number(r[0])||0)));editRefresh(p=>{p.duration=total;let j=0;p.sections.filter(s=>s.kind==='timeline').forEach(s=>s.rows.forEach(r=>r[0]=String(out[j++])));const m=p.meta.find(m=>m.id==='duration');if(m)m.value=fa(total)+' دقیقه'});close()})}
function helper(sid=''){if(!active)return toast('اول طرحی باز کن.',true);const defaults=sid?active.sections.find(s=>s.id===sid):null;const items=[...BLOOM.map(([title,verbs])=>({title:'هدف · '+title,text:`دانش‌آموز بتواند درباره «${active.title}» ${verbs.split('،')[0]}؛ با استفاده از یک مثال و بر اساس معیار درستی و توضیح.`})),...METHODS.map(([title,text])=>({title:'روش · '+title,text:title+'؛ '+text})),...ASSESSMENTS.map((text,j)=>({title:'ارزشیابی '+fa(j+1),text})),...HOMEWORKS.map((text,j)=>({title:'تکلیف '+fa(j+1),text}))];modal('پیشنهاد آموزشی؛ بدون هوش مصنوعی آنلاین',`<p class="explain">پیشنهادها از کتابخانهٔ داخلی‌اند. متن را پیش از افزودن تغییر بده؛ هیچ بخشی بدون تأیید جایگزین نمی‌شود.</p><div class="form-grid">${select('helper-target','بخش مقصد',active.sections.filter(s=>s.kind==='text').map(s=>[s.id,s.title]),defaults?.kind==='text'?defaults.id:active.sections.find(s=>s.kind==='text')?.id)}${select('helper-choice','نوع پیشنهاد',items.map((x,j)=>[j,x.title]))}</div><label for="helperText" style="margin-top:18px">متن پیشنهادی؛ کاملاً قابل تغییر</label><textarea id="helperText" rows="6">${E(items[0].text)}</textarea><div class="dialog-actions">${btn('close','انصراف','close')}<button class="btn primary" data-act="confirm">افزودن به انتهای بخش</button></div>`,()=>{const target=val('helper-target'),text=$('#helperText').value;if(!target)throw Error('یک بخش متنی در طرح بسازید.');editRefresh(p=>{const s=p.sections.find(s=>s.id===target);s.text+=(s.text?'\n\n':'')+text});close()});$('#f-helper-choice').onchange=()=>$('#helperText').value=items[+val('helper-choice')].text;}
function copySection(){if(!active)return;const sources=store.myPlans.filter(p=>p.id!==active.id);if(!sources.length)return toast('برای برداشت بخش، یک طرح دیگر در طرح‌های من ذخیره کن.',true);const options=sources.flatMap(p=>p.sections.map(s=>[p.id+'|'+s.id,p.title+' ← '+s.title]));modal('برداشت بخش از یک طرح دیگر',`<form data-form="modal">${select('sourceSection','بخش مورد نظر',options)}<p class="mini-help">یک نسخهٔ مستقل به انتهای طرح اضافه می‌شود؛ طرح مبدأ تغییر نمی‌کند.</p>${actions('برداشت بخش')}</form>`,()=>{const[pid,sid]=val('sourceSection').split('|'),s=clone(findPlan(pid).sections.find(s=>s.id===sid));s.id=id();editRefresh(p=>p.sections.push(s));close()})}
function signature(){if(!active)return;let strokes=clone(active.mark?.strokes||[]),drawing=false;modal('امضا و مهرِ شخصی',`<p class="explain">با ماوس یا لمس امضا کن. این یک تصویر ترسیمی است؛ گواهی هویت یا امضای رمزنگاری‌شده نیست.</p><canvas id="signCanvas" class="sign-canvas" width="640" height="160" aria-label="بوم رسم امضا"></canvas><div class="row" style="margin:13px 0">${btn('clear-sign','پاک‌کردن امضا','trash')}</div>${field('stamp','متن مهر یا نام امضاکننده',active.mark?.text||store.settings.teacherName,'maxlength="300"')}<div class="dialog-actions">${btn('close','انصراف','close')}<button class="btn primary" data-act="confirm">ثبت در طرح</button></div>`,()=>{editRefresh(p=>p.mark={strokes,text:val('stamp').trim()});close()});const canvas=$('#signCanvas'),ctx=canvas.getContext('2d');const draw=()=>{ctx.clearRect(0,0,640,160);ctx.strokeStyle='#254c39';ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';for(const s of strokes){ctx.beginPath();s.forEach((p,j)=>j?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke()}};const pt=e=>{const r=canvas.getBoundingClientRect();return[Math.max(0,Math.min(640,(e.clientX-r.left)/r.width*640)),Math.max(0,Math.min(160,(e.clientY-r.top)/r.height*160))]};canvas.onpointerdown=e=>{if(strokes.length>=200)return;drawing=true;strokes.push([pt(e)]);canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drawing&&strokes.at(-1).length<3000){strokes.at(-1).push(pt(e));draw()}};canvas.onpointerup=canvas.onpointercancel=()=>drawing=false;$('#modal [data-act="clear-sign"]').onclick=()=>{strokes=[];draw()};draw()}
function planMenu(pid){const p=findPlan(pid),mine=store.myPlans.some(x=>x.id===pid);modal(p.title,`<div class="export-grid">${btn('preview','پیش‌نمایش','file',`data-id="${pid}"`)}${btn('duplicate','کپی مستقل','plus',`data-id="${pid}"`)}${btn('export-plan','خروجی','download',`data-id="${pid}"`)}${btn('share-plan','اشتراک فایل','upload',`data-id="${pid}"`)}${mine?btn('archive',store.archived.includes(pid)?'بازگردانی از آرشیو':'آرشیو طرح','book',`data-id="${pid}"`)+btn('delete-plan','حذف طرح','trash',`data-id="${pid}"`,'danger'):''}</div><p class="mini-help">اشتراک، فایل قابل ویرایش می‌سازد؛ بارگذاری روی سرور یا پیوند عمومی ایجاد نمی‌شود.</p>`)}
function rawTextNodes(root){const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n,out=[];while(n=walk.nextNode()){const p=n.parentElement;if(!p||p.closest('input,textarea,select,script,style,.paper,.plan-card,.edit-table')||n.textContent.trim().length<2||n.textContent.length>600)continue;out.push(n)}return out}
function interfaceEditor(){const nodes=rawTextNodes($('#main')).concat(rawTextNodes($('#nav'))),texts=[...new Set(nodes.map(n=>n.__base||n.textContent))].slice(0,100);modal('نوشته‌های همین صفحه را شخصی کن',`<p class="explain">راهنماها و نوشته‌های رابط این صفحه را عوض کن. برای صفحه‌ای دیگر، ابتدا به آن برو و از پنل ظاهر، این ویرایشگر را باز کن. این کار منطق دکمه‌ها را تغییر نمی‌دهد.</p><form data-form="modal"><div class="stack">${texts.map((t,j)=>`<div class="field"><label for="copy-${j}">${E(t.trim().slice(0,100))}</label><textarea id="copy-${j}" rows="2">${E(store.settings.uiText['raw:'+t]??t)}</textarea></div>`).join('')}</div>${actions('ذخیرهٔ نوشته‌ها')}</form>`,()=>{if(!writable())return;texts.forEach((t,j)=>{const v=$('#copy-'+j).value;if(v!==t)store.settings.uiText['raw:'+t]=v;else delete store.settings.uiText['raw:'+t]});persist();close();render()},true)}
function safeURL(s){s=s.trim();if(!s)return '';if(/^(javascript|data|vbscript):/i.test(s)||s.startsWith('//')||/[<>"']/.test(s))throw Error('مسیر امن HTTP/HTTPS یا مسیر نسبی وارد کنید.');const u=new URL(s,location.href);if(!['http:','https:','file:'].includes(u.protocol))throw Error('نوع پیوند مجاز نیست.');return s}
function schedule(pid='',date=''){if(!store.myPlans.length)return toast('اول یک طرح در دفتر شخصی ذخیره کن.',true);modal('قرارِ یک طرح با کلاس',`<form data-form="modal"><div class="stack">${select('scheduledPlan','طرح',store.myPlans.map(p=>[p.id,p.title]),pid)}${field('scheduledDate','تاریخ شمسی',dateFa(date||today()),'class="ltr"')}</div>${actions('ثبت تاریخ')}</form>`,()=>{const date=parseDate(val('scheduledDate')),pid=val('scheduledPlan');commit(()=>{const p=findPlan(pid);p.date=date;p.updatedAt=now();if(active?.id===pid)active.date=date},'زمان اجرا ثبت شد.');close()})}

<script>
/* امکانات تکمیلی مستقل؛ دادهٔ قبلی، امنیت ورود و Undo/Redo دست‌نخورده می‌مانند. */
function personalizePlan(p){const replace=s=>typeof s==='string'?s.replace(/آموزگار نمونه؛ نام خود را جایگزین کنید/g,()=>store.settings.teacherName||'آموزگار نمونه؛ نام خود را جایگزین کنید').replace(/مدرسه[ٔ‌ ]+نمونه/g,()=>store.settings.school||'مدرسهٔ نمونه'):s;const q=clone(p);for(const m of q.meta)m.value=replace(m.value);for(const s of q.sections){if(s.kind==='text')s.text=replace(s.text);else s.rows=s.rows.map(r=>r.map(replace))}return q}
const searchCache=new WeakMap();
function searchable(p){if(searchCache.has(p))return searchCache.get(p);const text=norm([p.title,p.subject,p.grade,p.type,...p.tags,...p.meta.map(m=>m.value),...p.sections.map(s=>s.title+' '+(s.kind==='text'?s.text:s.rows.flat().join(' ')))].join(' '));searchCache.set(p,text);return text}
function gradeParts(p){const words={اول:'1',دوم:'2',سوم:'3',چهارم:'4',پنجم:'5',ششم:'6',هفتم:'7',هشتم:'8',نهم:'9',دهم:'10',یازدهم:'11',دوازدهم:'12'};return String(p.grade).split(/[،,]/).map(g=>{g=norm(g).replace(/^پایه\s*/,'');return words[g]||g})}
function matchesQuery(p,query){const tokens=[...String(query||'').matchAll(/"([^"]+)"|(\S+)/g)].map(m=>({text:m[1]||m[2],exact:!!m[1]})),text=searchable(p);return tokens.every(({text:q,exact})=>{q=norm(q);if(exact)return text.includes(q);const grade=q.match(/^\+پایه(\d+)$/);if(grade)return gradeParts(p).includes(grade[1]);if(q.startsWith('#'))return p.tags.some(t=>norm(t).includes(q.slice(1).replace(/_/g,' ')));if(q.startsWith('-')&&q.length>1)return !text.includes(q.slice(1));return text.includes(q.replace(/^\+/,''))})}
const TAG_STOP=new Set(norm('برای درباره مانند اینکه هستند باشد میشود می‌شود بتواند میتواند می‌تواند دانش‌آموز دانش‌آموزان آموزگار فعالیت فعالیت‌های نمونه نمونه‌های پرسش پاسخ توضیح انجام بررسی آموزش آموزشی یادگیری مفهوم طریق مورد کلاس معلم مدرسه جلسه سپس همراه مرتبط مشخص روشن مناسب خودشان دیگران داشته مشاهده راهنمایی معیار معیارهای موضوع نتیجه مرحله مراحل استفاده تولید توسط گرفته بدهید کنید کنند شود گردد باید بوده بیشتر قابل مثال تغییر محصول ارائه پیش‌بینی بنویسید برابر مستقل زمینه درستی نشان پس پیش کنند ثبت کنند روش منبع داده همان شوند خواهند کردن کردنهای از این آن یک هر با به که را و در روی همچنین زیرا هنگام').split(/\s+/));
for(const word of norm('می‌کند می‌دهد می‌نویسد می‌کنند می‌دهند چیزهایی بماند منصفانه متفاوت مشابه طراحی بسازید آغازین بازخورد مقدار اصلاح نشوند پذیرفته باشد می‌شود می‌توان').split(' '))TAG_STOP.add(word);
function frequentTags(p){const counts=new Map(),raw=p.sections.filter(s=>!['sources','reflection','differentiation','method','self'].includes(s.role)).map(s=>s.kind==='text'?s.text:s.rows.flat().join(' ')).join(' ');for(const w of norm(raw).match(/[\p{L}]+/gu)||[]){if(w.length>4&&!TAG_STOP.has(w))counts.set(w,(counts.get(w)||0)+1)}return [...counts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'fa')).slice(0,5).map(([word,count])=>({word,count}))}
function smartTags(){if(!active)return;const terms=frequentTags(active),base=[...new Set([active.subject,'پایه '+fa(active.grade),active.type])].filter(Boolean);modal('واژه‌های کلیدیِ طرح تو',`<p class="explain">پیشنهادها از شناسنامه و واژه‌های پرتکرارِ بیش از چهار حرف استخراج می‌شوند. واژه‌های رایج فارسی حذف شده‌اند؛ انتخاب نهایی با توست.</p><form data-form="modal"><div class="tag-suggestions">${[...base.map(word=>({word,count:0})),...terms].map(({word,count})=>`<label class="tag-pick"><input type="checkbox" class="smart-tag" value="${E(word)}" checked><span>${E(word)}</span>${count?`<small>${fa(count)} بار</small>`:''}</label>`).join('')}</div>${actions('افزودن برچسب‌های انتخاب‌شده')}</form>`,()=>{const chosen=$$('.smart-tag:checked').map(el=>el.value);editRefresh(p=>p.tags=[...new Set([...p.tags,...chosen])].slice(0,100));close();toast('برچسب‌های انتخابی افزوده شدند.')})}
ACT['smart-tags']=smartTags;
function planDigest(p){const q=clone(p);delete q.updatedAt;return JSON.stringify(q)}
function stampTime(iso){return new Intl.DateTimeFormat('fa-IR',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Tehran'}).format(new Date(iso))}
function validateHistory(x){if(!x||x.version!==1||!Array.isArray(x.entries)||x.entries.length>15000)throw Error('ساختار تاریخچه معتبر نیست.');const ids=new Set();for(const e of x.entries){if(!e||!safeId(e.id)||ids.has(e.id)||!safeId(e.planId)||e.planId!==e.data?.id||typeof e.at!=='string'||!isFinite(Date.parse(e.at))||typeof e.reason!=='string'||e.reason.length>300)throw Error('نسخهٔ تاریخچه معتبر نیست.');ids.add(e.id);validatePlan(e.data)}return x}
function historyBytes(x){const s=JSON.stringify(x);return Math.max(s.length*2,new TextEncoder().encode(s).length)}
function pruneHistory(x){x.entries.sort((a,b)=>a.at.localeCompare(b.at));const counts=new Map();x.entries=x.entries.reverse().filter(e=>{const n=(counts.get(e.planId)||0)+1;counts.set(e.planId,n);return n<=10}).reverse();while(x.entries.length&&historyBytes(x)>2*1024*1024)x.entries.shift();return x}
function loadHistory(){const raw=localStorage.getItem(HISTORY_KEY);return raw?validateHistory(JSON.parse(raw)):{version:1,entries:[]}}
let historyWarningShown=false;
function recordRevision(p,reason='ذخیره'){if(!p||broken||conflict)return false;try{const h=loadHistory(),last=h.entries.filter(e=>e.planId===p.id).at(-1);if(last&&planDigest(last.data)===planDigest(p))return true;h.entries.push({id:id(),planId:p.id,at:now(),reason,data:clone(p)});pruneHistory(h);localStorage.setItem(HISTORY_KEY,JSON.stringify(h));return true}catch(e){if(!historyWarningShown){toast('نسخهٔ تاریخچه ذخیره نشد؛ حافظه را بررسی و فایل پشتیبان دریافت کن.',true);historyWarningShown=true}return false}}
function safeHistoryPacket(){try{return loadHistory()}catch(e){return null}}
function backupPacket(){return{app:'hakimestan-tarhdars',version:1,kind:'backup',designer:'مهدی شریفیان',site:'حکیمستان',exportedAt:now(),data:serializeStore(store),history:safeHistoryPacket()}}
function historyDialog(pid=active?.id){if(!pid)return;let h;try{h=loadHistory()}catch(e){modal('تاریخچه نیاز به بررسی دارد',`<p class="explain">نسخه‌های قبلی خوانده نشدند و بازنویسی نمی‌شوند. ابتدا دادهٔ خام را دریافت کنید.</p><div class="row">${btn('history-raw','دریافت تاریخچه خام','download')}${btn('history-reset','پاک‌کردن تاریخچه خراب','trash','','danger')}</div>`);return}const rows=h.entries.filter(e=>e.planId===pid).reverse();modal('تاریخچهٔ ماندگار طرح',`<p class="explain">تا ۱۰ نسخهٔ متفاوت برای هر طرح، مستقل از بازگشت ۲۰مرحله‌ای. سقف کل دو مگابایت است و قدیمی‌ترین‌ها خودکار حذف می‌شوند. استفاده: ${fa(Math.ceil(historyBytes(h)/1024))} کیلوبایت.</p>${rows.length?`<div class="history-list">${rows.map((e,j)=>`<article class="revision-card"><span class="revision-dot">${fa(rows.length-j)}</span><div><strong>${E(stampTime(e.at))}</strong><p class="small muted">${E(e.reason)} · ${E(e.data.title)}</p><div class="row">${btn('history-preview','پیش‌نمایش','file',`data-id="${e.id}"`)}${btn('history-restore','بازگردانی','arrow',`data-id="${e.id}"`)}${ib('history-delete','حذف این نسخه','trash',`data-id="${e.id}" data-plan="${pid}"`)}</div></div></article>`).join('')}</div>`:empty('هنوز نسخه‌ای ثبت نشده','با نخستین ذخیره، نسخهٔ طرح در تاریخچه هم نگه داشته می‌شود.','','')}`,null,true)}
ACT.history=()=>historyDialog();
ACT['history-preview']=el=>{const e=loadHistory().entries.find(e=>e.id===el.dataset.id);if(!e)return;modal('نسخهٔ '+stampTime(e.at),`<div class="row">${btn('history-back','فهرست نسخه‌ها','arrow',`data-plan="${e.planId}"`)}${btn('history-restore','بازگردانی این نسخه','clock',`data-id="${e.id}"`,'primary')}</div>`+paperHTML(e.data),null,true)};
ACT['history-back']=el=>historyDialog(el.dataset.plan);
ACT['history-delete']=el=>{const eid=el.dataset.id,pid=el.dataset.plan;confirm('حذف یک نسخه','فقط همین نسخهٔ تاریخچه حذف می‌شود؛ خودِ طرح تغییر نمی‌کند.',()=>{const h=loadHistory();h.entries=h.entries.filter(e=>e.id!==eid);localStorage.setItem(HISTORY_KEY,JSON.stringify(h));setTimeout(()=>historyDialog(pid),0)})};
ACT['history-restore']=el=>{const e=loadHistory().entries.find(e=>e.id===el.dataset.id);if(!e)return;confirm('بازگردانی نسخهٔ ذخیره‌شده','محتوای این نسخه جایگزین طرح باز می‌شود. نسخهٔ فعلی هم برای امکان برگشت نگه داشته خواهد شد.',()=>{if(!writable())return;const current=active?.id===e.planId?active:store.myPlans.find(p=>p.id===e.planId);if(current)recordRevision(current,'پیش از بازگردانی');const restored=clone(e.data);restored.createdAt=current?.createdAt||restored.createdAt;restored.updatedAt=now();if(active?.id===e.planId)change(()=>active=restored);else{if(active&&dirty&&!savePlan(true))return;active=restored;dirty=true;past=[];future=[]}ui.tab='editor';savePlan();render()})};
ACT['history-raw']=()=>IO.download(localStorage.getItem(HISTORY_KEY)||'','history-recovery.txt','text/plain;charset=utf-8');
ACT['history-reset']=()=>confirm('پاک‌کردن تاریخچه','تمام نسخه‌های تاریخچه حذف می‌شوند. طرح‌های دفتر باقی می‌مانند.',()=>{localStorage.removeItem(HISTORY_KEY);historyWarningShown=false;toast('تاریخچه خالی شد.')});
function recordHabit(kind){const d=today();store.activity[d]??={created:0,edited:0};store.activity[d][kind]++}
function shiftDay(iso,n){return new Date(Date.parse(iso+'T12:00:00Z')+n*86400000).toISOString().slice(0,10)}
function habitStreak(){let day=today(),n=0;const has=d=>store.activity[d]&&(store.activity[d].created+store.activity[d].edited)>0;if(!has(day))day=shiftDay(day,-1);while(has(day)&&n<20000){n++;day=shiftDay(day,-1)}return n}
function habitCalendar(){const first=parseDate(`${ui.year}/${ui.month}/1`),next=ui.month===12?parseDate(`${ui.year+1}/1/1`):parseDate(`${ui.year}/${ui.month+1}/1`),days=Math.round((Date.parse(next)-Date.parse(first))/86400000),offset=(new Date(first+'T12:00:00Z').getUTCDay()+1)%7,total=Object.entries(store.activity).filter(([d,v])=>d>=first&&d<next&&(v.created+v.edited)>0).length;return `<section class="panel habit-panel"><div class="panel-head"><div><div class="eyebrow">قدم‌های کوچک، پیوستگیِ آرام</div><h2>${fa(habitStreak())} روز پشت سر هم طرح ساخته‌ای</h2><p class="small muted">ساخت یا ویرایش متفاوتِ ذخیره‌شده در کارگاه؛ بدون امتیاز اجباری. ${fa(total)} روز فعال این ماه.</p></div><div class="habit-flower" aria-hidden="true">✿</div></div><div class="habit-grid" aria-label="روزهای فعالیت این ماه">${['ش','ی','د','س','چ','پ','ج'].map(x=>`<span class="small muted">${x}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,j)=>{const iso=shiftDay(first,j),v=store.activity[iso]||{created:0,edited:0},n=v.created+v.edited;return `<div class="habit-day ${n?'has-work':''} ${iso===today()?'is-today':''}" tabindex="0" title="${E(dateFa(iso))}؛ ${fa(v.created)} ساخت و ${fa(v.edited)} ویرایش" aria-label="${E(dateFa(iso))}؛ ${fa(v.created)} ساخت و ${fa(v.edited)} ویرایش"><span>${fa(j+1)}</span><span class="habit-dot" aria-hidden="true" style="opacity:${n?Math.min(1,.45+n*.12):0}"></span></div>`}).join('')}</div><p class="mini-help">● روز فعال · کادر دور عدد: امروز · سوابق پیش از نصب این نسخه حدس زده نمی‌شوند.</p></section>`}
const originalCalendar=VIEWS.calendar;VIEWS.calendar=()=>originalCalendar()+habitCalendar();
const originalAbout=VIEWS.about;VIEWS.about=()=>originalAbout().replace('<div class="split">',`<article class="panel maker-card"><div class="maker-monogram" aria-hidden="true">م ش</div><div><h2>دربارهٔ سازنده</h2><p>این کارگاه توسط <strong>مهدی شریفیان</strong>، معلم و طراح آموزشی، برای استفادهٔ معلمان ایران ساخته شده. تمام طراحی، محتوا و کد به صورت مستقل و آفلاین تولید شده‌اند.</p><p class="small muted">حکیمستان · ۱۴۰۴–۱۴۰۵</p></div></article><div class="split">`);
let mergeItems=[],mergeBundles=[],mergeFileToken=null;
function mergeDialog(){mergeFileToken=null;modal('🔀 ادغام دفاتر',`<div class="merge-intro"><span aria-hidden="true">↔</span><h2>چند دفتر، یک کتابخانه</h2><p>چند فایل .tarhdars یا .json را انتخاب کن تا با هم یکی شوند.</p></div><p class="explain">هم فایل طرح‌ها و هم پشتیبان کامل همین کارگاه پذیرفته می‌شوند. عنوان‌های تکراری را پیش از تأیید می‌بینی و برای هر مورد، جایگزینی یا نگه‌داشتن هر دو را انتخاب می‌کنی. تنظیمات شخصی و روزهای فعالیت تو عوض نمی‌شوند. کتاب‌ها، یادداشت‌ها و قالب‌های پشتیبان نیز با شناسهٔ مستقل اضافه می‌شوند.</p><input id="mergeFiles" type="file" accept=".tarhdars,.json" multiple hidden><div class="row">${btn('merge-pick','انتخاب چند دفتر','upload','','primary')}${btn('merge-before','بازیابی نسخهٔ قبل از آخرین ادغام','clock')}</div><p class="mini-help">پیش از تغییر، نسخهٔ محلی خودکار گرفته می‌شود و فایل آن هم برای دانلود آماده خواهد شد. سقف هر بار: ۳۰ فایل و ۲۰۰ طرح.</p>`,null,true);$('#mergeFiles').onchange=async e=>{try{await readMergeFiles([...e.target.files])}catch(err){error(err)}}}
ACT.merge=mergeDialog;ACT['merge-pick']=()=>$('#mergeFiles').click();
async function readMergeFiles(files){if(!files.length||files.length>30)throw Error('بین یک تا ۳۰ فایل انتخاب کن.');const items=[],bundles=[];for(let fi=0;fi<files.length;fi++){const f=files[fi];if(!/\.(json|tarhdars)$/i.test(f.name)||f.size>16*1024*1024)throw Error('فایل‌های JSON یا TARHDARS تا ۱۶ مگابایت پذیرفته می‌شوند.');const d=JSON.parse((await f.text()).replace(/^\uFEFF/,''));let plans,extra=null;if(d.app==='hakimestan-tarhdars'&&d.version===1&&d.kind==='backup'){extra=validateStore(clone(d.data));plans=extra.myPlans}else if(d.app==='hakimestan-tarhdars'&&d.version===1&&d.kind==='plans'&&Array.isArray(d.plans))plans=d.plans;else if(d.version===1&&Array.isArray(d.myPlans)){extra=validateStore(clone(d));plans=extra.myPlans}else if(Array.isArray(d))plans=d;else throw Error('این فایل دفتر یا مجموعه طرح سازگار نیست: '+f.name);plans.forEach(validatePlan);if(items.length+plans.length>200)throw Error('در هر ادغام حداکثر ۲۰۰ طرح پذیرفته می‌شود.');for(const p of plans)items.push({plan:clone(p),source:f.name,bundle:fi,decision:'both'});bundles.push({name:f.name,data:extra})}if(!items.length)throw Error('در فایل‌ها طرحی پیدا نشد.');mergeItems=items;mergeBundles=bundles;mergePreview()}
function mergePreview(){const seen=new Map(store.myPlans.map(p=>[norm(p.title),p]));modal('تداخل‌ها را با خیال راحت بررسی کن',`<p class="explain">${fa(mergeItems.length)} طرح از ${fa(mergeBundles.length)} فایل. ترتیب فایل‌ها ترتیب اعمال است؛ «جایگزینی» یعنی نسخهٔ ورودی همین ردیف. گزینهٔ پیش‌فرض هیچ نسخه‌ای را حذف نمی‌کند.</p><div class="merge-list">${mergeItems.map((e,j)=>{const key=norm(e.plan.title),old=seen.get(key),resolved=old&&e.decision!=='replace'?uniqueTitle(e.plan.title,new Set(seen.keys())):e.plan.title;seen.set(norm(resolved),e.plan);return `<article class="merge-row ${old?'collision':''}"><div><strong>${E(e.plan.title)}</strong><p class="small muted">${E(e.source)} · ${E(stampTime(e.plan.updatedAt))}</p>${old?`<span class="conflict-label">عنوان تکراری · نسخهٔ پیشین: ${E(stampTime(old.updatedAt))}</span><span class="small">نام نهایی: ${E(resolved)}</span>`:'<span class="small muted">طرح تازه؛ افزوده می‌شود</span>'}<details><summary>دیدن محتوای ورودی</summary><pre class="merge-text">${E(planText(e.plan))}</pre></details></div>${old?`<label>تصمیم این تداخل<select class="merge-decision" data-index="${j}"><option value="both" ${e.decision==='both'?'selected':''}>هر دو بمانند؛ پسوند (۲)</option><option value="replace" ${e.decision==='replace'?'selected':''}>نسخهٔ ورودی جایگزین شود</option></select></label>`:''}</article>`}).join('')}</div><div class="dialog-actions">${btn('close','انصراف','close')}${btn('merge-confirm','پشتیبان‌گیری و تأیید ادغام','plus','','primary')}</div><div id="mergeFallback" class="callout warning" hidden>اگر برای نسخهٔ محلی جا نیست، می‌توانی ابتدا فایل پشتیبان بگیری و سپس آگاهانه ادامه بدهی.<div class="row">${btn('merge-file-backup','دریافت فایل امن و ادامه','download')}</div></div>`,null,true)}
function uniqueTitle(title,titles){const base=title.trim().slice(0,480)||'بدون عنوان';let name=base,n=2;while(titles.has(norm(name)))name=base+' ('+fa(n++)+')';return name}
function mergedCandidate(){const candidate=clone(store),maps=mergeBundles.map(()=>new Map()),replaced=[],touched=new Set();let created=0;for(const e of mergeItems){const p=clone(e.plan),pos=candidate.myPlans.findIndex(q=>norm(q.title)===norm(p.title));if(pos>=0&&e.decision==='replace'){const old=candidate.myPlans[pos];replaced.push(clone(old));p.id=old.id;p.createdAt=old.createdAt;p.updatedAt=now();candidate.myPlans[pos]=p}else{p.id=id();p.title=uniqueTitle(p.title,new Set(candidate.myPlans.map(q=>norm(q.title))));p.createdAt=now();p.updatedAt=now();candidate.myPlans.push(p);created++}const topic=p.meta.find(m=>m.id==='topic');if(topic)topic.value=p.title;maps[e.bundle].set(e.plan.id,p.id);touched.add(p.id)}for(let bi=0;bi<mergeBundles.length;bi++){const x=mergeBundles[bi].data;if(!x)continue;const map=maps[bi];for(const b of x.books){const copy=clone(b);copy.id=id();copy.title=uniqueTitle(copy.title,new Set(candidate.books.map(b=>norm(b.title))));copy.chapters=copy.chapters.map(c=>({...c,id:id(),planIds:c.planIds.map(pid=>map.get(pid)).filter(Boolean)}));copy.createdAt=now();copy.updatedAt=now();candidate.books.push(copy)}for(const t of x.settings.customTemplates){const q=clone(t);q.id=id();q.title=uniqueTitle(q.title,new Set(candidate.settings.customTemplates.map(p=>norm(p.title))));candidate.settings.customTemplates.push(q)}candidate.notes.push(...x.notes.map(n=>({...clone(n),id:id()})));candidate.favorites=[...new Set([...candidate.favorites,...x.favorites.map(pid=>map.get(pid)|| (BANK.some(p=>p.id===pid)?pid:null)).filter(Boolean)])];candidate.archived=[...new Set([...candidate.archived,...x.archived.map(pid=>map.get(pid)).filter(Boolean)])]}candidate.stats.importCount+=mergeItems.length;candidate.stats.totalCreated+=created;if(active&&candidate.myPlans.some(p=>p.id===active.id))candidate.draft=clone(candidate.myPlans.find(p=>p.id===active.id));validateStore(candidate);return{candidate,replaced,created,touched}}
ACT['merge-confirm']=()=>{if(!writable())return;if(active&&dirty&&!savePlan(true))throw Error('ابتدا ذخیرهٔ طرح جاری را کامل کن.');if(bookDirty&&!saveBook(true))throw Error('ابتدا کتاب جاری را ذخیره کن.');$$('.merge-decision').forEach(el=>mergeItems[+el.dataset.index].decision=el.value==='replace'?'replace':'both');const{candidate,replaced,created,touched}=mergedCandidate(),before=clone(store),packet=backupPacket(),raw=JSON.stringify(packet);const fileBacked=mergeFileToken===JSON.stringify(serializeStore(store));try{if(!fileBacked)localStorage.setItem(PREMERGE_KEY,raw)}catch(e){if($('#mergeFallback'))$('#mergeFallback').hidden=false;throw Error('فضای پشتیبان پیش از ادغام کافی نیست؛ هیچ طرحی تغییر نکرد. فایل پشتیبان بگیر و بخشی از تاریخچه یا نسخهٔ هفتگی قدیمی را آزاد کن.')}store=candidate;if(!persist()){store=before;throw Error('ادغام ذخیره نشد؛ دفتر قبلی حفظ شده و نسخهٔ قبل از ادغام در دسترس است.')}for(const p of replaced)recordRevision(p,'پیش از ادغام');for(const p of store.myPlans.filter(p=>touched.has(p.id)))recordRevision(p,'پس از ادغام');active=store.draft?clone(store.draft):null;dirty=false;past=[];future=[];if(!fileBacked)IO.download(raw,'tarh-before-merge-'+today()+'.tarhdars','application/json');else try{localStorage.removeItem(PREMERGE_KEY)}catch(e){}mergeFileToken=null;mergeItems=[];mergeBundles=[];close();ui.grade='';ui.subject='';ui.type='';ui.scope='active';ui.q='';ui.tab='mine';render();toast(fa(created)+' طرح تازه افزوده شد؛ تداخل‌ها طبق انتخاب تو اعمال شدند.')};
ACT['merge-before']=()=>{const raw=localStorage.getItem(PREMERGE_KEY);if(!raw)return toast('هنوز نسخهٔ پیش از ادغام وجود ندارد.',true);const packet=JSON.parse(raw);restorePreview(packet.data,'پیش از آخرین ادغام',packet.history)};
/* بازیابی چندکلیدی: اگر نوشتن یکی از بخش‌ها شکست بخورد، دادهٔ پیشین برگردانده می‌شود. */
function commitRestore(candidate,history){validateStore(candidate);if(history)validateHistory(history);const oldMain=localStorage.getItem(KEY),oldHistory=localStorage.getItem(HISTORY_KEY),raw=JSON.stringify(serializeStore(candidate));try{localStorage.setItem(KEY,raw);if(history)localStorage.setItem(HISTORY_KEY,JSON.stringify(pruneHistory(clone(history))))}catch(e){try{oldMain===null?localStorage.removeItem(KEY):localStorage.setItem(KEY,oldMain);oldHistory===null?localStorage.removeItem(HISTORY_KEY):localStorage.setItem(HISTORY_KEY,oldHistory)}catch(ignore){}throw Error('بازیابی به علت محدودیت حافظه کامل نشد؛ صفحه را تازه و دادهٔ قبلی را بررسی کن.')}store=clone(candidate);token=raw;bookDraft=null;bookDirty=false;bookLayout=null;broken=false;conflict=false;unsaved=false;problem='';active=store.draft?clone(store.draft):null;dirty=false;past=[];future=[];ui.selected.clear();status()}

try{const s=new CSSStyleSheet();s.replaceSync('@page{@bottom-center{content: "x"}}');if([...s.cssRules[0].cssRules].some(r=>r.name==='bottom-center'))document.documentElement.classList.add('native-margins')}catch(e){}

iv class="chapter-plan"><strong class="small">${E(p?.title||'طرح حذف‌شده')}</strong><div class="row">${ib('book-plan-up','طرح بالاتر در فصل','arrow',`data-ch="${c.id}" data-pid="${pid}" ${k===0?'disabled':''}`)}${ib('book-plan-down','طرح پایین‌تر در فصل','arrow',`data-ch="${c.id}" data-pid="${pid}" ${k===c.planIds.length-1?'disabled':''}`)}${ib('book-remove-plan','برداشتن طرح از کتاب','close',`data-pid="${pid}"`)}<select class="move-chapter" aria-label="انتقال ${E(p?.title||'طرح')} به فصل دیگر" data-book-move="${pid}">${b.chapters.map(z=>`<option value="${z.id}" ${z.id===c.id?'selected':''}>${E(z.title)}</option>`).join('')}</select></div></div>`}).join('')}${!c.planIds.length?'<p class="mini-help">از فهرست بالا طرحی به این فصل اضافه کن.</p>':''}</article>`).join('')}</div></section></div><aside class="book-preview-side"><section class="book-preview-shell"><div class="row between"><div><div class="eyebrow">چاپخانهٔ کوچک تو</div><h2>پیش‌نمایش کتاب</h2></div><span class="chip" id="bookPageCount">در حال آماده‌سازی…</span></div><div class="row book-preview-tools">${ib('book-prev','صفحه‌های قبلی','arrow','id="bookPrev"')}${btn('book-next','صفحه‌های بعد','arrow','id="bookNext"')}${btn('book-single','تک‌صفحه / دوصفحه','book')}${btn('book-zoom','بزرگ‌نمایی صفحه','image')}</div><p class="small muted" id="bookPreviewStatus" role="status">اندازه‌گیری متن برای صفحه‌بندی واقعی…</p><div id="bookPreview" class="book-spread" aria-label="پیش‌نمایش صفحه‌های کتاب"></div><div class="book-preview-note">فهرست PDF و HTML از همین صفحه‌بندی ساخته می‌شود. در نمای کتابی، سلول‌های جدول به ردیف‌های خوانا تبدیل می‌شوند. صفحه‌بندی Word به نرم‌افزار مقصد وابسته است و فهرست آن قابل به‌روزرسانی است.</div></section></aside></div>`}
function bookPicker(){const b=ensureBook(),ids=new Set(b.chapters.flatMap(c=>c.planIds)),list=store.myPlans.filter(p=>matchesQuery(p,bookSearch));return list.length?list.map(p=>`<label class="book-pick"><input type="checkbox" data-book-pick="${p.id}" ${ids.has(p.id)?'checked':''}><span><strong>${E(p.title)}</strong><small>${E(p.subject)} · پایه ${fa(p.grade)}${store.archived.includes(p.id)?' · بایگانی':''}</small></span></label>`).join(''):'<p class="mini-help">طرحی پیدا نشد. ابتدا از بانک، طرحی در دفتر شخصی ذخیره کن.</p>'}

function syncBookDate(){if($('#bookDate'))bookDraft.date=parseDate($('#bookDate').value);if($('#bookMargin')){const margin=number($('#bookMargin').value);if(!Number.isFinite(margin)||margin<10||margin>30)throw Error('حاشیه باید بین ۱۰ و ۳۰ میلی‌متر باشد.');bookDraft.margin=margin}}
function saveBook(silent=false){if(!bookDraft||!bookDirty&&store.books.some(b=>b.id===bookDraft.id))return true;if(!writable())return false;try{syncBookDate();bookDraft.title=bookDraft.title.trim()||'کتاب بدون عنوان';bookDraft.updatedAt=now();validateBook(bookDraft);const pos=store.books.findIndex(b=>b.id===bookDraft.id);if(pos<0){if(store.books.length>=100)throw Error('حداکثر ۱۰۰ کتاب در دفتر نگه داشته می‌شود.');store.books.push(clone(bookDraft))}else store.books[pos]=clone(bookDraft);const ok=persist();bookDirty=!ok;if(ok&&$('#bookShelf'))$('#bookShelf').innerHTML='<option value="">کتاب تازه</option>'+store.books.map(b=>`<option value="${b.id}" ${b.id===bookDraft.id?'selected':''}>${E(b.title)}</option>`).join('');if($('#bookState'))$('#bookState').textContent=ok?'کتاب ذخیره شد':'کتاب موقت است؛ خروجی بگیر';if(!silent)toast(ok?'کتاب و فصل‌بندی ذخیره شد.':'حافظه کافی نیست؛ کتاب را خروجی بگیر.',!ok);return ok}catch(e){error(e);return false}}
function switchBook(pid){const load=()=>{bookDraft=pid?clone(store.books.find(b=>b.id===pid)):newBook();bookDirty=false;bookLayout=null;bookSpread=0;bookSearch='';render()};if(bookDirty)confirm('تغییر کتاب','تغییرهای کتاب فعلی هنوز ذخیره نشده‌اند. ذخیره و جابه‌جا شو؟',()=>{if(saveBook(true))load()},'ذخیره و ادامه');else load()}

document.addEventListener('input',e=>{const el=e.target;if(el.id==='bookSearch'){bookSearch=el.value;$('#bookPlanPicker').innerHTML=bookPicker();return}if(el.dataset.bk){const key=el.dataset.bk;if(key==='margin'){const n=number(el.value);if(n<10||n>30||!Number.isFinite(n))return;bookDraft.margin=n}else if(key==='numbering')bookDraft.numbering=el.checked;else bookDraft[key]=el.value;touchBook()}if(el.dataset.bchapter){bookDraft.chapters.find(c=>c.id===el.dataset.bchapter).title=el.value;$$('#bookTargetChapter option,.move-chapter option').forEach(o=>{const c=bookDraft.chapters.find(c=>c.id===o.value);if(c)o.textContent=c.title});touchBook()}if(el.dataset.bookDate)bookDirty=true});

function bookText(b,md=false){const lines=[(md?'# ':'')+b.title,'نویسنده: '+b.author,'تاریخ: '+dateFa(b.date)];for(const c of b.chapters){lines.push('\n'+(md?'## ':'فصل: ')+c.title);for(const pid of c.planIds){const p=store.myPlans.find(p=>p.id===pid);if(p)lines.push(md?markdown(personalizePlan(p)).replace(/^#/gm,'##'):planText(p))}}return lines.join('\n\n')+'\n\n'+CREDIT}
function bookContentBlocks(b){const blocks=[];b.chapters.forEach((c,ci)=>{blocks.push({kind:'chapter',anchor:'c-'+c.id,html:`<div class="chapter-opening"><span class="chapter-number">${fa(ci+1)}</span><div class="cover-rule"></div><h1>${E(c.title)}</h1><p>${fa(c.planIds.length)} تجربهٔ یادگیری</p></div>`});for(const pid of c.planIds){const original=store.myPlans.find(p=>p.id===pid);if(!original)continue;const p=personalizePlan(original);blocks.push({kind:'plan',anchor:'p-'+pid,html:`<h1 class="book-keep">${E(p.title)}</h1>`});for(const m of p.meta)blocks.push({html:`<p class="bk-meta"><strong>${E(m.label)}:</strong> ${E(m.value)}</p>`});for(const s of p.sections){blocks.push({html:`<h2 class="book-keep">${E(s.title)}</h2>`});if(s.kind==='text')for(const line of s.text.split('\n').filter(l=>l.trim()))blocks.push({html:`<p>${E(line)}</p>`});else displayRows(p,s).forEach((r,ri)=>{blocks.push({html:`<h3 class="book-keep">ردیف ${fa(ri+1)}</h3>`});s.headers.forEach((h,i)=>blocks.push({html:`<p class="bk-row"><strong>${E(h)}:</strong> ${E(r[i])}</p>`}))})}if(p.mark?.strokes?.length||p.mark?.text)blocks.push({html:markHTML(p)});blocks.push({html:`<p class="toc-note">${E(p.origin||'طرح شخصی معلم')}</p>`})}});return blocks}
function bookCover(b){return `<div class="book-cover-inner"><div class="cover-label">حکیمستان · دفتر تجربه‌های یادگیری</div><div class="cover-art">${coverSVG(b.cover)}</div><div class="cover-rule"></div><h1>${E(b.title)}</h1>${b.author?`<p class="cover-author">${E(b.author)}</p>`:''}<p>${E(dateFa(b.date))}</p></div>`}
function scheduleBookPreview(){clearTimeout(bookTimer);if(ui.tab!=='books')return;bookJob++;bookTimer=setTimeout(()=>prepareBook(clone(ensureBook())).catch(e=>{if(e.message!=='cancelled'&&$('#bookPreviewStatus'))$('#bookPreviewStatus').textContent=e.message}),320)}
async function prepareBook(b){validateBook(b);const job=++bookJob;bookBusy=true;const host=document.createElement('div');host.className='book-measure';host.setAttribute('aria-hidden','true');host.style.cssText='position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;z-index:-50;contain:layout style paint;';host.innerHTML='<style>'+BOOK_CSS+'</style>';document.body.append(host);const pages=[];let flow=null,page=null;const check=()=>{if(job!==bookJob)throw Error('cancelled');if(pages.length>500)throw Error('کتاب از ۵۰۰ صفحه بیشتر شد؛ آن را به چند جلد کوچک‌تر تقسیم کن.')};const newPage=(kind='content')=>{check();page=document.createElement('article');page.className='book-page book-'+kind;page.style.cssText=bookVariables(b);page.innerHTML=`<div class="book-running">${E(b.title)}</div><div class="book-flow"></div>`;host.append(page);pages.push(page);flow=page.querySelector('.book-flow');return page};const overflow=()=>flow.scrollHeight>flow.clientHeight+1;
