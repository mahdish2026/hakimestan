  <circle cx="224" cy="250" r="9" fill="#2a1a0a"/>
  <circle cx="220" cy="243" r="3.5" fill="#fff"/>
  <ellipse cx="222" cy="234" rx="23" ry="16" fill="#f3c98b"/>
  <!-- چشم راست -->
  <ellipse cx="290" cy="248" rx="22" ry="22" fill="#fff"/>
  <circle cx="292" cy="250" r="9" fill="#2a1a0a"/>
  <circle cx="288" cy="243" r="3.5" fill="#fff"/>
  <ellipse cx="290" cy="234" rx="23" ry="16" fill="#f3c98b"/>

