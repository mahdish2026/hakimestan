function initHakim(){try{if(window.Hakim&&typeof Hakim.init==='function')Hakim.init({container:'#hakimMount',name:'دوست من',font:false})}catch(e){}say('سلام معلم عزیز! امروز چه کلاسی داری؟')}
function showError(e){const text=e.message||String(e);if($('#modal').open){const el=$('#modalError');if(el){el.textContent=text;el.hidden=false;el.scrollIntoView({block:'nearest'});return}}toast(text,true)}
function openModal(title,body,onSubmit=null,wide=false){modalPrevious=document.activeElement;modalAction=onSubmit;$('#modalTitle').textContent=title;$('#modalBody').innerHTML='<div id="modalError" class="modal-error" role="alert" hidden></div>'+body;$('#modal').classList.toggle('wide',wide);if(!$('#modal').open)$('#modal').showModal();$('#modalBody input:not([type=hidden]),#modalBody select,#modalBody textarea,#modalBody button')?.focus({preventScroll:true})}
function closeModal(){if(exportBusy)return;$('#modal').close();modalAction=null;modalContext=null;if(modalPrevious?.isConnected)modalPrevious.focus();else $('#viewTitle')?.focus({preventScroll:true})}
function confirmBox(title,text,fn,danger=true){openModal(title,`<p class="modal-copy">${E(text)}</p><div class="modal-actions"><button class="btn" data-action="close-modal">انصراف</button><button class="btn ${danger?'danger':'primary'}" data-action="confirm">${danger?'تأیید و حذف':'تأیید و ادامه'}</button></div>`,()=>{fn();closeModal()})}
function F(name,label,value='',type='text',extra=''){return `<div class="field"><label for="f-${E(name)}">${E(label)}</label><input id="f-${E(name)}" name="${E(name)}" type="${type}" value="${E(value)}" ${extra}></div>`}
function S(name,label,options,value='',extra=''){return `<div class="field"><label for="f-${E(name)}">${E(label)}</label><select id="f-${E(name)}" name="${E(name)}" ${extra}>${options.map(o=>{const a=Array.isArray(o)?o:[o,o];return `<option value="${E(a[0])}" ${String(a[0])===String(value)?'selected':''}>${E(a[1])}</option>`}).join('')}</select></div>`}
const V=n=>$('#f-'+n)?.value??'', req=(s,label,max=100)=>{s=String(s??'').trim();if(!s)throw Error(label+' را وارد کنید.');if(s.length>max)throw Error(label+' بیش از حد طولانی است.');return s};
const formActions=(text='ذخیره')=>`<div class="modal-actions"><button type="button" class="btn" data-action="close-modal">انصراف</button><button type="submit" class="btn primary">${text}</button></div>`;
function i(name){return `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`}
function b(action,text,icon='plus',extra='',cls=''){return `<button class="btn ${cls}" data-action="${action}" ${extra}>${i(icon)}${text}</button>`}
function iconButton(action,label,icon,extra=''){return `<button class="btn icon-only" data-action="${action}" aria-label="${E(label)}" title="${E(label)}" ${extra}>${i(icon)}</button>`}
function classSelect(){return `<div class="field"><label for="classSelect">کلاس</label><select id="classSelect" data-change="class">${db.classes.map(c=>`<option value="${E(c.id)}" ${c.id===view.classId?'selected':''}>${E(c.name)}${c.subject?' · '+E(c.subject):''}</option>`).join('')}</select></div>`}
function subjectSelect(){const subjects=[...new Set(db.grades.filter(g=>g.classId===view.classId).map(g=>g.subject).concat(klass(view.classId)?.subject||'').filter(Boolean))];return `<div class="field"><label for="subjectSelect">درس</label><select id="subjectSelect" data-change="subject"><option value="">همهٔ درس‌ها</option>${subjects.map(s=>`<option ${s===view.subject?'selected':''} value="${E(s)}">${E(s)}</option>`).join('')}</select></div>`}
function empty(title,text,action='add-class',label='افزودن اولین کلاس',icon='class',compact=false){return `<div class="empty${compact?' compact':''}"><div class="empty-symbol">${i(icon)}</div><h2>${E(title)}</h2><p>${E(text)}</p>${action?b(action,label,'plus','','primary'):''}</div>`}
function needClass(){return db.classes.length?false:empty('اول، یک کلاس بسازیم','نام کلاس، پایه و درس را وارد کنید؛ سپس دانش‌آموزان و اطلاعات آموزشی را به آن اضافه کنید.')}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th scope="col">${E(x)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="muted">اطلاعاتی برای نمایش نیست.</td></tr>`}</tbody></table></div>`}
function stat(value,label,icon,color=''){return `<div class="stat"><div class="stat-icon ${color}">${i(icon)}</div><div><strong><bdi dir="${String(value).includes('/')?'ltr':'auto'}">${E(value)}</bdi></strong><small>${E(label)}</small></div></div>`}
function titleBlock(title,description,actions=''){return `<div class="page-head"><div><p class="eyebrow">دفتر معلم / ${E(db.settings.school||'حکیمستان')}</p><h1 id="viewTitle" tabindex="-1">${E(title)}</h1><p class="page-description">${E(description)}</p></div><div class="row">${actions}${!['tools','settings'].includes(view.tab)?b('export','<span class="export-label">خروجی</span>','download','aria-label="خروجی و چاپ"'):''}</div></div>`}
function go(tab,cid){if(!TABS.some(t=>t[0]===tab))return;if(cid){view.classId=cid;view.studentId='';view.subject=''}view.tab=tab;view.search='';render();$('#viewTitle')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});if(tab==='home')say('سلام معلم عزیز! امروز چه کلاسی داری؟');if(tab==='report'&&student(view.studentId))say('کارنامه‌ی '+fullName(student(view.studentId))+' آماده‌ست.')}
function render(){const focusId=document.activeElement?.id;ensureClass();applyTheme();const mount=$('#hakimMount');if(mount)$('#hakimFooter').append(mount);$('#tabs').innerHTML=TABS.map(([id,title,icon])=>`<button class="tab" id="tab-${id}" role="tab" aria-selected="${view.tab===id}" aria-controls="main" tabindex="${view.tab===id?0:-1}" data-action="go" data-view="${id}">${i(icon)}${title}</button>`).join('');$('#main').setAttribute('aria-labelledby','tab-'+view.tab);$('#main').innerHTML='<div class="view-enter">'+RENDERS[view.tab]()+'</div>';if(view.tab==='home'){$('#homeHakim').append(mount);$('#hakimFooter').hidden=true}else $('#hakimFooter').hidden=false;$('#headerDate').textContent=longDate();updateStorage();updateTimer();$('#tab-'+view.tab)?.scrollIntoView({block:'nearest',inline:'nearest'});if(focusId&&document.getElementById(focusId))document.getElementById(focusId).focus({preventScroll:true});}
window.addEventListener('storage',e=>{if((e.key===KEY||e.key===null)&&e.newValue!==storageToken){storageConflict=true;updateStorage()}});
window.addEventListener('beforeunload',e=>{if(unsaved){e.preventDefault();e.returnValue=''}});

</script>

<script>
const ART=`<svg class="hero-art" viewBox="0 0 420 280" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><ellipse cx="211" cy="248" rx="149" ry="13" fill="#254977" opacity=".07"/><circle cx="227" cy="124" r="110" fill="white" opacity=".65"/><g transform="rotate(-10 160 160)"><rect x="54" y="74" width="143" height="165" rx="14" fill="#cce7db"/><rect x="64" y="64" width="143" height="165" rx="14" fill="#e4f4ec" stroke="#98cbb3"/><path d="M83 65v162" stroke="#98cbb3"/><rect x="102" y="94" width="86" height="53" rx="8" fill="white"/><path d="M116 111h58M125 127h39" stroke="#8cae9c" stroke-width="4" stroke-linecap="round"/><path d="m123 177 11 11 26-28" fill="none" stroke="#5c9c7c" stroke-width="6" stroke-linecap="round"/></g><g transform="rotate(8 269 150)"><rect x="196" y="65" width="162" height="165" rx="15" fill="#dae8f8"/><rect x="191" y="53" width="162" height="165" rx="15" fill="white" stroke="#bdd3ed" stroke-width="2"/><path d="M191 72a19 19 0 0 1 19-19h124a19 19 0 0 1 19 19v26H191Z" class="acc"/><g fill="none" stroke="#265994" stroke-width="5" stroke-linecap="round"><path d="M220 42v24M272 42v24M324 42v24"/></g><g fill="#e9f0f8"><rect x="213" y="115" width="28" height="27" rx="7"/><rect x="257" y="115" width="28" height="27" rx="7"/><rect x="301" y="115" width="28" height="27" rx="7"/><rect x="213" y="157" width="28" height="27" rx="7"/><rect x="257" y="157" width="28" height="27" rx="7"/></g><rect x="298" y="154" width="35" height="35" rx="10" fill="#fbe9bc"/><path d="m305 171 6 6 14-14" fill="none" stroke="#a9812c" stroke-width="3" stroke-linecap="round"/></g><g transform="rotate(19 111 217)"><rect x="46" y="209" width="135" height="13" rx="3" fill="#efc46c"/><path d="m181 209 20 6.5-20 6.5Z" fill="#e0ba93"/><path d="m194 213 7 2.5-7 2.5Z" fill="#44536a"/><rect x="43" y="209" width="20" height="13" rx="3" fill="#e999a5"/></g><g fill="#edbb65"><path d="m84 26 3 9 9 3-9 3-3 9-3-9-9-3 9-3Z"/><circle cx="363" cy="137" r="5"/><circle cx="152" cy="37" r="3"/></g><path d="m369 54 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" fill="#a9c9e9"/></svg>`;
function homeView(){const today=isoToday(),periods=db.schedule.filter(p=>p.day===dayIndex()).sort((a,b)=>a.start.localeCompare(b.start));const backupAge=db.lastBackup?Math.floor((Date.now()-Date.parse(db.lastBackup))/86400000):null;const due=backupAge===null||backupAge>=7;return titleBlock('سلام، '+(db.settings.teacher||'معلم عزیز')+'!','امروز '+longDate()+'؛ یک روز تازه برای یاد گرفتن.')+`<section class="hero"><div><span class="pill">${i('book')} دفترت همیشه همراه توست</span><h2>کمی نظم؛<br>وقت بیشتری برای آموزش.</h2><p>کلاس‌ها، حضور و غیاب و نمره‌ها، همه در یک دفتر آرام و مرتب. از برنامهٔ امروز شروع کنیم؟</p><div class="row">${b(db.classes.length?'go':'add-class',db.classes.length?'حضور و غیاب امروز':'اولین کلاسم را بسازم',db.classes.length?'check':'plus',db.classes.length?'data-view="attendance"':'','primary')}${b('go','برنامهٔ هفتگی','arrow','data-view="schedule"','soft')}</div></div>${ART}</section>`+`<div class="stat-grid">${stat(fa(db.classes.length),'کلاس در دفتر','class')}${stat(fa(db.students.length),'دانش‌آموز','users','mint')}${stat(fa(periods.length),'زنگِ امروز','calendar','peach')}${stat(backupAge===null?'—':backupAge===0?'امروز':fa(backupAge)+' روز','از آخرین پشتیبان','shield','lilac')}</div>`+`<div class="home-grid"><div class="stack"><section class="panel"><div class="panel-head"><div><h2>امروز چه کلاسی داری؟</h2><p>${periods.length?fa(periods.length)+' زنگ در برنامهٔ امروز':'برنامهٔ امروزت از اینجا شروع می‌شود.'}</p></div><span class="pill">${DAYS[dayIndex()]||'جمعه'}</span></div>${periods.length?periods.map(p=>`<button class="schedule-item" style="--cc:${p.color}" data-action="period-attendance" data-id="${p.id}"><span class="time ltr">${fa(p.start)}<br>${fa(p.end)}</span><span><strong>${E(p.subject||klass(p.classId)?.subject||'زنگ کلاس')}</strong><br><small class="muted">${E(klass(p.classId)?.name)}</small></span>${i('arrow')}</button>`).join(''):empty('امروز زنگی ثبت نشده','برنامهٔ هفتگی را وارد کن؛ زنگ‌های امروز به‌صورت خودکار اینجا نمایش داده می‌شوند.','go-schedule','تنظیم برنامه','calendar',true)}</section><section class="panel"><div class="panel-head"><h2>سه قدم تا یک دفتر مرتب</h2><span class="pill green">شروع ساده</span></div><div class="guide">${[['۱','کلاس را بساز','نام، پایه و درس کلاس.','classes'],['۲','دانش‌آموزان را اضافه کن','تکی، گروهی یا از CSV.','students'],['۳','امروز را ثبت کن','حضور، نمره و یک یادداشت.','attendance']].map(x=>`<div class="guide-step"><b>${x[0]}</b><div><h3>${x[1]}</h3><p>${x[2]}</p></div>${b('go','برویم','arrow',`data-view="${x[3]}"`,'soft')}</div>`).join('')}</div></section></div><aside><div id="homeHakim" class="hakim-home"></div><section class="panel"><div class="panel-head"><h2>یادم باشد…</h2>${iconButton('add-reminder','افزودن یادآوری','plus')}</div>${db.reminders.length?db.reminders.slice().sort((a,b)=>Number(a.done)-Number(b.done)||(a.due||'9999').localeCompare(b.due||'9999')).map(r=>`<div class="reminder ${r.done?'done':''}"><input type="checkbox" data-change="reminder" data-id="${r.id}" ${r.done?'checked':''} aria-label="انجام شد: ${E(r.text)}"><div class="content">${E(r.text)}${r.due?`<br><span class="pill ${!r.done&&r.due<today?'red':''}">${jalali(r.due)}</span>`:''}</div>${iconButton('delete-reminder','حذف یادآوری','trash',`data-id="${r.id}"`)}</div>`).join(''):'<p class="muted small">برای تکلیف فردا، جلسهٔ اولیا یا یک کار کوچک، یادآوری بگذار.</p>'}</section>${due?`<div class="backup-note">${i('shield')}<div><strong class="small">${db.lastBackup?'وقت پشتیبان هفتگی است':'یک نسخهٔ امن، بیرون از مرورگر'}</strong><p>پاک‌کردن داده‌های مرورگر، دفتر را هم پاک می‌کند. فایل پشتیبان را در جای امن نگه دار.</p><button class="link-btn" data-action="backup">دریافت پشتیبان ${i('arrow')}</button></div></div>`:''}</aside></div>`}
function classesView(){return titleBlock('کلاس‌های من','هر کلاس، یک جهان کوچک برای یاد گرفتن.',b('add-class','کلاس جدید','plus','','primary'))+(db.classes.length?`<div class="class-grid">${db.classes.map((c,idx)=>`<article class="panel class-card" style="--cc:${c.color}"><div class="row between"><div class="class-monogram">${E(c.grade||fa(idx+1))}</div><span class="pill">${fa(roster(c.id).length)} دانش‌آموز</span></div><h2>${E(c.name)}</h2><p class="muted small">پایه ${E(c.grade||'ثبت نشده')} · ${E(c.subject||'همهٔ درس‌ها')}</p><div class="card-actions">${b('class-students','دانش‌آموزان','users',`data-id="${c.id}"`,'primary')}${iconButton('edit-class','ویرایش '+c.name,'edit',`data-id="${c.id}"`)}${iconButton('delete-class','حذف '+c.name,'trash',`data-id="${c.id}"`)}</div></article>`).join('')}</div>`:empty('هنوز کلاسی در دفتر نیست','با ساخت اولین کلاس، بخش‌های دانش‌آموزان، حضور و غیاب و نمرات آمادهٔ استفاده می‌شوند.'))}
function scheduleView(){return titleBlock('برنامهٔ هفتگی','از شنبه تا پنجشنبه؛ روی هر زنگ بزن تا حضور و غیاب آن کلاس باز شود.',b('add-period','زنگ جدید','plus','','primary'))+(needClass()||`<section class="panel"><div class="row between" style="margin-bottom:22px"><span class="pill">${i('calendar')} ${E(db.settings.year)} · ساعت‌ها به وقت محلی</span><div class="row">${b('import-schedule','ورود CSV / Excel','upload')}${b('schedule-template','فایل نمونه','download')}</div></div><div class="week-scroll"><div class="week-grid">${DAYS.map((day,d)=>`<div class="day-column ${dayIndex()===d?'today':''}"><div class="day-head">${day}<small>${dayIndex()===d?'امروز':'برنامهٔ هفتگی'}</small></div>${db.schedule.filter(p=>p.day===d).sort((a,b)=>a.start.localeCompare(b.start)).map(p=>`<article class="period" style="--cc:${p.color}"><button data-action="period-attendance" data-id="${p.id}"><span class="time ltr">${fa(p.start)} – ${fa(p.end)}</span><strong>${E(p.subject||klass(p.classId)?.subject)}</strong><small>${E(klass(p.classId)?.name)}</small></button><div class="period-tools"><button data-action="edit-period" data-id="${p.id}" aria-label="ویرایش زنگ ${E(p.subject)}">${i('edit')}</button><button data-action="delete-period" data-id="${p.id}" aria-label="حذف زنگ ${E(p.subject)}">${i('trash')}</button></div></article>`).join('')}<button class="btn soft" data-action="add-period" data-day="${d}" style="width:100%">${i('plus')} افزودن زنگ</button></div>`).join('')}</div></div><p class="week-help">در موبایل جدول را افقی حرکت دهید. ورود Excel از اولین برگهٔ فایل .xlsx انجام می‌شود. برای ثبت حضور یک روز دیگر، تاریخ را در حضور و غیاب تغییر دهید.</p></section>`)}
function studentsView(){let list=roster().filter(s=>norm(fullName(s)+' '+s.code+' '+s.phone).includes(norm(view.search)));if(view.sort==='code')list.sort((a,b)=>a.code.localeCompare(b.code,'fa',{numeric:true}));if(view.sort==='last')list.sort((a,b)=>a.last.localeCompare(b.last,'fa'));return titleBlock('دانش‌آموزان','نام‌ها فقط در همین مرورگر ذخیره می‌شوند؛ اطلاعات تماس را محرمانه نگه دارید.')+(needClass()||`<section class="panel"><div class="toolbar">${classSelect()}<div class="field search-field"><label for="studentSearch">جستجوی نام، کد یا تلفن</label><input id="studentSearch" data-input="search" value="${E(view.search)}" placeholder="نام دانش‌آموز…" type="search"></div><div class="field"><label for="studentSort">مرتب‌سازی</label><select id="studentSort" data-change="sort"><option value="name" ${view.sort==='name'?'selected':''}>نام کامل</option><option value="last" ${view.sort==='last'?'selected':''}>نام خانوادگی</option><option value="code" ${view.sort==='code'?'selected':''}>کد دانش‌آموز</option></select></div><div class="actions">${b('add-student','دانش‌آموز جدید','plus','','primary')}${b('paste-students','افزودن گروهی','users')}${b('import-students','ورود CSV','upload')}</div></div>${roster().length?`<p class="small muted" style="margin-bottom:14px">${fa(list.length)} نفر از ${fa(roster().length)} دانش‌آموز کلاس</p>`+table(['دانش‌آموز','کد','تلفن والدین','یادداشت','عملیات'],list.map(s=>`<tr><td class="name"><strong>${E(fullName(s))}</strong></td><td class="ltr">${E(s.code||'—')}</td><td class="ltr">${E(s.phone||'—')}</td><td style="max-width:260px;white-space:pre-wrap;overflow-wrap:anywhere">${E(s.note||'—')}</td><td class="actions">${iconButton('student-report','کارنامهٔ '+fullName(s),'file',`data-id="${s.id}"`)}${iconButton('edit-student','ویرایش '+fullName(s),'edit',`data-id="${s.id}"`)}${iconButton('delete-student','حذف '+fullName(s),'trash',`data-id="${s.id}"`)}</td></tr>`)):empty('جای دانش‌آموزانت خالی است','نام‌ها را تکی وارد کن، یک فهرست را بچسبان یا فایل CSV کلاس را انتخاب کن.','add-student','افزودن دانش‌آموز','users')}</section>`)}
function attendanceView(){const list=roster(),vals=db.attendance[view.classId]?.[view.date]||{},counts={present:0,absent:0,late:0};list.forEach(s=>{if(vals[s.id])counts[vals[s.id]]++});return titleBlock('حضور و غیاب','تاریخ شمسی است. انتخاب هر وضعیت، همان لحظه ذخیره می‌شود.')+(needClass()||`<section class="panel attendance-panel"><div class="toolbar">${classSelect()}<div class="field"><label for="attendanceDate">تاریخ شمسی</label><input id="attendanceDate" data-change="att-date" class="ltr" value="${jalali(view.date)}" placeholder="۱۴۰۵/۰۶/۲۲" inputmode="numeric"></div><div class="actions">${b('all-present','همه حاضر','check','','soft')}${b('save-attendance','ثبت حضور کلاس','check','','primary')}</div></div><div class="summary-strip"><span><strong>${fa(counts.present)}</strong> حاضر</span><span><strong>${fa(counts.absent)}</strong> غایب</span><span><strong>${fa(counts.late)}</strong> تأخیر</span><span><strong>${fa(list.length-Object.keys(vals).length)}</strong> بدون ثبت</span><span class="spacer"></span><span>${longDate(view.date)}</span></div>${list.length?table(['دانش‌آموز','وضعیت حضور'],list.map(s=>`<tr><td class="name"><strong>${E(fullName(s))}</strong><div class="sub">${E(s.code||'بدون کد')}</div></td><td><div class="status-group" role="group" aria-label="وضعیت ${E(fullName(s))}">${[['present','حاضر'],['absent','غایب'],['late','تأخیر']].map(([id,label])=>`<button class="status-btn" data-action="attendance-status" data-id="${s.id}" data-status="${id}" aria-pressed="${vals[s.id]===id}">${label}</button>`).join('')}<button class="status-clear" data-action="attendance-clear" data-id="${s.id}" aria-label="پاک‌کردن وضعیت ${E(fullName(s))}">${i('close')}</button></div></td></tr>`)):empty('هنوز دانش‌آموزی ثبت نشده','ابتدا فهرست این کلاس را وارد کنید.','go-students','افزودن دانش‌آموز','users')}</section><section class="panel" style="margin-top:22px"><div class="panel-head"><div><h2>گزارش حضور در طول ترم</h2><p>فقط روزهای دارای وضعیت ثبت‌شده محاسبه می‌شوند؛ روزهای خالی، <script>
function classForm(id){const c=id?klass(id):{name:'',grade:'',subject:'',color:['#6398d9','#62af92','#dc91a4','#b297d4','#dfb35c'][db.classes.length%5]};openModal(id?'ویرایش کلاس':'یک کلاس تازه',`<form data-form="modal"><p class="modal-copy">نامی آشنا انتخاب کن؛ مثل «پنجم / ۱». هر کلاس می‌تواند نمره‌های چند درس داشته باشد.</p><div class="form-grid">${F('name','نام کلاس *',c.name,'text','maxlength="100" required')}${F('grade','پایه',c.grade,'text','maxlength="100" placeholder="مثلاً پنجم"')}${F('subject','درس اصلی',c.subject,'text','maxlength="100" placeholder="مثلاً ریاضی"')}${F('color','رنگ کلاس',c.color,'color')}</div>${formActions('ذخیرهٔ کلاس')}</form>`,()=>{const obj={id:id||uid(),name:req(V('name'),'نام کلاس'),grade:V('grade').trim(),subject:V('subject').trim(),color:V('color')};if(db.classes.some(x=>x.id!==id&&norm(x.name)===norm(obj.name)))throw Error('کلاسی با این نام وجود دارد؛ نام متمایز انتخاب کنید.');if(commit(d=>{if(id)d.classes[d.classes.findIndex(x=>x.id===id)]=obj;else d.classes.push(obj)},'کلاس ذخیره شد.')){view.classId=obj.id;closeModal();render()}})}
function studentForm(id){if(!view.classId)return toast('ابتدا یک کلاس بسازید.',true);const s=id?student(id):{first:'',last:'',code:'',phone:'',note:''};openModal(id?'ویرایش دانش‌آموز':'دانش‌آموز جدید',`<form data-form="modal"><p class="modal-copy">کلاس ${E(klass(view.classId).name)} · کد و تلفن اختیاری‌اند. صفر ابتدای کد و تلفن حفظ می‌شود.</p><div class="form-grid">${F('first','نام *',s.first,'text','required maxlength="100"')}${F('last','نام خانوادگی',s.last,'text','maxlength="100"')}${F('code','کد دانش‌آموز',s.code,'text','maxlength="100" inputmode="numeric" class="ltr"')}${F('phone','تلفن والدین',s.phone,'tel','maxlength="100" class="ltr"')}<div class="field span-2"><label for="f-note">یادداشت خصوصی معلم</label><textarea id="f-note" maxlength="2000">${E(s.note)}</textarea><small>این یادداشت در کارنامه درج نمی‌شود؛ یادداشت کارنامه جداست.</small></div></div>${formActions()}</form>`,()=>{const obj={...s,id:id||uid(),classId:view.classId,first:req(V('first'),'نام'),last:V('last').trim(),code:latin(V('code')).trim(),phone:latin(V('phone')).trim(),note:V('note').trim(),reportNote:s.reportNote||''};if(obj.code&&db.students.some(x=>x.id!==id&&x.classId===view.classId&&norm(x.code)===norm(obj.code)))throw Error('این کد در کلاس تکراری است.');if(commit(d=>{if(id)d.students[d.students.findIndex(x=>x.id===id)]=obj;else d.students.push(obj)},'دانش‌آموز ذخیره شد.'))closeModal()})}
function periodConflict(p,others=db.schedule){return others.find(x=>x.id!==p.id&&x.day===p.day&&p.start<x.end&&p.end>x.start)}
function readTime(value){if(typeof value==='number'&&value>=0&&value<1){const m=Math.round(value*1440);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}let s=latin(value).trim();const m=s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);if(!m||+m[1]>23||+m[2]>59)throw Error('ساعت باید به شکل ۰۸:۳۰ و در بازهٔ ۰۰:۰۰ تا ۲۳:۵۹ باشد.');return m[1].padStart(2,'0')+':'+m[2]}
function periodForm(id,day=0){if(!db.classes.length)return toast('ابتدا یک کلاس بسازید.',true);const p=id?db.schedule.find(x=>x.id===id):{classId:view.classId||db.classes[0].id,day:Number(day),start:'08:00',end:'08:45',subject:klass(view.classId)?.subject||'',color:klass(view.classId)?.color||'#6398d9'};openModal(id?'ویرایش زنگ':'افزودن زنگ',`<form data-form="modal"><div class="form-grid">${S('class','کلاس *',db.classes.map(c=>[c.id,c.name]),p.classId)}${S('day','روز',DAYS.map((d,i)=>[i,d]),p.day)}${F('start','ساعت شروع',p.start,'time','required')}${F('end','ساعت پایان',p.end,'time','required')}${F('subject','درس *',p.subject,'text','required maxlength="100"')}${F('color','رنگ زنگ',p.color,'color')}</div><p class="small muted" style="margin-top:18px">برای جلوگیری از تداخل برنامه، دو زنگ نمی‌توانند در یک روز هم‌زمان باشند.</p>${formActions('ذخیرهٔ زنگ')}</form>`,()=>{const obj={id:id||uid(),classId:V('class'),day:Number(V('day')),start:readTime(V('start')),end:readTime(V('end')),subject:req(V('subject'),'درس'),color:V('color')};if(obj.end<=obj.start)throw Error('ساعت پایان باید بعد از ساعت شروع باشد.');const conflict=periodConflict(obj);if(conflict)throw Error(`این زنگ با ${klass(conflict.classId)?.name} (${fa(conflict.start)} تا ${fa(conflict.end)}) تداخل دارد.`);if(commit(d=>{if(id)d.schedule[d.schedule.findIndex(x=>x.id===id)]=obj;else d.schedule.push(obj)},'زنگ به برنامه اضافه شد.'))closeModal()});$('#f-class').addEventListener('change',()=>{const c=klass(V('class'));$('#f-subject').value=c.subject;$('#f-color').value=c.color})}
function gradeForm(id){if(!roster().length)return toast('ابتدا دانش‌آموزی در این کلاس اضافه کنید.',true);const g=id?db.grades.find(x=>x.id===id):null;const students=g?[student(g.studentId)]:roster();openModal(g?'ویرایش نمره':'ثبت نمره؛ تکی یا گروهی',`<form data-form="modal"><p class="modal-copy">برای ثبت تکی فقط یک ردیف را پر کنید. ردیف‌های خالی نمره نمی‌گیرند؛ صفر یک نمرهٔ واقعی است.</p><div class="form-grid">${F('title','عنوان *',g?.title||'','text','required maxlength="200" placeholder="مثلاً فصل دوم؛ کسرها"')}${F('subject','درس *',g?.subject||view.subject||klass(view.classId)?.subject||'','text','required maxlength="100"')}${S('type','نوع ارزیابی',TYPES,g?.type||'امتحان')}${F('date','تاریخ شمسی',jalali(g?.date||isoToday()),'text','required class="ltr" inputmode="numeric"')}${F('weight','وزن (بیشتر از صفر تا ۱۰۰)',g?fa(g.weight):'۱','text','required inputmode="decimal"')}${F('note','توضیح مشترک',g?.note||'','text','maxlength="2000"')}</div><div style="margin-top:22px">${table(['دانش‌آموز','نمره از ۲۰'],students.map(s=>`<tr><td><label for="grade-${s.id}">${E(fullName(s))}</label></td><td><input id="grade-${s.id}" class="grade-input ltr" data-student="${s.id}" inputmode="decimal" value="${g?fa(g.score):''}" placeholder="بدون نمره" aria-label="نمرهٔ ${E(fullName(s))}"></td></tr>`))}</div>${formActions('ثبت نمره‌ها')}</form>`,()=>{const base={title:req(V('title'),'عنوان',200),subject:req(V('subject'),'درس'),type:V('type'),date:parseDate(V('date')),weight:num(V('weight')),note:V('note').trim()};if(!Number.isFinite(base.weight)||base.weight<=0||base.weight>100)throw Error('وزن باید عددی بیشتر از صفر و حداکثر ۱۰۰ باشد.');const entries=[];for(const input of $$('.grade-input')){if(!input.value.trim())continue;const n=num(input.value);if(!Number.isFinite(n)||n<0||n>20)throw Error('نمرهٔ '+fullName(student(input.dataset.student))+' باید از صفر تا بیست باشد.');entries.push({...base,id:g?.id||uid(),classId:view.classId,studentId:input.dataset.student,score:n,...(g?.sourceKey?{sourceKey:g.sourceKey}:{})})}if(!entries.length)throw Error('حداقل یک نمره وارد کنید.');if(commit(d=>{if(g)d.grades[d.grades.findIndex(x=>x.id===g.id)]=entries[0];else d.grades.push(...entries)},'نمره‌ها ثبت شد.')){closeModal();say('نمره‌ها ثبت شد.')}},true)}
function reminderForm(){openModal('یادم باشد…',`<form data-form="modal"><div class="stack">${F('text','یادآوری *','','text','required maxlength="500" placeholder="مثلاً جلسهٔ اولیا، سه‌شنبه"')}${F('due','تاریخ شمسی (اختیاری)','','text','class="ltr" inputmode="numeric" placeholder="۱۴۰۵/۰۶/۲۲"')}</div>${formActions('افزودن یادآوری')}</form>`,()=>{const r={id:uid(),text:req(V('text'),'متن یادآوری',500),due:parseDate(V('due'),true),done:false};if(commit(d=>d.reminders.push(r),'یادآوری اضافه شد.'))closeModal()})}
function backup(update=true){if(storageBroken)return IO.download(storageToken||'', 'daftar-recovery-raw.txt','text/plain;charset=utf-8');if(update&&!storageConflict){db.lastBackup=new Date().toISOString();persist()}IO.download(JSON.stringify({app:'hakimestan-daftar',version:1,exportedAt:new Date().toISOString(),data:db},null,2),'daftar-backup-'+isoToday()+'.json','application/json');if(!$('#modal').open)render();toast('فایل پشتیبان برای دانلود آماده شد؛ آن را در محل امن ذخیره کنید.');say('پشتیبان گرفته شد.')}
function clearAll(){openModal('پاک‌کردن همهٔ داده‌های دفتر',`<form data-form="modal"><p class="modal-copy">${fa(db.classes.length)} کلاس و ${fa(db.students.length)} دانش‌آموز همراه با نمرات و حضور و غیاب حذف می‌شوند. این کار برگشت‌پذیر نیست؛ مگر پشتیبان داشته باشید.</p>${b('backup','اول پشتیبان می‌گیرم','download')}<div style="margin-top:20px">${F('confirmText','برای تأیید بنویسید: پاک کن','','text','autocomplete="off"')}</div>${formActions('پاک‌کردن قطعی')}</form>`,()=>{if(V('confirmText').trim()!=='پاک کن')throw Error('عبارت «پاک کن» را دقیق وارد کنید.');try{localStorage.removeItem(KEY)}catch(e){if(storageToken)throw Error('حذف اطلاعات ذخیره‌شده ممکن نشد. دسترسی مرورگر را بررسی کنید.')}db=blank();storageToken=null;storageBroken=false;storageConflict=false;storageProblem='';unsaved=false;view.classId='';view.studentId='';view.tab='home';persist();closeModal();render();toast('فقط داده‌های دفتر معلم پاک شد.')})}
function pickFile(kind,accept){fileKind=kind;$('#fileInput').accept=accept;$('#fileInput').value='';$('#fileInput').click()}
function randomInt(max){if(window.crypto?.getRandomValues){const a=new Uint32Array(1),limit=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}return Math.floor(Math.random()*max)}
function animateResult(id,text){const el=$('#'+id);if(!el)return;el.textContent=text;el.classList.remove('active');void el.offsetWidth;el.classList.add('active')}
function getAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}catch(e){return null}}
function alarm(){if(!timer.alarm)return;const c=getAudio();if(!c)return;try{for(let j=0;j<3;j++){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=j===2?880:660;g.gain.setValueAtTime(0,c.currentTime+j*.32);g.gain.linearRampToValueAtTime(.12,c.currentTime+j*.32+.025);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+j*.32+.25);o.connect(g).connect(c.destination);o.start(c.currentTime+j*.32);o.stop(c.currentTime+j*.32+.28)}}catch(e){}}
function updateTimer(){if(timer.running){timer.remaining=Math.max(0,timer.end-performance.now());if(timer.remaining<=0){timer.running=false;clearInterval(timer.interval);timer.interval=null;alarm();toast('زمان فعالیت کلاس به پایان رسید.');say('زمان فعالیت به پایان رسید؛ خسته نباشید!')}}const sec=Math.ceil(timer.remaining/1000),text=fa(String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'));if($('#timerClock'))$('#timerClock').textContent=text;const mini=$('#timerMini');mini.classList.toggle('hidden',!timer.running);mini.textContent=text;}
function timerSet(){const m=num($('#timerMinutes')?.value??5),s=num($('#timerSeconds')?.value??0);if(!Number.isInteger(m)||m<0||m>180||!Number.isInteger(s)||s<0||s>59||m*60+s<=0)throw Error('زمان را بین یک ثانیه و ۱۸۰ دقیقه و ۵۹ ثانیه انتخاب کنید.');timer.remaining=(m*60+s)*1000;timer.configured=true}
const ACTIONS={
 'go':el=>go(el.dataset.view), 'go-schedule':()=>go('schedule'),'go-students':()=>go('students'),
 'add-class':()=>classForm(),'edit-class':el=>classForm(el.dataset.id),'class-students':el=>go('students',el.dataset.id),
 'delete-class':el=>{const c=klass(el.dataset.id);confirmBox('حذف کلاس '+c.name,'همهٔ دانش‌آموزان، زنگ‌ها، نمرات و حضور و غیاب این کلاس هم حذف خواهند شد. ابتدا پشتیبان بگیرید.',()=>commit(d=>{d.classes=d.classes.filter(x=>x.id!==c.id);d.students=d.students.filter(x=>x.classId!==c.id);d.schedule=d.schedule.filter(x=>x.classId!==c.id);d.grades=d.grades.filter(x=>x.classId!==c.id);delete d.attendance[c.id]},'کلاس حذف شد.'))},
 'add-student':()=>studentForm(),'edit-student':el=>studentForm(el.dataset.id),
 'delete-student':el=>{const s=student(el.dataset.id);confirmBox('حذف '+fullName(s),'نمرات و سوابق حضور این دانش‌آموز نیز حذف می‌شود. این کار برگشت‌پذیر نیست.',()=>commit(d=>{d.students=d.students.filter(x=>x.id!==s.id);d.grades=d.grades.filter(x=>x.studentId!==s.id);for(const vals of Object.values(d.attendance[s.classId]||{}))delete vals[s.id]},'دانش‌آموز حذف شد.'))},
 'student-report':el=>{const s=student(el.dataset.id);view.classId=s.classId;view.studentId=s.id;go('report')},
 'add-period':el=>periodForm(null,el.dataset.day||0),'edit-period':el=>periodForm(el.dataset.id),
 'delete-period':el=>confirmBox('حذف زنگ','این زنگ از برنامهٔ هفتگی حذف می‌شود؛ حضور و غیاب ثبت‌شده دست‌نخورده می‌ماند.',()=>commit(d=>d.schedule=d.schedule.filter(x=>x.id!==el.dataset.id),'زنگ حذف شد.')),
 'period-attendance':el=>{const p=db.schedule.find(x=>x.id===el.dataset.id);view.date=isoToday();go('attendance',p.classId);toast('حضور کلاس برای امروز باز شد؛ در صورت نیاز تاریخ را تغییر دهید.')},
 'attendance-status':el=>{const sid=el.dataset.id,status=el.dataset.status;commit(d=>{((d.attendance[view.classId]??={})[view.date]??={})[sid]=status},'',false);const scroll=window.scrollY;render();window.scrollTo(0,scroll);$(`[data-action="attendance-status"][data-id="${sid}"][data-status="${status}"]`)?.focus({preventScroll:true})},
 'attendance-clear':el=>commit(d=>{if(d.attendance[view.classId]?.[view.date])delete d.attendance[view.classId][view.date][el.dataset.id]}),
 'all-present':()=>{if(!roster().length)return toast('این کلاس دانش‌آموزی ندارد.',true);const run=()=>{if(commit(d=>{const v=((d.attendance[view.classId]??={})[view.date]??={});roster().forEach(s=>v[s.id]='present')},'همهٔ دانش‌آموزان حاضر ثبت شدند.'))say('حضور کلاس '+klass(view.classId).name+' ثبت شد.')};const existing=Object.values(db.attendance[view.classId]?.[view.date]||{});if(existing.some(x=>x!=='present'))confirmBox('همه حاضر؟','وضعیت غایب و تأخیر ثبت‌شده در این روز هم به حاضر تغییر می‌کند.',run,false);else run()},
 'save-attendance':()=>{const n=Object.keys(db.attendance[view.classId]?.[view.date]||{}).length;if(!n)return toast('هنوز وضعیتی ثبت نکرده‌اید.',true);const missing=roster().length-n;toast(missing?fa(missing)+' دانش‌آموز هنوز وضعیت ندارد؛ بقیه ذخیره شده‌اند.':'حضور همهٔ دانش‌آموزان این روز ثبت شده است.');say('حضور کلاس '+klass(view.classId).name+' ثبت شد.')},
 'filter-absence':()=>{const from=parseDate($('#absenceFrom').value,true),to=parseDate($('#absenceTo').value,true);if(from&&to&&from>to)throw Error('تاریخ پایان نباید قبل از شروع باشد.');view.from=from;view.to=to;render()},'clear-absence':()=>{view.from='';view.to='';render()},
 'add-grade':()=>gradeForm(),'edit-grade':el=>gradeForm(el.dataset.id),'delete-grade':el=>confirmBox('حذف نمره','این نمره از محاسبهٔ میانگین و کارنامه حذف می‌شود.',()=>commit(d=>d.grades=d.grades.filter(x=>x.id!==el.dataset.id),'نمره حذف شد.')),
 'save-report-note':()=>commit(d=>d.students.find(s=>s.id===view.studentId).reportNote=$('#reportNote').value.trim(),'یادداشت کارنامه ذخیره شد.'),
 'add-reminder':()=>reminderForm(),'delete-reminder':el=>commit(d=>d.reminders=d.reminders.filter(x=>x.id!==el.dataset.id)),
 'theme':el=>commit(d=>d.settings.theme=el.dataset.theme,'رنگ دفتر تغییر کرد.'),
 'backup':()=>backup(),'backup-current':()=>backup(false),'raw-backup':()=>IO.download(storageToken||'','daftar-recovery-raw.txt','text/plain;charset=utf-8'),
 'restore':()=>pickFile('restore','.json'),'clear-all':clearAll,'reload':()=>{unsaved=false;location.reload()},
 'close-modal':closeModal,'confirm':()=>{if(modalAction)modalAction()},
 'paste-students':()=>pasteStudents(),'import-students':()=>{if(!view.classId)return toast('کلاسی انتخاب کنید.',true);pickFile('students','.csv')},
 'import-schedule':()=>pickFile('schedule','.csv,.xlsx'),'schedule-template':()=>IO.download(IO.csv([['روز','شروع','پایان','درس','کلاس','رنگ'],['شنبه','08:00','08:45',klass(view.classId)?.subject||'ریاضی',klass(view.classId)?.name||'پنجم / ۱',klass(view.classId)?.color||'#6398d9']]),'schedule-template.csv','text/csv;charset=utf-8'),
 'import-exam':()=>{if(!roster().length)return toast('اول دانش‌آموزان این کلاس را ثبت کنید.',true);pickFile('exam','.json')},
 'preview-paste':()=>previewStudents(IO.csvParse($('#pasteList').value),true),
 'export':()=>exportModal(),'export-format':el=>exportAs(el.dataset.format),
 'random-student':()=>{const list=roster();if(!list.length)return toast('کلاسی با دانش‌آموز انتخاب کنید.',true);const old=randomHistory[view.classId]||[],pool=$('#noRepeat').checked?list.filter(s=>!old.includes(s.id)):list;if(!pool.length)return toast('همهٔ دانش‌آموزان انتخاب شده‌اند؛ دور تازه را شروع کنید.');const s=pool[randomInt(pool.length)];(randomHistory[view.classId]??=[]).push(s.id);animateResult('randomResult',fullName(s))},
 'reset-random':()=>{randomHistory[view.classId]=[];animateResult('randomResult','دور تازه آماده است!')},
 'roll-dice':()=>animateResult('diceResult','تاس: '+fa(randomInt(6)+1)),'flip-coin':()=>animateResult('coinResult',randomInt(2)?'شیر':'خط'),
 'timer-start':()=>{if(timer.running)return;if(!timer.configured||timer.remaining<=0)timerSet();getAudio();timer.running=true;timer.end=performance.now()+timer.remaining;clearInterval(timer.interval);timer.interval=setInterval(updateTimer,200);updateTimer()},
 'timer-pause':()=>{updateTimer();timer.running=false;clearInterval(timer.interval);timer.interval=null;updateTimer()},
 'timer-reset':()=>{timerSet();timer.running=false;clearInterval(timer.interval);timer.interval=null;updateTimer()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const fn=ACTIONS[el.dataset.action];if(fn)try{const r=fn(el);if(r?.catch)r.catch(showError)}catch(err){showError(err)}});
document.addEventListener('submit',e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();try{if(form.dataset.form==='modal'&&modalAction)modalAction();else if(form.dataset.form==='settings')commit(d=>{d.settings.teacher=V('teacher').trim();d.settings.school=V('school').trim();d.settings.year=req(V('year'),'سال تحصیلی',200)},'مشخصات دفتر ذخیره شد.')}catch(err){showError(err)}});

<script>

function hash(s){let h=2166136261;for(let j=0;j<s.length;j++)h=Math.imul(h^s.charCodeAt(j),16777619);return(h>>>0).toString(16)}

 modalContext=ctx;modalAction=()=>{const title=req(V('importTitle'),'عنوان',200),subject=req(V('importSubject'),'درس'),weight=num(V('importWeight'));if(!Number.isFinite(weight)||weight<=0||weight>100)throw Error('وزن باید بیشتر از صفر و حداکثر صد باشد.');const entries=[],seen=new Set(db.grades.map(g=>g.studentId+'|'+g.sourceKey));let skipped=0;for(const check of $$('.exam-check:checked')){const index=Number(check.dataset.index),r=rows.find(r=>r._j===index),sid=$(`.exam-map[data-index="${index}"]`).value;if(!sid)throw Error('برای «'+String(r[ctx.fields.student]||'نام خالی')+'» دانش‌آموز انتخاب کنید یا تیک ورودش را بردارید.');if(!student(sid)||student(sid).classId!==view.classId)throw Error('دانش‌آموز مقصد معتبر نیست.');if(r._score===null)throw Error('نمرهٔ نامعتبر قابل ثبت نیست.');const key=sid+'|'+r._source;if(seen.has(key)){skipped++;continue}seen.add(key);entries.push({id:uid(),studentId:sid,classId:view.classId,subject,type:'امتحان',title,date:r._date,score:r._score,weight,note:'ورود از آزمون‌ساز؛ '+resultNumber(r,ctx.fields).method,sourceKey:r._source})}if(!entries.length)throw Error(skipped?'همهٔ موارد انتخابی قبلاً ثبت شده‌اند.':'حداقل یک نتیجه انتخاب کنید.');if(commit(d=>d.grades.push(...entries),fa(entries.length)+' نمره ثبت شد.'+(skipped?' '+fa(skipped)+' مورد تکراری کنار گذاشته شد.':''))){closeModal();say('نمره‌ها ثبت شد.')}};

/* Shape complete Persian lines natively before html2canvas captures the layout.
   This avoids glyph-order errors in html2canvas's per-grapheme RTL fallback. */
async function rasterizeReportText(root){
 const elements=Array.from(root.querySelectorAll('h1,h2,p,th,td,.report-end'));
 for(const el of elements){
  const text=el.textContent,style=getComputedStyle(el),width=Math.max(8,el.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight));
  if(!text.trim())continue;
  const size=parseFloat(style.fontSize)||14,lineHeight=parseFloat(style.lineHeight)||size*1.9;
  const font=style.fontStyle+' '+style.fontWeight+' '+style.fontSize+' '+style.fontFamily;
  const probe=document.createElement('canvas').getContext('2d');probe.font=font;
  const lines=[];
  for(const paragraph of text.split('\n')){let line='';for(const word of paragraph.split(/\s+/)){if(!word)continue;const proposed=line?line+' '+word:word;if(probe.measureText(proposed).width<=width||!line){line=proposed}else{lines.push(line);line=word}if(probe.measureText(line).width>width){let fragment='';for(const char of Array.from(line)){if(fragment&&probe.measureText(fragment+char).width>width){lines.push(fragment);fragment=char}else fragment+=char}line=fragment}}lines.push(line)}
  const height=Math.max(lineHeight,lines.length*lineHeight),scale=2,canvas=document.createElement('canvas');
  if(height>12000)throw Error('متن برای تصویر بیش از حد بلند است؛ خروجی Word یا PDF را انتخاب کنید.');
  canvas.width=Math.ceil(width*scale);canvas.height=Math.ceil(height*scale);const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.font=font;ctx.fillStyle=style.color;ctx.direction=style.direction==='rtl'?'rtl':'ltr';const align=style.textAlign==='center'?'center':style.textAlign==='left'?'left':'right';ctx.textAlign=align;ctx.textBaseline='alphabetic';const metrics=ctx.measureText('آموزش Ag'),asc=metrics.fontBoundingBoxAscent||size*.85,desc=metrics.fontBoundingBoxDescent||size*.25,baseline=(lineHeight-asc-desc)/2+asc;
  lines.forEach((line,j)=>ctx.fillText(line,align==='center'?width/2:align==='right'?width:0,j*lineHeight+baseline));
  const img=new Image();img.src=canvas.toDataURL('image/png');img.alt=text;img.style.cssText='display:block;max-width:100%;width:'+width+'px;height:'+height+'px;object-fit:contain;';await img.decode();el.replaceChildren(img);canvas.width=1;canvas.height=1;
 }
}
async function pngReport(r){if(r.visualSheets)r={...r,sheets:r.visualSheets,visualSheets:null};if(typeof html2canvas!=='function')throw Error('ابزار تصویر در این نسخه در دسترس نیست؛ از چاپ استفاده کنید.');await document.fonts.ready;const pages=[];if(r.sheets.reduce((n,s)=>n+s.rows.length,0)<=28)pages.push(r);else for(const s of r.sheets){if(s.rows.length){for(let start=0;start<s.rows.length;start+=28)pages.push({...r,sheets:[{...s,rows:s.rows.slice(start,start+28)}],chart:pages.length===0?r.chart:'',note:''})}else pages.push({...r,sheets:[s],chart:pages.length===0?r.chart:'',note:''})}if(!pages.length)pages.push(r);if(pages.length>100)throw Error('این گزارش بیش از ۱۰۰ صفحهٔ تصویری دارد؛ از Excel یا چاپ استفاده کنید.');pages[pages.length-1].note=r.note;const files={};let holder=document.createElement('div');holder.className='export-staging';document.body.append(holder);try{for(let j=0;j<pages.length;j++){holder.innerHTML=reportHTML(pages[j]);holder.querySelector('.report-end').append(' · صفحهٔ '+fa(j+1)+' از '+fa(pages.length));const el=holder.firstElementChild;await rasterizeReportText(el);if(el.scrollHeight>11000)throw Error('متن یک صفحه برای تصویر بسیار بلند است؛ از PDF یا Word استفاده کنید.');const canvas=await html2canvas(el,{backgroundColor:'#fff',scale:1.6,logging:false,useCORS:false,windowWidth:1100,scrollX:0,scrollY:0});const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('ساخت تصویر ممکن نشد.');files['page-'+String(j+1).padStart(3,'0')+'.png']=new Uint8Array(await blob.arrayBuffer());canvas.width=1;canvas.height=1}const name='daftar-'+view.tab+'-'+isoToday();if(pages.length===1)IO.download(new Blob([Object.values(files)[0]],{type:'image/png'}),name+'.png');else{IO.download(IO.zip(files),name+'-png-pages.zip');toast(fa(pages.length)+' تصویر در یک فایل ZIP آماده شد.')}}finally{holder.remove()}}
async function exportAs(format){if(exportBusy)return;exportBusy=true;const buttons=$$('#modalBody button');buttons.forEach(b=>b.disabled=true);try{const r=reportData(),name='daftar-'+view.tab+'-'+isoToday();if(format==='print'){$('#printArea').innerHTML=reportHTML(r);exportBusy=false;closeModal();await document.fonts.ready;window.print();return}if(format==='png')await pngReport(r);else if(format==='xlsx')IO.download(IO.xlsx(r.sheets),name+'.xlsx');else if(format==='docx')IO.download(IO.docx({...r,sheets:r.visualSheets||r.sheets}),name+'.docx');else if(format==='text')IO.download('\uFEFF'+textReport(r),name+'.txt','text/plain;charset=utf-8');else if(format==='csv'){if(r.sheets.length===1)IO.download(IO.csv([r.sheets[0].headers,...r.sheets[0].rows]),name+'.csv','text/csv;charset=utf-8');else{const files={};r.sheets.forEach((s,j)=>files[String(j+1)+'-'+s.name+'.csv']=IO.csv([s.headers,...s.rows]));IO.download(IO.zip(files),name+'-csv.zip');toast('برای حفظ ستون‌ها، هر جدول در CSV جدا داخل ZIP قرار گرفت.')}}else if(format==='doc')IO.download('\uFEFF<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>'+E(r.title)+'</title><style>body{font-family:Tahoma;direction:rtl}table{border-collapse:collapse;width:100%;direction:rtl}td,th{border:1px solid #999;padding:8px}p{line-height:1.9}</style><body>'+reportHTML({...r,chart:''})+'</body></html>',name+'.doc','application/msword');toast('خروجی برای دانلود آماده شد.')}catch(err){showError(err)}finally{exportBusy=false;buttons.forEach(b=>b.disabled=false)}}

    const str = JSON.stringify(auth);

    else { sessionStorage.setItem(K_AUTH, str); localStorage.removeItem(K_AUTH); }
  }

      +   '<input id="rn" type="text" placeholder="زهرا احمدی" style="width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;box-sizing:border-box;margin-bottom:12px;font-family:inherit">'
      +   '<label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#334155">رمز عبور * (حداقل ۶ کاراکتر)</label>'
      +   '<input id="rp" type="password" style="width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;box-sizing:border-box;margin-bottom:12px;font-family:inherit">'
      +   '<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#475569;margin-bottom:16px;cursor:pointer"><input id="rrem" type="checkbox" checked style="width:18px;height:18px">مرا به خاطر بسپار</label>'
      +   '<button id="btnReg" style="width:100%;padding:13px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border:0;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">ساخت حساب و ورود</button>'
      + '</div>'
      + '</div>';
    
    document.body.appendChild(ov);
    
    const errEl = ov.querySelector('#dkErr');
    const showErr = (e) => { errEl.textContent = e && e.message ? e.message : String(e); errEl.style.display = 'block'; };
    
    if(msg) showErr(new Error(msg));
    
    ov.querySelector('#tabLogin').onclick = () => {
      ov.querySelector('#tabLogin').style.background = '#fff';
      ov.querySelector('#tabLogin').style.color = '#1e3a8a';
      ov.querySelector('#tabReg').style.background = 'none';
      ov.querySelector('#tabReg').style.color = '#64748b';
      ov.querySelector('#frmLogin').style.display = 'block';
      ov.querySelector('#frmReg').style.display = 'none';
      errEl.style.display = 'none';
    };
    ov.querySelector('#tabReg').onclick = () => {
      ov.querySelector('#tabReg').style.background = '#fff';
      ov.querySelector('#tabReg').style.color = '#1e3a8a';
      ov.querySelector('#tabLogin').style.background = 'none';
      ov.querySelector('#tabLogin').style.color = '#64748b';
      ov.querySelector('#frmLogin').style.display = 'none';
      ov.querySelector('#frmReg').style.display = 'block';
      errEl.style.display = 'none';
    };
    
     ov.querySelector('#btnLogin').onclick = async () => {
      const u = ov.querySelector('#lu').value.trim().toLowerCase();
      const p = ov.querySelector('#lp').value;
      const rem = ov.querySelector('#lrem').checked;
      errEl.style.display = 'none';
      if(!u || !p) return showErr(new Error('نام کاربری و رمز را وارد کن.'));
      
      const btn = ov.querySelector('#btnLogin');
      btn.disabled = true; btn.textContent = 'در حال ورود…';
      try {
        const r = await api('tLogin', {username: u, password: p});
        setAuth({username: r.username, token: r.token, remember: rem}, rem);
        localStorage.setItem(K_LAST_USER, r.username);
        
        // ★ مهم: قبل از هر کاری، داده‌های این حساب رو از سرور بگیر
        // تا کلاس‌های حساب قبلی روی این حساب آپلود نشن
        try {
          const dr = await api('tpClassGetAll', {token: r.token});
          if(dr.data) {
            localStorage.setItem(K_DATA, JSON.stringify(dr.data));
          } else {
            // حساب کاملاً خالیه — پاک‌سازی محلی
            localStorage.removeItem(K_DATA);
          }
        } catch(err) {
          console.warn('خطا در دریافت داده اولیه:', err);
          localStorage.removeItem(K_DATA);  // محض احتیاط پاک کن
        }
        
        ov.remove();
        showToast('✅ خوش آمدی ' + (r.name || r.username) + '!');
        if(r.mustChangePassword){
          openForcePassModal(r);
        } else {
          updateUI();
          startAutoSync();
          // ★ صفحه رو رفرش کن تا داده‌های حساب جدید نمایش داده بشن
          setTimeout(() => location.reload(), 800);
        }
      } catch(e) {
        showErr(e); btn.disabled = false; btn.textContent = 'ورود به دفتر';
      }
    };
    
    ov.querySelector('#btnReg').onclick = async () => {
      const u = ov.querySelector('#ru').value.trim().toLowerCase();
      const n = ov.querySelector('#rn').value.trim();
      const p = ov.querySelector('#rp').value;
      const rem = ov.querySelector('#rrem').checked;
      errEl.style.display = 'none';
      if(!u || !p) return showErr(new Error('نام کاربری و رمز را وارد کن.'));
      
            const btn = ov.querySelector('#btnReg');
      btn.disabled = true; btn.textContent = 'در حال ثبت‌نام…';
      try {
        const r = await api('tRegister', {username: u, password: p, name: n});
        setAuth({username: r.username, token: r.token, remember: rem}, rem);
        localStorage.setItem(K_LAST_USER, r.username);
        
        // ★ حساب جدید خالیه؛ هر دادهٔ محلی از حساب قبلی باید پاک بشه
        // تا اشتباهی روی حساب جدید آپلود نشه
        localStorage.removeItem(K_DATA);
        localStorage.removeItem(K_LAST);
        
        ov.remove();
        showToast('✅ حساب ساخته شد. خوش آمدی ' + (r.name || r.username) + '!');
        updateUI();
        startAutoSync();
        // ★ رفرش کن تا دفتر کاملاً خالی باز بشه
        setTimeout(() => location.reload(), 800);
      } catch(e) {
        showErr(e); btn.disabled = false; btn.textContent = 'ساخت حساب و ورود';
      }
    };
  }
  
  /* ═══════ پنجرهٔ قفل ═══════ */
  function openForcePassModal(user){
    const old = document.getElementById('dkForcePassOverlay');
    if(old) old.remove();
    
    const ov = document.createElement('div');
    ov.id = 'dkForcePassOverlay';
    ov.style.cssText = 'position:fixed;inset:0;z-index:10000;background:#7c2d12;display:flex;align-items:center;justify-content:center;padding:20px;direction:rtl;font-family:Vazirmatn,Tahoma,sans-serif';
    ov.innerHTML = '<div style="background:#fff;border-radius:24px;padding:32px;max-width:460px;width:100%">'
      + '<h2 style="text-align:center;color:#991b1b;font-size:22px;margin:0 0 8px">🔒 تغییر اجباری رمز</h2>'
      + '<p style="text-align:center;color:#64748b;font-size:13px;line-height:1.9;margin:0 0 20px">سلام <b>' + (user.name||'معلم عزیز') + '</b>!<br>مدیر رمز عبورت را ریست کرده. باید همین حالا رمز جدید تعیین کنی.</p>'
      + '<div style="background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:12px;font-size:12px;line-height:1.9;margin-bottom:18px">⚠️ تا رمز جدید نذاری، دسترسی ممکن نیست.</div>'
      + '<div id="fErr" style="background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:10px;padding:10px;font-size:12px;margin-bottom:12px;display:none"></div>'
      + '<label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px">رمز جدید (حداقل ۶ کاراکتر)</label>'
      + '<input id="fp1" type="password" style="width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;box-sizing:border-box;margin-bottom:12px;font-family:inherit">'
      + '<label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px">تکرار رمز جدید</label>'
      + '<input id="fp2" type="password" style="width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;box-sizing:border-box;margin-bottom:16px;font-family:inherit">'
      + '<button id="fSave" style="width:100%;padding:13px;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border:0;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">ذخیرهٔ رمز جدید</button>'
      + '<button id="fOut" style="width:100%;padding:13px;background:#fff;color:#991b1b;border:1px solid #fecaca;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;font-family:inherit">🚪 خروج از حساب</button>'
      + '</div>';
    document.body.appendChild(ov);
    
    const errEl = ov.querySelector('#fErr');
    
    ov.querySelector('#fSave').onclick = async () => {
      errEl.style.display = 'none';
      const p1 = ov.querySelector('#fp1').value, p2 = ov.querySelector('#fp2').value;
      if(!p1 || !p2) return (errEl.textContent = 'همه را پر کن.', errEl.style.display='block');
      if(p1.length < 6) return (errEl.textContent = 'حداقل ۶ کاراکتر.', errEl.style.display='block');
      if(p1 !== p2) return (errEl.textContent = 'رمزها یکسان نیستند.', errEl.style.display='block');
      
      const btn = ov.querySelector('#fSave');
      btn.disabled = true; btn.textContent = 'در حال ذخیره…';
      try {
        const a = getAuth();
        await api('tSetPasswordAfterReset', {token: a.token, newPassword: p1});
        showToast('✅ رمز جدید ذخیره شد.');
        setTimeout(() => location.reload(), 800);
      } catch(e) {
        errEl.textContent = e.message; errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'ذخیرهٔ رمز جدید';
      }
    };
    
    ov.querySelector('#fOut').onclick = async () => {
      if(!confirm('از حساب خارج می‌شی؟')) return;
      try { const a = getAuth(); await api('tLogout', {token: a.token}); } catch(e){}
      delAuth();
      ov.remove();
      location.reload();
    };
  }
  
  /* ═══════ UI ═══════ */
  function updateUI(){
    const a = getAuth();
    const dot = document.getElementById('syncDot');
    const label = document.getElementById('syncStatusLabel');
    const btn = document.getElementById('syncBtn');
    
    if(a && a.token){
      if(dot){ dot.className = 'sync-dot green'; }
      if(label){ label.textContent = 'وارد شده'; }
      if(btn){ btn.classList.remove('soft'); btn.classList.add('primary'); }
    } else {
      if(dot){ dot.className = 'sync-dot gray'; }
      if(label){ label.textContent = 'غیرفعال'; }
      if(btn){ btn.classList.remove('primary'); btn.classList.add('soft'); }
    }
  }
  
  /* ═══════ همگام‌سازی ═══════ */
  let syncTimer = null;
  
  async function doSync(){
    const a = getAuth();
    if(!a || !a.token) return;
    const raw = localStorage.getItem(K_DATA);
    if(!raw) return;
    
    try {
      const data = JSON.parse(raw);
      await api('tpClassSaveAll', {token: a.token, data});
      localStorage.setItem(K_LAST, new Date().toISOString());
      const dot = document.getElementById('syncDot');
      if(dot) dot.className = 'sync-dot green';
      console.log('✅ sync شد');
    } catch(e){
      console.warn('sync خطا:', e.message);
      const dot = document.getElementById('syncDot');
      if(dot) dot.className = 'sync-dot red';
    }
  }
  
   function startAutoSync(){
    const a = getAuth();
    if(!a || !a.token) return;
    
    // ★ sync اولیه فقط اگه واقعاً داده‌ای هست
    const initialData = localStorage.getItem(K_DATA);
    if(initialData){
      setTimeout(doSync, 2000);
    }
    
    // watch تغییرات بعدی
    let lastData = localStorage.getItem(K_DATA);
    setInterval(() => {
      const curr = localStorage.getItem(K_DATA);
      if(curr && curr !== lastData){
        lastData = curr;
        clearTimeout(syncTimer);
        syncTimer = setTimeout(doSync, 5000);
      }
    }, 3000);
  }
  
  /* ═══════ پنجرهٔ sync ═══════ */
  function openSyncModal(){
    const dlg = document.getElementById('modal');
    if(!dlg) return;
    
    const a = getAuth();
    const last = localStorage.getItem(K_LAST);
    const lastText = last ? 'آخرین همگام‌سازی: ' + new Date(last).toLocaleString('fa-IR') : 'هنوز همگام نشده';
    
    document.getElementById('modalTitle').textContent = 'همگام‌سازی با Google Sheets';
    document.getElementById('modalBody').innerHTML = 
      '<p class="modal-copy">اطلاعات دفتر در شیت ذخیره می‌شود.</p>'
      + '<div style="background:#eff6ff;border-radius:12px;padding:12px;margin-bottom:16px;font-size:13px"><b>👤 کاربر:</b> ' + (a?a.username:'-') + '</div>'
      + '<div id="syncAlert" class="modal-error" style="display:none"></div>'
      + '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">'
      +   '<button type="button" class="btn primary" id="syncUp">☁️ آپلود به شیت</button>'
      +   '<button type="button" class="btn soft" id="syncDown">⬇️ دریافت از شیت</button>'
      + '</div>'
      + '<p style="font-size:12px;color:#64748b">' + lastText + '</p>'
      + '<div class="modal-actions" style="display:flex;justify-content:space-between;gap:8px;margin-top:20px">'
      +   '<button type="button" class="btn danger" id="syncOut">🚪 خروج از حساب</button>'
      +   '<button type="button" class="btn" id="syncChPass">🔑 تغییر رمز</button>'
      + '</div>';
    
    if(!dlg.open) dlg.showModal();
    
    const alertEl = document.getElementById('syncAlert');
    
    document.getElementById('syncUp').onclick = async () => {
      alertEl.style.display = 'none';
      try {
        const raw = localStorage.getItem(K_DATA);
        if(!raw) throw new Error('داده‌ای نیست');
        await api('tpClassSaveAll', {token: a.token, data: JSON.parse(raw)});
        localStorage.setItem(K_LAST, new Date().toISOString());
        showToast('✅ روی شیت ذخیره شد');
        dlg.close();
      } catch(e){ alertEl.textContent = e.message; alertEl.style.display = 'block'; }
    };
    
    document.getElementById('syncDown').onclick = async () => {
      if(!confirm('داده‌های محلی جایگزین می‌شوند. ادامه؟')) return;
      alertEl.style.display = 'none';
      try {
        const r = await api('tpClassGetAll', {token: a.token});
        if(!r.data) throw new Error('شیت خالیه');
        localStorage.setItem(K_DATA, JSON.stringify(r.data));
        showToast('✅ دریافت شد. رفرش می‌شه.');
        setTimeout(() => location.reload(), 800);
      } catch(e){ alertEl.textContent = e.message; alertEl.style.display = 'block'; }
    };
    
    document.getElementById('syncOut').onclick = async () => {
      if(!confirm('از حساب خارج می‌شی؟')) return;
      try { await api('tLogout', {token: a.token}); } catch(e){}
      delAuth();
      dlg.close();
      openAuthModal('خارج شدی. دوباره وارد شو.');
    };
    
    document.getElementById('syncChPass').onclick = () => {
      document.getElementById('modalTitle').textContent = 'تغییر رمز';
      document.getElementById('modalBody').innerHTML = 
        '<div id="chErr" class="modal-error" style="display:none"></div>'
        + '<div class="field"><label>رمز فعلی</label><input id="chOld" type="password"></div>'
        + '<div class="field"><label>رمز جدید</label><input id="chNew" type="password"></div>'
        + '<div class="field"><label>تکرار رمز جدید</label><input id="chNew2" type="password"></div>'
        + '<div class="modal-actions"><button class="btn" id="chCancel">انصراف</button><button class="btn primary" id="chSave">ذخیره</button></div>';
      
      document.getElementById('chCancel').onclick = () => openSyncModal();
      document.getElementById('chSave').onclick = async () => {
        const o = document.getElementById('chOld').value;
        const n = document.getElementById('chNew').value;
        const n2 = document.getElementById('chNew2').value;
        const err = document.getElementById('chErr');
        err.style.display = 'none';
        if(!o||!n||!n2) return (err.textContent='پر کن', err.style.display='block');
        if(n.length<6) return (err.textContent='حداقل ۶', err.style.display='block');
        if(n!==n2) return (err.textContent='یکسان نیستند', err.style.display='block');
        try {
          await api('tChangePassword', {token: a.token, oldPassword: o, newPassword: n});
          showToast('✅ رمز تغییر کرد');
          dlg.close();
        } catch(e){ err.textContent = e.message; err.style.display = 'block'; }
      };
    };
  }
  
  /* ═══════ راه‌اندازی ═══════ */
  function init(){
    // استایل
    if(!document.getElementById('syncStyles')){
      const st = document.createElement('style');
      st.id = 'syncStyles';
      st.textContent = '.sync-status{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:#fff;border:1px solid #e1e7ec;border-radius:12px;font-size:11px;color:#627187}.sync-dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}.sync-dot.green{background:#22c55e}.sync-dot.amber{background:#f59e0b}.sync-dot.red{background:#ef4444}';
      document.head.appendChild(st);
    }
    
    // دکمه (از نسخهٔ ازپیش‌موجود در HTML استفاده می‌شود تا چیدمان هنگام بارگذاری نپرد)
    var btn = document.getElementById('syncBtn');
    if(!btn){
      const backupBtn = document.querySelector('[data-action="backup"]');
      if(backupBtn){
        btn = document.createElement('button');
        btn.id = 'syncBtn';
        btn.type = 'button';
        btn.className = 'btn soft';
        btn.innerHTML = '<span>☁️ همگام‌سازی</span>';
        backupBtn.parentNode.insertBefore(btn, backupBtn);
      }
    }
    if(btn){
      btn.onclick = () => {
        const a = getAuth();
        if(!a || !a.token) openAuthModal();
        else openSyncModal();
      };
      if(!document.getElementById('syncStatus')){
        const status = document.createElement('div');
        status.id = 'syncStatus';
        status.className = 'sync-status';
        status.innerHTML = '<span id="syncDot" class="sync-dot gray"></span><span id="syncStatusLabel">غیرفعال</span>';
        btn.parentNode.insertBefore(status, btn.nextSibling);
      }
    }
    
    // بررسی ورود
    const a = getAuth();
    if(a && a.token){
      api('tWhoAmI', {token: a.token}).then(r => {
        if(r.mustChangePassword){ openForcePassModal(r); return; }
        updateUI();
        startAutoSync();
      }).catch(e => {
        delAuth();
        updateUI();
        openAuthModal('نشست قبلی منقضی شده. دوباره وارد شو.');
      });
    } else {
      openAuthModal();
    }
  }
  
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  
})();
</script>

    else if (/mac/i.test(ua)) os = 'Mac';
    else if (/linux/i.test(ua)) os = 'Linux';

    var ref = 'مستقیم';
    if (document.referrer) {
      if (document.referrer.indexOf('hakimistan.ir') > -1) ref = 'داخلی';
      else if (document.referrer.indexOf('google') > -1) ref = 'گوگل';
      else if (document.referrer.indexOf('eitaa') > -1) ref = 'ایتا';
      else if (document.referrer.indexOf('shad') > -1) ref = 'شاد';
      else ref = 'سایر';
    }

    fetch(API, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'logVisit',
        userId: userId,
        page: (function(){
          var p = location.pathname.replace(/^\//, '').split('/').filter(Boolean);
